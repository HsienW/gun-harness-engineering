="358" font-size="12" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Model</text><path d="M96 392 L1184 392" fill="none" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="438" font-size="12" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Persistence</text><path d="M96 472 L1184 472" fill="none" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="518" font-size="12" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Tool Runtime</text><path d="M96 552 L1184 552" fill="none" stroke="#d5e1ee" stroke-width="1"/><path d="M272 224 L272 248" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-06-one-run-swimlane-en-06-one-run-swimlane-en-arrow)"/><path d="M272 304 L272 328" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-06-one-run-swimlane-en-06-one-run-swimlane-en-arrow)"/><path d="M352 356 L376 356 Q384 356 384 364 L384 428 Q384 436 392 436 L416 436" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-06-one-run-swimlane-en-06-one-run-swimlane-en-arrow)"/><path d="M512 408 L512 224" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-06-one-run-swimlane-en-06-one-run-swimlane-en-arrow)"/><path d="M608 196 L648 196 Q656 196 656 204 L656 268 Q656 276 664 276 L704 276" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-06-one-run-swimlane-en-06-one-run-swimlane-en-arrow)"/><path d="M800 304 L800 488" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-06-one-run-swimlane-en-06-one-run-swimlane-en-arrow)"/><path d="M896 516 L936 516 Q944 516 944 508 L944 364 Q944 356 952 356 L992 356" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-06-one-run-swimlane-en-06-one-run-swimlane-en-arrow)"/><path d="M1088 328 L1088 304" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-06-one-run-swimlane-en-06-one-run-swimlane-en-arrow)"/><g data-node="true"><rect x="192" y="168" width="160" height="56" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="204" y="192" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">1 Hand off request</text><text x="204" y="212" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Identity, tools, limits</text></g><g data-node="true"><rect x="192" y="248" width="160" height="56" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="204" y="272" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">2 Admit + sample</text><text x="204" y="292" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Run + model request</text></g><g data-node="true"><rect x="192" y="328" width="160" height="56" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="204" y="352" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">3 Propose calls</text><text x="204" y="372" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Read, then propose write</text></g><g data-node="true"><rect x="416" y="408" width="192" height="56" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="428" y="432" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">4 Save pending wait</text><text x="428" y="452" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Manifest + Checkpoint</text></g><g data-node="true"><rect x="416" y="168" width="192" height="56" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="428" y="192" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">5 Request approval</text><text x="428" y="212" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Approval binds this wait</text></g><g data-node="true"><rect x="704" y="248" width="192" height="56" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><text x="716" y="272" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">6 Validate + consume</text><text x="716" y="292" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Identity, Schema, validity</text></g><g data-node="true"><rect x="704" y="488" width="192" height="56" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="716" y="512" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">7 Dispatch + return</text><text x="716" y="532" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Attempt + Tool Result</text></g><g data-node="true"><rect x="992" y="328" width="192" height="56" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="1004" y="352" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">8 Reply from results</text><text x="1004" y="372" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Retain Tool Call correlation</text></g><g data-node="true"><rect x="992" y="248" width="192" height="56" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="1004" y="272" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">9 Commit terminal</text><text x="1004" y="292" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Check outcome and stop rules</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">The diagram follows require_confirmation: the Harness authorizes the concrete call before waiting data is saved.</text><text x="96" y="660" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Nodes combine the ten article steps. Article 04 covers external Commit and recovery queries; full E2E remains unverified.</text></svg>
