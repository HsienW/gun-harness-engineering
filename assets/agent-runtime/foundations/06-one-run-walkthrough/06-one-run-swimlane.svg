ke-width="1.2"/><text x="428" y="192" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">5 呈現並取得批准</text><text x="428" y="212" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Approval 綁定指定等待</text></g><g data-node="true"><rect x="704" y="248" width="192" height="56" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><text x="716" y="272" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">6 驗證並消費批准</text><text x="716" y="292" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">身分、Schema 與有效條件</text></g><g data-node="true"><rect x="704" y="488" width="192" height="56" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="716" y="512" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">7 受控派送並回傳</text><text x="716" y="532" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Attempt ＋ Tool Result</text></g><g data-node="true"><rect x="992" y="328" width="192" height="56" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="1004" y="352" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">8 依工具結果回覆</text><text x="1004" y="372" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">維持 Tool Call 關聯</text></g><g data-node="true"><rect x="992" y="248" width="192" height="56" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="1004" y="272" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">9 提交終止結果</text><text x="1004" y="292" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">核對結果與停止條件</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">主圖聚焦 require_confirmation 分支；具體呼叫先經 Harness 授權，再保存等待。</text><text x="96" y="660" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">泳道節點合併正文十步；外部 Commit 與故障回查另見第四篇，完整 E2E 尚待驗證。</text></svg>
