<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="01-runtime-responsibility-handoffs-title 01-runtime-responsibility-handoffs-desc" lang="zh-TW" id="d-01-runtime-responsibility-handoffs-root"><title id="01-runtime-responsibility-handoffs-title">Harness 與 Runtime 的責任交接</title><desc id="01-runtime-responsibility-handoffs-desc">Harness 提交執行契約並回覆決策請求；Runtime 推進模型與工具，回傳事件與終止結果。各交接使用各自的契約。</desc><defs>
      <style>#d-01-runtime-responsibility-handoffs-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-01-runtime-responsibility-handoffs-root nav, #d-01-runtime-responsibility-handoffs-root p { font-size:14px; line-height:1.8; }
      #d-01-runtime-responsibility-handoffs-root a { color:#0066d6; }
      #d-01-runtime-responsibility-handoffs-root .diagram-container { width:100%; overflow-x:auto; }
      #d-01-runtime-responsibility-handoffs-root details { border-top:1px solid #b9cce3; margin-top:24px; padding-top:16px; }
      #d-01-runtime-responsibility-handoffs-root summary { cursor:pointer; font-size:16px; font-weight:600; }
      #d-01-runtime-responsibility-handoffs-root nav, #d-01-runtime-responsibility-handoffs-root details { display:none; }
      #d-01-runtime-responsibility-handoffs-root .diagram-container { overflow-x:visible; }</style><marker id="d-01-runtime-responsibility-handoffs-01-runtime-responsibility-handoffs-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-01-runtime-responsibility-handoffs-01-runtime-responsibility-handoffs-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker><marker id="d-01-runtime-responsibility-handoffs-01-runtime-responsibility-handoffs-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="272" height="24" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">RUNTIME / RESPONSIBILITY HANDOFFS</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">概念架構 · 箭頭表示資料交接方向</text><rect x="96" y="116" width="64" height="4" rx="0" fill="#0078fc" stroke="none" stroke-width="1.2"/><path d="M352 240 L512 240" fill="none" stroke="#0066d6" stroke-width="1.2" marker-end="url(#d-01-runtime-responsibility-handoffs-01-runtime-responsibility-handoffs-arrow-accent)"/><rect x="372.0" y="210" width="120" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="432" y="224" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">ExecutionRequest</text><path d="M512 304 L352 304" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-01-runtime-responsibility-handoffs-01-runtime-responsibility-handoffs-arrow)"/><rect x="374.0" y="274" width="116" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="432" y="288" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">DecisionRequest</text><path d="M352 368 L512 368" fill="none" stroke="#0066d6" stroke-width="1.2" marker-end="url(#d-01-runtime-responsibility-handoffs-01-runtime-responsibility-handoffs-arrow-accent)"/><rect x="396.0" y="338" width="72" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="432" y="352" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">Decision</text><path d="M512 464 L352 464" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-01-runtime-responsibility-handoffs-01-runtime-responsibility-handoffs-arrow)"/><rect x="354.0" y="434" width="156" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="432" y="448" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">Event / TerminalResult</text><path d="M768 232 L840 232 Q848 232 848 224 L848 208 Q848 200 856 200 L960 200" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-01-runtime-responsibility-handoffs-01-runtime-responsibility-handoffs-arrow)"/><rect x="814.0" y="170" width="84" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="856" y="184" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">MODEL CALL</text><path d="M960 256 L888 256 Q880 256 880 264 L880 272 Q880 280 872 280 L768 280" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-01-runtime-responsibility-handoffs-01-runtime-responsibility-handoffs-arrow)"/><rect x="792.0" y="290" width="96" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="840" y="304" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">MODEL OUTPUT</text><path d="M768 416 L840 416 Q848 416 848 424 L848 432 Q848 440 856 440 L960 440" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-01-runtime-responsibility-handoffs-01-runtime-responsibility-handoffs-arrow)"/><rect x="806.0" y="386" width="100" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="856" y="400" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">TOOL DISPATCH</text><path d="M960 496 L888 496 Q880 496 880 488 L880 488 Q880 480 872 480 L768 480" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-01-runtime-responsibility-handoffs-01-runtime-responsibility-handoffs-arrow)"/><rect x="796.0" y="506" width="88" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="840" y="520" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">TOOL RESULT</text><g data-node="true"><rect x="96" y="208" width="256" height="288" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="108" y="220" width="112" height="18" rx="2" fill="#eef4fb" stroke="none" stroke-width="1.2"/><text x="116" y="233" font-size="9" fill="#0066d6" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">POLICY / PRODUCT</text><text x="108" y="258" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Harness</text><text x="108" y="278" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">組裝 Context 與能力契約</text><text x="108" y="296" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">提供可信 Principal 與限制</text><text x="108" y="314" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">處理授權、確認與產品決策</text><text x="108" y="332" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">接收事件與終止結果</text></g><g data-node="true"><rect x="512" y="208" width="256" height="288" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><rect x="524" y="220" width="70" height="18" rx="2" fill="#1c78e4" stroke="none" stroke-width="1.2"/><text x="532" y="233" font-size="9" fill="#ffffff" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">EXECUTION</text><text x="524" y="258" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Agent Runtime</text><text x="524" y="278" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">接納本次 Execution Request</text><text x="524" y="296" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">推進 Model／Tool Loop</text><text x="524" y="314" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">維護執行狀態與恢復位置</text><text x="524" y="332" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">需要決策時交回 Harness</text></g><g data-node="true"><rect x="960" y="168" width="224" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="972" y="180" width="48" height="18" rx="2" fill="#eef4fb" stroke="none" stroke-width="1.2"/><text x="980" y="193" font-size="9" fill="#0066d6" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">MODEL</text><text x="972" y="218" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Model Provider</text><text x="972" y="238" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">產生訊息與 Tool Call 提案</text><text x="972" y="256" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">結果仍需解析與驗證</text></g><g data-node="true"><rect x="960" y="408" width="224" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="972" y="420" width="48" height="18" rx="2" fill="#eef4fb" stroke="none" stroke-width="1.2"/><text x="980" y="433" font-size="9" fill="#0066d6" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">TOOL</text><text x="972" y="458" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Tool Runtime／Adapter</text><text x="972" y="478" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">執行允許的 Typed Tool</text><text x="972" y="496" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">回傳結果與外部效果證據</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">ExecutionRequest 交付執行條件；DecisionRequest／Decision 承接執行途中需要的產品或授權決策。</text><text x="96" y="660" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">外部 Commit 以工具與下游證據判定；Runtime Event 用於傳遞已知事實與結果。</text></svg>
