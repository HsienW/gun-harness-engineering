font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">Step / ModelRequest</text><path d="M496 256 L496 320" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-execution-identity-relations-02-execution-identity-relations-arrow)"/><rect x="504.0" y="274" width="88" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="548" y="288" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">Tool Call</text><path d="M608 344 L736 344" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-execution-identity-relations-02-execution-identity-relations-arrow)"/><path d="M608 376 L648 376 Q656 376 656 384 L656 504 Q656 512 664 512 L736 512" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-execution-identity-relations-02-execution-identity-relations-arrow)"/><path d="M928 344 L952 344 Q960 344 960 352 L960 408 Q960 416 968 416 L992 416" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-02-execution-identity-relations-02-execution-identity-relations-arrow)"/><path d="M928 512 L968 512 Q976 512 976 504 L976 456 Q976 448 984 448 L992 448" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-02-execution-identity-relations-02-execution-identity-relations-arrow)"/><g data-node="true"><rect x="96" y="176" width="192" height="80" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="108" y="200" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Task T</text><text x="108" y="220" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">同一業務目標</text><text x="108" y="238" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">可跨多個 Run</text></g><g data-node="true"><rect x="384" y="176" width="224" height="80" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><text x="396" y="200" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Run R · generation 5</text><text x="396" y="220" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">本次執行與目前可見版本</text><text x="396" y="238" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">taskId／runId／generation</text></g><g data-node="true"><rect x="896" y="176" width="288" height="80" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="908" y="200" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Step／Model Request</text><text x="908" y="220" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">分別記錄步驟與 Provider 呼叫</text><text x="908" y="238" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">實際欄位依 Runtime 契約</text></g><g data-node="true"><rect x="384" y="320" width="224" height="80" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="396" y="344" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Tool Call C</text><text x="396" y="364" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">模型提出的具體呼叫</text><text x="396" y="382" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Tool Result 對回 callId</text></g><g data-node="true"><rect x="736" y="304" width="192" height="80" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="748" y="328" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Attempt A1</text><text x="748" y="348" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">第一次派送</text><text x="748" y="366" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">保存結果與已知 phase</text></g><g data-node="true"><rect x="736" y="472" width="192" height="80" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="748" y="496" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Attempt A2</text><text x="748" y="516" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">符合條件才建立的重試</text><text x="748" y="534" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">使用新的 Attempt ID</text></g><g data-node="true"><rect x="992" y="392" width="192" height="80" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="1004" y="416" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Operation E</text><text x="1004" y="436" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">同一外部業務效果</text><text x="1004" y="454" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">穩定 effect key</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">實線：執行資料的識別關聯。虛線：Attempt 指向同一外部效果；此圖未表示資料表的固定包含關係。</text><text x="96" y="660" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">A2 需先證明 A1 未提交，並通過重試政策、預算與取消檢查；穩定 effect key 依下游契約支援。</text></svg>
