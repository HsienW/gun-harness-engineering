      #d-02-execution-identity-relations-root a { color:#0066d6; }
      #d-02-execution-identity-relations-root .diagram-container { width:100%; overflow-x:auto; }
      #d-02-execution-identity-relations-root details { border-top:1px solid #b9cce3; margin-top:24px; padding-top:16px; }
      #d-02-execution-identity-relations-root summary { cursor:pointer; font-size:16px; font-weight:600; }
      #d-02-execution-identity-relations-root nav, #d-02-execution-identity-relations-root details { display:none; }
