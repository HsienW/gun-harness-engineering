<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="02-execution-identity-relations-title 02-execution-identity-relations-desc" lang="zh-TW" id="d-02-execution-identity-relations-root"><title id="02-execution-identity-relations-title">Tool Call、Attempt 與外部效果的識別關聯</title><desc id="02-execution-identity-relations-desc">概念例子以 Task 與 Run 定位執行，以 Tool Call 配對模型訊息；不同 Attempt 仍可關聯同一外部 Operation，供去重與回查使用。</desc><defs>
      <style>#d-02-execution-identity-relations-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
