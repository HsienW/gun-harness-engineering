<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="02-execution-identity-relations-en-title 02-execution-identity-relations-en-desc" lang="en" id="d-02-execution-identity-relations-en-root"><title id="02-execution-identity-relations-en-title">Tool Call, Attempt, and external effect identities</title><desc id="02-execution-identity-relations-en-desc">This conceptual example locates execution with Task and Run, pairs model messages through Tool Call, and links distinct Attempts to the same external Operation for deduplication and reconciliation.</desc><defs>
      <style>#d-02-execution-identity-relations-en-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-02-execution-identity-relations-en-root nav, #d-02-execution-identity-relations-en-root p { font-size:14px; line-height:1.8; }
      #d-02-execution-identity-relations-en-root a { color:#0066d6; }
      #d-02-execution-identity-relations-en-root .diagram-container { width:100%; overflow-x:auto; }
      #d-02-execution-identity-relations-en-root details { border-top:1px solid #b9cce3; margin-top:24px; padding-top:16px; }
      #d-02-execution-identity-relations-en-root summary { cursor:pointer; font-size:16px; font-weight:600; }
      #d-02-execution-identity-relations-en-root nav, #d-02-execution-identity-relations-en-root details { display:none; }
      #d-02-execution-identity-relations-en-root .diagram-container { overflow-x:visible; }</style><marker id="d-02-execution-identity-relations-en-02-execution-identity-relations-en-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-02-execution-identity-relations-en-02-execution-identity-relations-en-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker><marker id="d-02-execution-identity-relations-en-02-execution-identity-relations-en-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="248" height="24" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">EXECUTION / IDENTITY RELATIONS</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">Conceptual example · Lines show identity relationships</text><rect x="96" y="116" width="64" height="4" rx="0" fill="#0078fc" stroke="none" stroke-width="1.2"/><path d="M288 216 L384 216" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-execution-identity-relations-en-02-execution-identity-relations-en-arrow)"/><path d="M608 200 L896 200" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-execution-identity-relations-en-02-execution-identity-relations-en-arrow)"/><rect x="682.0" y="170" width="140" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="752" y="184" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">Step / ModelRequest</text><path d="M496 256 L496 320" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-execution-identity-relations-en-02-execution-identity-relations-en-arrow)"/><rect x="504.0" y="274" width="88" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="548" y="288" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">Tool Call</text><path d="M608 344 L736 344" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-execution-identity-relations-en-02-execution-identity-relations-en-arrow)"/><path d="M608 376 L648 376 Q656 376 656 384 L656 504 Q656 512 664 512 L736 512" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-execution-identity-relations-en-02-execution-identity-relations-en-arrow)"/><path d="M928 344 L952 344 Q960 344 960 352 L960 408 Q960 416 968 416 L992 416" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-02-execution-identity-relations-en-02-execution-identity-relations-en-arrow)"/><path d="M928 512 L968 512 Q976 512 976 504 L976 456 Q976 448 984 448 L992 448" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-02-execution-identity-relations-en-02-execution-identity-relations-en-arrow)"/><g data-node="true"><rect x="96" y="176" width="192" height="80" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="108" y="200" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Task T</text><text x="108" y="220" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">The same business goal</text><text x="108" y="238" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">May span multiple Runs</text></g><g data-node="true"><rect x="384" y="176" width="224" height="80" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><text x="396" y="200" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Run R · generation 5</text><text x="396" y="220" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Execution and visible version</text><text x="396" y="238" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">taskId / runId / generation</text></g><g data-node="true"><rect x="896" y="176" width="288" height="80" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="908" y="200" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Step / Model Request</text><text x="908" y="220" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Record steps and Provider calls separately</text><text x="908" y="238" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Actual fields follow the Runtime contract</text></g><g data-node="true"><rect x="384" y="320" width="224" height="80" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="396" y="344" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Tool Call C</text><text x="396" y="364" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">A specific model-proposed call</text><text x="396" y="382" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Tool Result maps back to callId</text></g><g data-node="true"><rect x="736" y="304" width="192" height="80" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="748" y="328" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Attempt A1</text><text x="748" y="348" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">First dispatch</text><text x="748" y="366" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Save result and known phase</text></g><g data-node="true"><rect x="736" y="472" width="192" height="80" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="748" y="496" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Attempt A2</text><text x="748" y="516" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Retry only when eligible</text><text x="748" y="534" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Use a new Attempt ID</text></g><g data-node="true"><rect x="992" y="392" width="192" height="80" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="1004" y="416" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Operation E</text><text x="1004" y="436" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">The same external effect</text><text x="1004" y="454" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Stable effect key</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Solid: execution identity relationships. Dashed: Attempts refer to the same external effect. Lines do not prescribe table containment.</text><text x="96" y="660" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">A2 requires proven noncommit of A1 plus retry policy, budget, and cancellation checks. Stable effect keys depend on downstream support.</text></svg>
