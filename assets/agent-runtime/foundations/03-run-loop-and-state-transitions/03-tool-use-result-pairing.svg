<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="03-tool-use-result-pairing-title 03-tool-use-result-pairing-desc" lang="zh-TW" id="d-03-tool-use-result-pairing-root"><title id="03-tool-use-result-pairing-title">並行工具先完成，訊息仍依 Call ID 配對</title><desc id="03-tool-use-result-pairing-desc">模型提出 A 與 B 兩個工具呼叫，B 先完成；Runtime 依各自 Call ID 收齊本輪所需的合法結果，再組裝下一次模型請求。</desc><defs>
      <style>#d-03-tool-use-result-pairing-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-03-tool-use-result-pairing-root nav, #d-03-tool-use-result-pairing-root p { font-size:14px; line-height:1.8; }
      #d-03-tool-use-result-pairing-root a { color:#0066d6; }
      #d-03-tool-use-result-pairing-root .diagram-container { width:100%; overflow-x:auto; }
      #d-03-tool-use-result-pairing-root details { border-top:1px solid #b9cce3; margin-top:24px; padding-top:16px; }
      #d-03-tool-use-result-pairing-root summary { cursor:pointer; font-size:16px; font-weight:600; }
      #d-03-tool-use-result-pairing-root nav, #d-03-tool-use-result-pairing-root details { display:none; }
      #d-03-tool-use-result-pairing-root .diagram-container { overflow-x:visible; }</style><marker id="d-03-tool-use-result-pairing-03-tool-use-result-pairing-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-03-tool-use-result-pairing-03-tool-use-result-pairing-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker><marker id="d-03-tool-use-result-pairing-03-tool-use-result-pairing-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="212" height="24" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">TOOL USE / RESULT PAIRING</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">訊息時序 · 時間由上而下</text><rect x="96" y="116" width="64" height="4" rx="0" fill="#0078fc" stroke="none" stroke-width="1.2"/><path d="M192 216 L192 584" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><path d="M496 216 L496 584" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><path d="M800 216 L800 584" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><path d="M1104 216 L1104 584" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><path d="M192 248 L496 248" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-03-tool-use-result-pairing-03-tool-use-result-pairing-arrow)"/><rect x="294.0" y="218" width="100" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="344.0" y="232" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">ToolUse A + B</text><path d="M496 304 L800 304" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-03-tool-use-result-pairing-03-tool-use-result-pairing-arrow)"/><rect x="618.0" y="274" width="60" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="648.0" y="288" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">Call A</text><path d="M496 360 L1104 360" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-03-tool-use-result-pairing-03-tool-use-result-pairing-arrow)"/><rect x="770.0" y="330" width="60" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="800.0" y="344" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">Call B</text><path d="M1104 416 L496 416" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-03-tool-use-result-pairing-03-tool-use-result-pairing-arrow)"/><rect x="730.0" y="386" width="140" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="800.0" y="400" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">Result B · callId B</text><path d="M800 472 L496 472" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-03-tool-use-result-pairing-03-tool-use-result-pairing-arrow)"/><rect x="578.0" y="442" width="140" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="648.0" y="456" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">Result A · callId A</text><path d="M496 552 L192 552" fill="none" stroke="#0066d6" stroke-width="1.2" marker-end="url(#d-03-tool-use-result-pairing-03-tool-use-result-pairing-arrow-accent)"/><rect x="294.0" y="522" width="100" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="344.0" y="536" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">Results A + B</text><g data-node="true"><rect x="96" y="152" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="108" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Model</text><text x="108" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">提出完整 Tool Use</text></g><g data-node="true"><rect x="400" y="152" width="192" height="64" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><text x="412" y="176" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Runtime</text><text x="412" y="196" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">驗證、派送與配對</text></g><g data-node="true"><rect x="704" y="152" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="716" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Tool A</text><text x="716" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">較晚回傳</text></g><g data-node="true"><rect x="1008" y="152" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="1020" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Tool B</text><text x="1020" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">較早回傳</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">B 先完成仍對回 callId B；下一次 Provider 請求需符合訊息順序與 Tool Use／Result 配對契約。</text><text x="96" y="660" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">完整參數通過檢查後才派送；中止時需要的合成結果屬訊息修復，另依 Provider／Runtime 契約處理。</text></svg>
