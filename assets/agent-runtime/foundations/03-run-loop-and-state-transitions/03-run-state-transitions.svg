"12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">工作已結束，必要證據已保存</text></g><g data-node="true"><rect x="96" y="352" width="240" height="96" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="108" y="364" width="58" height="18" rx="2" fill="#eef4fb" stroke="none" stroke-width="1.2"/><text x="116" y="377" font-size="9" fill="#0066d6" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">WAITING</text><text x="108" y="402" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">等待指定輸入</text><text x="108" y="422" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">保存 Manifest 與恢復條件</text></g><g data-node="true"><rect x="416" y="352" width="256" height="96" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="428" y="364" width="82" height="18" rx="2" fill="#eef4fb" stroke="none" stroke-width="1.2"/><text x="436" y="377" font-size="9" fill="#0066d6" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">RECONCILING</text><text x="428" y="402" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">回查外部效果</text><text x="428" y="422" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Ledger ＋ Operation 證據</text></g><g data-node="true"><rect x="928" y="352" width="256" height="96" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="940" y="364" width="76" height="18" rx="2" fill="#eef4fb" stroke="none" stroke-width="1.2"/><text x="948" y="377" font-size="9" fill="#0066d6" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">CANCELLING</text><text x="940" y="402" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">取消處理中</text><text x="940" y="422" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">停止新派送，判讀既有效果</text></g><g data-node="true"><rect x="96" y="520" width="240" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="108" y="544" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">失敗</text><text x="108" y="564" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">不可恢復錯誤 → Failed</text></g><g data-node="true"><rect x="416" y="520" width="256" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="428" y="544" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">停放待處理</text><text x="428" y="564" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Parked：保留未知，交由人工</text></g><g data-node="true"><rect x="928" y="520" width="256" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="940" y="544" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">已取消</text><text x="940" y="564" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Cancelled：保存停止範圍</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">恢復前核對等待、期限與相容版本；回查後重新進入 Running，仍須通過後續派送檢查。</text><text x="96" y="660" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">非終止狀態的不可恢復錯誤可進入 Failed；Terminal 的晚到事件只補充證據，不改回 Running。</text></svg>
