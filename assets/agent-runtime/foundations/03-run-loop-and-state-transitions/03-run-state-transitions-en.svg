<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="03-run-state-transitions-en-title 03-run-state-transitions-en-desc" lang="en" id="d-03-run-state-transitions-en-root"><title id="03-run-state-transitions-en-title">Run state transitions and terminal boundaries</title><desc id="03-run-state-transitions-en-desc">After admission, a Run advances model and tool work, enters waiting, reconciliation, or cancellation as decisions require, and converges to a terminal result under valid conditions.</desc><defs>
      <style>#d-03-run-state-transitions-en-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-03-run-state-transitions-en-root nav, #d-03-run-state-transitions-en-root p { font-size:14px; line-height:1.8; }
      #d-03-run-state-transitions-en-root a { color:#0066d6; }
      #d-03-run-state-transitions-en-root .diagram-container { width:100%; overflow-x:auto; }
      #d-03-run-state-transitions-en-root details { border-top:1px solid #b9cce3; margin-top:24px; padding-top:16px; }
      #d-03-run-state-transitions-en-root summary { cursor:pointer; font-size:16px; font-weight:600; }
      #d-03-run-state-transitions-en-root nav, #d-03-run-state-transitions-en-root details { display:none; }
