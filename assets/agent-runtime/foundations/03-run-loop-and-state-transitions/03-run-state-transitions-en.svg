="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="352" y="208" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">ADMIT</text><path d="M640 208 L928 208" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-03-run-state-transitions-en-03-run-state-transitions-en-arrow)"/><rect x="754.0" y="178" width="60" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="784" y="192" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">FINISH</text><path d="M448 272 L448 296 Q448 304 440 304 L224 304 Q216 304 216 312 L216 352" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-03-run-state-transitions-en-03-run-state-transitions-en-arrow)"/><rect x="266.0" y="274" width="76" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="304" y="288" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">INTERRUPT</text><path d="M96 384 L80 384 Q72 384 72 376 L72 152 Q72 144 80 144 L504 144 Q512 144 512 152 L512 176" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-03-run-state-transitions-en-03-run-state-transitions-en-arrow)"/><rect x="248.0" y="114" width="88" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="292" y="128" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">RESUME</text><path d="M560 272 L560 352" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-03-run-state-transitions-en-03-run-state-transitions-en-arrow)"/><rect x="568.0" y="302" width="88" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="612" y="316" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', monospace" text-anchor="middle">UNKNOWN</text><path d="M672 384 L712 384 Q720 384 720 376 L720 272 Q720 264 712 264 L640 264" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-03-run-state-transitions-en-03-run-state-transitions-en-arrow)"/><rect x="608.0" y="330" width="104" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="660" y="344" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', monospace" text-anchor="middle">CHECKS PASS</text><path d="M640 248 L808 248 Q816 248 816 256 L816 392 Q816 400 824 400 L928 400" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-03-run-state-transitions-en-03-run-state-transitions-en-arrow)"/><rect x="842.0" y="370" width="60" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="872" y="384" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">CANCEL</text><path d="M544 448 L544 520" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-03-run-state-transitions-en-03-run-state-transitions-en-arrow)"/><rect x="552.0" y="474" width="104" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="604" y="488" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', monospace" text-anchor="middle">UNRESOLVED</text><path d="M1056 448 L1056 520" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-03-run-state-transitions-en-03-run-state-transitions-en-arrow)"/><rect x="1064.0" y="474" width="96" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="1112" y="488" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', monospace" text-anchor="middle">STOP + LOG</text><g data-node="true"><rect x="96" y="176" width="192" height="96" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="108" y="188" width="64" height="18" rx="2" fill="#eef4fb" stroke="none" stroke-width="1.2"/><text x="116" y="201" font-size="9" fill="#0066d6" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">ADMITTED</text><text x="108" y="226" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Admit execution</text><text x="108" y="246" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Identity, versions, limits</text></g><g data-node="true"><rect x="416" y="176" width="224" height="96" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><rect x="428" y="188" width="58" height="18" rx="2" fill="#1c78e4" stroke="none" stroke-width="1.2"/><text x="436" y="201" font-size="9" fill="#ffffff" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">RUNNING</text><text x="428" y="226" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Running</text><text x="428" y="246" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Model sampling ↔ tool results</text></g><g data-node="true"><rect x="928" y="176" width="256" height="96" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="940" y="188" width="70" height="18" rx="2" fill="#eef4fb" stroke="none" stroke-width="1.2"/><text x="948" y="201" font-size="9" fill="#0066d6" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">COMPLETED</text><text x="940" y="226" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Completed</text><text x="940" y="246" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Work ended; required evidence saved</text></g><g data-node="true"><rect x="96" y="352" width="240" height="96" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="108" y="364" width="58" height="18" rx="2" fill="#eef4fb" stroke="none" stroke-width="1.2"/><text x="116" y="377" font-size="9" fill="#0066d6" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">WAITING</text><text x="108" y="402" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Await specified input</text><text x="108" y="422" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Save Manifest and resume rules</text></g><g data-node="true"><rect x="416" y="352" width="256" height="96" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="428" y="364" width="82" height="18" rx="2" fill="#eef4fb" stroke="none" stroke-width="1.2"/><text x="436" y="377" font-size="9" fill="#0066d6" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">RECONCILING</text><text x="428" y="402" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Reconcile external effects</text><text x="428" y="422" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Ledger + Operation evidence</text></g><g data-node="true"><rect x="928" y="352" width="256" height="96" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="940" y="364" width="76" height="18" rx="2" fill="#eef4fb" stroke="none" stroke-width="1.2"/><text x="948" y="377" font-size="9" fill="#0066d6" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">CANCELLING</text><text x="940" y="402" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Cancelling</text><text x="940" y="422" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Stop new dispatch; assess effects</text></g><g data-node="true"><rect x="96" y="520" width="240" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="108" y="544" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Failed</text><text x="108" y="564" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Unrecoverable error → Failed</text></g><g data-node="true"><rect x="416" y="520" width="256" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="428" y="544" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Parked</text><text x="428" y="564" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Keep unknown; hand off to a person</text></g><g data-node="true"><rect x="928" y="520" width="256" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="940" y="544" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Cancelled</text><text x="940" y="564" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Record the scope of stopped work</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Before resume, check the wait, expiry, and versions. Returning to Running after reconciliation still requires dispatch checks.</text><text x="96" y="660" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Unrecoverable errors in nonterminal states may enter Failed. Late events after Terminal add evidence without restoring Running.</text></svg>
