<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="05-persist-before-notify-title 05-persist-before-notify-desc" lang="zh-TW" id="d-05-persist-before-notify-root"><title id="05-persist-before-notify-title">先保存可恢復等待，再通知與消費回覆</title><desc id="05-persist-before-notify-desc">Runtime 先確認等待與恢復資料已保存，再通知 Harness；回覆通過核對後，原子消費指定等待，再銜接可恢復的後續派送。</desc><defs>
      <style>#d-05-persist-before-notify-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-05-persist-before-notify-root nav, #d-05-persist-before-notify-root p { font-size:14px; line-height:1.8; }
      #d-05-persist-before-notify-root a { color:#0066d6; }
      #d-05-persist-before-notify-root .diagram-container { width:100%; overflow-x:auto; }
      #d-05-persist-before-notify-root details { border-top:1px solid #b9cce3; margin-top:24px; padding-top:16px; }
      #d-05-persist-before-notify-root summary { cursor:pointer; font-size:16px; font-weight:600; }
      #d-05-persist-before-notify-root nav, #d-05-persist-before-notify-root details { display:none; }
      #d-05-persist-before-notify-root .diagram-container { overflow-x:visible; }</style><marker id="d-05-persist-before-notify-05-persist-before-notify-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-05-persist-before-notify-05-persist-before-notify-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker><marker id="d-05-persist-before-notify-05-persist-before-notify-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="272" height="24" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">INTERRUPT / PERSIST BEFORE NOTIFY</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">提交順序 · 時間由上而下</text><rect x="96" y="116" width="64" height="4" rx="0" fill="#0078fc" stroke="none" stroke-width="1.2"/><path d="M240 216 L240 584" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><path d="M640 216 L640 584" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><path d="M1056 216 L1056 584" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><path d="M240 248 L640 248" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-05-persist-before-notify-05-persist-before-notify-arrow)"/><rect x="402.0" y="218" width="76" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="440.0" y="232" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">SAVE WAIT</text><path d="M640 304 L240 304" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-05-persist-before-notify-05-persist-before-notify-arrow)"/><rect x="414.0" y="274" width="52" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="440.0" y="288" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">SAVED</text><path d="M240 360 L1056 360" fill="none" stroke="#0066d6" stroke-width="1.2" marker-end="url(#d-05-persist-before-notify-05-persist-before-notify-arrow-accent)"/><rect x="604.0" y="330" width="88" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="648.0" y="344" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">NOTIFY WAIT</text><path d="M1056 416 L240 416" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-05-persist-before-notify-05-persist-before-notify-arrow)"/><rect x="600.0" y="386" width="96" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="648.0" y="400" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">RESUME INPUT</text><path d="M240 480 L640 480" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-05-persist-before-notify-05-persist-before-notify-arrow)"/><rect x="374.0" y="450" width="132" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="440.0" y="464" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">VALIDATE + CONSUME</text><path d="M640 544 L240 544" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-05-persist-before-notify-05-persist-before-notify-arrow)"/><rect x="404.0" y="514" width="72" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="440.0" y="528" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">CONSUMED</text><g data-node="true"><rect x="144" y="152" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="156" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Runtime</text><text x="156" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">維護等待與恢復流程</text></g><g data-node="true"><rect x="512" y="152" width="256" height="64" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><text x="524" y="176" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">等待／恢復資料儲存</text><text x="524" y="196" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Manifest ＋ Checkpoint</text></g><g data-node="true"><rect x="944" y="152" width="224" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="956" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Harness／UI</text><text x="956" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">顯示等待、送回輸入</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">保存失敗時停止通知；通知失敗時從已保存等待重送。回覆需核對身分、指定等待、版本與期限。</text><text x="96" y="660" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">CONSUMED 後仍需可恢復地銜接 Resume／派送；崩潰不能讓已消費輸入永久遺失，也不能重複批准。</text></svg>
