<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="05-persist-before-notify-en-title 05-persist-before-notify-en-desc" lang="en" id="d-05-persist-before-notify-en-root"><title id="05-persist-before-notify-en-title">Persist waiting state before notifying and consuming input</title><desc id="05-persist-before-notify-en-desc">The Runtime confirms that waiting and recovery data is saved before notifying the Harness, then validates the response, atomically consumes the specified wait, and connects it to recoverable dispatch.</desc><defs>
      <style>#d-05-persist-before-notify-en-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-05-persist-before-notify-en-root nav, #d-05-persist-before-notify-en-root p { font-size:14px; line-height:1.8; }
      #d-05-persist-before-notify-en-root a { color:#0066d6; }
      #d-05-persist-before-notify-en-root .diagram-container { width:100%; overflow-x:auto; }
      #d-05-persist-before-notify-en-root details { border-top:1px solid #b9cce3; margin-top:24px; padding-top:16px; }
      #d-05-persist-before-notify-en-root summary { cursor:pointer; font-size:16px; font-weight:600; }
      #d-05-persist-before-notify-en-root nav, #d-05-persist-before-notify-en-root details { display:none; }
      #d-05-persist-before-notify-en-root .diagram-container { overflow-x:visible; }</style><marker id="d-05-persist-before-notify-en-05-persist-before-notify-en-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-05-persist-before-notify-en-05-persist-before-notify-en-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker><marker id="d-05-persist-before-notify-en-05-persist-before-notify-en-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="272" height="24" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">INTERRUPT / PERSIST BEFORE NOTIFY</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">Commit ordering · Time runs downward</text><rect x="96" y="116" width="64" height="4" rx="0" fill="#0078fc" stroke="none" stroke-width="1.2"/><path d="M240 216 L240 584" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><path d="M640 216 L640 584" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><path d="M1056 216 L1056 584" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><path d="M240 248 L640 248" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-05-persist-before-notify-en-05-persist-before-notify-en-arrow)"/><rect x="402.0" y="218" width="76" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="440.0" y="232" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">SAVE WAIT</text><path d="M640 304 L240 304" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-05-persist-before-notify-en-05-persist-before-notify-en-arrow)"/><rect x="414.0" y="274" width="52" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="440.0" y="288" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">SAVED</text><path d="M240 360 L1056 360" fill="none" stroke="#0066d6" stroke-width="1.2" marker-end="url(#d-05-persist-before-notify-en-05-persist-before-notify-en-arrow-accent)"/><rect x="604.0" y="330" width="88" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="648.0" y="344" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">NOTIFY WAIT</text><path d="M1056 416 L240 416" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-05-persist-before-notify-en-05-persist-before-notify-en-arrow)"/><rect x="600.0" y="386" width="96" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="648.0" y="400" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">RESUME INPUT</text><path d="M240 480 L640 480" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-05-persist-before-notify-en-05-persist-before-notify-en-arrow)"/><rect x="374.0" y="450" width="132" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="440.0" y="464" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">VALIDATE + CONSUME</text><path d="M640 544 L240 544" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-05-persist-before-notify-en-05-persist-before-notify-en-arrow)"/><rect x="404.0" y="514" width="72" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="440.0" y="528" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">CONSUMED</text><g data-node="true"><rect x="144" y="152" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="156" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Runtime</text><text x="156" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Manage waiting and resume</text></g><g data-node="true"><rect x="512" y="152" width="256" height="64" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><text x="524" y="176" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Waiting / recovery store</text><text x="524" y="196" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Manifest + Checkpoint</text></g><g data-node="true"><rect x="944" y="152" width="224" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="956" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Harness / UI</text><text x="956" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Display wait; return input</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">A failed save stops notification; a failed notification is resent from saved waiting state. Check identity, wait, versions, and expiry.</text><text x="96" y="660" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">After CONSUMED, Resume / dispatch must remain recoverable: a crash must neither lose consumed input permanently nor duplicate approval.</text></svg>
