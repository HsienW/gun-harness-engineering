<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="04-commit-checkpoint-crash-en-title 04-commit-checkpoint-crash-en-desc" lang="en" id="d-04-commit-checkpoint-crash-en-root"><title id="04-commit-checkpoint-crash-en-title">External Commit before Tool Result persistence</title><desc id="04-commit-checkpoint-crash-en-desc">When the Runtime crashes after an external Commit but before saving the Tool Result, recovery uses the Ledger and Operation ID to decide whether to reuse the result, recheck dispatch eligibility, or park the operation.</desc><defs>
      <style>#d-04-commit-checkpoint-crash-en-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-04-commit-checkpoint-crash-en-root nav, #d-04-commit-checkpoint-crash-en-root p { font-size:14px; line-height:1.8; }
      #d-04-commit-checkpoint-crash-en-root a { color:#0066d6; }
      #d-04-commit-checkpoint-crash-en-root .diagram-container { width:100%; overflow-x:auto; }
      #d-04-commit-checkpoint-crash-en-root details { border-top:1px solid #b9cce3; margin-top:24px; padding-top:16px; }
      #d-04-commit-checkpoint-crash-en-root summary { cursor:pointer; font-size:16px; font-weight:600; }
      #d-04-commit-checkpoint-crash-en-root nav, #d-04-commit-checkpoint-crash-en-root details { display:none; }
      #d-04-commit-checkpoint-crash-en-root .diagram-container { overflow-x:visible; }</style><marker id="d-04-commit-checkpoint-crash-en-04-commit-checkpoint-crash-en-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-04-commit-checkpoint-crash-en-04-commit-checkpoint-crash-en-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker><marker id="d-04-commit-checkpoint-crash-en-04-commit-checkpoint-crash-en-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="212" height="24" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">COMMIT / CRASH / RECOVERY</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">Failure scenario · Time runs downward</text><rect x="96" y="116" width="64" height="4" rx="0" fill="#0078fc" stroke="none" stroke-width="1.2"/><path d="M272 216 L272 584" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><path d="M704 216 L704 584" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><path d="M1072 216 L1072 584" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><rect x="96" y="368" width="1088" height="48" rx="8" fill="#eef4fb" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><text x="112" y="398" font-size="12" fill="#102743" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">CRASH</text><text x="240" y="398" font-size="12" fill="#102743" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Crash after Commit, before Tool Result persistence; the Ledger may also retain an old phase.</text><path d="M272 248 L704 248" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-04-commit-checkpoint-crash-en-04-commit-checkpoint-crash-en-arrow)"/><rect x="452.0" y="218" width="72" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="488" y="232" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">DISPATCH</text><path d="M272 480 L704 480" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-04-commit-checkpoint-crash-en-04-commit-checkpoint-crash-en-arrow)"/><rect x="452.0" y="450" width="72" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="488" y="464" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">QUERY OP</text><path d="M704 536 L272 536" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-04-commit-checkpoint-crash-en-04-commit-checkpoint-crash-en-arrow)"/><rect x="452.0" y="506" width="72" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="488" y="520" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">EVIDENCE</text><g data-node="true"><rect x="176" y="152" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="188" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Runtime</text><text x="188" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Dispatch and recovery</text></g><g data-node="true"><rect x="608" y="152" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="620" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">External system</text><text x="620" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Owns Commit truth</text></g><g data-node="true"><rect x="976" y="152" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="988" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Checkpoint</text><text x="988" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Stores Graph State</text></g><g data-node="true"><rect x="608" y="280" width="192" height="64" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><text x="620" y="304" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Operation committed</text><text x="620" y="324" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">External state: Committed</text></g><g data-node="true"><rect x="976" y="280" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="988" y="304" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Result not yet saved</text><text x="988" y="324" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">This Tool Result is missing</text></g><rect x="176" y="424" width="192" height="40" rx="0" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="188" y="440" font-size="12" fill="#102743" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Restart: read Ledger</text><text x="188" y="460" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Find original Operation ID</text><rect x="976" y="436" width="192" height="44" rx="0" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="988" y="453" font-size="12" fill="#102743" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Checkpoint alone</text><text x="988" y="473" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Cannot confirm the outcome</text><rect x="224" y="564" width="624" height="24" rx="0" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="236" y="581" font-size="12" fill="#102743" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Classify using query evidence, then update local state and the required Tool Result.</text><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Proven committed</text><text x="96" y="660" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Reuse the result; fill in required records</text><text x="456" y="638" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Proven not committed</text><text x="456" y="660" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Recheck policy, budget, and cancellation</text><text x="832" y="638" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Still unknown</text><text x="832" y="660" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Keep ambiguous; park or handle manually</text></svg>
