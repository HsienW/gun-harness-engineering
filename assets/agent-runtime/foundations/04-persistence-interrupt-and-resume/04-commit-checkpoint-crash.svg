<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="04-commit-checkpoint-crash-title 04-commit-checkpoint-crash-desc" lang="zh-TW" id="d-04-commit-checkpoint-crash-root"><title id="04-commit-checkpoint-crash-title">外部已 Commit，Checkpoint 尚未保存結果</title><desc id="04-commit-checkpoint-crash-desc">外部操作提交後，Runtime 在保存 Tool Result 前崩潰，重啟後須以 Ledger 與 Operation ID 回查，再決定重用結果、重新檢查派送條件或停放處理。</desc><defs>
      <style>#d-04-commit-checkpoint-crash-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-04-commit-checkpoint-crash-root nav, #d-04-commit-checkpoint-crash-root p { font-size:14px; line-height:1.8; }
      #d-04-commit-checkpoint-crash-root a { color:#0066d6; }
      #d-04-commit-checkpoint-crash-root .diagram-container { width:100%; overflow-x:auto; }
      #d-04-commit-checkpoint-crash-root details { border-top:1px solid #b9cce3; margin-top:24px; padding-top:16px; }
      #d-04-commit-checkpoint-crash-root summary { cursor:pointer; font-size:16px; font-weight:600; }
      #d-04-commit-checkpoint-crash-root nav, #d-04-commit-checkpoint-crash-root details { display:none; }
      #d-04-commit-checkpoint-crash-root .diagram-container { overflow-x:visible; }</style><marker id="d-04-commit-checkpoint-crash-04-commit-checkpoint-crash-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-04-commit-checkpoint-crash-04-commit-checkpoint-crash-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker><marker id="d-04-commit-checkpoint-crash-04-commit-checkpoint-crash-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="212" height="24" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">COMMIT / CRASH / RECOVERY</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">故障情境 · 時間由上而下</text><rect x="96" y="116" width="64" height="4" rx="0" fill="#0078fc" stroke="none" stroke-width="1.2"/><path d="M272 216 L272 584" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><path d="M704 216 L704 584" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><path d="M1072 216 L1072 584" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><rect x="96" y="368" width="1088" height="48" rx="8" fill="#eef4fb" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><text x="112" y="398" font-size="12" fill="#102743" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">CRASH</text><text x="240" y="398" font-size="12" fill="#102743" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">程序在 Commit 後、Tool Result 寫入前崩潰；Ledger 也可能停在舊 phase。</text><path d="M272 248 L704 248" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-04-commit-checkpoint-crash-04-commit-checkpoint-crash-arrow)"/><rect x="452.0" y="218" width="72" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="488" y="232" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">DISPATCH</text><path d="M272 480 L704 480" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-04-commit-checkpoint-crash-04-commit-checkpoint-crash-arrow)"/><rect x="452.0" y="450" width="72" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="488" y="464" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">QUERY OP</text><path d="M704 536 L272 536" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-04-commit-checkpoint-crash-04-commit-checkpoint-crash-arrow)"/><rect x="452.0" y="506" width="72" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="488" y="520" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">EVIDENCE</text><g data-node="true"><rect x="176" y="152" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="188" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Runtime</text><text x="188" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">派送與恢復</text></g><g data-node="true"><rect x="608" y="152" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="620" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">外部系統</text><text x="620" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">持有 Commit 真相</text></g><g data-node="true"><rect x="976" y="152" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="988" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Checkpoint</text><text x="988" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">保存 Graph State</text></g><g data-node="true"><rect x="608" y="280" width="192" height="64" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><text x="620" y="304" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">操作已提交</text><text x="620" y="324" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">外部狀態：Committed</text></g><g data-node="true"><rect x="976" y="280" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="988" y="304" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">結果尚未保存</text><text x="988" y="324" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">缺少本次 Tool Result</text></g><rect x="176" y="424" width="192" height="40" rx="0" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="188" y="440" font-size="12" fill="#102743" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">重啟：讀 Ledger</text><text x="188" y="460" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">定位原 Operation ID</text><rect x="976" y="436" width="192" height="44" rx="0" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="988" y="453" font-size="12" fill="#102743" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">只看 Checkpoint</text><text x="988" y="473" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">仍無法確認外部結果</text><rect x="224" y="564" width="624" height="24" rx="0" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="236" y="581" font-size="12" fill="#102743" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">以回查證據分類，再更新本地狀態與必要的 Tool Result。</text><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">已證明提交</text><text x="96" y="660" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">重用結果，補寫必要紀錄</text><text x="456" y="638" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">已證明未提交</text><text x="456" y="660" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">重新檢查政策、預算與取消</text><text x="832" y="638" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">仍無法判讀</text><text x="832" y="660" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">保留 ambiguous，停放或人工處理</text></svg>
