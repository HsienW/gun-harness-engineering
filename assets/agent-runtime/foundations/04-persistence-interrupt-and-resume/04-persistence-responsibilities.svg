<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="04-persistence-responsibilities-title 04-persistence-responsibilities-desc" lang="zh-TW" id="d-04-persistence-responsibilities-root"><title id="04-persistence-responsibilities-title">五種保存資料，支援不同的恢復問題</title><desc id="04-persistence-responsibilities-desc">各權威寫入端保存 Transcript、Checkpoint、Ownership、Interrupt Manifest 與 Side-effect Ledger；恢復時依待查問題讀取對應資料。</desc><defs>
      <style>#d-04-persistence-responsibilities-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-04-persistence-responsibilities-root nav, #d-04-persistence-responsibilities-root p { font-size:14px; line-height:1.8; }
      #d-04-persistence-responsibilities-root a { color:#0066d6; }
      #d-04-persistence-responsibilities-root .diagram-container { width:100%; overflow-x:auto; }
      #d-04-persistence-responsibilities-root details { border-top:1px solid #b9cce3; margin-top:24px; padding-top:16px; }
      #d-04-persistence-responsibilities-root summary { cursor:pointer; font-size:16px; font-weight:600; }
      #d-04-persistence-responsibilities-root nav, #d-04-persistence-responsibilities-root details { display:none; }
      #d-04-persistence-responsibilities-root .diagram-container { overflow-x:visible; }</style><marker id="d-04-persistence-responsibilities-04-persistence-responsibilities-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-04-persistence-responsibilities-04-persistence-responsibilities-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker><marker id="d-04-persistence-responsibilities-04-persistence-responsibilities-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="224" height="24" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">PERSISTENCE / READ PURPOSES</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">讀寫架構 · 寫入與查讀各有權威</text><rect x="96" y="116" width="64" height="4" rx="0" fill="#0078fc" stroke="none" stroke-width="1.2"/><path d="M320 184 L448 184" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-04-persistence-responsibilities-04-persistence-responsibilities-arrow)"/><path d="M768 184 L960 184" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-04-persistence-responsibilities-04-persistence-responsibilities-arrow)"/><path d="M320 272 L448 272" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-04-persistence-responsibilities-04-persistence-responsibilities-arrow)"/><path d="M768 272 L960 272" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-04-persistence-responsibilities-04-persistence-responsibilities-arrow)"/><path d="M320 360 L448 360" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-04-persistence-responsibilities-04-persistence-responsibilities-arrow)"/><path d="M768 360 L960 360" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-04-persistence-responsibilities-04-persistence-responsibilities-arrow)"/><path d="M320 448 L448 448" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-04-persistence-responsibilities-04-persistence-responsibilities-arrow)"/><path d="M768 448 L960 448" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-04-persistence-responsibilities-04-persistence-responsibilities-arrow)"/><path d="M320 536 L448 536" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-04-persistence-responsibilities-04-persistence-responsibilities-arrow)"/><path d="M768 536 L960 536" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-04-persistence-responsibilities-04-persistence-responsibilities-arrow)"/><g data-node="true"><rect x="448" y="152" width="320" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="460" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Transcript</text><text x="460" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">對話與 Tool 訊息</text></g><g data-node="true"><rect x="448" y="240" width="320" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="460" y="264" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Checkpoint</text><text x="460" y="284" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Graph State 與下一個節點</text></g><g data-node="true"><rect x="448" y="328" width="320" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="460" y="352" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Task／Ownership</text><text x="460" y="372" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">目前 owner 與 generation</text></g><g data-node="true"><rect x="448" y="416" width="320" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="460" y="440" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Interrupt Manifest</text><text x="460" y="460" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">等待對象與 Resume 契約</text></g><g data-node="true"><rect x="448" y="504" width="320" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="460" y="528" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Side-effect Ledger</text><text x="460" y="548" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Attempt、effect key 與 phase</text></g><g data-node="true"><rect x="96" y="152" width="224" height="416" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="108" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">各資料的權威寫入端</text><text x="108" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Loop：保存對話訊息</text><text x="108" y="214" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Checkpointer：保存 Graph</text><text x="108" y="232" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Ownership：保存執行權</text><text x="108" y="250" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Interrupt handler：保存等待</text><text x="108" y="268" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Runner／Adapter：保存效果</text><text x="108" y="286" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">各項寫入依自己的契約提交</text></g><g data-node="true"><rect x="960" y="152" width="224" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="972" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">重建對話 Context</text><text x="972" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">讀取已保存的訊息</text></g><g data-node="true"><rect x="960" y="240" width="224" height="240" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><text x="972" y="264" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Resume 前核對</text><text x="972" y="284" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">讀取 Graph 恢復位置</text><text x="972" y="302" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">核對目前 Run 與 owner</text><text x="972" y="320" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">核對指定等待與回覆契約</text><text x="972" y="338" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">必要欄位依等待種類決定</text></g><g data-node="true"><rect x="960" y="504" width="224" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="972" y="528" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">回查外部效果</text><text x="972" y="548" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">連同下游證據判讀</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">實線：各權威寫入端保存資料。虛線：恢復與查讀用途；圖中省略一般執行期間的其他讀取。</text><text x="96" y="660" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">五種資料可分屬不同儲存；Checkpoint 缺少結果時，仍需 Ledger 與下游證據確認外部 Commit。</text></svg>
