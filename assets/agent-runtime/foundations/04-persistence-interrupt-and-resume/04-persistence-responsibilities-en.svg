      #d-04-persistence-responsibilities-en-root .diagram-container { width:100%; overflow-x:auto; }
      #d-04-persistence-responsibilities-en-root details { border-top:1px solid #b9cce3; margin-top:24px; padding-top:16px; }
      #d-04-persistence-responsibilities-en-root summary { cursor:pointer; font-size:16px; font-weight:600; }
      #d-04-persistence-responsibilities-en-root nav, #d-04-persistence-responsibilities-en-root details { display:none; }
