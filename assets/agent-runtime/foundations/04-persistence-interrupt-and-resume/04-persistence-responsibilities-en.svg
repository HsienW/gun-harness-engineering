<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="04-persistence-responsibilities-en-title 04-persistence-responsibilities-en-desc" lang="en" id="d-04-persistence-responsibilities-en-root"><title id="04-persistence-responsibilities-en-title">Five persistence roles and their recovery uses</title><desc id="04-persistence-responsibilities-en-desc">Authoritative writers save Transcript, Checkpoint, Ownership, Interrupt Manifest, and Side-effect Ledger data, which recovery reads according to the question being checked.</desc><defs>
      <style>#d-04-persistence-responsibilities-en-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
