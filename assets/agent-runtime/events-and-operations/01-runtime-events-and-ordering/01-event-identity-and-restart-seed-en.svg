<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="01-event-identity-and-restart-seed-en-title 01-event-identity-and-restart-seed-en-desc" lang="en" id="d-01-event-identity-and-restart-seed-en-root"><title id="01-event-identity-and-restart-seed-en-title">Retain identity on redelivery; seed from durable evidence after restart</title><desc id="01-event-identity-and-restart-seed-en-desc">Redelivery retains the original event ID, while a new event has its own identity. After restart, seed from the persisted maximum sequence before allocating subsequent values for the same Run.</desc><defs>
      <style>#d-01-event-identity-and-restart-seed-en-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-01-event-identity-and-restart-seed-en-root nav, #d-01-event-identity-and-restart-seed-en-root p { font-size:14px; line-height:1.8; }
      #d-01-event-identity-and-restart-seed-en-root a { color:#0066d6; }
      #d-01-event-identity-and-restart-seed-en-root .diagram-container { width:100%; overflow-x:auto; }
      #d-01-event-identity-and-restart-seed-en-root details { border-top:1px solid #b9cce3; margin-top:24px; padding-top:16px; }
      #d-01-event-identity-and-restart-seed-en-root summary { cursor:pointer; font-size:16px; font-weight:600; }
      #d-01-event-identity-and-restart-seed-en-root nav, #d-01-event-identity-and-restart-seed-en-root details { display:none; }
      #d-01-event-identity-and-restart-seed-en-root .diagram-container { overflow-x:visible; }</style><marker id="d-01-event-identity-and-restart-seed-en-01-event-identity-and-restart-seed-en-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-01-event-identity-and-restart-seed-en-01-event-identity-and-restart-seed-en-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker><marker id="d-01-event-identity-and-restart-seed-en-01-event-identity-and-restart-seed-en-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="240" height="24" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">EVENTS / IDENTITY AND RESTART</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">Illustrative IDs and sequences / no measured time scale</text><rect x="96" y="116" width="64" height="4" rx="0" fill="#0078fc" stroke="none" stroke-width="1.2"/><rect x="80" y="144" width="1120" height="176" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><text x="96" y="172" font-size="12" fill="#102743" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">A / Same event and new event: caller supplies original identity</text><rect x="80" y="352" width="1120" height="232" rx="8" fill="#eef4fb" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><text x="96" y="380" font-size="12" fill="#102743" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">B / Process restart: sequence restoration for the same Run, separate from A</text><rect x="640" y="400" width="544" height="128" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><text x="656" y="420" font-size="12" fill="#102743" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">In-process Map: old values lost on restart</text><text x="96" y="556" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Multiple Workers need a single-writer or shared allocation contract. This Map has no cross-process atomic allocation.</text><path d="M384 244 L480 244" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-01-event-identity-and-restart-seed-en-01-event-identity-and-restart-seed-en-arrow)"/><rect x="400.0" y="206" width="64" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="432" y="220" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">REDELIVER</text><path d="M320 476 L384 476" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-01-event-identity-and-restart-seed-en-01-event-identity-and-restart-seed-en-arrow)"/><path d="M608 476 L672 476" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-01-event-identity-and-restart-seed-en-01-event-identity-and-restart-seed-en-arrow)"/><path d="M896 476 L960 476" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-01-event-identity-and-restart-seed-en-01-event-identity-and-restart-seed-en-arrow)"/><g data-node="true"><rect x="96" y="208" width="288" height="80" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="108" y="232" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Original event saved</text><text x="108" y="252" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">event-a / sequence 12</text><text x="108" y="270" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Read original ID and sequence</text></g><g data-node="true"><rect x="480" y="208" width="288" height="80" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><text x="492" y="232" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Redeliver original event</text><text x="492" y="252" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">event-a / sequence 12</text><text x="492" y="270" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Retain existing identity</text></g><g data-node="true"><rect x="864" y="208" width="320" height="80" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="876" y="232" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">A genuinely new event</text><text x="876" y="252" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">event-b / sequence 13</text><text x="876" y="270" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Identical text can be a new event</text></g><g data-node="true"><rect x="96" y="440" width="224" height="72" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="108" y="464" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Persisted sequence evidence</text><text x="108" y="484" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Original Run maximum: 12</text></g><g data-node="true"><rect x="384" y="440" width="224" height="72" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="396" y="464" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Caller reads and checks</text><text x="396" y="484" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Verify the Run and source</text></g><g data-node="true"><rect x="672" y="440" width="224" height="72" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="684" y="464" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">seed(12)</text><text x="684" y="484" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Restore allocator memory</text></g><g data-node="true"><rect x="960" y="440" width="208" height="72" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="972" y="464" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">next() → 13</text><text x="972" y="484" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Allocate the next sequence</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">stableEventId reuses an ID only when the caller supplies it. Identical payloads do not automatically receive the same ID.</text><text x="96" y="660" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Dashed arrows mark durable-read and recovery wiring. TTL or capacity eviction can also remove the Map's allocation history.</text></svg>
