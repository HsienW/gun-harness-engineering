<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="01-event-identity-and-restart-seed-title 01-event-identity-and-restart-seed-desc" lang="zh-TW" id="d-01-event-identity-and-restart-seed-root"><title id="01-event-identity-and-restart-seed-title">重送保留事件身分，重啟配號先讀回持久依據</title><desc id="01-event-identity-and-restart-seed-desc">同一事件重送沿用原 ID，新事件有自己的身分；程序重啟後由已保存最大序號 seed，再配置同一 Run 後續序號。</desc><defs>
      <style>#d-01-event-identity-and-restart-seed-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-01-event-identity-and-restart-seed-root nav, #d-01-event-identity-and-restart-seed-root p { font-size:14px; line-height:1.8; }
      #d-01-event-identity-and-restart-seed-root a { color:#0066d6; }
      #d-01-event-identity-and-restart-seed-root .diagram-container { width:100%; overflow-x:auto; }
      #d-01-event-identity-and-restart-seed-root details { border-top:1px solid #b9cce3; margin-top:24px; padding-top:16px; }
      #d-01-event-identity-and-restart-seed-root summary { cursor:pointer; font-size:16px; font-weight:600; }
      #d-01-event-identity-and-restart-seed-root nav, #d-01-event-identity-and-restart-seed-root details { display:none; }
      #d-01-event-identity-and-restart-seed-root .diagram-container { overflow-x:visible; }</style><marker id="d-01-event-identity-and-restart-seed-01-event-identity-and-restart-seed-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-01-event-identity-and-restart-seed-01-event-identity-and-restart-seed-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker><marker id="d-01-event-identity-and-restart-seed-01-event-identity-and-restart-seed-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="240" height="24" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">EVENTS / IDENTITY AND RESTART</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">示意身分與序號 · 非實測時間比例</text><rect x="96" y="116" width="64" height="4" rx="0" fill="#0078fc" stroke="none" stroke-width="1.2"/><rect x="80" y="144" width="1120" height="176" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><text x="96" y="172" font-size="12" fill="#102743" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">A / 同一事件與新事件：由 caller 提供原身分</text><rect x="80" y="352" width="1120" height="232" rx="8" fill="#eef4fb" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><text x="96" y="380" font-size="12" fill="#102743" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">B / 程序重啟：同一 Run 的配號恢復，與上排分開說明</text><rect x="640" y="400" width="544" height="128" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><text x="656" y="420" font-size="12" fill="#102743" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">程序內 Map：重啟後失去舊值</text><text x="96" y="556" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">跨 Worker 需唯一寫入者或共享配置契約；這個 Map 沒有自行提供跨程序原子配號。</text><path d="M384 244 L480 244" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-01-event-identity-and-restart-seed-01-event-identity-and-restart-seed-arrow)"/><rect x="400.0" y="206" width="64" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="432" y="220" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">重送</text><path d="M320 476 L384 476" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-01-event-identity-and-restart-seed-01-event-identity-and-restart-seed-arrow)"/><path d="M608 476 L672 476" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-01-event-identity-and-restart-seed-01-event-identity-and-restart-seed-arrow)"/><path d="M896 476 L960 476" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-01-event-identity-and-restart-seed-01-event-identity-and-restart-seed-arrow)"/><g data-node="true"><rect x="96" y="208" width="288" height="80" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="108" y="232" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">原事件已保存</text><text x="108" y="252" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">event-a / sequence 12</text><text x="108" y="270" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">讀回原 ID 與序號</text></g><g data-node="true"><rect x="480" y="208" width="288" height="80" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><text x="492" y="232" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">重送原事件</text><text x="492" y="252" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">event-a / sequence 12</text><text x="492" y="270" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">不重新建立事件身分</text></g><g data-node="true"><rect x="864" y="208" width="320" height="80" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="876" y="232" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">真正的新事件</text><text x="876" y="252" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">event-b / sequence 13</text><text x="876" y="270" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">相同文字仍可能是新事件</text></g><g data-node="true"><rect x="96" y="440" width="224" height="72" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="108" y="464" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">已保存序號依據</text><text x="108" y="484" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">原 Run 最大值：12</text></g><g data-node="true"><rect x="384" y="440" width="224" height="72" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="396" y="464" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Caller 讀取並核對</text><text x="396" y="484" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">確認同一 Run 與來源</text></g><g data-node="true"><rect x="672" y="440" width="224" height="72" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="684" y="464" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">seed(12)</text><text x="684" y="484" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">恢復 allocator 記憶</text></g><g data-node="true"><rect x="960" y="440" width="208" height="72" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="972" y="464" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">next() → 13</text><text x="972" y="484" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">再配置下一個序號</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">stableEventId 只在 caller 提供既有 ID 時重用；相同 payload 不會自動取得同一 ID。</text><text x="96" y="660" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">虛線箭頭是需接線的持久讀取／恢復責任；Map 的 TTL、容量淘汰也可能使舊配號記憶消失。</text></svg>
