<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="04-layered-runtime-health-title 04-layered-runtime-health-desc" lang="zh-TW" id="d-04-layered-runtime-health-root"><title id="04-layered-runtime-health-title">每一層健康，都有自己的輸入與處置範圍</title><desc id="04-layered-runtime-health-desc">caller 提供 probe 與執行訊號，projectRuntimeHealth 分別計算活著、可達、接納、恢復與降級；投影與實際處置接線分開。</desc><defs>
      <style>#d-04-layered-runtime-health-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-04-layered-runtime-health-root nav, #d-04-layered-runtime-health-root p { font-size:14px; line-height:1.8; }
      #d-04-layered-runtime-health-root a { color:#0066d6; }
      #d-04-layered-runtime-health-root .diagram-container { width:100%; overflow-x:auto; }
      #d-04-layered-runtime-health-root details { border-top:1px solid #b9cce3; margin-top:24px; padding-top:16px; }
      #d-04-layered-runtime-health-root summary { cursor:pointer; font-size:16px; font-weight:600; }
      #d-04-layered-runtime-health-root nav, #d-04-layered-runtime-health-root details { display:none; }
      #d-04-layered-runtime-health-root .diagram-container { overflow-x:visible; }</style><marker id="d-04-layered-runtime-health-04-layered-runtime-health-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-04-layered-runtime-health-04-layered-runtime-health-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker><marker id="d-04-layered-runtime-health-04-layered-runtime-health-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="248" height="24" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">OPERATIONS / HEALTH PROJECTION</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">條件對照 · 五列獨立判讀</text><rect x="96" y="116" width="64" height="4" rx="0" fill="#0078fc" stroke="none" stroke-width="1.2"/><path d="M416 184 L512 184" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-04-layered-runtime-health-04-layered-runtime-health-arrow)"/><path d="M800 184 L864 184" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-04-layered-runtime-health-04-layered-runtime-health-arrow)"/><path d="M416 272 L512 272" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-04-layered-runtime-health-04-layered-runtime-health-arrow)"/><path d="M800 272 L864 272" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-04-layered-runtime-health-04-layered-runtime-health-arrow)"/><path d="M416 360 L512 360" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-04-layered-runtime-health-04-layered-runtime-health-arrow)"/><path d="M800 360 L864 360" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-04-layered-runtime-health-04-layered-runtime-health-arrow)"/><path d="M416 448 L512 448" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-04-layered-runtime-health-04-layered-runtime-health-arrow)"/><path d="M800 448 L864 448" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-04-layered-runtime-health-04-layered-runtime-health-arrow)"/><path d="M416 536 L512 536" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-04-layered-runtime-health-04-layered-runtime-health-arrow)"/><path d="M800 536 L864 536" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-04-layered-runtime-health-04-layered-runtime-health-arrow)"/><g data-node="true"><rect x="96" y="152" width="320" height="432" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="108" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Caller 提供訊號</text><text x="108" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">processAlive</text><text x="108" y="214" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Redis／Postgres／Checkpoint</text><text x="108" y="232" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">接納開關與 draining</text><text x="108" y="250" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">recovery 可達條件</text><text x="108" y="268" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Run／容量／heartbeat</text><text x="108" y="286" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">read-only degraded</text><text x="108" y="304" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">multiInstanceSafe</text><text x="108" y="322" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif"></text><text x="108" y="340" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">預設 probe 僅提供部分輸入</text><text x="108" y="358" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">缺少訊號保留 missingSignals</text></g><g data-node="true"><rect x="864" y="152" width="320" height="432" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="876" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">部署與 consumer 接線</text><text x="876" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Probe：真正探測依賴</text><text x="876" y="214" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">接納端：停止或允許新工作</text><text x="876" y="232" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">恢復端：核對恢復資格</text><text x="876" y="250" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">寫入端：執行限制政策</text><text x="876" y="268" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif"></text><text x="876" y="286" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">multiInstanceSafe 預設 false</text><text x="876" y="304" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">需由外部驗證支持</text><text x="876" y="322" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif"></text><text x="876" y="340" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">投影函式沒有代為連線探測</text><text x="876" y="358" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">也沒有代為執行全部處置</text></g><g data-node="true"><rect x="512" y="152" width="288" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="524" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">alive</text><text x="524" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">processAlive 未明確 false</text></g><g data-node="true"><rect x="512" y="240" width="288" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="524" y="264" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">reachable</text><text x="524" y="284" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">三項指定依賴均為 true</text></g><g data-node="true"><rect x="512" y="328" width="288" height="64" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><text x="524" y="352" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">acceptNewWork</text><text x="524" y="372" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">依賴＋接納開關＋draining</text></g><g data-node="true"><rect x="512" y="416" width="288" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="524" y="440" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">resumeDurableWork</text><text x="524" y="460" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">持久依賴＋recovery 條件</text></g><g data-node="true"><rect x="512" y="504" width="288" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="524" y="528" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">degraded</text><text x="524" y="548" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">read-only degraded 訊號</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Live 通過仍可能無法接納或恢復。Alive 缺省可 ready；這個預設值未證明外部 probe 已完成。</text><text x="96" y="660" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">本文 resume 政策排除 Redis 不可達原因；實際恢復是否依賴 Redis，仍需核對部署路徑。</text></svg>
