 y="550" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">手動對照：獨立 Task = 2</text></g><g data-node="true"><rect x="704" y="488" width="448" height="80" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="716" y="512" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">計數對照</text><text x="716" y="532" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">snapshot：Task total = 3</text><text x="716" y="550" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">手動對照：獨立 Task = 3</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">獨立 Task 數是本圖手動對照，未表示 snapshot 已提供此欄位；槽位位置也不等於事件時間排序。</text><text x="96" y="660" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">保留時間隨流量改變，重啟失去記憶體紀錄。其他類型覆寫 Task entry 時，Task total 也可能下降。</text></svg>
