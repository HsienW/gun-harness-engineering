<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="04-ring-buffer-record-window-title 04-ring-buffer-record-window-desc" lang="zh-TW" id="d-04-ring-buffer-record-window-root"><title id="04-ring-buffer-record-window-title">固定容量保留的是紀錄，Task 數需要另行辨認</title><desc id="04-ring-buffer-record-window-desc">示意容量三筆的 ring buffer，同一 Task 的兩種狀態佔兩筆；新紀錄覆寫最舊槽位後，entry 數與獨立 Task 數的關係改變。</desc><defs>
      <style>#d-04-ring-buffer-record-window-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-04-ring-buffer-record-window-root nav, #d-04-ring-buffer-record-window-root p { font-size:14px; line-height:1.8; }
      #d-04-ring-buffer-record-window-root a { color:#0066d6; }
      #d-04-ring-buffer-record-window-root .diagram-container { width:100%; overflow-x:auto; }
      #d-04-ring-buffer-record-window-root details { border-top:1px solid #b9cce3; margin-top:24px; padding-top:16px; }
      #d-04-ring-buffer-record-window-root summary { cursor:pointer; font-size:16px; font-weight:600; }
      #d-04-ring-buffer-record-window-root nav, #d-04-ring-buffer-record-window-root details { display:none; }
