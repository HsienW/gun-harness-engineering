<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="04-ring-buffer-record-window-en-title 04-ring-buffer-record-window-en-desc" lang="en" id="d-04-ring-buffer-record-window-en-root"><title id="04-ring-buffer-record-window-en-title">A capacity window counts records; distinct Tasks need separate interpretation</title><desc id="04-ring-buffer-record-window-en-desc">In a three-entry example ring buffer, two states of one Task occupy two entries. A new record overwrites the oldest slot, changing the relationship between entry counts and distinct Tasks.</desc><defs>
      <style>#d-04-ring-buffer-record-window-en-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-04-ring-buffer-record-window-en-root nav, #d-04-ring-buffer-record-window-en-root p { font-size:14px; line-height:1.8; }
      #d-04-ring-buffer-record-window-en-root a { color:#0066d6; }
      #d-04-ring-buffer-record-window-en-root .diagram-container { width:100%; overflow-x:auto; }
      #d-04-ring-buffer-record-window-en-root details { border-top:1px solid #b9cce3; margin-top:24px; padding-top:16px; }
      #d-04-ring-buffer-record-window-en-root summary { cursor:pointer; font-size:16px; font-weight:600; }
      #d-04-ring-buffer-record-window-en-root nav, #d-04-ring-buffer-record-window-en-root details { display:none; }
      #d-04-ring-buffer-record-window-en-root .diagram-container { overflow-x:visible; }</style><marker id="d-04-ring-buffer-record-window-en-04-ring-buffer-record-window-en-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-04-ring-buffer-record-window-en-04-ring-buffer-record-window-en-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker><marker id="d-04-ring-buffer-record-window-en-04-ring-buffer-record-window-en-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="276" height="24" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">METRICS / RECORD WINDOW AND COUNTS</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">Example capacity: 3 entries / no fixed time scale</text><rect x="96" y="116" width="64" height="4" rx="0" fill="#0078fc" stroke="none" stroke-width="1.2"/><rect x="96" y="144" width="384" height="448" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="656" y="144" width="544" height="448" rx="8" fill="#eef4fb" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><text x="112" y="172" font-size="12" fill="#102743" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">A / Before overwrite: three retained records</text><text x="672" y="172" font-size="12" fill="#102743" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">B / After adding Task C's running record</text><path d="M448 232 L704 232" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-04-ring-buffer-record-window-en-04-ring-buffer-record-window-en-arrow)"/><rect x="488.0" y="194" width="176" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="576" y="208" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">New C overwrites oldest slot</text><g data-node="true"><rect x="128" y="200" width="320" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="140" y="224" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Slot 0 / Task A</text><text x="140" y="244" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">running / oldest record</text></g><g data-node="true"><rect x="128" y="288" width="320" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="140" y="312" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Slot 1 / Task A</text><text x="140" y="332" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">completed / another entry for A</text></g><g data-node="true"><rect x="128" y="376" width="320" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="140" y="400" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Slot 2 / Task B</text><text x="140" y="420" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">completed</text></g><g data-node="true"><rect x="704" y="200" width="448" height="64" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><text x="716" y="224" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Slot 0 / Task C</text><text x="716" y="244" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">running / new record</text></g><g data-node="true"><rect x="704" y="288" width="448" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="716" y="312" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Slot 1 / Task A</text><text x="716" y="332" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">completed / retained</text></g><g data-node="true"><rect x="704" y="376" width="448" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="716" y="400" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Slot 2 / Task B</text><text x="716" y="420" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">completed / retained</text></g><g data-node="true"><rect x="128" y="488" width="320" height="80" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="140" y="512" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Count comparison</text><text x="140" y="532" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">snapshot: Task total = 3</text><text x="140" y="550" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Manual comparison: distinct Tasks = 2</text></g><g data-node="true"><rect x="704" y="488" width="448" height="80" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="716" y="512" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Count comparison</text><text x="716" y="532" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">snapshot: Task total = 3</text><text x="716" y="550" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Manual comparison: distinct Tasks = 3</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Distinct Task counts are manual comparisons, not claimed snapshot fields. Slot positions are not chronological event order.</text><text x="96" y="660" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Retention time varies with traffic; restart loses memory. Other record types overwriting Task entries can lower Task total.</text></svg>
