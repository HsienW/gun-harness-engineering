<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="05-validation-evidence-and-gates-en-title 05-validation-evidence-and-gates-en-desc" lang="en" id="d-05-validation-evidence-and-gates-en-root"><title id="05-validation-evidence-and-gates-en-title">Link Gate results to tests, versions and deployment consumers</title><desc id="05-validation-evidence-and-gates-en-desc">Fault scenarios, real or test-double environments and original evidence correlate with build, Manifest, policy and dataset. Separate Gates judge their contracts; deployment still needs to consume results.</desc><defs>
      <style>#d-05-validation-evidence-and-gates-en-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-05-validation-evidence-and-gates-en-root nav, #d-05-validation-evidence-and-gates-en-root p { font-size:14px; line-height:1.8; }
      #d-05-validation-evidence-and-gates-en-root a { color:#0066d6; }
      #d-05-validation-evidence-and-gates-en-root .diagram-container { width:100%; overflow-x:auto; }
      #d-05-validation-evidence-and-gates-en-root details { border-top:1px solid #b9cce3; margin-top:24px; padding-top:16px; }
      #d-05-validation-evidence-and-gates-en-root summary { cursor:pointer; font-size:16px; font-weight:600; }
      #d-05-validation-evidence-and-gates-en-root nav, #d-05-validation-evidence-and-gates-en-root details { display:none; }
      #d-05-validation-evidence-and-gates-en-root .diagram-container { overflow-x:visible; }</style><marker id="d-05-validation-evidence-and-gates-en-05-validation-evidence-and-gates-en-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-05-validation-evidence-and-gates-en-05-validation-evidence-and-gates-en-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker><marker id="d-05-validation-evidence-and-gates-en-05-validation-evidence-and-gates-en-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="292" height="24" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">VALIDATION / EVIDENCE AND GATE SCOPE</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">Three independent Gates / no fixed serial chain</text><rect x="96" y="116" width="64" height="4" rx="0" fill="#0078fc" stroke="none" stroke-width="1.2"/><path d="M416 196 L512 196" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-05-validation-evidence-and-gates-en-05-validation-evidence-and-gates-en-arrow)"/><path d="M800 196 L864 196" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-05-validation-evidence-and-gates-en-05-validation-evidence-and-gates-en-arrow)"/><path d="M416 356 L512 356" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-05-validation-evidence-and-gates-en-05-validation-evidence-and-gates-en-arrow)"/><path d="M800 356 L864 356" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-05-validation-evidence-and-gates-en-05-validation-evidence-and-gates-en-arrow)"/><path d="M416 516 L512 516" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-05-validation-evidence-and-gates-en-05-validation-evidence-and-gates-en-arrow)"/><path d="M800 516 L864 516" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-05-validation-evidence-and-gates-en-05-validation-evidence-and-gates-en-arrow)"/><g data-node="true"><rect x="96" y="152" width="320" height="432" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="108" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Test artifacts and versions</text><text x="108" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Fault scenario / dataset / fixture</text><text x="108" y="214" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Environment: real or test double</text><text x="108" y="232" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Original evidence reference</text><text x="108" y="250" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Runtime build / Manifest</text><text x="108" y="268" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Policy reference / digest</text><text x="108" y="286" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif"></text><text x="108" y="304" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Supply inputs for each Gate:</text><text x="108" y="322" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">facts / candidate / evaluation</text><text x="108" y="340" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Check dependency implementations</text><text x="108" y="358" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Versioned release report</text></g><g data-node="true"><rect x="864" y="152" width="320" height="432" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="876" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">CI / deployment consumes results</text><text x="876" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Link artifacts to the Build</text><text x="876" y="214" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Retain artifacts and evidence refs</text><text x="876" y="232" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Distinguish pass, fail and incomplete</text><text x="876" y="250" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Wire in failure blocking</text><text x="876" y="268" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif"></text><text x="876" y="286" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Package script is an entry point</text><text x="876" y="304" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Verify mandatory pipeline execution</text><text x="876" y="322" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif"></text><text x="876" y="340" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">The scope of passed depends on</text><text x="876" y="358" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Input source, environment and wiring</text></g><g data-node="true"><rect x="512" y="152" width="288" height="88" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="524" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Completion / Quality</text><text x="524" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Check policy, checks and facts</text><text x="524" y="214" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Compare supplied evaluation to limits</text></g><g data-node="true"><rect x="512" y="312" width="288" height="88" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><text x="524" y="336" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Readiness</text><text x="524" y="356" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Check build / Manifest</text><text x="524" y="374" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Call five injected check categories</text></g><g data-node="true"><rect x="512" y="472" width="288" height="88" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="524" y="496" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Release</text><text x="524" y="516" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Parse a versioned report</text><text x="524" y="534" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Judge report values and regressions</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Readiness checks need trusted implementations. Completion scores and Release reports need traceable producers.</text><text x="96" y="660" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Dashed CI links need verification. Valid report fields, a present digest and passing fixtures each have a limited scope.</text></svg>
