<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="03-records-and-data-output-boundaries-en-title 03-records-and-data-output-boundaries-en-desc" lang="en" id="d-03-records-and-data-output-boundaries-en-root"><title id="03-records-and-data-output-boundaries-en-title">One execution, separate records and data policies</title><desc id="03-records-and-data-output-boundaries-en-desc">Stable execution identity correlates Events, Traces, Audit, authoritative state and content references. Each branch has its own persistence, failure and data handling responsibilities.</desc><defs>
      <style>#d-03-records-and-data-output-boundaries-en-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-03-records-and-data-output-boundaries-en-root nav, #d-03-records-and-data-output-boundaries-en-root p { font-size:14px; line-height:1.8; }
      #d-03-records-and-data-output-boundaries-en-root a { color:#0066d6; }
      #d-03-records-and-data-output-boundaries-en-root .diagram-container { width:100%; overflow-x:auto; }
      #d-03-records-and-data-output-boundaries-en-root details { border-top:1px solid #b9cce3; margin-top:24px; padding-top:16px; }
      #d-03-records-and-data-output-boundaries-en-root summary { cursor:pointer; font-size:16px; font-weight:600; }
      #d-03-records-and-data-output-boundaries-en-root nav, #d-03-records-and-data-output-boundaries-en-root details { display:none; }
      #d-03-records-and-data-output-boundaries-en-root .diagram-container { overflow-x:visible; }</style><marker id="d-03-records-and-data-output-boundaries-en-03-records-and-data-output-boundaries-en-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-03-records-and-data-output-boundaries-en-03-records-and-data-output-boundaries-en-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker><marker id="d-03-records-and-data-output-boundaries-en-03-records-and-data-output-boundaries-en-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="336" height="24" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">OBSERVABILITY / RECORD AND DATA BOUNDARIES</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">Correlation and responsibility / check each output</text><rect x="96" y="116" width="64" height="4" rx="0" fill="#0078fc" stroke="none" stroke-width="1.2"/><path d="M416 188 L512 188" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-03-records-and-data-output-boundaries-en-03-records-and-data-output-boundaries-en-arrow)"/><path d="M416 276 L512 276" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-03-records-and-data-output-boundaries-en-03-records-and-data-output-boundaries-en-arrow)"/><path d="M416 364 L512 364" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-03-records-and-data-output-boundaries-en-03-records-and-data-output-boundaries-en-arrow)"/><path d="M416 452 L512 452" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-03-records-and-data-output-boundaries-en-03-records-and-data-output-boundaries-en-arrow)"/><path d="M416 540 L512 540" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-03-records-and-data-output-boundaries-en-03-records-and-data-output-boundaries-en-arrow)"/><g data-node="true"><rect x="96" y="152" width="320" height="432" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><text x="108" y="176" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Shared execution correlation</text><text x="108" y="196" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Request / Thread / Run</text><text x="108" y="214" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Task / Step</text><text x="108" y="232" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Tool Call / Tool Execution</text><text x="108" y="250" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Attempt and trusted scope</text><text x="108" y="268" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif"></text><text x="108" y="286" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Trace / Span IDs describe calls</text><text x="108" y="304" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Retry or recovery can create new spans</text><text x="108" y="322" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif"></text><text x="108" y="340" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Arrows: correlation / output duties</text><text x="108" y="358" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Check wiring at each entry point</text></g><g data-node="true"><rect x="512" y="152" width="672" height="72" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="524" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Runtime Event</text><text x="524" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Version / identity / order / payload contract</text><text x="524" y="214" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Confirm persistence, transport and consumer application separately</text></g><g data-node="true"><rect x="512" y="240" width="672" height="72" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="524" y="264" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Trace / Span</text><text x="524" y="284" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Sampling / instrumentation / exporter / flush</text><text x="524" y="302" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Error-message redaction has its own scope</text></g><g data-node="true"><rect x="512" y="328" width="672" height="72" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="524" y="352" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Audit</text><text x="524" y="372" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Check general record and authorization-decision persistence separately</text><text x="524" y="390" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Console / Pg / Composite and field policies have their own conditions</text></g><g data-node="true"><rect x="512" y="416" width="672" height="72" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="524" y="440" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Authoritative Task / Ledger records</text><text x="524" y="460" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Retrieve domain state and effect evidence</text><text x="524" y="478" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Unknown external commits still need trusted reconciliation</text></g><g data-node="true"><rect x="512" y="504" width="672" height="72" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><text x="524" y="528" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Raw content and safe references: design responsibility</text><text x="524" y="548" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Separate content needs access, retention and deletion contracts</text><text x="524" y="566" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Diagnostics retain reason, opaque correlation and safe references</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Branches share no transaction or uniform durability guarantee. Missing records still require checking authoritative state.</text><text x="96" y="660" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Audit field rules, Trace error replacement and Opik redaction have separate scopes; one redactor cannot establish full coverage.</text></svg>
