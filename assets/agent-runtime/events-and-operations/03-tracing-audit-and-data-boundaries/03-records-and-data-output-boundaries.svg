<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="03-records-and-data-output-boundaries-title 03-records-and-data-output-boundaries-desc" lang="zh-TW" id="d-03-records-and-data-output-boundaries-root"><title id="03-records-and-data-output-boundaries-title">同一執行留下多種紀錄，各自核對保存與資料政策</title><desc id="03-records-and-data-output-boundaries-desc">以穩定執行身分關聯 Event、Trace、Audit、權威狀態與內容 reference；各分支有不同保存、失敗與資料處理責任。</desc><defs>
      <style>#d-03-records-and-data-output-boundaries-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-03-records-and-data-output-boundaries-root nav, #d-03-records-and-data-output-boundaries-root p { font-size:14px; line-height:1.8; }
      #d-03-records-and-data-output-boundaries-root a { color:#0066d6; }
      #d-03-records-and-data-output-boundaries-root .diagram-container { width:100%; overflow-x:auto; }
      #d-03-records-and-data-output-boundaries-root details { border-top:1px solid #b9cce3; margin-top:24px; padding-top:16px; }
      #d-03-records-and-data-output-boundaries-root summary { cursor:pointer; font-size:16px; font-weight:600; }
      #d-03-records-and-data-output-boundaries-root nav, #d-03-records-and-data-output-boundaries-root details { display:none; }
      #d-03-records-and-data-output-boundaries-root .diagram-container { overflow-x:visible; }</style><marker id="d-03-records-and-data-output-boundaries-03-records-and-data-output-boundaries-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-03-records-and-data-output-boundaries-03-records-and-data-output-boundaries-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker><marker id="d-03-records-and-data-output-boundaries-03-records-and-data-output-boundaries-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="336" height="24" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">OBSERVABILITY / RECORD AND DATA BOUNDARIES</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">關聯與責任圖 · 各輸出獨立核對</text><rect x="96" y="116" width="64" height="4" rx="0" fill="#0078fc" stroke="none" stroke-width="1.2"/><path d="M416 188 L512 188" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-03-records-and-data-output-boundaries-03-records-and-data-output-boundaries-arrow)"/><path d="M416 276 L512 276" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-03-records-and-data-output-boundaries-03-records-and-data-output-boundaries-arrow)"/><path d="M416 364 L512 364" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-03-records-and-data-output-boundaries-03-records-and-data-output-boundaries-arrow)"/><path d="M416 452 L512 452" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-03-records-and-data-output-boundaries-03-records-and-data-output-boundaries-arrow)"/><path d="M416 540 L512 540" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-03-records-and-data-output-boundaries-03-records-and-data-output-boundaries-arrow)"/><g data-node="true"><rect x="96" y="152" width="320" height="432" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><text x="108" y="176" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">同一組執行關聯</text><text x="108" y="196" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Request／Thread／Run</text><text x="108" y="214" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Task／Step</text><text x="108" y="232" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Tool Call／Tool Execution</text><text x="108" y="250" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Attempt 與可信 scope</text><text x="108" y="268" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif"></text><text x="108" y="286" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Trace／Span ID 補充呼叫關係</text><text x="108" y="304" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">重試或恢復可能產生新 span</text><text x="108" y="322" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif"></text><text x="108" y="340" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">箭頭表示關聯與輸出責任</text><text x="108" y="358" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">各入口接線需另行核對</text></g><g data-node="true"><rect x="512" y="152" width="672" height="72" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="524" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Runtime Event</text><text x="524" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">版本／身分／順序與 payload 契約</text><text x="524" y="214" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">保存、傳輸與 consumer 套用分層確認</text></g><g data-node="true"><rect x="512" y="240" width="672" height="72" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="524" y="264" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Trace／Span</text><text x="524" y="284" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">取樣、instrumentation、exporter 與 flush</text><text x="524" y="302" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Error message 脫敏有自己的處理範圍</text></g><g data-node="true"><rect x="512" y="328" width="672" height="72" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="524" y="352" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Audit</text><text x="524" y="372" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">一般 record 與授權決策分別核對保存語意</text><text x="524" y="390" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Console／Pg／Composite 及欄位政策各有條件</text></g><g data-node="true"><rect x="512" y="416" width="672" height="72" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="524" y="440" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Task／Ledger 權威紀錄</text><text x="524" y="460" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">查回指定領域的狀態與效果證據</text><text x="524" y="478" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">外部提交不明時，仍需可信回查</text></g><g data-node="true"><rect x="512" y="504" width="672" height="72" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><text x="524" y="528" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">原始內容與安全 reference：設計責任</text><text x="524" y="548" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">內容另存需存取控制、保留與刪除契約</text><text x="524" y="566" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">診斷保留 reason、opaque correlation 與安全參照</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">各分支沒有共同 transaction 或相同持久保證。某份紀錄缺失，仍需沿權威狀態查證原操作。</text><text x="96" y="660" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Audit 欄位規則、Trace error 替換與 Opik redaction 各有範圍；不由一個 redactor 推論所有輸出已涵蓋。</text></svg>
