<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="06-terminal-event-incident-swimlane-en-title 06-terminal-event-incident-swimlane-en-desc" lang="en" id="d-06-terminal-event-incident-swimlane-en-root"><title id="06-terminal-event-incident-swimlane-en-title">Repair consumer delivery after the original result is persisted</title><desc id="06-terminal-event-incident-swimlane-en-desc">This teaching path assumes Run terminal state, tool effects and event identity are persisted, but sequence 13 is lost in transport. Investigate original records, then repair the projection through controlled redelivery.</desc><defs>
      <style>#d-06-terminal-event-incident-swimlane-en-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-06-terminal-event-incident-swimlane-en-root nav, #d-06-terminal-event-incident-swimlane-en-root p { font-size:14px; line-height:1.8; }
      #d-06-terminal-event-incident-swimlane-en-root a { color:#0066d6; }
      #d-06-terminal-event-incident-swimlane-en-root .diagram-container { width:100%; overflow-x:auto; }
      #d-06-terminal-event-incident-swimlane-en-root details { border-top:1px solid #b9cce3; margin-top:24px; padding-top:16px; }
      #d-06-terminal-event-incident-swimlane-en-root summary { cursor:pointer; font-size:16px; font-weight:600; }
      #d-06-terminal-event-incident-swimlane-en-root nav, #d-06-terminal-event-incident-swimlane-en-root details { display:none; }
      #d-06-terminal-event-incident-swimlane-en-root .diagram-container { overflow-x:visible; }</style><marker id="d-06-terminal-event-incident-swimlane-en-06-terminal-event-incident-swimlane-en-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-06-terminal-event-incident-swimlane-en-06-terminal-event-incident-swimlane-en-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker><marker id="d-06-terminal-event-incident-swimlane-en-06-terminal-event-incident-swimlane-en-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="276" height="24" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">INCIDENT / TERMINAL EVENT DELIVERY</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">Time moves right / dashed: evidence reads or wiring needed</text><rect x="96" y="116" width="64" height="4" rx="0" fill="#0078fc" stroke="none" stroke-width="1.2"/><path d="M96 240 L1200 240" fill="none" stroke="#d5e1ee" stroke-width="1"/><path d="M96 344 L1200 344" fill="none" stroke="#d5e1ee" stroke-width="1"/><path d="M96 448 L1200 448" fill="none" stroke="#d5e1ee" stroke-width="1"/><path d="M96 568 L1200 568" fill="none" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="188" font-size="12" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Worker / state</text><text x="96" y="292" font-size="12" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Event / transport</text><text x="96" y="396" font-size="12" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Consumer</text><text x="96" y="508" font-size="12" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Ops / repair</text><text x="704" y="552" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Check state, effects, events, receipt and application</text><path d="M416 192 L440 192 Q448 192 448 200 L448 284 Q448 292 456 292 L480 292" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-06-terminal-event-incident-swimlane-en-06-terminal-event-incident-swimlane-en-arrow)"/><path d="M672 292 L736 292" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-06-terminal-event-incident-swimlane-en-06-terminal-event-incident-swimlane-en-arrow)"/><path d="M528 324 L528 472" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-06-terminal-event-incident-swimlane-en-06-terminal-event-incident-swimlane-en-arrow)"/><path d="M848 428 L848 444 Q848 452 840 452 L632 452 Q624 452 624 460 L624 472" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-06-terminal-event-incident-swimlane-en-06-terminal-event-incident-swimlane-en-arrow)"/><path d="M672 512 L1008 512" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-06-terminal-event-incident-swimlane-en-06-terminal-event-incident-swimlane-en-arrow)"/><path d="M1104 472 L1104 428" fill="none" stroke="#0066d6" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-06-terminal-event-incident-swimlane-en-06-terminal-event-incident-swimlane-en-arrow-accent)"/><g data-node="true"><rect x="224" y="160" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="236" y="184" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">1 Work completed</text><text x="236" y="204" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Terminal / effects saved</text></g><g data-node="true"><rect x="480" y="260" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="492" y="284" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">2 Event ID saved</text><text x="492" y="304" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">event-terminal-a / 13</text></g><g data-node="true"><rect x="736" y="260" width="224" height="64" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><text x="748" y="284" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">3 Lost in transport</text><text x="748" y="304" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">13 never reaches consumer</text></g><g data-node="true"><rect x="736" y="364" width="224" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="748" y="388" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">4 Screen still waiting</text><text x="748" y="408" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Last applied sequence: 12</text></g><g data-node="true"><rect x="480" y="472" width="192" height="80" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="492" y="496" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">5 Fetch evidence</text><text x="492" y="516" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Run / Task / Ledger</text><text x="492" y="534" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Original event ID / result</text></g><g data-node="true"><rect x="1008" y="472" width="192" height="80" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><text x="1020" y="496" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">6 Repair delivery</text><text x="1020" y="516" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">scope / target Run</text><text x="1020" y="534" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Redelivery: add wiring</text></g><g data-node="true"><rect x="1008" y="364" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="1020" y="388" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">7 Verify projection</text><text x="1020" y="408" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Reuse original result</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">No arrival arrow crosses the loss. Trace / Audit / incident index supplement evidence; an empty projection cannot refute Terminal.</text><text x="96" y="660" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Do not repeat committed work here. Missing 13 with Terminal 14 already buffered is a separate test in the article.</text></svg>
