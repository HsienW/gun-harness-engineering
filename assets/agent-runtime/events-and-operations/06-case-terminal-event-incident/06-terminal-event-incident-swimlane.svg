crosoft JhengHei', sans-serif">Worker／權威</text><text x="96" y="292" font-size="12" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">事件／傳輸</text><text x="96" y="396" font-size="12" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Consumer</text><text x="96" y="508" font-size="12" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">維運／修復</text><text x="704" y="552" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">查證：狀態、效果、事件、接收與套用位置</text><path d="M416 192 L440 192 Q448 192 448 200 L448 284 Q448 292 456 292 L480 292" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-06-terminal-event-incident-swimlane-06-terminal-event-incident-swimlane-arrow)"/><path d="M672 292 L736 292" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-06-terminal-event-incident-swimlane-06-terminal-event-incident-swimlane-arrow)"/><path d="M528 324 L528 472" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-06-terminal-event-incident-swimlane-06-terminal-event-incident-swimlane-arrow)"/><path d="M848 428 L848 444 Q848 452 840 452 L632 452 Q624 452 624 460 L624 472" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-06-terminal-event-incident-swimlane-06-terminal-event-incident-swimlane-arrow)"/><path d="M672 512 L1008 512" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-06-terminal-event-incident-swimlane-06-terminal-event-incident-swimlane-arrow)"/><path d="M1104 472 L1104 428" fill="none" stroke="#0066d6" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-06-terminal-event-incident-swimlane-06-terminal-event-incident-swimlane-arrow-accent)"/><g data-node="true"><rect x="224" y="160" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="236" y="184" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">1 原工作已完成</text><text x="236" y="204" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Terminal／效果已存</text></g><g data-node="true"><rect x="480" y="260" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="492" y="284" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">2 事件身分已保存</text><text x="492" y="304" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">event-terminal-a / 13</text></g><g data-node="true"><rect x="736" y="260" width="224" height="64" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><text x="748" y="284" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">3 傳輸中遺失</text><text x="748" y="304" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">13 未抵達 consumer</text></g><g data-node="true"><rect x="736" y="364" width="224" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="748" y="388" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">4 畫面仍在等待</text><text x="748" y="408" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">最後已套用 sequence 12</text></g><g data-node="true"><rect x="480" y="472" width="192" height="80" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="492" y="496" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">5 查回原證據</text><text x="492" y="516" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Run／Task／Ledger</text><text x="492" y="534" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">原事件身分與結果</text></g><g data-node="true"><rect x="1008" y="472" width="192" height="80" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><text x="1020" y="496" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">6 受控修復交付</text><text x="1020" y="516" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">scope／目標 Run</text><text x="1020" y="534" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">補送能力需另接線</text></g><g data-node="true"><rect x="1008" y="364" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="1020" y="388" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">7 核對投影已更新</text><text x="1020" y="408" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">重用原結果</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">傳輸遺失處沒有抵達箭頭。Trace／Audit／Incident index 補充查證；空投影不推翻已保存 Terminal。</text><text x="96" y="660" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">本例不重做已提交操作；「13 缺失、Terminal 14 已到但暫存」是正文另一個獨立測試。</text></svg>
