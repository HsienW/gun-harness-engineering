<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="02-state-event-and-delivery-windows-en-title 02-state-event-and-delivery-windows-en-desc" lang="en" id="d-02-state-event-and-delivery-windows-en-root"><title id="02-state-event-and-delivery-windows-en-title">Confirm persistence and delivery at each layer</title><desc id="02-state-event-and-delivery-windows-en-desc">Authoritative state, event identity persistence, transport and consumer application have separate failure windows. Terminal cleanup can also occur after append failure.</desc><defs>
      <style>#d-02-state-event-and-delivery-windows-en-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-02-state-event-and-delivery-windows-en-root nav, #d-02-state-event-and-delivery-windows-en-root p { font-size:14px; line-height:1.8; }
      #d-02-state-event-and-delivery-windows-en-root a { color:#0066d6; }
      #d-02-state-event-and-delivery-windows-en-root .diagram-container { width:100%; overflow-x:auto; }
      #d-02-state-event-and-delivery-windows-en-root details { border-top:1px solid #b9cce3; margin-top:24px; padding-top:16px; }
      #d-02-state-event-and-delivery-windows-en-root summary { cursor:pointer; font-size:16px; font-weight:600; }
      #d-02-state-event-and-delivery-windows-en-root nav, #d-02-state-event-and-delivery-windows-en-root details { display:none; }
      #d-02-state-event-and-delivery-windows-en-root .diagram-container { overflow-x:visible; }</style><marker id="d-02-state-event-and-delivery-windows-en-02-state-event-and-delivery-windows-en-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-02-state-event-and-delivery-windows-en-02-state-event-and-delivery-windows-en-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker><marker id="d-02-state-event-and-delivery-windows-en-02-state-event-and-delivery-windows-en-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="272" height="24" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">EVENTS / PERSISTENCE AND DELIVERY</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">Conceptual handoffs / dashed arrows require wiring</text><rect x="96" y="116" width="64" height="4" rx="0" fill="#0078fc" stroke="none" stroke-width="1.2"/><path d="M352 152 L352 328" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><path d="M640 152 L640 328" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><path d="M928 152 L928 328" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><text x="96" y="312" font-size="12" fill="#102743" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">A State saved; event may be missing</text><text x="384" y="312" font-size="12" fill="#102743" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">B Event saved; transport may lose it</text><text x="832" y="312" font-size="12" fill="#102743" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">C Output sent; projection may be stale</text><rect x="96" y="368" width="1088" height="216" rx="8" fill="#eef4fb" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><text x="112" y="396" font-size="12" fill="#102743" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">TERMINAL / separate failure branch inside the persistence try block</text><text x="128" y="552" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Earlier allocation and validation precede this try block; their errors have a different finally scope.</text><path d="M320 232 L384 232" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-02-state-event-and-delivery-windows-en-02-state-event-and-delivery-windows-en-arrow)"/><path d="M608 232 L672 232" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-02-state-event-and-delivery-windows-en-02-state-event-and-delivery-windows-en-arrow)"/><path d="M896 232 L960 232" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-02-state-event-and-delivery-windows-en-02-state-event-and-delivery-windows-en-arrow)"/><path d="M448 472 L512 472" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-state-event-and-delivery-windows-en-02-state-event-and-delivery-windows-en-arrow)"/><path d="M768 472 L832 472" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-state-event-and-delivery-windows-en-02-state-event-and-delivery-windows-en-arrow)"/><g data-node="true"><rect x="96" y="192" width="224" height="80" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="108" y="216" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">1 State persisted</text><text x="108" y="236" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Run / Task written</text><text x="108" y="254" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Check effects in Ledger</text></g><g data-node="true"><rect x="384" y="192" width="224" height="80" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><text x="396" y="216" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">2 Identity appended</text><text x="396" y="236" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Task Event payload</text><text x="396" y="254" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">runtimeEventIdentity</text></g><g data-node="true"><rect x="672" y="192" width="224" height="80" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="684" y="216" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">3 Handed to transport</text><text x="684" y="236" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Specified connection or channel</text><text x="684" y="254" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Confirm consumer receipt</text></g><g data-node="true"><rect x="960" y="192" width="224" height="80" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="972" y="216" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">4 Consumer applied</text><text x="972" y="236" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Check the target Run</text><text x="972" y="254" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Update consumer projection</text></g><g data-node="true"><rect x="128" y="432" width="320" height="80" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="140" y="456" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Append throws</text><text x="140" y="476" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">No normal envelope return</text></g><g data-node="true"><rect x="512" y="432" width="256" height="80" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="524" y="456" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Finally releases Run entry</text><text x="524" y="476" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Allocator cleanup may still finish</text></g><g data-node="true"><rect x="832" y="432" width="320" height="80" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="844" y="456" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Check original state and identity</text><text x="844" y="476" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Recover from the stopping point</text><text x="844" y="494" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Cleanup does not confirm persistence</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">The upper row separates four success points. No shared transaction or existing durable delivery pipeline is implied.</text><text x="96" y="660" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Identity persistence stores Task Event identity. Full envelopes, continuous subscription and redelivery still need contracts.</text></svg>
