<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="02-sequence-gap-and-bounded-forwarding-en-title 02-sequence-gap-and-bounded-forwarding-en-desc" lang="en" id="d-02-sequence-gap-and-bounded-forwarding-en-root"><title id="02-sequence-gap-and-bounded-forwarding-en-title">Waiting for a gap and skipping forward have different outcomes</title><desc id="02-sequence-gap-and-bounded-forwarding-en-desc">The consumer expects sequence 13, but 14 arrives first and is buffered. A later 13 permits contiguous output; exceeding window conditions skips forward while the missing event stays missing.</desc><defs>
      <style>#d-02-sequence-gap-and-bounded-forwarding-en-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-02-sequence-gap-and-bounded-forwarding-en-root nav, #d-02-sequence-gap-and-bounded-forwarding-en-root p { font-size:14px; line-height:1.8; }
      #d-02-sequence-gap-and-bounded-forwarding-en-root a { color:#0066d6; }
      #d-02-sequence-gap-and-bounded-forwarding-en-root .diagram-container { width:100%; overflow-x:auto; }
      #d-02-sequence-gap-and-bounded-forwarding-en-root details { border-top:1px solid #b9cce3; margin-top:24px; padding-top:16px; }
      #d-02-sequence-gap-and-bounded-forwarding-en-root summary { cursor:pointer; font-size:16px; font-weight:600; }
      #d-02-sequence-gap-and-bounded-forwarding-en-root nav, #d-02-sequence-gap-and-bounded-forwarding-en-root details { display:none; }
      #d-02-sequence-gap-and-bounded-forwarding-en-root .diagram-container { overflow-x:visible; }</style><marker id="d-02-sequence-gap-and-bounded-forwarding-en-02-sequence-gap-and-bounded-forwarding-en-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-02-sequence-gap-and-bounded-forwarding-en-02-sequence-gap-and-bounded-forwarding-en-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker><marker id="d-02-sequence-gap-and-bounded-forwarding-en-02-sequence-gap-and-bounded-forwarding-en-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="256" height="24" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">EVENTS / DEDUPLICATION AND GAPS</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">Independent scenarios / no timer-based retrieval</text><rect x="96" y="116" width="64" height="4" rx="0" fill="#0078fc" stroke="none" stroke-width="1.2"/><rect x="80" y="264" width="1120" height="152" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="80" y="448" width="1120" height="152" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><text x="96" y="288" font-size="12" fill="#102743" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">A / Missing predecessor arrives</text><text x="96" y="472" font-size="12" fill="#102743" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">B / Window conditions exceeded</text><path d="M352 348 L448 348" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-sequence-gap-and-bounded-forwarding-en-02-sequence-gap-and-bounded-forwarding-en-arrow)"/><path d="M704 348 L800 348" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-sequence-gap-and-bounded-forwarding-en-02-sequence-gap-and-bounded-forwarding-en-arrow)"/><path d="M352 532 L448 532" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-sequence-gap-and-bounded-forwarding-en-02-sequence-gap-and-bounded-forwarding-en-arrow)"/><path d="M704 532 L800 532" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-sequence-gap-and-bounded-forwarding-en-02-sequence-gap-and-bounded-forwarding-en-arrow)"/><g data-node="true"><rect x="96" y="152" width="1088" height="72" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><text x="108" y="176" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Shared starting point: nextSequence = 13; 14 arrives first</text><text x="108" y="196" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Deduplicate by event ID first; 14 creates a gap and stays in the Run buffer.</text></g><g data-node="true"><rect x="96" y="312" width="256" height="72" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="108" y="336" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">13 arrives later</text><text x="108" y="356" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Keep original event identity</text></g><g data-node="true"><rect x="448" y="312" width="256" height="72" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="460" y="336" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Gap closes</text><text x="460" y="356" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Deliver contiguous sequences</text></g><g data-node="true"><rect x="800" y="312" width="384" height="72" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="812" y="336" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Output 13, then 14</text><text x="812" y="356" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Projection can apply contiguous events</text></g><g data-node="true"><rect x="96" y="496" width="256" height="72" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="108" y="520" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Distance / count limit</text><text x="108" y="540" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Check on new-event processing</text></g><g data-node="true"><rect x="448" y="496" width="256" height="72" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="460" y="520" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Advance to min sequence</text><text x="460" y="540" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">events.reorder.forwarded</text></g><g data-node="true"><rect x="800" y="496" width="384" height="72" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="812" y="520" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Continue from available events</text><text x="812" y="540" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">If smallest is 14, 13 stays missing</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">IDs in the seen set are deduplicated. Bounded memory and reconstruction limits prevent a permanent exactly-once record.</text><text x="96" y="660" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Small gaps can keep waiting. No timer automatically retrieves or advances; durable fetching needs a separate contract.</text></svg>
