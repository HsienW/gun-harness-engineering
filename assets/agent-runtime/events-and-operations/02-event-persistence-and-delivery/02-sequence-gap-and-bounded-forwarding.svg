<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="02-sequence-gap-and-bounded-forwarding-title 02-sequence-gap-and-bounded-forwarding-desc" lang="zh-TW" id="d-02-sequence-gap-and-bounded-forwarding-root"><title id="02-sequence-gap-and-bounded-forwarding-title">等待缺口與向前跳過，是兩種不同結果</title><desc id="02-sequence-gap-and-bounded-forwarding-desc">consumer 預期 sequence 13，14 先到並暫存；13 後續補到可連續輸出，超過 window 條件則向前跳過，遺失事件仍未補回。</desc><defs>
      <style>#d-02-sequence-gap-and-bounded-forwarding-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-02-sequence-gap-and-bounded-forwarding-root nav, #d-02-sequence-gap-and-bounded-forwarding-root p { font-size:14px; line-height:1.8; }
      #d-02-sequence-gap-and-bounded-forwarding-root a { color:#0066d6; }
      #d-02-sequence-gap-and-bounded-forwarding-root .diagram-container { width:100%; overflow-x:auto; }
      #d-02-sequence-gap-and-bounded-forwarding-root details { border-top:1px solid #b9cce3; margin-top:24px; padding-top:16px; }
      #d-02-sequence-gap-and-bounded-forwarding-root summary { cursor:pointer; font-size:16px; font-weight:600; }
      #d-02-sequence-gap-and-bounded-forwarding-root nav, #d-02-sequence-gap-and-bounded-forwarding-root details { display:none; }
      #d-02-sequence-gap-and-bounded-forwarding-root .diagram-container { overflow-x:visible; }</style><marker id="d-02-sequence-gap-and-bounded-forwarding-02-sequence-gap-and-bounded-forwarding-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-02-sequence-gap-and-bounded-forwarding-02-sequence-gap-and-bounded-forwarding-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker><marker id="d-02-sequence-gap-and-bounded-forwarding-02-sequence-gap-and-bounded-forwarding-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="256" height="24" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">EVENTS / DEDUPLICATION AND GAPS</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">兩個獨立情境 · 無計時自動補回</text><rect x="96" y="116" width="64" height="4" rx="0" fill="#0078fc" stroke="none" stroke-width="1.2"/><rect x="80" y="264" width="1120" height="152" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="80" y="448" width="1120" height="152" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><text x="96" y="288" font-size="12" fill="#102743" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">A / 前置事件補到</text><text x="96" y="472" font-size="12" fill="#102743" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">B / 超過 window 條件</text><path d="M352 348 L448 348" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-sequence-gap-and-bounded-forwarding-02-sequence-gap-and-bounded-forwarding-arrow)"/><path d="M704 348 L800 348" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-sequence-gap-and-bounded-forwarding-02-sequence-gap-and-bounded-forwarding-arrow)"/><path d="M352 532 L448 532" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-sequence-gap-and-bounded-forwarding-02-sequence-gap-and-bounded-forwarding-arrow)"/><path d="M704 532 L800 532" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-sequence-gap-and-bounded-forwarding-02-sequence-gap-and-bounded-forwarding-arrow)"/><g data-node="true"><rect x="96" y="152" width="1088" height="72" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><text x="108" y="176" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">共同起點：nextSequence = 13，先收到 14</text><text x="108" y="196" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">先依 event ID 去重；14 形成缺口，暫存在 Run 的 buffer 中。</text></g><g data-node="true"><rect x="96" y="312" width="256" height="72" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="108" y="336" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">後續收到 13</text><text x="108" y="356" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">保留原事件身分</text></g><g data-node="true"><rect x="448" y="312" width="256" height="72" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="460" y="336" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">缺口關閉</text><text x="460" y="356" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">按連續序號往下交付</text></g><g data-node="true"><rect x="800" y="312" width="384" height="72" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="812" y="336" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">依序輸出 13、14</text><text x="812" y="356" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">投影可套用連續事件</text></g><g data-node="true"><rect x="96" y="496" width="256" height="72" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="108" y="520" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">序號距離或數量超限</text><text x="108" y="540" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">由新事件處理觸發條件</text></g><g data-node="true"><rect x="448" y="496" width="256" height="72" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="460" y="520" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">移到已緩存最小序號</text><text x="460" y="540" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">events.reorder.forwarded</text></g><g data-node="true"><rect x="800" y="496" width="384" height="72" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="812" y="520" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">從可用事件繼續輸出</text><text x="812" y="540" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">若最小為 14，13 仍然缺失</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">相同 event ID 在 seen 集合內會被去重；有界記憶體與重建限制，使它無法充當永久 exactly-once 紀錄。</text><text x="96" y="660" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">小缺口可持續等待；本類別沒有計時到期自動補回或向前機制，持久補取須另有契約。</text></svg>
