<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="02-state-event-and-delivery-windows-title 02-state-event-and-delivery-windows-desc" lang="zh-TW" id="d-02-state-event-and-delivery-windows-root"><title id="02-state-event-and-delivery-windows-title">保存成功與交付成功，需要分層確認</title><desc id="02-state-event-and-delivery-windows-desc">權威狀態、事件身分保存、傳輸與 consumer 套用有不同故障窗口；Terminal 清理也可能發生在 append 失敗之後。</desc><defs>
      <style>#d-02-state-event-and-delivery-windows-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-02-state-event-and-delivery-windows-root nav, #d-02-state-event-and-delivery-windows-root p { font-size:14px; line-height:1.8; }
      #d-02-state-event-and-delivery-windows-root a { color:#0066d6; }
      #d-02-state-event-and-delivery-windows-root .diagram-container { width:100%; overflow-x:auto; }
      #d-02-state-event-and-delivery-windows-root details { border-top:1px solid #b9cce3; margin-top:24px; padding-top:16px; }
      #d-02-state-event-and-delivery-windows-root summary { cursor:pointer; font-size:16px; font-weight:600; }
      #d-02-state-event-and-delivery-windows-root nav, #d-02-state-event-and-delivery-windows-root details { display:none; }
      #d-02-state-event-and-delivery-windows-root .diagram-container { overflow-x:visible; }</style><marker id="d-02-state-event-and-delivery-windows-02-state-event-and-delivery-windows-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-02-state-event-and-delivery-windows-02-state-event-and-delivery-windows-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker><marker id="d-02-state-event-and-delivery-windows-02-state-event-and-delivery-windows-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="272" height="24" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">EVENTS / PERSISTENCE AND DELIVERY</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">概念交接 · 虛線箭頭需具體契約串接</text><rect x="96" y="116" width="64" height="4" rx="0" fill="#0078fc" stroke="none" stroke-width="1.2"/><path d="M352 152 L352 328" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><path d="M640 152 L640 328" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><path d="M928 152 L928 328" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><text x="96" y="312" font-size="12" fill="#102743" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">A 狀態已存，事件可能未存</text><text x="384" y="312" font-size="12" fill="#102743" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">B 事件已存，傳輸可能遺失</text><text x="832" y="312" font-size="12" fill="#102743" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">C 已輸出，投影可能未更新</text><rect x="96" y="368" width="1088" height="216" rx="8" fill="#eef4fb" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><text x="112" y="396" font-size="12" fill="#102743" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">TERMINAL / 保存 try 範圍內的另一條失敗分支</text><text x="128" y="552" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">較早的配號與驗證位於此 try 之前；它們拋錯時，不套用上面的 finally 路徑。</text><path d="M320 232 L384 232" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-02-state-event-and-delivery-windows-02-state-event-and-delivery-windows-arrow)"/><path d="M608 232 L672 232" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-02-state-event-and-delivery-windows-02-state-event-and-delivery-windows-arrow)"/><path d="M896 232 L960 232" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-02-state-event-and-delivery-windows-02-state-event-and-delivery-windows-arrow)"/><path d="M448 472 L512 472" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-state-event-and-delivery-windows-02-state-event-and-delivery-windows-arrow)"/><path d="M768 472 L832 472" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-state-event-and-delivery-windows-02-state-event-and-delivery-windows-arrow)"/><g data-node="true"><rect x="96" y="192" width="224" height="80" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="108" y="216" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">1 權威狀態已保存</text><text x="108" y="236" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Run／Task 已寫入</text><text x="108" y="254" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">效果另查 Ledger</text></g><g data-node="true"><rect x="384" y="192" width="224" height="80" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><text x="396" y="216" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">2 事件身分已 append</text><text x="396" y="236" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Task Event payload</text><text x="396" y="254" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">runtimeEventIdentity</text></g><g data-node="true"><rect x="672" y="192" width="224" height="80" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="684" y="216" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">3 資料交給傳輸端</text><text x="684" y="236" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">指定連線或通道</text><text x="684" y="254" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">仍需確認 consumer</text></g><g data-node="true"><rect x="960" y="192" width="224" height="80" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="972" y="216" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">4 Consumer 已套用</text><text x="972" y="236" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">核對目標 Run</text><text x="972" y="254" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">更新該 consumer 投影</text></g><g data-node="true"><rect x="128" y="432" width="320" height="80" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="140" y="456" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Append 拋錯</text><text x="140" y="476" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">未正常返回 envelope</text></g><g data-node="true"><rect x="512" y="432" width="256" height="80" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="524" y="456" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Finally 釋放 Run 條目</text><text x="524" y="476" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">allocator 清理仍可能完成</text></g><g data-node="true"><rect x="832" y="432" width="320" height="80" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="844" y="456" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">回查原狀態及事件身分</text><text x="844" y="476" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">依停止位置安排恢復</text><text x="844" y="494" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">清理本身不確認保存成功</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">上排依序說明四個成功位置；不宣稱共用 transaction，也不宣稱現有模組已串成持久投遞管線。</text><text x="96" y="660" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Identity persistence 保存 Task Event 內的身分資料；完整 envelope、持續訂閱與補送仍需契約。</text></svg>
