<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="01-provider-timeout-and-caller-abort-title 01-provider-timeout-and-caller-abort-desc" lang="zh-TW" id="d-01-provider-timeout-and-caller-abort-root"><title id="01-provider-timeout-and-caller-abort-title">Provider 失敗後，先分辨 caller 取消與可切換錯誤</title><desc id="01-provider-timeout-and-caller-abort-desc">同一 Model Step 的嘗試拋錯後，caller 已取消便停止候選切換；caller 仍有效且錯誤允許、尚有候選與額度時，才嘗試下一個 Provider。</desc><defs>
      <style>#d-01-provider-timeout-and-caller-abort-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-01-provider-timeout-and-caller-abort-root nav, #d-01-provider-timeout-and-caller-abort-root p { font-size:14px; line-height:1.8; }
      #d-01-provider-timeout-and-caller-abort-root a { color:#0066d6; }
      #d-01-provider-timeout-and-caller-abort-root .diagram-container { width:100%; overflow-x:auto; }
      #d-01-provider-timeout-and-caller-abort-root details { border-top:1px solid #b9cce3; margin-top:24px; padding-top:16px; }
      #d-01-provider-timeout-and-caller-abort-root summary { cursor:pointer; font-size:16px; font-weight:600; }
      #d-01-provider-timeout-and-caller-abort-root nav, #d-01-provider-timeout-and-caller-abort-root details { display:none; }
      #d-01-provider-timeout-and-caller-abort-root .diagram-container { overflow-x:visible; }</style><marker id="d-01-provider-timeout-and-caller-abort-01-provider-timeout-and-caller-abort-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-01-provider-timeout-and-caller-abort-01-provider-timeout-and-caller-abort-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker><marker id="d-01-provider-timeout-and-caller-abort-01-provider-timeout-and-caller-abort-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="272" height="24" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">PROVIDER / ERROR AND CANCELLATION</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">來源順序示例 · fallback 已啟用</text><rect x="96" y="116" width="64" height="4" rx="0" fill="#0078fc" stroke="none" stroke-width="1.2"/><path d="M192 216 L192 592" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><path d="M496 216 L496 592" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><path d="M800 216 L800 592" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><path d="M1104 216 L1104 592" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><rect x="96" y="352" width="1088" height="240" rx="8" fill="#eef4fb" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="96" y="352" width="48" height="20" rx="2" fill="#f5f8fc" stroke="#b9cce3" stroke-width="1.2"/><text x="108" y="367" font-size="10" fill="#102743" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">ALT</text><text x="160" y="380" font-size="12" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">caller signal 已 aborted：本次處理停止切換</text><path d="M96 464 L1184 464" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><text x="112" y="492" font-size="12" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">caller 仍有效，且錯誤屬 fallback 白名單</text><text x="112" y="444" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">重新拋出錯誤；不再呼叫後續候選。</text><text x="112" y="580" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">另需仍有下一個 Provider 與嘗試額度；其他錯誤出口省略。</text><path d="M496 248 L800 248" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-01-provider-timeout-and-caller-abort-01-provider-timeout-and-caller-abort-arrow)"/><rect x="612.0" y="218" width="72" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="648" y="232" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">INVOKE A</text><path d="M496 416 L192 416" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-01-provider-timeout-and-caller-abort-01-provider-timeout-and-caller-abort-arrow)"/><rect x="312.0" y="386" width="64" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="344" y="400" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">RETHROW</text><path d="M496 552 L1104 552" fill="none" stroke="#0066d6" stroke-width="1.2" marker-end="url(#d-01-provider-timeout-and-caller-abort-01-provider-timeout-and-caller-abort-arrow-accent)"/><rect x="750.0" y="522" width="100" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="800" y="536" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">NEXT PROVIDER</text><g data-node="true"><rect x="96" y="152" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="108" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Caller</text><text x="108" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">signal 與執行關聯</text></g><g data-node="true"><rect x="400" y="152" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="412" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Fallback wrapper</text><text x="412" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">先查取消，再判斷錯誤</text></g><g data-node="true"><rect x="704" y="152" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="716" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Provider A</text><text x="716" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">本次已送出的嘗試</text></g><g data-node="true"><rect x="1008" y="152" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="1020" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Provider B</text><text x="1020" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">尚未開始的候選</text></g><g data-node="true"><rect x="400" y="280" width="256" height="64" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><text x="412" y="304" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">本次嘗試拋錯</text><text x="412" y="324" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">例：wrapper 的單次等待逾時</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">ALT 的兩個分支互斥。此例呈現 invoke wrapper 的錯誤處理，不表示 Provider Token 串流可以透明換接。</text><text x="96" y="660" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">本地逾時或傳遞 abort 不證明遠端運算停止；候選能力、實際用量與取消接線仍需分別查證。</text></svg>
