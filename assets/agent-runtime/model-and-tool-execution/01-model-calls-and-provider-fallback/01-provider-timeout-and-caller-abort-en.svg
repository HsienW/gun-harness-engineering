<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="01-provider-timeout-and-caller-abort-en-title 01-provider-timeout-and-caller-abort-en-desc" lang="en" id="d-01-provider-timeout-and-caller-abort-en-root"><title id="01-provider-timeout-and-caller-abort-en-title">After a Provider error, check cancellation before fallback</title><desc id="01-provider-timeout-and-caller-abort-en-desc">After an attempt in the same Model Step throws, an aborted caller stops fallback. Try the next Provider only while the caller is active, the error is eligible, and candidates and attempt budget remain.</desc><defs>
      <style>#d-01-provider-timeout-and-caller-abort-en-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-01-provider-timeout-and-caller-abort-en-root nav, #d-01-provider-timeout-and-caller-abort-en-root p { font-size:14px; line-height:1.8; }
      #d-01-provider-timeout-and-caller-abort-en-root a { color:#0066d6; }
      #d-01-provider-timeout-and-caller-abort-en-root .diagram-container { width:100%; overflow-x:auto; }
      #d-01-provider-timeout-and-caller-abort-en-root details { border-top:1px solid #b9cce3; margin-top:24px; padding-top:16px; }
      #d-01-provider-timeout-and-caller-abort-en-root summary { cursor:pointer; font-size:16px; font-weight:600; }
      #d-01-provider-timeout-and-caller-abort-en-root nav, #d-01-provider-timeout-and-caller-abort-en-root details { display:none; }
      #d-01-provider-timeout-and-caller-abort-en-root .diagram-container { overflow-x:visible; }</style><marker id="d-01-provider-timeout-and-caller-abort-en-01-provider-timeout-and-caller-abort-en-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-01-provider-timeout-and-caller-abort-en-01-provider-timeout-and-caller-abort-en-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker><marker id="d-01-provider-timeout-and-caller-abort-en-01-provider-timeout-and-caller-abort-en-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="272" height="24" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">PROVIDER / ERROR AND CANCELLATION</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">Candidate order example / fallback enabled</text><rect x="96" y="116" width="64" height="4" rx="0" fill="#0078fc" stroke="none" stroke-width="1.2"/><path d="M192 216 L192 592" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><path d="M496 216 L496 592" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><path d="M800 216 L800 592" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><path d="M1104 216 L1104 592" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><rect x="96" y="352" width="1088" height="240" rx="8" fill="#eef4fb" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="96" y="352" width="48" height="20" rx="2" fill="#f5f8fc" stroke="#b9cce3" stroke-width="1.2"/><text x="108" y="367" font-size="10" fill="#102743" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">ALT</text><text x="160" y="380" font-size="12" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Caller signal aborted: stop fallback for this error</text><path d="M96 464 L1184 464" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><text x="112" y="492" font-size="12" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Caller active and error eligible for fallback</text><text x="112" y="444" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Rethrow the error; do not invoke later candidates.</text><text x="112" y="580" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">A candidate and attempt budget must remain; other error exits are omitted.</text><path d="M496 248 L800 248" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-01-provider-timeout-and-caller-abort-en-01-provider-timeout-and-caller-abort-en-arrow)"/><rect x="612.0" y="218" width="72" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="648" y="232" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">INVOKE A</text><path d="M496 416 L192 416" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-01-provider-timeout-and-caller-abort-en-01-provider-timeout-and-caller-abort-en-arrow)"/><rect x="312.0" y="386" width="64" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="344" y="400" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">RETHROW</text><path d="M496 552 L1104 552" fill="none" stroke="#0066d6" stroke-width="1.2" marker-end="url(#d-01-provider-timeout-and-caller-abort-en-01-provider-timeout-and-caller-abort-en-arrow-accent)"/><rect x="750.0" y="522" width="100" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="800" y="536" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">NEXT PROVIDER</text><g data-node="true"><rect x="96" y="152" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="108" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Caller</text><text x="108" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Signal and execution identity</text></g><g data-node="true"><rect x="400" y="152" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="412" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Fallback wrapper</text><text x="412" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Check abort, then error</text></g><g data-node="true"><rect x="704" y="152" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="716" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Provider A</text><text x="716" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Attempt already invoked</text></g><g data-node="true"><rect x="1008" y="152" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="1020" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Provider B</text><text x="1020" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Candidate not yet invoked</text></g><g data-node="true"><rect x="400" y="280" width="256" height="64" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><text x="412" y="304" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Attempt throws</text><text x="412" y="324" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Example: wrapper timeout</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">ALT branches are exclusive. This invoke wrapper does not transparently switch an in-progress Provider Token stream.</text><text x="96" y="660" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">A local timeout or forwarded abort does not prove remote work stopped. Check capabilities, usage and cancellation wiring separately.</text></svg>
