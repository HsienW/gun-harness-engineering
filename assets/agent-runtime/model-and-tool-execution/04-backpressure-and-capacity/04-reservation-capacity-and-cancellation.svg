      #d-04-reservation-capacity-and-cancellation-root .diagram-container { width:100%; overflow-x:auto; }
      #d-04-reservation-capacity-and-cancellation-root details { border-top:1px solid #b9cce3; margin-top:24px; padding-top:16px; }
      #d-04-reservation-capacity-and-cancellation-root summary { cursor:pointer; font-size:16px; font-weight:600; }
      #d-04-reservation-capacity-and-cancellation-root nav, #d-04-reservation-capacity-and-cancellation-root details { display:none; }
