<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="04-reservation-capacity-and-cancellation-title 04-reservation-capacity-and-cancellation-desc" lang="zh-TW" id="d-04-reservation-capacity-and-cancellation-root"><title id="04-reservation-capacity-and-cancellation-title">保留、等待與超額拒絕是不同狀態</title><desc id="04-reservation-capacity-and-cancellation-desc">在全域讀取槽位與每 Run 保留皆為一的示例中，A1 執行、B1 保留後等待、B2 被拒絕；若取消 B1，移除 waiter 並釋放 Run B 的保留。</desc><defs>
      <style>#d-04-reservation-capacity-and-cancellation-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
