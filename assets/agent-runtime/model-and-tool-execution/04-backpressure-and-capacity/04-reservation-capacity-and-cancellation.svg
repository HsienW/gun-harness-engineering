43" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">每 Run 保留上限：1</text><path d="M288 208 L448 208" fill="none" stroke="#0066d6" stroke-width="1.2" marker-end="url(#d-04-reservation-capacity-and-cancellation-04-reservation-capacity-and-cancellation-arrow-accent)"/><rect x="332.0" y="178" width="72" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="368" y="192" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">ACQUIRED</text><path d="M288 336 L448 336" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-04-reservation-capacity-and-cancellation-04-reservation-capacity-and-cancellation-arrow)"/><rect x="332.0" y="306" width="72" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="368" y="320" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">RESERVED</text><path d="M288 464 L448 464" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-04-reservation-capacity-and-cancellation-04-reservation-capacity-and-cancellation-arrow)"/><rect x="332.0" y="434" width="72" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="368" y="448" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">REJECTED</text><path d="M704 344 L824 344 Q832 344 832 352 L832 392 Q832 400 840 400 L912 400" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-04-reservation-capacity-and-cancellation-04-reservation-capacity-and-cancellation-arrow)"/><rect x="730.0" y="314" width="76" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="768" y="328" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">CANCEL B1</text><g data-node="true"><rect x="96" y="176" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="108" y="200" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">A1：Run A</text><text x="108" y="220" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">第一個讀取要求</text></g><g data-node="true"><rect x="96" y="304" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="108" y="328" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">B1：Run B</text><text x="108" y="348" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">已取得自己的保留</text></g><g data-node="true"><rect x="96" y="432" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="108" y="456" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">B2：Run B</text><text x="108" y="476" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">同一 Run 的另一要求</text></g><g data-node="true"><rect x="448" y="176" width="256" height="80" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><text x="460" y="200" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">A1 正在執行</text><text x="460" y="220" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">占用唯一全域讀取槽位</text><text x="460" y="238" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">尚未釋放</text></g><g data-node="true"><rect x="448" y="304" width="256" height="80" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="460" y="328" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">等待佇列：1 筆</text><text x="460" y="348" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">B1：已保留，尚未執行</text><text x="460" y="366" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">等待全域槽位</text></g><g data-node="true"><rect x="448" y="432" width="256" height="80" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="460" y="456" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">B2 超額拒絕</text><text x="460" y="476" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">未入列，也未呼叫 runner</text><text x="460" y="494" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">TOOL_RUN_CAPACITY_EXCEEDED</text></g><g data-node="true"><rect x="912" y="176" width="272" height="96" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="924" y="200" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">取消前的保留快照</text><text x="924" y="220" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Run A = 1：A1 執行中</text><text x="924" y="238" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Run B = 1：B1 等待中</text><text x="924" y="256" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">B2 沒有取得額外保留</text></g><g data-node="true"><rect x="912" y="368" width="272" height="96" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="924" y="392" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">取消 B1 的等待</text><text x="924" y="412" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">移除 waiter 與 listener</text><text x="924" y="430" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">finally 釋放 Run B 保留</text><text x="924" y="448" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">B1 runner 呼叫數為零</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">B1 等待全域槽位時已計入 Run B 保留；B2 超額直接拒絕。右上快照在取消 B1 之前。</text><text x="96" y="660" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">本圖選取等待取消分支，未繼續畫 B1 執行；數字不是來源預設值，也未宣稱跨 Worker 總容量。</text></svg>
