<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="04-reservation-capacity-and-cancellation-en-title 04-reservation-capacity-and-cancellation-en-desc" lang="en" id="d-04-reservation-capacity-and-cancellation-en-root"><title id="04-reservation-capacity-and-cancellation-en-title">Reservations, waiting and capacity rejection are distinct states</title><desc id="04-reservation-capacity-and-cancellation-en-desc">With one global read slot and one reservation per Run, A1 runs, B1 reserves capacity and waits, and B2 is rejected. Cancelling B1 removes its waiter and releases Run B's reservation.</desc><defs>
      <style>#d-04-reservation-capacity-and-cancellation-en-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-04-reservation-capacity-and-cancellation-en-root nav, #d-04-reservation-capacity-and-cancellation-en-root p { font-size:14px; line-height:1.8; }
      #d-04-reservation-capacity-and-cancellation-en-root a { color:#0066d6; }
      #d-04-reservation-capacity-and-cancellation-en-root .diagram-container { width:100%; overflow-x:auto; }
      #d-04-reservation-capacity-and-cancellation-en-root details { border-top:1px solid #b9cce3; margin-top:24px; padding-top:16px; }
      #d-04-reservation-capacity-and-cancellation-en-root summary { cursor:pointer; font-size:16px; font-weight:600; }
      #d-04-reservation-capacity-and-cancellation-en-root nav, #d-04-reservation-capacity-and-cancellation-en-root details { display:none; }
      #d-04-reservation-capacity-and-cancellation-en-root .diagram-container { overflow-x:visible; }</style><marker id="d-04-reservation-capacity-and-cancellation-en-04-reservation-capacity-and-cancellation-en-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-04-reservation-capacity-and-cancellation-en-04-reservation-capacity-and-cancellation-en-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker><marker id="d-04-reservation-capacity-and-cancellation-en-04-reservation-capacity-and-cancellation-en-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="256" height="24" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">CAPACITY / RESERVATION AND WAIT</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">Teaching snapshot / one scheduler instance</text><rect x="96" y="116" width="64" height="4" rx="0" fill="#0078fc" stroke="none" stroke-width="1.2"/><text x="96" y="148" font-size="12" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Requests</text><text x="448" y="148" font-size="12" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Global read slots: 1 / 1</text><text x="912" y="148" font-size="12" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Reservations per Run: 1</text><path d="M288 208 L448 208" fill="none" stroke="#0066d6" stroke-width="1.2" marker-end="url(#d-04-reservation-capacity-and-cancellation-en-04-reservation-capacity-and-cancellation-en-arrow-accent)"/><rect x="332.0" y="178" width="72" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="368" y="192" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">ACQUIRED</text><path d="M288 336 L448 336" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-04-reservation-capacity-and-cancellation-en-04-reservation-capacity-and-cancellation-en-arrow)"/><rect x="332.0" y="306" width="72" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="368" y="320" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">RESERVED</text><path d="M288 464 L448 464" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-04-reservation-capacity-and-cancellation-en-04-reservation-capacity-and-cancellation-en-arrow)"/><rect x="332.0" y="434" width="72" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="368" y="448" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">REJECTED</text><path d="M704 344 L824 344 Q832 344 832 352 L832 392 Q832 400 840 400 L912 400" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-04-reservation-capacity-and-cancellation-en-04-reservation-capacity-and-cancellation-en-arrow)"/><rect x="730.0" y="314" width="76" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="768" y="328" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">CANCEL B1</text><g data-node="true"><rect x="96" y="176" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="108" y="200" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">A1: Run A</text><text x="108" y="220" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">First read request</text></g><g data-node="true"><rect x="96" y="304" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="108" y="328" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">B1: Run B</text><text x="108" y="348" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Own reservation acquired</text></g><g data-node="true"><rect x="96" y="432" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="108" y="456" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">B2: Run B</text><text x="108" y="476" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Another request in Run B</text></g><g data-node="true"><rect x="448" y="176" width="256" height="80" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><text x="460" y="200" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">A1 running</text><text x="460" y="220" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Holds the only read slot</text><text x="460" y="238" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Not yet released</text></g><g data-node="true"><rect x="448" y="304" width="256" height="80" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="460" y="328" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Wait queue: 1 item</text><text x="460" y="348" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">B1: reserved, not running</text><text x="460" y="366" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Waiting for a global slot</text></g><g data-node="true"><rect x="448" y="432" width="256" height="80" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="460" y="456" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">B2 rejected: capacity</text><text x="460" y="476" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Not queued; runner not called</text><text x="460" y="494" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">TOOL_RUN_CAPACITY_EXCEEDED</text></g><g data-node="true"><rect x="912" y="176" width="272" height="96" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="924" y="200" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Reservations before cancel</text><text x="924" y="220" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Run A = 1: A1 running</text><text x="924" y="238" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Run B = 1: B1 waiting</text><text x="924" y="256" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">No extra reservation for B2</text></g><g data-node="true"><rect x="912" y="368" width="272" height="96" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="924" y="392" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Cancel B1's wait</text><text x="924" y="412" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Remove waiter and listener</text><text x="924" y="430" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">finally frees Run B capacity</text><text x="924" y="448" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">B1 runner calls: zero</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">B1 counts toward Run B's reservation while waiting for a global slot; B2 is rejected. The top-right snapshot precedes cancellation.</text><text x="96" y="660" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">This path cancels B1's wait without running B1. Values are illustrative, not source defaults; no cross-Worker capacity guarantee is shown.</text></svg>
