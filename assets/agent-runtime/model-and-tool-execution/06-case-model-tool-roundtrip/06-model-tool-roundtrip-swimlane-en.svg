<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="06-model-tool-roundtrip-swimlane-en-title 06-model-tool-roundtrip-swimlane-en-desc" lang="en" id="d-06-model-tool-roundtrip-swimlane-en-root"><title id="06-model-tool-roundtrip-swimlane-en-title">Gather both required reads before proposing and executing a write</title><desc id="06-model-tool-roundtrip-swimlane-en-desc">This teaching path follows the model, Runtime, tool runner and result consumer through two concurrent reads, required-result collection by ID, a write proposal in the next turn and a response based on a known outcome. Failure branches do not automatically rejoin the normal path.</desc><defs>
      <style>#d-06-model-tool-roundtrip-swimlane-en-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-06-model-tool-roundtrip-swimlane-en-root nav, #d-06-model-tool-roundtrip-swimlane-en-root p { font-size:14px; line-height:1.8; }
      #d-06-model-tool-roundtrip-swimlane-en-root a { color:#0066d6; }
      #d-06-model-tool-roundtrip-swimlane-en-root .diagram-container { width:100%; overflow-x:auto; }
      #d-06-model-tool-roundtrip-swimlane-en-root details { border-top:1px solid #b9cce3; margin-top:24px; padding-top:16px; }
      #d-06-model-tool-roundtrip-swimlane-en-root summary { cursor:pointer; font-size:16px; font-weight:600; }
      #d-06-model-tool-roundtrip-swimlane-en-root nav, #d-06-model-tool-roundtrip-swimlane-en-root details { display:none; }
      #d-06-model-tool-roundtrip-swimlane-en-root .diagram-container { overflow-x:visible; }</style><marker id="d-06-model-tool-roundtrip-swimlane-en-06-model-tool-roundtrip-swimlane-en-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-06-model-tool-roundtrip-swimlane-en-06-model-tool-roundtrip-swimlane-en-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker><marker id="d-06-model-tool-roundtrip-swimlane-en-06-model-tool-roundtrip-swimlane-en-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="240" height="24" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">ROUND TRIP / REQUIRED RESULTS</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">Teaching composition / no formal E2E run</text><rect x="96" y="116" width="64" height="4" rx="0" fill="#0078fc" stroke="none" stroke-width="1.2"/><text x="96" y="196" font-size="12" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Model</text><path d="M96 248 L1184 248" fill="none" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="292" font-size="12" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Runtime</text><path d="M96 344 L1184 344" fill="none" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="388" font-size="12" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Tool Runner</text><path d="M96 440 L1184 440" fill="none" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="484" font-size="12" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Result consumer</text><path d="M96 536 L1184 536" fill="none" stroke="#d5e1ee" stroke-width="1"/><rect x="96" y="552" width="1088" height="40" rx="8" fill="#eef4fb" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><text x="112" y="576" font-size="12" fill="#102743" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Separate branches: read failure / cancelled wait means no write with missing data; ambiguous persistence means reconcile, without automatic redispatch.</text><path d="M320 232 L320 264" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-06-model-tool-roundtrip-swimlane-en-06-model-tool-roundtrip-swimlane-en-arrow)"/><path d="M416 296 L440 296 Q448 296 448 304 L448 392 Q448 400 456 400 L480 400" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-06-model-tool-roundtrip-swimlane-en-06-model-tool-roundtrip-swimlane-en-arrow)"/><path d="M704 400 L712 400 Q720 400 720 392 L720 304 Q720 296 728 296 L736 296" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-06-model-tool-roundtrip-swimlane-en-06-model-tool-roundtrip-swimlane-en-arrow)"/><path d="M832 264 L832 232" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-06-model-tool-roundtrip-swimlane-en-06-model-tool-roundtrip-swimlane-en-arrow)"/><path d="M928 200 L968 200 Q976 200 976 208 L976 288 Q976 296 984 296 L1008 296" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-06-model-tool-roundtrip-swimlane-en-06-model-tool-roundtrip-swimlane-en-arrow)"/><path d="M1104 328 L1104 360" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-06-model-tool-roundtrip-swimlane-en-06-model-tool-roundtrip-swimlane-en-arrow)"/><path d="M1104 424 L1104 456" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-06-model-tool-roundtrip-swimlane-en-06-model-tool-roundtrip-swimlane-en-arrow)"/><path d="M1200 488 L1208 488 Q1216 488 1216 480 L1216 208 Q1216 200 1208 200 L1200 200" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-06-model-tool-roundtrip-swimlane-en-06-model-tool-roundtrip-swimlane-en-arrow)"/><g data-node="true"><rect x="224" y="168" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="236" y="192" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">1 Propose two reads</text><text x="236" y="212" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">First Model Step</text></g><g data-node="true"><rect x="224" y="264" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="236" y="288" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">2 Check and schedule</text><text x="236" y="308" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Schema / auth / capacity</text></g><g data-node="true"><rect x="480" y="360" width="224" height="80" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="492" y="384" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">3 Read A / B in parallel</text><text x="492" y="404" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Separate IDs and outcomes</text><text x="492" y="422" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Results may arrive out of order</text></g><g data-node="true"><rect x="736" y="264" width="192" height="64" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><text x="748" y="288" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">4 Check required results</text><text x="748" y="308" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Match IDs; keep dependencies</text></g><g data-node="true"><rect x="736" y="168" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="748" y="192" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">5 Propose summary write</text><text x="748" y="212" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Second Model Step</text></g><g data-node="true"><rect x="1008" y="264" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="1020" y="288" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">6 Authorize the write</text><text x="1020" y="308" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Target / input / conditions</text></g><g data-node="true"><rect x="1008" y="360" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="1020" y="384" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">7 Execute write</text><text x="1020" y="404" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Keep Tool Attempt links</text></g><g data-node="true"><rect x="1008" y="456" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="1020" y="480" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">8 Persist / check outcome</text><text x="1020" y="500" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Check inner outcome</text></g><g data-node="true"><rect x="1008" y="168" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="1020" y="192" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">9 Reply with known result</text><text x="1020" y="212" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Later Model Step</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Numbers show reading order. Both reads are concurrency-safe, required data and write authorization are available, and required persistence succeeds.</text><text x="96" y="660" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Orchestration maintains required-read dependencies. A serial queue supplies no implicit dependency; a model reply does not determine Run Terminal state.</text></svg>
