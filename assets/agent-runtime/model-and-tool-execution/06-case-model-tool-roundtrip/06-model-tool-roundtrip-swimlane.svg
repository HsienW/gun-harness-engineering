      #d-06-model-tool-roundtrip-swimlane-root a { color:#0066d6; }
      #d-06-model-tool-roundtrip-swimlane-root .diagram-container { width:100%; overflow-x:auto; }
      #d-06-model-tool-roundtrip-swimlane-root details { border-top:1px solid #b9cce3; margin-top:24px; padding-top:16px; }
      #d-06-model-tool-roundtrip-swimlane-root summary { cursor:pointer; font-size:16px; font-weight:600; }
      #d-06-model-tool-roundtrip-swimlane-root nav, #d-06-model-tool-roundtrip-swimlane-root details { display:none; }
