<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="06-model-tool-roundtrip-swimlane-title 06-model-tool-roundtrip-swimlane-desc" lang="zh-TW" id="d-06-model-tool-roundtrip-swimlane-root"><title id="06-model-tool-roundtrip-swimlane-title">兩份必要讀取齊備後，再提出並執行寫入</title><desc id="06-model-tool-roundtrip-swimlane-desc">教學主線沿模型、Runtime、工具與結果 consumer，呈現兩個可並行讀取、依 ID 收集必要結果、下一輪寫入提案及確定結果回覆；失敗分支不自動接回正常主線。</desc><defs>
      <style>#d-06-model-tool-roundtrip-swimlane-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
