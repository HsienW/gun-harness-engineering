stroke="#d5e1ee" stroke-width="1"/><text x="96" y="388" font-size="12" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Tool Runner</text><path d="M96 440 L1184 440" fill="none" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="484" font-size="12" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Result consumer</text><path d="M96 536 L1184 536" fill="none" stroke="#d5e1ee" stroke-width="1"/><rect x="96" y="552" width="1088" height="40" rx="8" fill="#eef4fb" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><text x="112" y="576" font-size="12" fill="#102743" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">獨立分支：讀取失敗／等待取消 → 必要資料未齊，不進寫入；結果保存不明 → 回查，不自動重做。</text><path d="M320 232 L320 264" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-06-model-tool-roundtrip-swimlane-06-model-tool-roundtrip-swimlane-arrow)"/><path d="M416 296 L440 296 Q448 296 448 304 L448 392 Q448 400 456 400 L480 400" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-06-model-tool-roundtrip-swimlane-06-model-tool-roundtrip-swimlane-arrow)"/><path d="M704 400 L712 400 Q720 400 720 392 L720 304 Q720 296 728 296 L736 296" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-06-model-tool-roundtrip-swimlane-06-model-tool-roundtrip-swimlane-arrow)"/><path d="M832 264 L832 232" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-06-model-tool-roundtrip-swimlane-06-model-tool-roundtrip-swimlane-arrow)"/><path d="M928 200 L968 200 Q976 200 976 208 L976 288 Q976 296 984 296 L1008 296" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-06-model-tool-roundtrip-swimlane-06-model-tool-roundtrip-swimlane-arrow)"/><path d="M1104 328 L1104 360" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-06-model-tool-roundtrip-swimlane-06-model-tool-roundtrip-swimlane-arrow)"/><path d="M1104 424 L1104 456" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-06-model-tool-roundtrip-swimlane-06-model-tool-roundtrip-swimlane-arrow)"/><path d="M1200 488 L1208 488 Q1216 488 1216 480 L1216 208 Q1216 200 1208 200 L1200 200" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-06-model-tool-roundtrip-swimlane-06-model-tool-roundtrip-swimlane-arrow)"/><g data-node="true"><rect x="224" y="168" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="236" y="192" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">1 提出兩個讀取</text><text x="236" y="212" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">第一個 Model Step</text></g><g data-node="true"><rect x="224" y="264" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="236" y="288" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">2 驗證並取得排程</text><text x="236" y="308" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Schema／授權／容量</text></g><g data-node="true"><rect x="480" y="360" width="224" height="80" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="492" y="384" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">3 並行讀取 A／B</text><text x="492" y="404" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">各自 ID 與 outcome</text><text x="492" y="422" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">結果可亂序返回</text></g><g data-node="true"><rect x="736" y="264" width="192" height="64" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><text x="748" y="288" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">4 核對必要結果齊備</text><text x="748" y="308" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">依 ID 配對，維持依賴</text></g><g data-node="true"><rect x="736" y="168" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="748" y="192" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">5 再提出摘要寫入</text><text x="748" y="212" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">第二個 Model Step</text></g><g data-node="true"><rect x="1008" y="264" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="1020" y="288" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">6 寫入獨立授權派送</text><text x="1020" y="308" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">目標／參數／執行條件</text></g><g data-node="true"><rect x="1008" y="360" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="1020" y="384" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">7 執行寫入</text><text x="1020" y="404" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">保留 Tool Attempt 關聯</text></g><g data-node="true"><rect x="1008" y="456" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="1020" y="480" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">8 保存並判讀結果</text><text x="1020" y="500" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">確認內層 outcome</text></g><g data-node="true"><rect x="1008" y="168" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="1020" y="192" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">9 依確定結果回覆</text><text x="1020" y="212" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">後續 Model Step</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">數字為閱讀順序。主線假設兩個讀取可並行、必要資料與寫入授權成立，結果及必要保存成功。</text><text x="96" y="660" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">必要讀取的等待由 orchestration 維持；serial queue 不自動提供依賴，模型回覆也不取代 Run Terminal 判定。</text></svg>
