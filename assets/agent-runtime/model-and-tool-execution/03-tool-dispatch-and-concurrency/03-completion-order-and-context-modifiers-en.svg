<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="03-completion-order-and-context-modifiers-en-title 03-completion-order-and-context-modifiers-en-desc" lang="en" id="d-03-completion-order-and-context-modifiers-en-root"><title id="03-completion-order-and-context-modifiers-en-title">Tool completion and Context updates follow separate orders</title><desc id="03-completion-order-and-context-modifiers-en-desc">In one CCB concurrency-safe batch, B can finish before A. Context modifiers are collected by Tool Call ID, then applied in the original proposal order A, B after batch collection ends.</desc><defs>
      <style>#d-03-completion-order-and-context-modifiers-en-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-03-completion-order-and-context-modifiers-en-root nav, #d-03-completion-order-and-context-modifiers-en-root p { font-size:14px; line-height:1.8; }
      #d-03-completion-order-and-context-modifiers-en-root a { color:#0066d6; }
      #d-03-completion-order-and-context-modifiers-en-root .diagram-container { width:100%; overflow-x:auto; }
      #d-03-completion-order-and-context-modifiers-en-root details { border-top:1px solid #b9cce3; margin-top:24px; padding-top:16px; }
      #d-03-completion-order-and-context-modifiers-en-root summary { cursor:pointer; font-size:16px; font-weight:600; }
      #d-03-completion-order-and-context-modifiers-en-root nav, #d-03-completion-order-and-context-modifiers-en-root details { display:none; }
      #d-03-completion-order-and-context-modifiers-en-root .diagram-container { overflow-x:visible; }</style><marker id="d-03-completion-order-and-context-modifiers-en-03-completion-order-and-context-modifiers-en-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-03-completion-order-and-context-modifiers-en-03-completion-order-and-context-modifiers-en-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker><marker id="d-03-completion-order-and-context-modifiers-en-03-completion-order-and-context-modifiers-en-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="248" height="24" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">CONTEXT / COMPLETION AND APPLY</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">CCB batch path / no duration scale</text><rect x="96" y="116" width="64" height="4" rx="0" fill="#0078fc" stroke="none" stroke-width="1.2"/><text x="96" y="156" font-size="12" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Proposal order: A then B; both belong to one concurrency-safe batch</text><path d="M96 344 L816 344" fill="none" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="332" font-size="12" fill="#102743" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">A execution</text><text x="96" y="496" font-size="12" fill="#102743" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">B execution</text><path d="M288 248 L608 248" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-03-completion-order-and-context-modifiers-en-03-completion-order-and-context-modifiers-en-arrow)"/><rect x="414.0" y="218" width="68" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="448" y="232" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">LATER</text><path d="M288 432 L416 432" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-03-completion-order-and-context-modifiers-en-03-completion-order-and-context-modifiers-en-arrow)"/><rect x="324.0" y="402" width="56" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="352" y="416" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">EARLIER</text><path d="M800 248 L920 248 Q928 248 928 256 L928 304" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-03-completion-order-and-context-modifiers-en-03-completion-order-and-context-modifiers-en-arrow)"/><rect x="828.0" y="218" width="72" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="864" y="232" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">A RESULT</text><path d="M608 432 L1000 432 Q1008 432 1008 424 L1008 400" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-03-completion-order-and-context-modifiers-en-03-completion-order-and-context-modifiers-en-arrow)"/><rect x="764.0" y="402" width="72" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="800" y="416" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">B RESULT</text><path d="M1152 360 L1200 360 Q1208 360 1208 368 L1208 472 Q1208 480 1200 480 L536 480 Q528 480 528 488 L528 520" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-03-completion-order-and-context-modifiers-en-03-completion-order-and-context-modifiers-en-arrow)"/><rect x="1078.0" y="450" width="84" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="1120" y="464" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">BATCH DONE</text><path d="M640 552 L800 552" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-03-completion-order-and-context-modifiers-en-03-completion-order-and-context-modifiers-en-arrow)"/><rect x="690.0" y="522" width="60" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="720" y="536" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">THEN B</text><g data-node="true"><rect x="96" y="216" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="108" y="240" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Tool A starts</text><text x="108" y="260" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">First proposal in the batch</text></g><g data-node="true"><rect x="96" y="400" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="108" y="424" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Tool B starts</text><text x="108" y="444" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">May run alongside A</text></g><g data-node="true"><rect x="608" y="216" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="620" y="240" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Tool A finishes</text><text x="620" y="260" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">A result and modifier</text></g><g data-node="true"><rect x="416" y="400" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="428" y="424" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Tool B finishes first</text><text x="428" y="444" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">B result and modifier</text></g><g data-node="true"><rect x="880" y="304" width="272" height="96" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><text x="892" y="328" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Collect results/modifiers</text><text x="892" y="348" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Store modifiers by Tool Call ID</text><text x="892" y="366" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Continue after batch collection</text></g><g data-node="true"><rect x="416" y="520" width="224" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="428" y="544" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">1 Apply A modifier</text><text x="428" y="564" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Original blocks order</text></g><g data-node="true"><rect x="800" y="520" width="224" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="812" y="544" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">2 Apply B modifier</text><text x="812" y="564" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Next currentContext</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">B may deliver a message first. After batch collection, Context modifiers apply in proposal order A then B, regardless of completion order.</text><text x="96" y="660" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">This covers in-process Context in runTools(). It does not grant a shared external-write transaction or describe the streaming executor.</text></svg>
