<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="03-batches-and-scheduler-scope-en-title 03-batches-and-scheduler-scope-en-desc" lang="en" id="d-03-batches-and-scheduler-scope-en-root"><title id="03-batches-and-scheduler-scope-en-title">Batch order and separate scheduler paths impose different waits</title><desc id="03-batches-and-scheduler-scope-en-desc">CCB's ordinary batch path processes consecutive safe tools and unsafe tools in ordered batches. Chat Gun manages bounded reads and the serial tail separately; the serial path does not automatically wait for all reads.</desc><defs>
      <style>#d-03-batches-and-scheduler-scope-en-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-03-batches-and-scheduler-scope-en-root nav, #d-03-batches-and-scheduler-scope-en-root p { font-size:14px; line-height:1.8; }
      #d-03-batches-and-scheduler-scope-en-root a { color:#0066d6; }
      #d-03-batches-and-scheduler-scope-en-root .diagram-container { width:100%; overflow-x:auto; }
      #d-03-batches-and-scheduler-scope-en-root details { border-top:1px solid #b9cce3; margin-top:24px; padding-top:16px; }
      #d-03-batches-and-scheduler-scope-en-root summary { cursor:pointer; font-size:16px; font-weight:600; }
      #d-03-batches-and-scheduler-scope-en-root nav, #d-03-batches-and-scheduler-scope-en-root details { display:none; }
      #d-03-batches-and-scheduler-scope-en-root .diagram-container { overflow-x:visible; }</style><marker id="d-03-batches-and-scheduler-scope-en-03-batches-and-scheduler-scope-en-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-03-batches-and-scheduler-scope-en-03-batches-and-scheduler-scope-en-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker><marker id="d-03-batches-and-scheduler-scope-en-03-batches-and-scheduler-scope-en-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="248" height="24" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">SCHEDULING / BATCHES AND SCOPE</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">Separate source paths / distinct conditions</text><rect x="96" y="116" width="64" height="4" rx="0" fill="#0078fc" stroke="none" stroke-width="1.2"/><rect x="96" y="152" width="496" height="432" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="624" y="152" width="560" height="432" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><text x="120" y="180" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">CCB: ordinary runTools() batch path</text><text x="120" y="200" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Proposals: safe A, safe B, unsafe C, safe D</text><text x="648" y="180" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Chat Gun: separate paths in one scheduler</text><text x="648" y="200" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">After classification, schedule() selects the path</text><path d="M904 224 L904 384" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><path d="M344 296 L344 344" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-03-batches-and-scheduler-scope-en-03-batches-and-scheduler-scope-en-arrow)"/><rect x="352.0" y="310" width="92" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="398" y="324" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">NEXT</text><path d="M344 408 L344 472" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-03-batches-and-scheduler-scope-en-03-batches-and-scheduler-scope-en-arrow)"/><rect x="352.0" y="430" width="92" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="398" y="444" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">NEXT</text><g data-node="true"><rect x="128" y="216" width="432" height="80" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><text x="140" y="240" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Batch 1: A and B may run concurrently</text><text x="140" y="260" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Adjacent safe proposals share a batch</text><text x="140" y="278" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Finish this batch before moving on</text></g><g data-node="true"><rect x="128" y="344" width="432" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="140" y="368" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Batch 2: C</text><text x="140" y="388" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">An unsafe tool forms its own batch</text></g><g data-node="true"><rect x="128" y="472" width="432" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="140" y="496" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Batch 3: D</text><text x="140" y="516" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Keep proposal order; do not move D into batch 1</text></g><g data-node="true"><rect x="656" y="248" width="224" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="668" y="272" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Bounded reads</text><text x="668" y="292" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">concurrent_safe + runId</text><text x="668" y="310" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Per-Run reservation and read slot</text><text x="668" y="328" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Capacity and wait conditions apply</text></g><g data-node="true"><rect x="928" y="248" width="224" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="940" y="272" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Serial tail</text><text x="940" y="292" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">All other cases take this path</text><text x="940" y="310" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Serializes only this path's work</text><text x="940" y="328" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">No all-reads-complete barrier</text></g><g data-node="true"><rect x="656" y="424" width="496" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="668" y="448" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">No shared read/write barrier between paths</text><text x="668" y="468" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">If a write needs read results, orchestration must maintain that dependency</text><text x="668" y="486" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Check Step Lock and cross-Resource / Worker exclusion separately</text><text x="668" y="504" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">No reads-to-serial wait arrow is drawn between these paths</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Left: CCB batch runTools() only; inspect StreamingToolExecutor separately. Right: one Chat Gun scheduler instance.</text><text x="96" y="660" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">The article details classification, Schema, authorization and deployment gates. These sources have separate scheduling contracts.</text></svg>
