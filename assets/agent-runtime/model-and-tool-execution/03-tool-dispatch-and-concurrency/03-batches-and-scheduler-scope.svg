<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="03-batches-and-scheduler-scope-title 03-batches-and-scheduler-scope-desc" lang="zh-TW" id="d-03-batches-and-scheduler-scope-root"><title id="03-batches-and-scheduler-scope-title">批次順序與分離排程路徑具有不同等待關係</title><desc id="03-batches-and-scheduler-scope-desc">CCB 一般批次依序處理連續安全工具與非安全工具；Chat Gun 的 bounded reads 與 serial tail 則分別管理，serial 路徑不自動等待全部讀取。</desc><defs>
      <style>#d-03-batches-and-scheduler-scope-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-03-batches-and-scheduler-scope-root nav, #d-03-batches-and-scheduler-scope-root p { font-size:14px; line-height:1.8; }
      #d-03-batches-and-scheduler-scope-root a { color:#0066d6; }
      #d-03-batches-and-scheduler-scope-root .diagram-container { width:100%; overflow-x:auto; }
      #d-03-batches-and-scheduler-scope-root details { border-top:1px solid #b9cce3; margin-top:24px; padding-top:16px; }
      #d-03-batches-and-scheduler-scope-root summary { cursor:pointer; font-size:16px; font-weight:600; }
      #d-03-batches-and-scheduler-scope-root nav, #d-03-batches-and-scheduler-scope-root details { display:none; }
      #d-03-batches-and-scheduler-scope-root .diagram-container { overflow-x:visible; }</style><marker id="d-03-batches-and-scheduler-scope-03-batches-and-scheduler-scope-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-03-batches-and-scheduler-scope-03-batches-and-scheduler-scope-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker><marker id="d-03-batches-and-scheduler-scope-03-batches-and-scheduler-scope-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="248" height="24" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">SCHEDULING / BATCHES AND SCOPE</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">兩份來源分開對照 · 保留各自條件</text><rect x="96" y="116" width="64" height="4" rx="0" fill="#0078fc" stroke="none" stroke-width="1.2"/><rect x="96" y="152" width="496" height="432" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="624" y="152" width="560" height="432" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><text x="120" y="180" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">CCB：一般 runTools() 批次路徑</text><text x="120" y="200" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">原提案：safe A、safe B、unsafe C、safe D</text><text x="648" y="180" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Chat Gun：同一 scheduler 的不同路徑</text><text x="648" y="200" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">分類完成後，依 schedule() 條件選擇路徑</text><path d="M904 224 L904 384" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><path d="M344 296 L344 344" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-03-batches-and-scheduler-scope-03-batches-and-scheduler-scope-arrow)"/><rect x="352.0" y="310" width="92" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="398" y="324" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">NEXT</text><path d="M344 408 L344 472" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-03-batches-and-scheduler-scope-03-batches-and-scheduler-scope-arrow)"/><rect x="352.0" y="430" width="92" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="398" y="444" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">NEXT</text><g data-node="true"><rect x="128" y="216" width="432" height="80" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><text x="140" y="240" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">批次 1：A 與 B 可並行</text><text x="140" y="260" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">相鄰 safe 提案合成同批</text><text x="140" y="278" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">該批處理結束後再往下</text></g><g data-node="true"><rect x="128" y="344" width="432" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="140" y="368" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">批次 2：C</text><text x="140" y="388" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">unsafe 工具單獨成批</text></g><g data-node="true"><rect x="128" y="472" width="432" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="140" y="496" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">批次 3：D</text><text x="140" y="516" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">保留原提案順序，不移到批次 1</text></g><g data-node="true"><rect x="656" y="248" width="224" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="668" y="272" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Bounded reads</text><text x="668" y="292" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">concurrent_safe ＋ runId</text><text x="668" y="310" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">取得每 Run 保留與讀取槽位</text><text x="668" y="328" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">容量與等待另有條件</text></g><g data-node="true"><rect x="928" y="248" width="224" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="940" y="272" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Serial tail</text><text x="940" y="292" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">其餘情況進入此路徑</text><text x="940" y="310" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">只序列化本路徑的工作</text><text x="940" y="328" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">沒有全讀取完成 barrier</text></g><g data-node="true"><rect x="656" y="424" width="496" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="668" y="448" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">兩條路徑之間沒有共同讀寫 barrier</text><text x="668" y="468" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">若寫入必須等讀取結果，需上層明確維持依賴</text><text x="668" y="486" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Step Lock 與跨 Resource／Worker 互斥另查</text><text x="668" y="504" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">圖中刻意不畫 reads → serial 的等待箭頭</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">左側限 CCB 批次 runTools()；StreamingToolExecutor 的排程需另查。右側限 Chat Gun 單一 scheduler。</text><text x="96" y="660" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">安全分類、Schema、授權與部署啟用條件在正文展開；兩個來源未共用一套排程契約。</text></svg>
