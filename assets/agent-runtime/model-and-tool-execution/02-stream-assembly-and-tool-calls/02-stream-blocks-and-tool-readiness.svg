<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="02-stream-blocks-and-tool-readiness-title 02-stream-blocks-and-tool-readiness-desc" lang="zh-TW" id="d-02-stream-blocks-and-tool-readiness-root"><title id="02-stream-blocks-and-tool-readiness-title">工具區塊完整、可執行與訊息完成有不同時點</title><desc id="02-stream-blocks-and-tool-readiness-desc">CCB 將工具參數片段累積到區塊結束並正規化，再交給輸入與執行檢查；啟用提前執行時工具可以先開始，usage 與 stop reason 隨後才到。</desc><defs>
      <style>#d-02-stream-blocks-and-tool-readiness-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-02-stream-blocks-and-tool-readiness-root nav, #d-02-stream-blocks-and-tool-readiness-root p { font-size:14px; line-height:1.8; }
      #d-02-stream-blocks-and-tool-readiness-root a { color:#0066d6; }
      #d-02-stream-blocks-and-tool-readiness-root .diagram-container { width:100%; overflow-x:auto; }
      #d-02-stream-blocks-and-tool-readiness-root details { border-top:1px solid #b9cce3; margin-top:24px; padding-top:16px; }
      #d-02-stream-blocks-and-tool-readiness-root summary { cursor:pointer; font-size:16px; font-weight:600; }
      #d-02-stream-blocks-and-tool-readiness-root nav, #d-02-stream-blocks-and-tool-readiness-root details { display:none; }
