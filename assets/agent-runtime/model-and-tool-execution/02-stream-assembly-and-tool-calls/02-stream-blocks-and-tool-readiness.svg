fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-stream-blocks-and-tool-readiness-02-stream-blocks-and-tool-readiness-arrow)"/><rect x="300.0" y="218" width="88" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="344" y="232" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">INPUT DELTA</text><path d="M192 312 L496 312" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-stream-blocks-and-tool-readiness-02-stream-blocks-and-tool-readiness-arrow)"/><rect x="302.0" y="282" width="84" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="344" y="296" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">BLOCK STOP</text><path d="M496 448 L800 448" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-stream-blocks-and-tool-readiness-02-stream-blocks-and-tool-readiness-arrow)"/><rect x="612.0" y="418" width="72" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="648" y="432" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">VALIDATE</text><path d="M800 568 L1104 568" fill="none" stroke="#0066d6" stroke-width="1.2" marker-end="url(#d-02-stream-blocks-and-tool-readiness-02-stream-blocks-and-tool-readiness-arrow-accent)"/><rect x="964.0" y="538" width="72" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="1000" y="552" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">DISPATCH</text><path d="M192 584 L496 584" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-stream-blocks-and-tool-readiness-02-stream-blocks-and-tool-readiness-arrow)"/><rect x="308.0" y="554" width="72" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="344" y="568" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">METADATA</text><g data-node="true"><rect x="96" y="152" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="108" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Provider events</text><text x="108" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">按訊息與區塊關聯</text></g><g data-node="true"><rect x="400" y="152" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="412" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">區塊組裝與正規化</text><text x="412" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">累積 partial_json</text></g><g data-node="true"><rect x="704" y="152" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="716" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">工具執行檢查</text><text x="716" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Schema／permission 等</text></g><g data-node="true"><rect x="1008" y="152" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="1020" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Tool Runner</text><text x="1020" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">僅在相應檢查通過後</text></g><g data-node="true"><rect x="400" y="344" width="256" height="64" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><text x="412" y="368" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">建立可辨認提案</text><text x="412" y="388" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">解析失敗也可能回退成 {}</text></g><g data-node="true"><rect x="704" y="480" width="224" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="716" y="504" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">核對輸入與執行資格</text><text x="716" y="524" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">區塊結束不等於驗證通過</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">本例選取 gate 啟用且檢查通過的提前派送；usage、stop reason 可晚於區塊與工具開始時間。</text><text x="96" y="660" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">JSON 解碼、Schema 與授權各自核對；metadata 更新記憶體物件，不證明外部 Store 自動同步。</text></svg>
