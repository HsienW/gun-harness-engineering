<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="02-fallback-stale-results-and-effects-en-title 02-fallback-stale-results-and-effects-en-desc" lang="en" id="d-02-fallback-stale-results-and-effects-en-root"><title id="02-fallback-stale-results-and-effects-en-title">Clearing stale results requires a separate check of external I/O</title><desc id="02-fallback-stale-results-and-effects-en-desc">Some CCB fallback paths clear old messages and collections, discard the old executor and create a new attempt. The discarded flag alone does not prove that an old external operation was cancelled or reversed.</desc><defs>
      <style>#d-02-fallback-stale-results-and-effects-en-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-02-fallback-stale-results-and-effects-en-root nav, #d-02-fallback-stale-results-and-effects-en-root p { font-size:14px; line-height:1.8; }
      #d-02-fallback-stale-results-and-effects-en-root a { color:#0066d6; }
      #d-02-fallback-stale-results-and-effects-en-root .diagram-container { width:100%; overflow-x:auto; }
      #d-02-fallback-stale-results-and-effects-en-root details { border-top:1px solid #b9cce3; margin-top:24px; padding-top:16px; }
      #d-02-fallback-stale-results-and-effects-en-root summary { cursor:pointer; font-size:16px; font-weight:600; }
      #d-02-fallback-stale-results-and-effects-en-root nav, #d-02-fallback-stale-results-and-effects-en-root details { display:none; }
      #d-02-fallback-stale-results-and-effects-en-root .diagram-container { overflow-x:visible; }</style><marker id="d-02-fallback-stale-results-and-effects-en-02-fallback-stale-results-and-effects-en-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-02-fallback-stale-results-and-effects-en-02-fallback-stale-results-and-effects-en-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker><marker id="d-02-fallback-stale-results-and-effects-en-02-fallback-stale-results-and-effects-en-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="204" height="24" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">FALLBACK / STALE RESULTS</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">CCB example / selected fallback branches</text><rect x="96" y="116" width="64" height="4" rx="0" fill="#0078fc" stroke="none" stroke-width="1.2"/><path d="M192 216 L192 592" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><path d="M496 216 L496 592" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><path d="M800 216 L800 592" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><path d="M1104 216 L1104 592" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><path d="M800 248 L1104 248" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-fallback-stale-results-and-effects-en-02-fallback-stale-results-and-effects-en-arrow)"/><rect x="916.0" y="218" width="72" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="952" y="232" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">I/O SENT</text><path d="M192 320 L496 320" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-fallback-stale-results-and-effects-en-02-fallback-stale-results-and-effects-en-arrow)"/><rect x="306.0" y="290" width="76" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="344" y="304" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">TOMBSTONE</text><path d="M192 392 L800 392" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-fallback-stale-results-and-effects-en-02-fallback-stale-results-and-effects-en-arrow)"/><rect x="464.0" y="362" width="64" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="496" y="376" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">DISCARD</text><g data-node="true"><rect x="96" y="152" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="108" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Query consumer</text><text x="108" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Handles model fallback</text></g><g data-node="true"><rect x="400" y="152" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="412" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Old messages and data</text><text x="412" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">assistant / tool-use links</text></g><g data-node="true"><rect x="704" y="152" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="716" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Old stream executor</text><text x="716" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Tools may have started</text></g><g data-node="true"><rect x="1008" y="152" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="1020" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">External system</text><text x="1020" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Old I/O already sent</text></g><g data-node="true"><rect x="400" y="424" width="256" height="80" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="412" y="448" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Old messages/data cleared</text><text x="412" y="468" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Keep old IDs out of replies</text><text x="412" y="486" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Handled by fallback branch</text></g><g data-node="true"><rect x="704" y="424" width="192" height="80" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><text x="716" y="448" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">discarded = true</text><text x="716" y="468" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Checked by run/result code</text><text x="716" y="486" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Old results not delivered</text></g><g data-node="true"><rect x="1008" y="424" width="192" height="80" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="1020" y="448" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Old I/O: status unknown</text><text x="1020" y="468" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Stopped? Committed?</text><text x="1020" y="486" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Check tool and abort wiring</text></g><g data-node="true"><rect x="96" y="520" width="560" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="108" y="544" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">New attempt creates a new executor</text><text x="108" y="564" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">New message and Tool Call links; old results must not attach to a new proposal</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Tombstones and cleared collections maintain message pairing. discard() sets a flag; it does not call a remote reversal API.</text><text x="96" y="660" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Queued tools and in-flight I/O have different outcomes. A new attempt does not erase old effects; no rollback or shared transaction is shown.</text></svg>
