<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="02-stream-blocks-and-tool-readiness-en-title 02-stream-blocks-and-tool-readiness-en-desc" lang="en" id="d-02-stream-blocks-and-tool-readiness-en-root"><title id="02-stream-blocks-and-tool-readiness-en-title">Block completion, tool readiness and message completion occur separately</title><desc id="02-stream-blocks-and-tool-readiness-en-desc">CCB accumulates tool argument fragments until the block ends, normalizes them, then checks input and execution eligibility. With early execution enabled, the tool can start before usage and stop reason arrive.</desc><defs>
      <style>#d-02-stream-blocks-and-tool-readiness-en-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-02-stream-blocks-and-tool-readiness-en-root nav, #d-02-stream-blocks-and-tool-readiness-en-root p { font-size:14px; line-height:1.8; }
      #d-02-stream-blocks-and-tool-readiness-en-root a { color:#0066d6; }
      #d-02-stream-blocks-and-tool-readiness-en-root .diagram-container { width:100%; overflow-x:auto; }
      #d-02-stream-blocks-and-tool-readiness-en-root details { border-top:1px solid #b9cce3; margin-top:24px; padding-top:16px; }
      #d-02-stream-blocks-and-tool-readiness-en-root summary { cursor:pointer; font-size:16px; font-weight:600; }
      #d-02-stream-blocks-and-tool-readiness-en-root nav, #d-02-stream-blocks-and-tool-readiness-en-root details { display:none; }
      #d-02-stream-blocks-and-tool-readiness-en-root .diagram-container { overflow-x:visible; }</style><marker id="d-02-stream-blocks-and-tool-readiness-en-02-stream-blocks-and-tool-readiness-en-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-02-stream-blocks-and-tool-readiness-en-02-stream-blocks-and-tool-readiness-en-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker><marker id="d-02-stream-blocks-and-tool-readiness-en-02-stream-blocks-and-tool-readiness-en-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="272" height="24" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">STREAM / BLOCK AND TOOL READINESS</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">CCB sequence / early-execution gate enabled</text><rect x="96" y="116" width="64" height="4" rx="0" fill="#0078fc" stroke="none" stroke-width="1.2"/><path d="M192 216 L192 600" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><path d="M496 216 L496 600" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><path d="M800 216 L800 600" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><path d="M1104 216 L1104 600" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><path d="M192 248 L496 248" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-stream-blocks-and-tool-readiness-en-02-stream-blocks-and-tool-readiness-en-arrow)"/><rect x="300.0" y="218" width="88" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="344" y="232" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">INPUT DELTA</text><path d="M192 312 L496 312" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-stream-blocks-and-tool-readiness-en-02-stream-blocks-and-tool-readiness-en-arrow)"/><rect x="302.0" y="282" width="84" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="344" y="296" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">BLOCK STOP</text><path d="M496 448 L800 448" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-stream-blocks-and-tool-readiness-en-02-stream-blocks-and-tool-readiness-en-arrow)"/><rect x="612.0" y="418" width="72" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="648" y="432" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">VALIDATE</text><path d="M800 568 L1104 568" fill="none" stroke="#0066d6" stroke-width="1.2" marker-end="url(#d-02-stream-blocks-and-tool-readiness-en-02-stream-blocks-and-tool-readiness-en-arrow-accent)"/><rect x="964.0" y="538" width="72" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="1000" y="552" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">DISPATCH</text><path d="M192 584 L496 584" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-stream-blocks-and-tool-readiness-en-02-stream-blocks-and-tool-readiness-en-arrow)"/><rect x="308.0" y="554" width="72" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="344" y="568" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">METADATA</text><g data-node="true"><rect x="96" y="152" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="108" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Provider events</text><text x="108" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Message and block links</text></g><g data-node="true"><rect x="400" y="152" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="412" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Assemble / normalize</text><text x="412" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Accumulate partial_json</text></g><g data-node="true"><rect x="704" y="152" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="716" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Tool execution checks</text><text x="716" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Schema / permission etc.</text></g><g data-node="true"><rect x="1008" y="152" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="1020" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Tool Runner</text><text x="1020" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">After relevant checks pass</text></g><g data-node="true"><rect x="400" y="344" width="256" height="64" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><text x="412" y="368" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Form a tool proposal</text><text x="412" y="388" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Parse failure may fall back to {}</text></g><g data-node="true"><rect x="704" y="480" width="224" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="716" y="504" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Check input and eligibility</text><text x="716" y="524" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Block end does not validate input</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">This example enables the gate and passes the checks for early dispatch. Usage and stop reason may arrive after the block ends and the tool starts.</text><text x="96" y="660" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Check JSON decoding, Schema and authorization separately. Metadata updates in-memory objects; external Store synchronization requires verification.</text></svg>
