<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="02-fallback-stale-results-and-effects-title 02-fallback-stale-results-and-effects-desc" lang="zh-TW" id="d-02-fallback-stale-results-and-effects-root"><title id="02-fallback-stale-results-and-effects-title">清理舊訊息與結果時，外部 I/O 仍要另外查證</title><desc id="02-fallback-stale-results-and-effects-desc">CCB 的部分 fallback 路徑清理舊訊息與收集、discard 舊 executor 並建立新嘗試；discarded flag 不會單獨證明舊外部操作已取消或撤銷。</desc><defs>
      <style>#d-02-fallback-stale-results-and-effects-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-02-fallback-stale-results-and-effects-root nav, #d-02-fallback-stale-results-and-effects-root p { font-size:14px; line-height:1.8; }
      #d-02-fallback-stale-results-and-effects-root a { color:#0066d6; }
      #d-02-fallback-stale-results-and-effects-root .diagram-container { width:100%; overflow-x:auto; }
      #d-02-fallback-stale-results-and-effects-root details { border-top:1px solid #b9cce3; margin-top:24px; padding-top:16px; }
      #d-02-fallback-stale-results-and-effects-root summary { cursor:pointer; font-size:16px; font-weight:600; }
      #d-02-fallback-stale-results-and-effects-root nav, #d-02-fallback-stale-results-and-effects-root details { display:none; }
      #d-02-fallback-stale-results-and-effects-root .diagram-container { overflow-x:visible; }</style><marker id="d-02-fallback-stale-results-and-effects-02-fallback-stale-results-and-effects-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-02-fallback-stale-results-and-effects-02-fallback-stale-results-and-effects-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker><marker id="d-02-fallback-stale-results-and-effects-02-fallback-stale-results-and-effects-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="204" height="24" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">FALLBACK / STALE RESULTS</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">CCB 路徑示例 · 部分 fallback 分支</text><rect x="96" y="116" width="64" height="4" rx="0" fill="#0078fc" stroke="none" stroke-width="1.2"/><path d="M192 216 L192 592" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><path d="M496 216 L496 592" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><path d="M800 216 L800 592" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><path d="M1104 216 L1104 592" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><path d="M800 248 L1104 248" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-fallback-stale-results-and-effects-02-fallback-stale-results-and-effects-arrow)"/><rect x="916.0" y="218" width="72" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="952" y="232" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">I/O SENT</text><path d="M192 320 L496 320" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-fallback-stale-results-and-effects-02-fallback-stale-results-and-effects-arrow)"/><rect x="306.0" y="290" width="76" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="344" y="304" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">TOMBSTONE</text><path d="M192 392 L800 392" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-fallback-stale-results-and-effects-02-fallback-stale-results-and-effects-arrow)"/><rect x="464.0" y="362" width="64" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="496" y="376" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">DISCARD</text><g data-node="true"><rect x="96" y="152" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="108" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Query consumer</text><text x="108" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">處理模型 fallback</text></g><g data-node="true"><rect x="400" y="152" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="412" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">舊訊息與收集</text><text x="412" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">assistant／tool-use 關聯</text></g><g data-node="true"><rect x="704" y="152" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="716" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">舊串流 executor</text><text x="716" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">可能已有工具開始</text></g><g data-node="true"><rect x="1008" y="152" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="1020" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">外部系統</text><text x="1020" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">舊 I/O 已經送出</text></g><g data-node="true"><rect x="400" y="424" width="256" height="80" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="412" y="448" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">舊訊息／收集已清理</text><text x="412" y="468" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">避免舊 ID 混入新回應</text><text x="412" y="486" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">由對應 fallback 分支處理</text></g><g data-node="true"><rect x="704" y="424" width="192" height="80" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><text x="716" y="448" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">discarded = true</text><text x="716" y="468" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">執行／取結果端判讀</text><text x="716" y="486" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">舊結果不再交付</text></g><g data-node="true"><rect x="1008" y="424" width="192" height="80" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="1020" y="448" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">舊 I/O 狀態待查</text><text x="1020" y="468" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">是否停止、是否提交</text><text x="1020" y="486" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">由工具與取消接線證明</text></g><g data-node="true"><rect x="96" y="520" width="560" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="108" y="544" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">新嘗試建立新的 executor</text><text x="108" y="564" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">新訊息與 Tool Call 關聯；不可把舊結果直接接到新提案</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Tombstone 與清空收集用來處理訊息配對；discard() 本身設定旗標，沒有單獨呼叫遠端撤銷 API。</text><text x="96" y="660" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">等待中的工具與已開始的 I/O 有不同後續；新嘗試不代表舊效果消失，圖中未畫自動 rollback 或共同 transaction。</text></svg>
