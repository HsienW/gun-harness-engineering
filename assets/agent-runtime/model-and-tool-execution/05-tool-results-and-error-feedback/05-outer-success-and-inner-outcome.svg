<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="05-outer-success-and-inner-outcome-title 05-outer-success-and-inner-outcome-desc" lang="zh-TW" id="d-05-outer-success-and-inner-outcome-root"><title id="05-outer-success-and-inner-outcome-title">外層交付成功，仍要讀取內層執行結果</title><desc id="05-outer-success-and-inner-outcome-desc">Runner 返回後 Task Step 保存失敗，pipeline 可以成功回傳包含 ambiguous_after_dispatch 的結果封套；consumer 必須讀取內層 outcome，再決定回查與後續處理。</desc><defs>
      <style>#d-05-outer-success-and-inner-outcome-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-05-outer-success-and-inner-outcome-root nav, #d-05-outer-success-and-inner-outcome-root p { font-size:14px; line-height:1.8; }
      #d-05-outer-success-and-inner-outcome-root a { color:#0066d6; }
      #d-05-outer-success-and-inner-outcome-root .diagram-container { width:100%; overflow-x:auto; }
      #d-05-outer-success-and-inner-outcome-root details { border-top:1px solid #b9cce3; margin-top:24px; padding-top:16px; }
      #d-05-outer-success-and-inner-outcome-root summary { cursor:pointer; font-size:16px; font-weight:600; }
      #d-05-outer-success-and-inner-outcome-root nav, #d-05-outer-success-and-inner-outcome-root details { display:none; }
      #d-05-outer-success-and-inner-outcome-root .diagram-container { overflow-x:visible; }</style><marker id="d-05-outer-success-and-inner-outcome-05-outer-success-and-inner-outcome-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-05-outer-success-and-inner-outcome-05-outer-success-and-inner-outcome-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker><marker id="d-05-outer-success-and-inner-outcome-05-outer-success-and-inner-outcome-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="264" height="24" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">RESULT / OUTER AND INNER OUTCOME</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">Chat Gun 選定分支 · 保存失敗後的回傳</text><rect x="96" y="116" width="64" height="4" rx="0" fill="#0078fc" stroke="none" stroke-width="1.2"/><rect x="800" y="176" width="384" height="240" rx="8" fill="#eef4fb" stroke="#0066d6" stroke-width="1.2" stroke-dasharray="6 6"/><text x="816" y="198" font-size="12" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">回傳的 result envelope（欄位節錄）</text><path d="M320 248 L448 248" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-05-outer-success-and-inner-outcome-05-outer-success-and-inner-outcome-arrow)"/><rect x="352.0" y="218" width="64" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="384" y="232" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">PERSIST</text><path d="M576 280 L576 344" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-05-outer-success-and-inner-outcome-05-outer-success-and-inner-outcome-arrow)"/><rect x="584.0" y="306" width="112" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="640" y="320" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">FAIL</text><path d="M704 392 L744 392 Q752 392 752 384 L752 360 Q752 352 760 352 L832 352" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-05-outer-success-and-inner-outcome-05-outer-success-and-inner-outcome-arrow)"/><rect x="728.0" y="322" width="96" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="776" y="336" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">ENVELOPE</text><path d="M992 400 L992 464" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-05-outer-success-and-inner-outcome-05-outer-success-and-inner-outcome-arrow)"/><rect x="1000.0" y="426" width="136" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="1068" y="440" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">READ OUTCOME</text><g data-node="true"><rect x="96" y="216" width="224" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="108" y="240" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Runner 已返回</text><text x="108" y="260" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">已有本次工具執行結果</text></g><g data-node="true"><rect x="448" y="216" width="256" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="460" y="240" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">保存 Task Step 結果</text><text x="460" y="260" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">依 outcome complete／fail</text></g><g data-node="true"><rect x="448" y="344" width="256" height="96" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="460" y="368" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">結果保存失敗</text><text x="460" y="388" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">補記並記錄 ambiguous</text><text x="460" y="406" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">回傳新的 structured envelope</text></g><g data-node="true"><rect x="832" y="216" width="320" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="844" y="240" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">外層：succeeded</text><text x="844" y="260" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">這條呼叫成功交付結果封裝</text></g><g data-node="true"><rect x="832" y="304" width="320" height="96" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><text x="844" y="328" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">內層：ambiguous_after_dispatch</text><text x="844" y="348" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">TASK_STEP_PERSISTENCE_FAILED_</text><text x="844" y="366" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">AFTER_DISPATCH</text></g><g data-node="true"><rect x="800" y="464" width="384" height="96" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="812" y="488" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Consumer 讀內層 outcome 再分流</text><text x="812" y="508" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">回查或人工處理，不能只看外層值報成功</text><text x="812" y="526" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">圖中省略其他欄位與後續補記的細節</text></g><g data-node="true"><rect x="96" y="488" width="608" height="72" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="108" y="512" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">外部是否提交，仍需效果證據</text><text x="108" y="532" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">保存失敗不表示原操作未發生，也不表示可直接重新派送</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">外層 succeeded 描述結果封裝的回傳；內層 outcome 才描述這個分支的執行與保存狀態。</text><text x="96" y="660" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">本例未由 Task Step 保存失敗推論外部 Commit 真相；legacy 文字轉換與恢復演算法在正文另行說明。</text></svg>
