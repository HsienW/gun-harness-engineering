<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="05-outer-success-and-inner-outcome-en-title 05-outer-success-and-inner-outcome-en-desc" lang="en" id="d-05-outer-success-and-inner-outcome-en-root"><title id="05-outer-success-and-inner-outcome-en-title">Successful envelope delivery still requires reading the inner outcome</title><desc id="05-outer-success-and-inner-outcome-en-desc">If Task Step persistence fails after the runner returns, the pipeline can successfully deliver an envelope containing ambiguous_after_dispatch. The consumer must inspect the inner outcome before choosing reconciliation or further handling.</desc><defs>
      <style>#d-05-outer-success-and-inner-outcome-en-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-05-outer-success-and-inner-outcome-en-root nav, #d-05-outer-success-and-inner-outcome-en-root p { font-size:14px; line-height:1.8; }
      #d-05-outer-success-and-inner-outcome-en-root a { color:#0066d6; }
      #d-05-outer-success-and-inner-outcome-en-root .diagram-container { width:100%; overflow-x:auto; }
      #d-05-outer-success-and-inner-outcome-en-root details { border-top:1px solid #b9cce3; margin-top:24px; padding-top:16px; }
      #d-05-outer-success-and-inner-outcome-en-root summary { cursor:pointer; font-size:16px; font-weight:600; }
      #d-05-outer-success-and-inner-outcome-en-root nav, #d-05-outer-success-and-inner-outcome-en-root details { display:none; }
      #d-05-outer-success-and-inner-outcome-en-root .diagram-container { overflow-x:visible; }</style><marker id="d-05-outer-success-and-inner-outcome-en-05-outer-success-and-inner-outcome-en-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-05-outer-success-and-inner-outcome-en-05-outer-success-and-inner-outcome-en-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker><marker id="d-05-outer-success-and-inner-outcome-en-05-outer-success-and-inner-outcome-en-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="264" height="24" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">RESULT / OUTER AND INNER OUTCOME</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">Chat Gun branch / return after persistence failure</text><rect x="96" y="116" width="64" height="4" rx="0" fill="#0078fc" stroke="none" stroke-width="1.2"/><rect x="800" y="176" width="384" height="240" rx="8" fill="#eef4fb" stroke="#0066d6" stroke-width="1.2" stroke-dasharray="6 6"/><text x="816" y="198" font-size="12" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Returned result envelope (selected fields)</text><path d="M320 248 L448 248" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-05-outer-success-and-inner-outcome-en-05-outer-success-and-inner-outcome-en-arrow)"/><rect x="352.0" y="218" width="64" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="384" y="232" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">PERSIST</text><path d="M576 280 L576 344" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-05-outer-success-and-inner-outcome-en-05-outer-success-and-inner-outcome-en-arrow)"/><rect x="584.0" y="306" width="112" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="640" y="320" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">FAIL</text><path d="M704 392 L744 392 Q752 392 752 384 L752 360 Q752 352 760 352 L832 352" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-05-outer-success-and-inner-outcome-en-05-outer-success-and-inner-outcome-en-arrow)"/><rect x="728.0" y="322" width="96" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="776" y="336" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">ENVELOPE</text><path d="M992 400 L992 464" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-05-outer-success-and-inner-outcome-en-05-outer-success-and-inner-outcome-en-arrow)"/><rect x="1000.0" y="426" width="136" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="1068" y="440" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">READ OUTCOME</text><g data-node="true"><rect x="96" y="216" width="224" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="108" y="240" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Runner returns</text><text x="108" y="260" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Tool execution result available</text></g><g data-node="true"><rect x="448" y="216" width="256" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="460" y="240" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Persist Task Step result</text><text x="460" y="260" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">complete / fail by outcome</text></g><g data-node="true"><rect x="448" y="344" width="256" height="96" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="460" y="368" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Result persistence fails</text><text x="460" y="388" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Record ambiguity; attempt fail</text><text x="460" y="406" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Return a structured envelope</text></g><g data-node="true"><rect x="832" y="216" width="320" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="844" y="240" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Outer: succeeded</text><text x="844" y="260" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">The call delivers a result envelope</text></g><g data-node="true"><rect x="832" y="304" width="320" height="96" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><text x="844" y="328" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Inner: ambiguous_after_dispatch</text><text x="844" y="348" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">TASK_STEP_PERSISTENCE_FAILED_</text><text x="844" y="366" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">AFTER_DISPATCH</text></g><g data-node="true"><rect x="800" y="464" width="384" height="96" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="812" y="488" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Consumer branches on inner outcome</text><text x="812" y="508" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Reconcile or seek help; outer success alone is insufficient</text><text x="812" y="526" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Other fields and follow-up recording details are omitted</text></g><g data-node="true"><rect x="96" y="488" width="608" height="72" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="108" y="512" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">External commit still requires effect evidence</text><text x="108" y="532" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Persistence failure proves neither absence of the operation nor permission to redispatch</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Outer succeeded describes envelope delivery. The inner outcome describes execution and persistence status on this branch.</text><text x="96" y="660" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Task Step persistence failure does not establish the external Commit state. The article covers legacy text conversion and recovery separately.</text></svg>
