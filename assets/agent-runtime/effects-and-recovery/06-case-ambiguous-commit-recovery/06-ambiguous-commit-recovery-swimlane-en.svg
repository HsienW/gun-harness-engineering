<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="06-ambiguous-commit-recovery-swimlane-en-title 06-ambiguous-commit-recovery-swimlane-en-desc" lang="en" id="d-06-ambiguous-commit-recovery-swimlane-en-root"><title id="06-ambiguous-commit-recovery-swimlane-en-title">Reconcile and persist the original operation before delivering a known result</title><desc id="06-ambiguous-commit-recovery-swimlane-en-desc">This teaching case selects an external commit with a lost response and a local unknown record. A new consumer checks data and takeover eligibility, reconciles the original effect, persists the needed records and delivers the result.</desc><defs>
      <style>#d-06-ambiguous-commit-recovery-swimlane-en-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-06-ambiguous-commit-recovery-swimlane-en-root nav, #d-06-ambiguous-commit-recovery-swimlane-en-root p { font-size:14px; line-height:1.8; }
      #d-06-ambiguous-commit-recovery-swimlane-en-root a { color:#0066d6; }
      #d-06-ambiguous-commit-recovery-swimlane-en-root .diagram-container { width:100%; overflow-x:auto; }
      #d-06-ambiguous-commit-recovery-swimlane-en-root details { border-top:1px solid #b9cce3; margin-top:24px; padding-top:16px; }
      #d-06-ambiguous-commit-recovery-swimlane-en-root summary { cursor:pointer; font-size:16px; font-weight:600; }
      #d-06-ambiguous-commit-recovery-swimlane-en-root nav, #d-06-ambiguous-commit-recovery-swimlane-en-root details { display:none; }
      #d-06-ambiguous-commit-recovery-swimlane-en-root .diagram-container { overflow-x:visible; }</style><marker id="d-06-ambiguous-commit-recovery-swimlane-en-06-ambiguous-commit-recovery-swimlane-en-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-06-ambiguous-commit-recovery-swimlane-en-06-ambiguous-commit-recovery-swimlane-en-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker><marker id="d-06-ambiguous-commit-recovery-swimlane-en-06-ambiguous-commit-recovery-swimlane-en-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="224" height="24" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">RECOVERY / AMBIGUOUS COMMIT</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">Teaching composition / query and takeover contracts required</text><rect x="96" y="116" width="64" height="4" rx="0" fill="#0078fc" stroke="none" stroke-width="1.2"/><path d="M96 240 L1200 240" fill="none" stroke="#d5e1ee" stroke-width="1"/><path d="M96 336 L1200 336" fill="none" stroke="#d5e1ee" stroke-width="1"/><path d="M96 440 L1200 440" fill="none" stroke="#d5e1ee" stroke-width="1"/><path d="M96 544 L1200 544" fill="none" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="196" font-size="12" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Original Worker</text><text x="96" y="292" font-size="12" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Durable records</text><text x="96" y="388" font-size="12" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">External service</text><text x="96" y="492" font-size="12" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Recovery consumer</text><text x="224" y="578" font-size="12" fill="#102743" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Branches: a proven non-commit still needs retry eligibility; unknown or missing results remain parked; compensation takes a separate Action path.</text><path d="M416 200 L440 200 Q448 200 448 208 L448 384 Q448 392 456 392 L480 392" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-06-ambiguous-commit-recovery-swimlane-en-06-ambiguous-commit-recovery-swimlane-en-arrow)"/><path d="M576 360 L576 328" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-06-ambiguous-commit-recovery-swimlane-en-06-ambiguous-commit-recovery-swimlane-en-arrow)"/><path d="M672 296 L696 296 Q704 296 704 304 L704 488 Q704 496 712 496 L736 496" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-06-ambiguous-commit-recovery-swimlane-en-06-ambiguous-commit-recovery-swimlane-en-arrow)"/><path d="M848 456 L848 424" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-06-ambiguous-commit-recovery-swimlane-en-06-ambiguous-commit-recovery-swimlane-en-arrow)"/><path d="M960 392 L976 392 Q984 392 984 384 L984 304 Q984 296 992 296 L1008 296" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-06-ambiguous-commit-recovery-swimlane-en-06-ambiguous-commit-recovery-swimlane-en-arrow)"/><path d="M1104 328 L1104 456" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-06-ambiguous-commit-recovery-swimlane-en-06-ambiguous-commit-recovery-swimlane-en-arrow)"/><g data-node="true"><rect x="224" y="168" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="236" y="192" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">1 Original write attempt</text><text x="236" y="212" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Claim and Attempt recorded</text></g><g data-node="true"><rect x="480" y="360" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="492" y="384" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">2 External effect commits</text><text x="492" y="404" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Response lost on return</text></g><g data-node="true"><rect x="480" y="264" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="492" y="288" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">3 Local state: unknown</text><text x="492" y="308" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Worker then stops</text></g><g data-node="true"><rect x="736" y="456" width="224" height="80" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><text x="748" y="480" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">4 Check takeover eligibility</text><text x="748" y="500" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">IDs / versions / history / owner</text><text x="748" y="518" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Trace the original business effect</text></g><g data-node="true"><rect x="736" y="360" width="224" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><text x="748" y="384" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">5 Retrieve committed result</text><text x="748" y="404" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Trusted external query: prerequisite</text></g><g data-node="true"><rect x="1008" y="264" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><text x="1020" y="288" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">6 Persist local records</text><text x="1020" y="308" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Consumer wiring required</text></g><g data-node="true"><rect x="1008" y="456" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="1020" y="480" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">7 Deliver known result</text><text x="1020" y="500" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Check result and eligibility</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Numbers show reading order, not measured time. Dashed boxes mark prerequisites; no single Recovery function is shown completing the whole path.</text><text x="96" y="660" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">This case persists unknown before the Worker stops. With only executing recorded, inspect the old Worker and dispatch evidence before any redispatch.</text></svg>
