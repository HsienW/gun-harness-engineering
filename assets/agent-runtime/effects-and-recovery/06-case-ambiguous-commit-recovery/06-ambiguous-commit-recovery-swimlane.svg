', 'Microsoft JhengHei', sans-serif">原 Worker</text><text x="96" y="292" font-size="12" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">持久紀錄</text><text x="96" y="388" font-size="12" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">外部服務</text><text x="96" y="492" font-size="12" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">恢復 consumer</text><text x="224" y="578" font-size="12" fill="#102743" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">分支：未提交仍需重試資格；unknown／缺少結果先停放；需要補償時另走獨立 Action。</text><path d="M416 200 L440 200 Q448 200 448 208 L448 384 Q448 392 456 392 L480 392" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-06-ambiguous-commit-recovery-swimlane-06-ambiguous-commit-recovery-swimlane-arrow)"/><path d="M576 360 L576 328" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-06-ambiguous-commit-recovery-swimlane-06-ambiguous-commit-recovery-swimlane-arrow)"/><path d="M672 296 L696 296 Q704 296 704 304 L704 488 Q704 496 712 496 L736 496" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-06-ambiguous-commit-recovery-swimlane-06-ambiguous-commit-recovery-swimlane-arrow)"/><path d="M848 456 L848 424" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-06-ambiguous-commit-recovery-swimlane-06-ambiguous-commit-recovery-swimlane-arrow)"/><path d="M960 392 L976 392 Q984 392 984 384 L984 304 Q984 296 992 296 L1008 296" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-06-ambiguous-commit-recovery-swimlane-06-ambiguous-commit-recovery-swimlane-arrow)"/><path d="M1104 328 L1104 456" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-06-ambiguous-commit-recovery-swimlane-06-ambiguous-commit-recovery-swimlane-arrow)"/><g data-node="true"><rect x="224" y="168" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="236" y="192" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">1 原嘗試送出寫入</text><text x="236" y="212" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">已取得 claim 與 Attempt</text></g><g data-node="true"><rect x="480" y="360" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="492" y="384" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">2 外部效果已提交</text><text x="492" y="404" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">回應在傳回時遺失</text></g><g data-node="true"><rect x="480" y="264" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="492" y="288" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">3 本地保留 unknown</text><text x="492" y="308" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Worker 隨後停止</text></g><g data-node="true"><rect x="736" y="456" width="224" height="80" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><text x="748" y="480" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">4 核對恢復與接手資格</text><text x="748" y="500" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">身分／版本／歷史與 owner</text><text x="748" y="518" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">沿原業務效果追查</text></g><g data-node="true"><rect x="736" y="360" width="224" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><text x="748" y="384" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">5 查回 committed 結果</text><text x="748" y="404" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">可信外部查詢器：額外前提</text></g><g data-node="true"><rect x="1008" y="264" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><text x="1020" y="288" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">6 補記必要本地狀態</text><text x="1020" y="308" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">接手 consumer：需補接</text></g><g data-node="true"><rect x="1008" y="456" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="1020" y="480" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">7 交付已確認結果</text><text x="1020" y="500" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">核對可用性與續行資格</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">數字是閱讀順序，非實測時間。虛線框標示額外前提；圖未表示單一 Recovery 函式已串起所有步驟。</text><text x="96" y="660" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">選取停止前已留下 unknown 的案例；若只留下 executing，須另查原 Worker 與派送證據，不能直接重做。</text></svg>
