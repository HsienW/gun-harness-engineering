<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="01-recovery-evidence-map-en-title 01-recovery-evidence-map-en-desc" lang="en" id="d-01-recovery-evidence-map-en-root"><title id="01-recovery-evidence-map-en-title">Recovery combines execution state, waiting contracts and effect evidence</title><desc id="01-recovery-evidence-map-en-desc">Checkpoint, manifests, local execution records, result references and external evidence support different recovery judgments. Cross-check their identity and scope before selecting a continuation.</desc><defs>
      <style>#d-01-recovery-evidence-map-en-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-01-recovery-evidence-map-en-root nav, #d-01-recovery-evidence-map-en-root p { font-size:14px; line-height:1.8; }
      #d-01-recovery-evidence-map-en-root a { color:#0066d6; }
      #d-01-recovery-evidence-map-en-root .diagram-container { width:100%; overflow-x:auto; }
      #d-01-recovery-evidence-map-en-root details { border-top:1px solid #b9cce3; margin-top:24px; padding-top:16px; }
      #d-01-recovery-evidence-map-en-root summary { cursor:pointer; font-size:16px; font-weight:600; }
      #d-01-recovery-evidence-map-en-root nav, #d-01-recovery-evidence-map-en-root details { display:none; }
      #d-01-recovery-evidence-map-en-root .diagram-container { overflow-x:visible; }</style><marker id="d-01-recovery-evidence-map-en-01-recovery-evidence-map-en-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-01-recovery-evidence-map-en-01-recovery-evidence-map-en-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker><marker id="d-01-recovery-evidence-map-en-01-recovery-evidence-map-en-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="196" height="24" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">RECOVERY / EVIDENCE MAP</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">Responsibility map / no shared transaction implied</text><rect x="96" y="116" width="64" height="4" rx="0" fill="#0078fc" stroke="none" stroke-width="1.2"/><path d="M368 216 L408 216 Q416 216 416 224 L416 320 Q416 328 424 328 L480 328" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-01-recovery-evidence-map-en-01-recovery-evidence-map-en-arrow)"/><path d="M368 352 L480 352" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-01-recovery-evidence-map-en-01-recovery-evidence-map-en-arrow)"/><path d="M368 488 L440 488 Q448 488 448 480 L448 384 Q448 376 456 376 L480 376" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-01-recovery-evidence-map-en-01-recovery-evidence-map-en-arrow)"/><path d="M864 216 L824 216 Q816 216 816 224 L816 320 Q816 328 808 328 L752 328" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-01-recovery-evidence-map-en-01-recovery-evidence-map-en-arrow)"/><path d="M864 488 L792 488 Q784 488 784 480 L784 384 Q784 376 776 376 L752 376" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-01-recovery-evidence-map-en-01-recovery-evidence-map-en-arrow)"/><path d="M616 400 L616 488" fill="none" stroke="#0066d6" stroke-width="1.2" marker-end="url(#d-01-recovery-evidence-map-en-01-recovery-evidence-map-en-arrow-accent)"/><g data-node="true"><rect x="96" y="176" width="272" height="80" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="108" y="200" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Graph Checkpoint</text><text x="108" y="220" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Messages and pending nodes</text><text x="108" y="238" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Persistence depends on deployment</text></g><g data-node="true"><rect x="96" y="304" width="272" height="96" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="108" y="328" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Recovery Manifests</text><text x="108" y="348" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Waiting IDs, response and expiry</text><text x="108" y="366" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Graph configuration and versions</text><text x="108" y="384" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Compatibility needs verification</text></g><g data-node="true"><rect x="96" y="448" width="272" height="96" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="108" y="472" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Task / Step / Ledger</text><text x="108" y="492" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Local execution and effect state</text><text x="108" y="510" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Attempt and commit records</text><text x="108" y="528" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Local state may lag external work</text></g><g data-node="true"><rect x="864" y="176" width="272" height="80" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="876" y="200" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Result Reference</text><text x="876" y="220" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Retrieve an existing result</text><text x="876" y="238" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Check scope, version and policy</text></g><g data-node="true"><rect x="864" y="448" width="272" height="80" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="876" y="472" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">External effect evidence</text><text x="876" y="492" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Commit / non-commit / unknown</text><text x="876" y="510" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Use trusted operation correlations</text></g><g data-node="true"><rect x="480" y="304" width="272" height="96" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><text x="492" y="328" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Cross-check recovery evidence</text><text x="492" y="348" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Match IDs and trusted scope</text><text x="492" y="366" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Sanitize history; compare versions</text><text x="492" y="384" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Keep unresolved contradictions</text></g><g data-node="true"><rect x="480" y="488" width="272" height="80" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="492" y="512" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Select a continuation</text><text x="492" y="532" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Stop, wait, reconcile or continue</text><text x="492" y="550" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Consumer must execute the decision</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Arrows show evidence used for judgment, not a single read transaction or a promise that every entry point loads all five sources.</text><text x="96" y="660" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Graph position and transcript cleanup do not prove external commit status. Missing or incompatible evidence can require manual handling.</text></svg>
