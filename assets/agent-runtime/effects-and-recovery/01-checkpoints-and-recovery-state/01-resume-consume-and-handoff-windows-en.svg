<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="01-resume-consume-and-handoff-windows-en-title 01-resume-consume-and-handoff-windows-en-desc" lang="en" id="d-01-resume-consume-and-handoff-windows-en-root"><title id="01-resume-consume-and-handoff-windows-en-title">Consuming a response and handing control to the Graph are separate steps</title><desc id="01-resume-consume-and-handoff-windows-en-desc">The waiting-user path consumes the response, updates sanitized history, then invokes the Graph with a resume Command. A process can stop between these calls; a consumed response is not proof of Graph takeover.</desc><defs>
      <style>#d-01-resume-consume-and-handoff-windows-en-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-01-resume-consume-and-handoff-windows-en-root nav, #d-01-resume-consume-and-handoff-windows-en-root p { font-size:14px; line-height:1.8; }
      #d-01-resume-consume-and-handoff-windows-en-root a { color:#0066d6; }
      #d-01-resume-consume-and-handoff-windows-en-root .diagram-container { width:100%; overflow-x:auto; }
      #d-01-resume-consume-and-handoff-windows-en-root details { border-top:1px solid #b9cce3; margin-top:24px; padding-top:16px; }
      #d-01-resume-consume-and-handoff-windows-en-root summary { cursor:pointer; font-size:16px; font-weight:600; }
      #d-01-resume-consume-and-handoff-windows-en-root nav, #d-01-resume-consume-and-handoff-windows-en-root details { display:none; }
      #d-01-resume-consume-and-handoff-windows-en-root .diagram-container { overflow-x:visible; }</style><marker id="d-01-resume-consume-and-handoff-windows-en-01-resume-consume-and-handoff-windows-en-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-01-resume-consume-and-handoff-windows-en-01-resume-consume-and-handoff-windows-en-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker><marker id="d-01-resume-consume-and-handoff-windows-en-01-resume-consume-and-handoff-windows-en-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="232" height="24" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">RESUME / CONSUME AND HANDOFF</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">Selected waiting-user path / separate persistence calls</text><rect x="96" y="116" width="64" height="4" rx="0" fill="#0078fc" stroke="none" stroke-width="1.2"/><path d="M368 224 L480 224" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-01-resume-consume-and-handoff-windows-en-01-resume-consume-and-handoff-windows-en-arrow)"/><rect x="402.0" y="194" width="44" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="424" y="208" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">THEN</text><path d="M752 224 L864 224" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-01-resume-consume-and-handoff-windows-en-01-resume-consume-and-handoff-windows-en-arrow)"/><rect x="786.0" y="194" width="44" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="808" y="208" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">THEN</text><path d="M232 264 L232 400" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-01-resume-consume-and-handoff-windows-en-01-resume-consume-and-handoff-windows-en-arrow)"/><rect x="258.0" y="322" width="60" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="288" y="336" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">STOP A</text><path d="M616 264 L616 400" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-01-resume-consume-and-handoff-windows-en-01-resume-consume-and-handoff-windows-en-arrow)"/><rect x="642.0" y="322" width="60" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="672" y="336" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">STOP B</text><path d="M1000 264 L1000 400" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-01-resume-consume-and-handoff-windows-en-01-resume-consume-and-handoff-windows-en-arrow)"/><g data-node="true"><rect x="96" y="184" width="272" height="80" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="108" y="208" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">1 Consume waiting response</text><text x="108" y="228" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">After identity and Schema checks</text><text x="108" y="246" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Confirmation uses its authorizer</text></g><g data-node="true"><rect x="480" y="184" width="272" height="80" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="492" y="208" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">2 Update Graph history</text><text x="492" y="228" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">updateState(config, messages)</text><text x="492" y="246" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Uses sanitized history</text></g><g data-node="true"><rect x="864" y="184" width="272" height="80" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="876" y="208" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">3 Invoke with resume Command</text><text x="876" y="228" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">graph.invoke(Command, config)</text><text x="876" y="246" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Invocation is a separate call</text></g><g data-node="true"><rect x="96" y="400" width="272" height="128" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><text x="108" y="424" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Window A: no handoff</text><text x="108" y="444" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Waiting record may be consumed</text><text x="108" y="462" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">History update has not completed</text><text x="108" y="480" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Duplicate consume may be refused</text><text x="108" y="498" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Takeover needs explicit evidence</text></g><g data-node="true"><rect x="480" y="400" width="272" height="128" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="492" y="424" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Window B: history updated</text><text x="492" y="444" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Invoke has not been confirmed</text><text x="492" y="462" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Consumed is not execution success</text><text x="492" y="480" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Inspect Checkpoint and handoff</text><text x="492" y="498" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Do not invent an automatic retry</text></g><g data-node="true"><rect x="864" y="400" width="272" height="128" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="876" y="424" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Verify execution and effects</text><text x="876" y="444" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Observe the Graph continuation</text><text x="876" y="462" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Read authoritative Run state</text><text x="876" y="480" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Keep external effects unresolved</text><text x="876" y="498" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Resume is not a Terminal decision</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">STOP A and STOP B are separate fault scenarios, not steps that must both fail in one execution. No shared transaction is established here.</text><text x="96" y="660" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">The Checkpointer determines persistence across restart. The adapter alone does not supply durable takeover or safe replay of external work.</text></svg>
