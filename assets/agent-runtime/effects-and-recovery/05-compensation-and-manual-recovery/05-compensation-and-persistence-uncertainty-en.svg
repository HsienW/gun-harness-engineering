<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="05-compensation-and-persistence-uncertainty-en-title 05-compensation-and-persistence-uncertainty-en-desc" lang="en" id="d-05-compensation-and-persistence-uncertainty-en-root"><title id="05-compensation-and-persistence-uncertainty-en-title">A compensation action can succeed before its persistence fails</title><desc id="05-compensation-and-persistence-uncertainty-en-desc">This branch assumes the original effect is committed, the Action is reversible and a Ledger reference exists. If saving compensated fails after the action runs, preserve uncertainty rather than rerunning the Action directly.</desc><defs>
      <style>#d-05-compensation-and-persistence-uncertainty-en-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-05-compensation-and-persistence-uncertainty-en-root nav, #d-05-compensation-and-persistence-uncertainty-en-root p { font-size:14px; line-height:1.8; }
      #d-05-compensation-and-persistence-uncertainty-en-root a { color:#0066d6; }
      #d-05-compensation-and-persistence-uncertainty-en-root .diagram-container { width:100%; overflow-x:auto; }
      #d-05-compensation-and-persistence-uncertainty-en-root details { border-top:1px solid #b9cce3; margin-top:24px; padding-top:16px; }
      #d-05-compensation-and-persistence-uncertainty-en-root summary { cursor:pointer; font-size:16px; font-weight:600; }
      #d-05-compensation-and-persistence-uncertainty-en-root nav, #d-05-compensation-and-persistence-uncertainty-en-root details { display:none; }
      #d-05-compensation-and-persistence-uncertainty-en-root .diagram-container { overflow-x:visible; }</style><marker id="d-05-compensation-and-persistence-uncertainty-en-05-compensation-and-persistence-uncertainty-en-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-05-compensation-and-persistence-uncertainty-en-05-compensation-and-persistence-uncertainty-en-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker><marker id="d-05-compensation-and-persistence-uncertainty-en-05-compensation-and-persistence-uncertainty-en-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="308" height="24" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">COMPENSATION / NEW EFFECT AND EVIDENCE</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">Selected compensation branch / no transaction rollback</text><rect x="96" y="116" width="64" height="4" rx="0" fill="#0078fc" stroke="none" stroke-width="1.2"/><path d="M192 216 L192 600" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><path d="M496 216 L496 600" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><path d="M800 216 L800 600" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><path d="M1104 216 L1104 600" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><text x="96" y="560" font-size="12" fill="#102743" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Separate branch: irreversible means skip and seek manual help</text><text x="96" y="580" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Keep Action failure and Ledger persistence failure distinct</text><path d="M192 248 L496 248" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-05-compensation-and-persistence-uncertainty-en-05-compensation-and-persistence-uncertainty-en-arrow)"/><rect x="294.0" y="218" width="100" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="344" y="232" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">COMMITTED REF</text><path d="M496 312 L800 312" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-05-compensation-and-persistence-uncertainty-en-05-compensation-and-persistence-uncertainty-en-arrow)"/><rect x="578.0" y="282" width="140" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="648" y="296" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">PREPARE / EXECUTING</text><path d="M496 384 L1104 384" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-05-compensation-and-persistence-uncertainty-en-05-compensation-and-persistence-uncertainty-en-arrow)"/><rect x="746.0" y="354" width="108" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="800" y="368" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">EXECUTE ACTION</text><path d="M1104 448 L496 448" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-05-compensation-and-persistence-uncertainty-en-05-compensation-and-persistence-uncertainty-en-arrow)"/><rect x="740.0" y="418" width="120" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="800" y="432" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">ACTION SUCCEEDED</text><path d="M496 512 L800 512" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-05-compensation-and-persistence-uncertainty-en-05-compensation-and-persistence-uncertainty-en-arrow)"/><rect x="588.0" y="482" width="120" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="648" y="496" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">SAVE COMPENSATED</text><g data-node="true"><rect x="96" y="152" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="108" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Original effect</text><text x="108" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Committed execution ref</text></g><g data-node="true"><rect x="400" y="152" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="412" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Saga Orchestrator</text><text x="412" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Registered Action selected</text></g><g data-node="true"><rect x="704" y="152" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="716" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Compensation Ledger</text><text x="716" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">New Compensation ID</text></g><g data-node="true"><rect x="1008" y="152" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="1020" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Compensation Action</text><text x="1020" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Its own external operation</text></g><g data-node="true"><rect x="704" y="536" width="480" height="64" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><text x="716" y="560" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Compensation may be complete; persistence is uncertain</text><text x="716" y="580" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">COMPENSATION_PERSISTENCE_UNCERTAIN</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">This path has an original committed reference, required compensation records and a reversible Action. Missing references and irreversible actions are separate branches.</text><text x="96" y="660" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">A new compensation ID records an execution; it does not deduplicate the action. Show original Task failure and individual compensation outcomes separately.</text></svg>
