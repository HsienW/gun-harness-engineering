<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="02-replay-attempt-and-effect-identity-en-title 02-replay-attempt-and-effect-identity-en-desc" lang="en" id="d-02-replay-attempt-and-effect-identity-en-root"><title id="02-replay-attempt-and-effect-identity-en-title">Request deduplication, replay and business effects use different identities</title><desc id="02-replay-attempt-and-effect-identity-en-desc">A Replay Key identifies a logical call within a Run. Tool Execution records can have physical Attempts. A new Run changes replay identity while a stable scoped business key can still refer to an existing effect.</desc><defs>
      <style>#d-02-replay-attempt-and-effect-identity-en-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-02-replay-attempt-and-effect-identity-en-root nav, #d-02-replay-attempt-and-effect-identity-en-root p { font-size:14px; line-height:1.8; }
      #d-02-replay-attempt-and-effect-identity-en-root a { color:#0066d6; }
      #d-02-replay-attempt-and-effect-identity-en-root .diagram-container { width:100%; overflow-x:auto; }
      #d-02-replay-attempt-and-effect-identity-en-root details { border-top:1px solid #b9cce3; margin-top:24px; padding-top:16px; }
      #d-02-replay-attempt-and-effect-identity-en-root summary { cursor:pointer; font-size:16px; font-weight:600; }
      #d-02-replay-attempt-and-effect-identity-en-root nav, #d-02-replay-attempt-and-effect-identity-en-root details { display:none; }
      #d-02-replay-attempt-and-effect-identity-en-root .diagram-container { overflow-x:visible; }</style><marker id="d-02-replay-attempt-and-effect-identity-en-02-replay-attempt-and-effect-identity-en-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-02-replay-attempt-and-effect-identity-en-02-replay-attempt-and-effect-identity-en-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker><marker id="d-02-replay-attempt-and-effect-identity-en-02-replay-attempt-and-effect-identity-en-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="300" height="24" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">IDENTITY / REPLAY AND BUSINESS EFFECT</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">Conceptual identity links / not physical schema cardinalities</text><rect x="96" y="116" width="64" height="4" rx="0" fill="#0078fc" stroke="none" stroke-width="1.2"/><text x="96" y="280" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Request deduplication has its own entry-point contract.</text><path d="M704 208 L800 208" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-replay-attempt-and-effect-identity-en-02-replay-attempt-and-effect-identity-en-arrow)"/><rect x="722.0" y="178" width="60" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="752" y="192" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">DERIVE</text><path d="M992 264 L992 296 Q992 304 984 304 L584 304 Q576 304 576 312 L576 344" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-replay-attempt-and-effect-identity-en-02-replay-attempt-and-effect-identity-en-arrow)"/><rect x="720.0" y="274" width="128" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="784" y="288" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">LOOK UP EXECUTION</text><path d="M448 384 L408 384 Q400 384 400 392 L400 520 Q400 528 392 528 L352 528" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-replay-attempt-and-effect-identity-en-02-replay-attempt-and-effect-identity-en-arrow)"/><path d="M704 384 L792 384 Q800 384 800 392 L800 520 Q800 528 808 528 L864 528" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-replay-attempt-and-effect-identity-en-02-replay-attempt-and-effect-identity-en-arrow)"/><path d="M1024 424 L1024 488" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-02-replay-attempt-and-effect-identity-en-02-replay-attempt-and-effect-identity-en-arrow)"/><rect x="1032.0" y="450" width="128" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="1096" y="464" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">SAME BUSINESS KEY</text><g data-node="true"><rect x="96" y="168" width="256" height="80" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="108" y="192" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Request dedup identity</text><text x="108" y="212" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Tenant / principal / route / key</text><text x="108" y="230" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Separate from tool replay</text></g><g data-node="true"><rect x="448" y="168" width="256" height="80" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="460" y="192" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Run and logical proposal</text><text x="460" y="212" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Run / Step / logical call ID</text><text x="460" y="230" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Call index / tool / version</text></g><g data-node="true"><rect x="800" y="168" width="384" height="96" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="812" y="192" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Replay Key</text><text x="812" y="212" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Derived from the six identity components</text><text x="812" y="230" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Existing replay checks requestHash</text><text x="812" y="248" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Different hash: conflict, not a new attempt</text></g><g data-node="true"><rect x="448" y="344" width="256" height="80" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><text x="460" y="368" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Tool Execution</text><text x="460" y="388" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Durable execution ID</text><text x="460" y="406" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Links replay, request and result</text></g><g data-node="true"><rect x="96" y="488" width="256" height="80" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="108" y="512" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Physical Attempt</text><text x="108" y="532" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">New Attempt ID and number</text><text x="108" y="550" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Attempts may share an effect</text></g><g data-node="true"><rect x="864" y="488" width="320" height="96" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="876" y="512" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Business Effect</text><text x="876" y="532" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Tenant + scope + business key</text><text x="876" y="550" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">External operation evidence is separate</text><text x="876" y="568" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">A local key does not bind a remote API</text></g><g data-node="true"><rect x="864" y="344" width="320" height="80" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="876" y="368" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Another Run / proposal</text><text x="876" y="388" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">New Run changes replay identity</text><text x="876" y="406" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Same business intent may reuse the effect</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Links describe identity derivation and correlation; they do not imply database foreign keys, fixed one-to-one cardinality or automatic dispatch.</text><text x="96" y="660" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Business keys come from the descriptor and trusted scope. Reusing a committed result still requires scope, version, policy and payload checks.</text></svg>
