<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="03-external-commit-and-local-persistence-en-title 03-external-commit-and-local-persistence-en-desc" lang="en" id="d-03-external-commit-and-local-persistence-en-root"><title id="03-external-commit-and-local-persistence-en-title">External commit and local persistence have separate failure windows</title><desc id="03-external-commit-and-local-persistence-en-desc">After external success, result references, the Ledger and the Task Step are saved in sequence. Only the two Ledger records commit in the same local transaction shown here.</desc><defs>
      <style>#d-03-external-commit-and-local-persistence-en-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-03-external-commit-and-local-persistence-en-root nav, #d-03-external-commit-and-local-persistence-en-root p { font-size:14px; line-height:1.8; }
      #d-03-external-commit-and-local-persistence-en-root a { color:#0066d6; }
      #d-03-external-commit-and-local-persistence-en-root .diagram-container { width:100%; overflow-x:auto; }
      #d-03-external-commit-and-local-persistence-en-root details { border-top:1px solid #b9cce3; margin-top:24px; padding-top:16px; }
      #d-03-external-commit-and-local-persistence-en-root summary { cursor:pointer; font-size:16px; font-weight:600; }
      #d-03-external-commit-and-local-persistence-en-root nav, #d-03-external-commit-and-local-persistence-en-root details { display:none; }
      #d-03-external-commit-and-local-persistence-en-root .diagram-container { overflow-x:visible; }</style><marker id="d-03-external-commit-and-local-persistence-en-03-external-commit-and-local-persistence-en-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-03-external-commit-and-local-persistence-en-03-external-commit-and-local-persistence-en-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker><marker id="d-03-external-commit-and-local-persistence-en-03-external-commit-and-local-persistence-en-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="232" height="24" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">COMMIT / PERSISTENCE WINDOWS</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">Teaching path / check each persistence layer</text><rect x="96" y="116" width="64" height="4" rx="0" fill="#0078fc" stroke="none" stroke-width="1.2"/><path d="M96 240 L1184 240" fill="none" stroke="#d5e1ee" stroke-width="1"/><path d="M96 336 L1184 336" fill="none" stroke="#d5e1ee" stroke-width="1"/><path d="M96 448 L1184 448" fill="none" stroke="#d5e1ee" stroke-width="1"/><path d="M96 544 L1184 544" fill="none" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="190" font-size="12" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">External service</text><text x="96" y="286" font-size="12" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Result reference</text><text x="96" y="390" font-size="12" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Effect Ledger</text><text x="96" y="502" font-size="12" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Task Step</text><rect x="720" y="352" width="256" height="88" rx="8" fill="#eef4fb" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><text x="728" y="346" font-size="11" fill="#102743" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Local transaction: two Ledger records only</text><text x="480" y="220" font-size="12" fill="#102743" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">A Earlier: committed, response may be lost</text><text x="736" y="280" font-size="12" fill="#102743" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">B Ref saved; Ledger may be uncommitted</text><text x="736" y="488" font-size="12" fill="#102743" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">C Ledger committed; Step save may fail</text><text x="224" y="578" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">A / B / C are separate fault scenarios. Recovery rereads each layer and preserves mixed states and external effects.</text><path d="M416 200 L440 200 Q448 200 448 208 L448 288 Q448 296 456 296 L480 296" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-03-external-commit-and-local-persistence-en-03-external-commit-and-local-persistence-en-arrow)"/><path d="M672 296 L696 296 Q704 296 704 304 L704 392 Q704 400 712 400 L736 400" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-03-external-commit-and-local-persistence-en-03-external-commit-and-local-persistence-en-arrow)"/><path d="M960 400 L976 400 Q984 400 984 408 L984 496 Q984 504 992 504 L1008 504" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-03-external-commit-and-local-persistence-en-03-external-commit-and-local-persistence-en-arrow)"/><g data-node="true"><rect x="224" y="168" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="236" y="192" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">1 Effect committed</text><text x="236" y="212" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Tool receives the result</text></g><g data-node="true"><rect x="480" y="264" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="492" y="288" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">2 Save Result Ref</text><text x="492" y="308" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Payload and execution links</text></g><g data-node="true"><rect x="736" y="360" width="224" height="72" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><text x="748" y="384" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">3 Commit Ledger</text><text x="748" y="404" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Tool Execution</text><text x="748" y="422" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">+ Business Effect</text></g><g data-node="true"><rect x="1008" y="472" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="1020" y="496" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">4 Save Task Step</text><text x="1020" y="516" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Then deliver the envelope</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">The main path has external success and an available result. A precedes step 2; a lost response requires reconciliation before normal continuation.</text><text x="96" y="660" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Result Reference, external I/O and Task Step are outside the boxed transaction. Invalid output does not erase an existing commit.</text></svg>
