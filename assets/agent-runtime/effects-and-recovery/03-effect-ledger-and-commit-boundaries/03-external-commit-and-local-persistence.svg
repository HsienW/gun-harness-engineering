<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="03-external-commit-and-local-persistence-title 03-external-commit-and-local-persistence-desc" lang="zh-TW" id="d-03-external-commit-and-local-persistence-root"><title id="03-external-commit-and-local-persistence-title">外部提交與各層保存有不同故障窗口</title><desc id="03-external-commit-and-local-persistence-desc">外部成功後依序保存結果參照、Ledger 與 Task Step；只有兩份 Ledger 紀錄在圖示的同一本地 transaction 中提交。</desc><defs>
      <style>#d-03-external-commit-and-local-persistence-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-03-external-commit-and-local-persistence-root nav, #d-03-external-commit-and-local-persistence-root p { font-size:14px; line-height:1.8; }
      #d-03-external-commit-and-local-persistence-root a { color:#0066d6; }
      #d-03-external-commit-and-local-persistence-root .diagram-container { width:100%; overflow-x:auto; }
      #d-03-external-commit-and-local-persistence-root details { border-top:1px solid #b9cce3; margin-top:24px; padding-top:16px; }
      #d-03-external-commit-and-local-persistence-root summary { cursor:pointer; font-size:16px; font-weight:600; }
      #d-03-external-commit-and-local-persistence-root nav, #d-03-external-commit-and-local-persistence-root details { display:none; }
      #d-03-external-commit-and-local-persistence-root .diagram-container { overflow-x:visible; }</style><marker id="d-03-external-commit-and-local-persistence-03-external-commit-and-local-persistence-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-03-external-commit-and-local-persistence-03-external-commit-and-local-persistence-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker><marker id="d-03-external-commit-and-local-persistence-03-external-commit-and-local-persistence-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="232" height="24" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">COMMIT / PERSISTENCE WINDOWS</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">教學主線 · 各保存層分開核對</text><rect x="96" y="116" width="64" height="4" rx="0" fill="#0078fc" stroke="none" stroke-width="1.2"/><path d="M96 240 L1184 240" fill="none" stroke="#d5e1ee" stroke-width="1"/><path d="M96 336 L1184 336" fill="none" stroke="#d5e1ee" stroke-width="1"/><path d="M96 448 L1184 448" fill="none" stroke="#d5e1ee" stroke-width="1"/><path d="M96 544 L1184 544" fill="none" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="190" font-size="12" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">外部服務</text><text x="96" y="286" font-size="12" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">結果參照</text><text x="96" y="390" font-size="12" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">效果 Ledger</text><text x="96" y="502" font-size="12" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Task Step</text><rect x="720" y="352" width="256" height="88" rx="8" fill="#eef4fb" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><text x="728" y="346" font-size="11" fill="#102743" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">本地 transaction：僅含兩份 Ledger 紀錄</text><text x="480" y="220" font-size="12" fill="#102743" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">A 先前窗口：外部已提交，回應可能遺失</text><text x="736" y="280" font-size="12" fill="#102743" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">B 參照已存，Ledger 可能未提交</text><text x="736" y="488" font-size="12" fill="#102743" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">C Ledger 已提交，Step 仍可能保存失敗</text><text x="224" y="578" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">A／B／C 是分開演練的故障窗口；恢復時重新讀取各層，保留混合狀態與外部效果。</text><path d="M416 200 L440 200 Q448 200 448 208 L448 288 Q448 296 456 296 L480 296" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-03-external-commit-and-local-persistence-03-external-commit-and-local-persistence-arrow)"/><path d="M672 296 L696 296 Q704 296 704 304 L704 392 Q704 400 712 400 L736 400" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-03-external-commit-and-local-persistence-03-external-commit-and-local-persistence-arrow)"/><path d="M960 400 L976 400 Q984 400 984 408 L984 496 Q984 504 992 504 L1008 504" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-03-external-commit-and-local-persistence-03-external-commit-and-local-persistence-arrow)"/><g data-node="true"><rect x="224" y="168" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="236" y="192" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">1 外部效果已提交</text><text x="236" y="212" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">工具取得成功結果</text></g><g data-node="true"><rect x="480" y="264" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="492" y="288" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">2 保存 Result Ref</text><text x="492" y="308" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">payload 與執行關聯</text></g><g data-node="true"><rect x="736" y="360" width="224" height="72" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><text x="748" y="384" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">3 提交 Ledger</text><text x="748" y="404" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Tool Execution</text><text x="748" y="422" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">＋ Business Effect</text></g><g data-node="true"><rect x="1008" y="472" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="1020" y="496" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">4 保存 Task Step</text><text x="1020" y="516" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">再交付結果封套</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">圖選取外部成功且能取得結果的主線；A 發生在進入第 2 步之前，不表示遺失回應後仍自然續行。</text><text x="96" y="660" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Result Reference、外部 I/O 與 Task Step 不在框內 transaction；輸出格式失敗也不會抹除既有提交。</text></svg>
