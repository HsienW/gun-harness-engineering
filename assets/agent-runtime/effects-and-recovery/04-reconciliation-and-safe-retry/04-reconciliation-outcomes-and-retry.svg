<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="04-reconciliation-outcomes-and-retry-title 04-reconciliation-outcomes-and-retry-desc" lang="zh-TW" id="d-04-reconciliation-outcomes-and-retry-root"><title id="04-reconciliation-outcomes-and-retry-title">回查結果、結果可用性與重試資格分開核對</title><desc id="04-reconciliation-outcomes-and-retry-desc">Reconciler 提供 committed、not_committed 或 unknown。已提交仍需可用結果；未提交仍需重試與轉移條件；未知保留停放與人工處理。</desc><defs>
      <style>#d-04-reconciliation-outcomes-and-retry-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-04-reconciliation-outcomes-and-retry-root nav, #d-04-reconciliation-outcomes-and-retry-root p { font-size:14px; line-height:1.8; }
      #d-04-reconciliation-outcomes-and-retry-root a { color:#0066d6; }
      #d-04-reconciliation-outcomes-and-retry-root .diagram-container { width:100%; overflow-x:auto; }
      #d-04-reconciliation-outcomes-and-retry-root details { border-top:1px solid #b9cce3; margin-top:24px; padding-top:16px; }
      #d-04-reconciliation-outcomes-and-retry-root summary { cursor:pointer; font-size:16px; font-weight:600; }
      #d-04-reconciliation-outcomes-and-retry-root nav, #d-04-reconciliation-outcomes-and-retry-root details { display:none; }
      #d-04-reconciliation-outcomes-and-retry-root .diagram-container { overflow-x:visible; }</style><marker id="d-04-reconciliation-outcomes-and-retry-04-reconciliation-outcomes-and-retry-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-04-reconciliation-outcomes-and-retry-04-reconciliation-outcomes-and-retry-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker><marker id="d-04-reconciliation-outcomes-and-retry-04-reconciliation-outcomes-and-retry-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="256" height="24" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">RECONCILE / EVIDENCE AND ACTION</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">Runner 分支示意 · 非通用恢復 API</text><rect x="96" y="116" width="64" height="4" rx="0" fill="#0078fc" stroke="none" stroke-width="1.2"/><path d="M496 216 L496 232 Q496 240 488 240 L240 240 Q232 240 232 248 L232 280" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-04-reconciliation-outcomes-and-retry-04-reconciliation-outcomes-and-retry-arrow)"/><path d="M616 216 L616 280" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-04-reconciliation-outcomes-and-retry-04-reconciliation-outcomes-and-retry-arrow)"/><path d="M736 216 L736 232 Q736 240 744 240 L992 240 Q1000 240 1000 248 L1000 280" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-04-reconciliation-outcomes-and-retry-04-reconciliation-outcomes-and-retry-arrow)"/><path d="M232 344 L232 432" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-04-reconciliation-outcomes-and-retry-04-reconciliation-outcomes-and-retry-arrow)"/><path d="M616 344 L616 432" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-04-reconciliation-outcomes-and-retry-04-reconciliation-outcomes-and-retry-arrow)"/><path d="M1000 344 L1000 432" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-04-reconciliation-outcomes-and-retry-04-reconciliation-outcomes-and-retry-arrow)"/><g data-node="true"><rect x="456" y="152" width="320" height="64" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><text x="468" y="176" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">取得可信回查結果</text><text x="468" y="196" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">對應原工具執行與業務效果</text></g><g data-node="true"><rect x="96" y="280" width="272" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="108" y="304" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">committed</text><text x="108" y="324" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">外部效果已成立</text></g><g data-node="true"><rect x="480" y="280" width="272" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="492" y="304" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">not_committed</text><text x="492" y="324" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">有足夠證據支持未提交</text></g><g data-node="true"><rect x="864" y="280" width="272" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="876" y="304" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">unknown</text><text x="876" y="324" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">證據不足或仍無法判讀</text></g><g data-node="true"><rect x="96" y="432" width="272" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="108" y="456" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">補記並重用既有結果</text><text x="108" y="476" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">有結果：驗證並保存參照</text><text x="108" y="494" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">缺結果：保留已提交事實</text><text x="108" y="512" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">不重做已提交操作</text></g><g data-node="true"><rect x="480" y="432" width="272" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="492" y="456" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">條件成立才進下一次 Attempt</text><text x="492" y="476" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Budget／取消與狀態轉移</text><text x="492" y="494" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">派送仍遵守授權及執行條件</text><text x="492" y="512" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">不成立：延後或交由人工</text></g><g data-node="true"><rect x="864" y="432" width="272" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="876" y="456" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">延後或人工介入</text><text x="876" y="476" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">保留原身分與證據缺口</text><text x="876" y="494" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">等待更強的回查依據</text><text x="876" y="512" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">不自動重新派送</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">not_committed ＋ canRetry 才由 helper 選 retry；Runner 還要成功轉移本地狀態，重新派送仍有其他條件。</text><text x="96" y="660" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">缺少 Reconciler 另走人工處理；回查拋錯由呼叫邊界處理，不保證都已轉成圖中的三態。</text></svg>
