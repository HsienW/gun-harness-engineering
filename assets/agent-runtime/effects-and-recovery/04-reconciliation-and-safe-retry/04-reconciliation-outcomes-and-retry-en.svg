<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="04-reconciliation-outcomes-and-retry-en-title 04-reconciliation-outcomes-and-retry-en-desc" lang="en" id="d-04-reconciliation-outcomes-and-retry-en-root"><title id="04-reconciliation-outcomes-and-retry-en-title">Check reconciliation evidence, result availability and retry eligibility separately</title><desc id="04-reconciliation-outcomes-and-retry-en-desc">The Reconciler returns committed, not_committed or unknown. A committed effect still needs a usable result; a non-commit still needs retry and transition conditions. Unknown effects remain parked or require manual handling.</desc><defs>
      <style>#d-04-reconciliation-outcomes-and-retry-en-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-04-reconciliation-outcomes-and-retry-en-root nav, #d-04-reconciliation-outcomes-and-retry-en-root p { font-size:14px; line-height:1.8; }
      #d-04-reconciliation-outcomes-and-retry-en-root a { color:#0066d6; }
      #d-04-reconciliation-outcomes-and-retry-en-root .diagram-container { width:100%; overflow-x:auto; }
      #d-04-reconciliation-outcomes-and-retry-en-root details { border-top:1px solid #b9cce3; margin-top:24px; padding-top:16px; }
      #d-04-reconciliation-outcomes-and-retry-en-root summary { cursor:pointer; font-size:16px; font-weight:600; }
      #d-04-reconciliation-outcomes-and-retry-en-root nav, #d-04-reconciliation-outcomes-and-retry-en-root details { display:none; }
      #d-04-reconciliation-outcomes-and-retry-en-root .diagram-container { overflow-x:visible; }</style><marker id="d-04-reconciliation-outcomes-and-retry-en-04-reconciliation-outcomes-and-retry-en-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-04-reconciliation-outcomes-and-retry-en-04-reconciliation-outcomes-and-retry-en-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker><marker id="d-04-reconciliation-outcomes-and-retry-en-04-reconciliation-outcomes-and-retry-en-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="256" height="24" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">RECONCILE / EVIDENCE AND ACTION</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">Runner branches / not a general recovery API</text><rect x="96" y="116" width="64" height="4" rx="0" fill="#0078fc" stroke="none" stroke-width="1.2"/><path d="M496 216 L496 232 Q496 240 488 240 L240 240 Q232 240 232 248 L232 280" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-04-reconciliation-outcomes-and-retry-en-04-reconciliation-outcomes-and-retry-en-arrow)"/><path d="M616 216 L616 280" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-04-reconciliation-outcomes-and-retry-en-04-reconciliation-outcomes-and-retry-en-arrow)"/><path d="M736 216 L736 232 Q736 240 744 240 L992 240 Q1000 240 1000 248 L1000 280" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-04-reconciliation-outcomes-and-retry-en-04-reconciliation-outcomes-and-retry-en-arrow)"/><path d="M232 344 L232 432" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-04-reconciliation-outcomes-and-retry-en-04-reconciliation-outcomes-and-retry-en-arrow)"/><path d="M616 344 L616 432" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-04-reconciliation-outcomes-and-retry-en-04-reconciliation-outcomes-and-retry-en-arrow)"/><path d="M1000 344 L1000 432" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-04-reconciliation-outcomes-and-retry-en-04-reconciliation-outcomes-and-retry-en-arrow)"/><g data-node="true"><rect x="456" y="152" width="320" height="64" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><text x="468" y="176" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Obtain trusted reconciliation evidence</text><text x="468" y="196" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Match the original execution and effect</text></g><g data-node="true"><rect x="96" y="280" width="272" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="108" y="304" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">committed</text><text x="108" y="324" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">External effect has committed</text></g><g data-node="true"><rect x="480" y="280" width="272" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="492" y="304" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">not_committed</text><text x="492" y="324" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Enough evidence of no commit</text></g><g data-node="true"><rect x="864" y="280" width="272" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="876" y="304" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">unknown</text><text x="876" y="324" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Evidence is incomplete or inconclusive</text></g><g data-node="true"><rect x="96" y="432" width="272" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="108" y="456" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Save and reuse the result</text><text x="108" y="476" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Result present: validate and save ref</text><text x="108" y="494" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">No result: preserve commit evidence</text><text x="108" y="512" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Do not repeat a committed operation</text></g><g data-node="true"><rect x="480" y="432" width="272" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="492" y="456" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Next Attempt if checks pass</text><text x="492" y="476" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Budget / cancellation / transitions</text><text x="492" y="494" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Dispatch still needs authorization</text><text x="492" y="512" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Otherwise defer or seek manual help</text></g><g data-node="true"><rect x="864" y="432" width="272" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="876" y="456" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Defer or seek manual help</text><text x="876" y="476" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Keep original IDs and evidence gaps</text><text x="876" y="494" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Wait for stronger evidence</text><text x="876" y="512" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">No automatic redispatch</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">The helper selects retry only for not_committed + canRetry. The Runner must also transition local state; redispatch has further conditions.</text><text x="96" y="660" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">A missing Reconciler takes a manual path. Exceptions need caller handling; they are not guaranteed to become one of these three states.</text></svg>
