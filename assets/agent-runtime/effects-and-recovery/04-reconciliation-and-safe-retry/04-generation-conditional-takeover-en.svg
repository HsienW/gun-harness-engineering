<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="04-generation-conditional-takeover-en-title 04-generation-conditional-takeover-en-desc" lang="en" id="d-04-generation-conditional-takeover-en-root"><title id="04-generation-conditional-takeover-en-title">A stale recovery finding cannot overwrite a newer ownership generation</title><desc id="04-generation-conditional-takeover-en-desc">Two callers use the same expected generation. A conditionally advances active ownership first. B later presents the stale value and is rejected. Taking ownership does not redispatch a tool or fence a remote service.</desc><defs>
      <style>#d-04-generation-conditional-takeover-en-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-04-generation-conditional-takeover-en-root nav, #d-04-generation-conditional-takeover-en-root p { font-size:14px; line-height:1.8; }
      #d-04-generation-conditional-takeover-en-root a { color:#0066d6; }
      #d-04-generation-conditional-takeover-en-root .diagram-container { width:100%; overflow-x:auto; }
      #d-04-generation-conditional-takeover-en-root details { border-top:1px solid #b9cce3; margin-top:24px; padding-top:16px; }
      #d-04-generation-conditional-takeover-en-root summary { cursor:pointer; font-size:16px; font-weight:600; }
      #d-04-generation-conditional-takeover-en-root nav, #d-04-generation-conditional-takeover-en-root details { display:none; }
      #d-04-generation-conditional-takeover-en-root .diagram-container { overflow-x:visible; }</style><marker id="d-04-generation-conditional-takeover-en-04-generation-conditional-takeover-en-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-04-generation-conditional-takeover-en-04-generation-conditional-takeover-en-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker><marker id="d-04-generation-conditional-takeover-en-04-generation-conditional-takeover-en-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="248" height="24" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">TAKEOVER / EXPECTED GENERATION</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">A wins first in this example / illustrative generations 7 and 8</text><rect x="96" y="116" width="64" height="4" rx="0" fill="#0078fc" stroke="none" stroke-width="1.2"/><path d="M192 216 L192 528" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><path d="M616 216 L616 528" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><path d="M1040 216 L1040 528" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><text x="480" y="576" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">SQL updates ownership generation and time only.</text><path d="M192 352 L616 352" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-04-generation-conditional-takeover-en-04-generation-conditional-takeover-en-arrow)"/><rect x="344.0" y="322" width="120" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="404" y="336" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">EXPECT 7 / SET 8</text><path d="M616 400 L192 400" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-04-generation-conditional-takeover-en-04-generation-conditional-takeover-en-arrow)"/><rect x="346.0" y="370" width="116" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="404" y="384" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">ONE ROW UPDATED</text><path d="M1040 464 L616 464" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-04-generation-conditional-takeover-en-04-generation-conditional-takeover-en-arrow)"/><rect x="768.0" y="434" width="120" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="828" y="448" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">EXPECT 7 / SET 8</text><path d="M616 512 L1040 512" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-04-generation-conditional-takeover-en-04-generation-conditional-takeover-en-arrow)"/><rect x="764.0" y="482" width="128" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="828" y="496" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">ZERO ROWS UPDATED</text><g data-node="true"><rect x="96" y="152" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="108" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Recovery caller A</text><text x="108" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Finding expects gen 7</text></g><g data-node="true"><rect x="480" y="152" width="272" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="492" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Active ownership record</text><text x="492" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Run / expected generation guard</text></g><g data-node="true"><rect x="928" y="152" width="224" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="940" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Recovery caller B</text><text x="940" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Same stale finding: gen 7</text></g><g data-node="true"><rect x="480" y="240" width="272" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="492" y="264" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Snapshot: generation 7</text><text x="492" y="284" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Active; no superseding Run</text></g><g data-node="true"><rect x="96" y="536" width="320" height="64" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><text x="108" y="560" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">A acquires generation 8</text><text x="108" y="580" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Consumer still owns follow-up work</text></g><g data-node="true"><rect x="864" y="536" width="320" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="876" y="560" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">B is rejected on stale generation</text><text x="876" y="580" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">No claim of a second tool dispatch</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">This illustrates the conditional update, not two simultaneous valid singleton-lease leaders. Reaper checks its own lease separately.</text><text x="96" y="660" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">A decision named requeued or resumed is not a queue operation. Check downstream generation enforcement and external effects separately.</text></svg>
