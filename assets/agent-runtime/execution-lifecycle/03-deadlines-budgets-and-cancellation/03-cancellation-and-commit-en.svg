<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="03-cancellation-and-commit-en-title 03-cancellation-and-commit-en-desc" lang="en" id="d-03-cancellation-and-commit-en-root"><title id="03-cancellation-and-commit-en-title">Cancellation before dispatch, during I/O, and after Commit</title><desc id="03-cancellation-and-commit-en-desc">Three mutually exclusive cancellation test points on a dispatch, external I/O, and Commit sequence distinguish no tool call, abort propagation, and an existing effect.</desc><defs>
      <style>#d-03-cancellation-and-commit-en-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-03-cancellation-and-commit-en-root nav, #d-03-cancellation-and-commit-en-root p { font-size:14px; line-height:1.8; }
      #d-03-cancellation-and-commit-en-root a { color:#0066d6; }
      #d-03-cancellation-and-commit-en-root .diagram-container { width:100%; overflow-x:auto; }
      #d-03-cancellation-and-commit-en-root details { border-top:1px solid #b9cce3; margin-top:24px; padding-top:16px; }
      #d-03-cancellation-and-commit-en-root summary { cursor:pointer; font-size:16px; font-weight:600; }
      #d-03-cancellation-and-commit-en-root nav, #d-03-cancellation-and-commit-en-root details { display:none; }
      #d-03-cancellation-and-commit-en-root .diagram-container { overflow-x:visible; }</style><marker id="d-03-cancellation-and-commit-en-03-cancellation-and-commit-en-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-03-cancellation-and-commit-en-03-cancellation-and-commit-en-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker><marker id="d-03-cancellation-and-commit-en-03-cancellation-and-commit-en-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="232" height="24" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">CANCELLATION / COMMIT TIMING</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">Operation sequence · ①②③ are exclusive test points</text><rect x="96" y="116" width="64" height="4" rx="0" fill="#0078fc" stroke="none" stroke-width="1.2"/><path d="M240 216 L240 600" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><path d="M640 216 L640 600" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><path d="M1056 216 L1056 600" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><rect x="96" y="224" width="1088" height="24" rx="8" fill="#eef4fb" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><text x="112" y="241" font-size="12" fill="#102743" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">① Before dispatch: do not call the underlying runner; expect zero calls.</text><rect x="96" y="344" width="1088" height="24" rx="8" fill="#eef4fb" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><text x="112" y="361" font-size="12" fill="#102743" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">② During I/O: attempt abort; the external outcome may be success, failure, or unknown.</text><rect x="96" y="464" width="1088" height="24" rx="8" fill="#eef4fb" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><text x="112" y="481" font-size="12" fill="#102743" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">③ After Commit: stop subsequent work; retain the original effect and follow policy.</text><path d="M240 280 L640 280" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-03-cancellation-and-commit-en-03-cancellation-and-commit-en-arrow)"/><rect x="404.0" y="250" width="72" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="440.0" y="264" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">DISPATCH</text><path d="M640 328 L1056 328" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-03-cancellation-and-commit-en-03-cancellation-and-commit-en-arrow)"/><rect x="800.0" y="298" width="96" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="848.0" y="312" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">EXTERNAL I/O</text><path d="M1056 528 L640 528" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-03-cancellation-and-commit-en-03-cancellation-and-commit-en-arrow)"/><rect x="798.0" y="498" width="100" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="848.0" y="512" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">COMMIT RESULT</text><path d="M640 568 L240 568" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-03-cancellation-and-commit-en-03-cancellation-and-commit-en-arrow)"/><rect x="390.0" y="538" width="100" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="440.0" y="552" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">TYPED OUTCOME</text><g data-node="true"><rect x="144" y="152" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="156" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Runtime</text><text x="156" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Stop work; finalize outcome</text></g><g data-node="true"><rect x="544" y="152" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="556" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Tool Runner</text><text x="556" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Dispatch; propagate cancel</text></g><g data-node="true"><rect x="960" y="152" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="972" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">External System</text><text x="972" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Holds actual effect state</text></g><g data-node="true"><rect x="960" y="384" width="192" height="64" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><text x="972" y="408" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">External Commit done</text><text x="972" y="428" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">The effect now exists</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Arrows show operation order. ① prevents dispatch; ② may change the later path. These are three separate cancellation tests.</text><text x="96" y="660" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">A Run can stop later work while retaining committed or unknown effects. Transport abort alone does not prove non-commit.</text></svg>
