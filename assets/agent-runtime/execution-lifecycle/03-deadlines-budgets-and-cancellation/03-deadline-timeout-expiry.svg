<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="03-deadline-timeout-expiry-title 03-deadline-timeout-expiry-desc" lang="zh-TW" id="d-03-deadline-timeout-expiry-root"><title id="03-deadline-timeout-expiry-title">三種期限各自涵蓋哪段時間</title><desc id="03-deadline-timeout-expiry-desc">以示例相對秒數比較整體 Run Deadline、單次呼叫 timeout 與指定等待 expiry 的起點、期間及到期位置，各自限制不同工作。</desc><defs>
      <style>#d-03-deadline-timeout-expiry-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-03-deadline-timeout-expiry-root nav, #d-03-deadline-timeout-expiry-root p { font-size:14px; line-height:1.8; }
      #d-03-deadline-timeout-expiry-root a { color:#0066d6; }
      #d-03-deadline-timeout-expiry-root .diagram-container { width:100%; overflow-x:auto; }
      #d-03-deadline-timeout-expiry-root details { border-top:1px solid #b9cce3; margin-top:24px; padding-top:16px; }
      #d-03-deadline-timeout-expiry-root summary { cursor:pointer; font-size:16px; font-weight:600; }
      #d-03-deadline-timeout-expiry-root nav, #d-03-deadline-timeout-expiry-root details { display:none; }
      #d-03-deadline-timeout-expiry-root .diagram-container { overflow-x:visible; }</style><marker id="d-03-deadline-timeout-expiry-03-deadline-timeout-expiry-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-03-deadline-timeout-expiry-03-deadline-timeout-expiry-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker><marker id="d-03-deadline-timeout-expiry-03-deadline-timeout-expiry-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="240" height="24" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">TIME LIMITS / DISTINCT SCOPES</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">概念比例時間軸 · 秒數僅為教學示例</text><rect x="96" y="116" width="64" height="4" rx="0" fill="#0078fc" stroke="none" stroke-width="1.2"/><path d="M288 176 L1152 176" fill="none" stroke="#d5e1ee" stroke-width="1"/><path d="M288.0 168 L288.0 184" fill="none" stroke="#d5e1ee" stroke-width="1"/><text x="288.0" y="204" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">0s</text><path d="M432.0 168 L432.0 184" fill="none" stroke="#d5e1ee" stroke-width="1"/><text x="432.0" y="204" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">10s</text><path d="M576.0 168 L576.0 184" fill="none" stroke="#d5e1ee" stroke-width="1"/><text x="576.0" y="204" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">20s</text><path d="M720.0 168 L720.0 184" fill="none" stroke="#d5e1ee" stroke-width="1"/><text x="720.0" y="204" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">30s</text><path d="M864.0 168 L864.0 184" fill="none" stroke="#d5e1ee" stroke-width="1"/><text x="864.0" y="204" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">40s</text><path d="M1008.0 168 L1008.0 184" fill="none" stroke="#d5e1ee" stroke-width="1"/><text x="1008.0" y="204" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">50s</text><path d="M1152.0 168 L1152.0 184" fill="none" stroke="#d5e1ee" stroke-width="1"/><text x="1152.0" y="204" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">60s</text><text x="96" y="250" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Run 整體期限</text><path d="M288 292 L1152 292" fill="none" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="378" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">單次呼叫</text><path d="M288 420 L1152 420" fill="none" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="506" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">指定等待</text><path d="M288 548 L1152 548" fill="none" stroke="#d5e1ee" stroke-width="1"/><g data-node="true"><rect x="288" y="224" width="864" height="56" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><text x="300" y="248" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Run Deadline</text><text x="300" y="268" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">0 → 60 秒：示例整體執行上限</text></g><g data-node="true"><rect x="432" y="352" width="216" height="56" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="444" y="376" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Call timeout</text><text x="444" y="396" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">10 → 25 秒：單次等待</text></g><g data-node="true"><rect x="720" y="480" width="288" height="56" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="732" y="504" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Waiting expiry</text><text x="732" y="524" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">30 → 50 秒：指定回覆期限</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">橫向位置按示例秒數比例排列；呼叫 timeout 不證明外部未提交，等待 expiry 只決定回覆是否仍有效。</text><text x="96" y="660" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">此例將等待時間包含在整體期限內；實際是否暫停計時、跨 Resume 延續或建立新 Run，需由契約決定。</text></svg>
