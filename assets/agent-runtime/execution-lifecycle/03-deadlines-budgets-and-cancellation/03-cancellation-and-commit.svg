<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="03-cancellation-and-commit-title 03-cancellation-and-commit-desc" lang="zh-TW" id="d-03-cancellation-and-commit-root"><title id="03-cancellation-and-commit-title">取消在派送前、I/O 中與 Commit 後的不同含義</title><desc id="03-cancellation-and-commit-desc">在操作派送、外部 I/O 與 Commit 的示意時序上，標出三個互斥的取消測試點，分別判斷未呼叫工具、已傳遞 abort 與已存在的效果。</desc><defs>
      <style>#d-03-cancellation-and-commit-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-03-cancellation-and-commit-root nav, #d-03-cancellation-and-commit-root p { font-size:14px; line-height:1.8; }
      #d-03-cancellation-and-commit-root a { color:#0066d6; }
      #d-03-cancellation-and-commit-root .diagram-container { width:100%; overflow-x:auto; }
      #d-03-cancellation-and-commit-root details { border-top:1px solid #b9cce3; margin-top:24px; padding-top:16px; }
      #d-03-cancellation-and-commit-root summary { cursor:pointer; font-size:16px; font-weight:600; }
      #d-03-cancellation-and-commit-root nav, #d-03-cancellation-and-commit-root details { display:none; }
      #d-03-cancellation-and-commit-root .diagram-container { overflow-x:visible; }</style><marker id="d-03-cancellation-and-commit-03-cancellation-and-commit-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-03-cancellation-and-commit-03-cancellation-and-commit-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker><marker id="d-03-cancellation-and-commit-03-cancellation-and-commit-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="232" height="24" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">CANCELLATION / COMMIT TIMING</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">操作時序示意 · ①②③為互斥測試點</text><rect x="96" y="116" width="64" height="4" rx="0" fill="#0078fc" stroke="none" stroke-width="1.2"/><path d="M240 216 L240 600" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><path d="M640 216 L640 600" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><path d="M1056 216 L1056 600" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><rect x="96" y="224" width="1088" height="24" rx="8" fill="#eef4fb" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><text x="112" y="241" font-size="12" fill="#102743" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">① 若在派送前取消：不呼叫底層 runner，呼叫次數應為零。</text><rect x="96" y="344" width="1088" height="24" rx="8" fill="#eef4fb" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><text x="112" y="361" font-size="12" fill="#102743" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">② 若在 I/O 中取消：嘗試 abort；外部仍可能成功、失敗或未知。</text><rect x="96" y="464" width="1088" height="24" rx="8" fill="#eef4fb" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><text x="112" y="481" font-size="12" fill="#102743" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">③ 若在 Commit 後取消：停止後續工作，保留原效果並依政策處理。</text><path d="M240 280 L640 280" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-03-cancellation-and-commit-03-cancellation-and-commit-arrow)"/><rect x="404.0" y="250" width="72" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="440.0" y="264" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">DISPATCH</text><path d="M640 328 L1056 328" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-03-cancellation-and-commit-03-cancellation-and-commit-arrow)"/><rect x="800.0" y="298" width="96" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="848.0" y="312" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">EXTERNAL I/O</text><path d="M1056 528 L640 528" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-03-cancellation-and-commit-03-cancellation-and-commit-arrow)"/><rect x="798.0" y="498" width="100" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="848.0" y="512" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">COMMIT RESULT</text><path d="M640 568 L240 568" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-03-cancellation-and-commit-03-cancellation-and-commit-arrow)"/><rect x="390.0" y="538" width="100" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="440.0" y="552" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">TYPED OUTCOME</text><g data-node="true"><rect x="144" y="152" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="156" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Runtime</text><text x="156" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">停止新工作並收束結果</text></g><g data-node="true"><rect x="544" y="152" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="556" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Tool Runner</text><text x="556" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">派送與傳遞取消</text></g><g data-node="true"><rect x="960" y="152" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="972" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">外部系統</text><text x="972" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">持有實際效果狀態</text></g><g data-node="true"><rect x="960" y="384" width="192" height="64" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><text x="972" y="408" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">外部已 Commit</text><text x="972" y="428" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">此位置之後效果已存在</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">箭頭只示意操作順序；①若生效便不再派送，②可能使後續路徑改變，三個取消點不在同一次執行全部發生。</text><text x="96" y="660" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Run 可停止後續工作，同時保留已提交或效果不明的操作；abort transport 本身不是外部未提交證據。</text></svg>
