<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="01-double-submit-reservation-title 01-double-submit-reservation-desc" lang="zh-TW" id="d-01-double-submit-reservation-root"><title id="01-double-submit-reservation-title">雙送出跨過 await 時，先保留再查 owner</title><desc id="01-double-submit-reservation-desc">同一個本地 QueryGuard 先為要求 A 建立 provisional entry，再等待持久 claim；要求 B 在此時進入，等待既有 reservation 後查回 owner，交由互動政策處置。</desc><defs>
      <style>#d-01-double-submit-reservation-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-01-double-submit-reservation-root nav, #d-01-double-submit-reservation-root p { font-size:14px; line-height:1.8; }
      #d-01-double-submit-reservation-root a { color:#0066d6; }
      #d-01-double-submit-reservation-root .diagram-container { width:100%; overflow-x:auto; }
      #d-01-double-submit-reservation-root details { border-top:1px solid #b9cce3; margin-top:24px; padding-top:16px; }
      #d-01-double-submit-reservation-root summary { cursor:pointer; font-size:16px; font-weight:600; }
      #d-01-double-submit-reservation-root nav, #d-01-double-submit-reservation-root details { display:none; }
      #d-01-double-submit-reservation-root .diagram-container { overflow-x:visible; }</style><marker id="d-01-double-submit-reservation-01-double-submit-reservation-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-01-double-submit-reservation-01-double-submit-reservation-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker><marker id="d-01-double-submit-reservation-01-double-submit-reservation-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="212" height="24" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">ADMISSION / DOUBLE SUBMIT</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">來源順序示例 · 同一個 QueryGuard 實例</text><rect x="96" y="116" width="64" height="4" rx="0" fill="#0078fc" stroke="none" stroke-width="1.2"/><path d="M192 216 L192 600" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><path d="M496 216 L496 600" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><path d="M800 216 L800 600" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><path d="M1104 216 L1104 600" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><path d="M192 248 L800 248" fill="none" stroke="#0066d6" stroke-width="1.2" marker-end="url(#d-01-double-submit-reservation-01-double-submit-reservation-arrow-accent)"/><rect x="458.0" y="218" width="76" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="496.0" y="232" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">RESERVE A</text><path d="M800 360 L1104 360" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-01-double-submit-reservation-01-double-submit-reservation-arrow)"/><rect x="920.0" y="330" width="64" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="952.0" y="344" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">CLAIM A</text><path d="M496 416 L800 416" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-01-double-submit-reservation-01-double-submit-reservation-arrow)"/><rect x="610.0" y="386" width="76" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="648.0" y="400" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">RESERVE B</text><path d="M1104 464 L800 464" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-01-double-submit-reservation-01-double-submit-reservation-arrow)"/><rect x="920.0" y="434" width="64" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="952.0" y="448" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">OWNER A</text><path d="M800 512 L1104 512" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-01-double-submit-reservation-01-double-submit-reservation-arrow)"/><rect x="908.0" y="482" width="88" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="952.0" y="496" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">FIND ACTIVE</text><path d="M1104 552 L800 552" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-01-double-submit-reservation-01-double-submit-reservation-arrow)"/><rect x="916.0" y="522" width="72" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="952.0" y="536" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">ACTIVE A</text><path d="M800 592 L496 592" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-01-double-submit-reservation-01-double-submit-reservation-arrow)"/><rect x="594.0" y="562" width="108" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="648.0" y="576" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">OWNER CONFLICT</text><g data-node="true"><rect x="96" y="152" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="108" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">要求 A</text><text x="108" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">第一份送出</text></g><g data-node="true"><rect x="400" y="152" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="412" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">要求 B</text><text x="412" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">在 claim 等待時進入</text></g><g data-node="true"><rect x="704" y="152" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="716" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">本地 QueryGuard</text><text x="716" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">同一程序的 entry</text></g><g data-node="true"><rect x="1008" y="152" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="1020" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Ownership Store</text><text x="1020" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">決定共享 active owner</text></g><g data-node="true"><rect x="704" y="272" width="192" height="64" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><text x="716" y="296" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">先建立 provisional</text><text x="716" y="316" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">state = dispatching</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">B 等待既有 reservation 完成後查回 durable owner；向 A 回傳與後續實際派送省略。</text><text x="96" y="660" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Ownership conflict 交由互動政策處置，不表示所有重送都直接拒絕；程序內 entry 也不等於跨 Worker 鎖。</text></svg>
