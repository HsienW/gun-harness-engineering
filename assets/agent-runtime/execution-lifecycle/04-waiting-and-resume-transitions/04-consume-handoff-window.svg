<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="04-consume-handoff-window-title 04-consume-handoff-window-desc" lang="zh-TW" id="d-04-consume-handoff-window-root"><title id="04-consume-handoff-window-title">等待已消費，Graph 尚未接手的窗口</title><desc id="04-consume-handoff-window-desc">成功續行依序消費等待、替換 ownership、保存決策與派送 Graph；若消費後崩潰或版本衝突，仍需獨立的接手機制。</desc><defs>
      <style>#d-04-consume-handoff-window-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-04-consume-handoff-window-root nav, #d-04-consume-handoff-window-root p { font-size:14px; line-height:1.8; }
      #d-04-consume-handoff-window-root a { color:#0066d6; }
      #d-04-consume-handoff-window-root .diagram-container { width:100%; overflow-x:auto; }
      #d-04-consume-handoff-window-root details { border-top:1px solid #b9cce3; margin-top:24px; padding-top:16px; }
      #d-04-consume-handoff-window-root summary { cursor:pointer; font-size:16px; font-weight:600; }
      #d-04-consume-handoff-window-root nav, #d-04-consume-handoff-window-root details { display:none; }
      #d-04-consume-handoff-window-root .diagram-container { overflow-x:visible; }</style><marker id="d-04-consume-handoff-window-04-consume-handoff-window-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-04-consume-handoff-window-04-consume-handoff-window-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker><marker id="d-04-consume-handoff-window-04-consume-handoff-window-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="232" height="24" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">RESUME / CONSUME AND HANDOFF</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">來源順序觀察 · 下方表示成功續行</text><rect x="96" y="116" width="64" height="4" rx="0" fill="#0078fc" stroke="none" stroke-width="1.2"/><path d="M192 216 L192 592" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><path d="M416 216 L416 592" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><path d="M640 216 L640 592" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><path d="M864 216 L864 592" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><path d="M1088 216 L1088 592" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><rect x="96" y="344" width="1088" height="48" rx="8" fill="#eef4fb" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><text x="112" y="374" font-size="12" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">風險窗口</text><text x="240" y="374" font-size="12" fill="#102743" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">等待已 consumed；若此時崩潰或後續 supersede 衝突，Graph 可能尚未取得輸入。</text><path d="M192 248 L416 248" fill="none" stroke="#0066d6" stroke-width="1.2" marker-end="url(#d-04-consume-handoff-window-04-consume-handoff-window-arrow-accent)"/><rect x="272.0" y="218" width="64" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="304.0" y="232" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">CONSUME</text><path d="M416 304 L192 304" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-04-consume-handoff-window-04-consume-handoff-window-arrow)"/><rect x="268.0" y="274" width="72" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="304.0" y="288" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">CONSUMED</text><path d="M192 432 L640 432" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-04-consume-handoff-window-04-consume-handoff-window-arrow)"/><rect x="378.0" y="402" width="76" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="416.0" y="416" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">SUPERSEDE</text><path d="M640 480 L192 480" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-04-consume-handoff-window-04-consume-handoff-window-arrow)"/><rect x="378.0" y="450" width="76" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="416.0" y="464" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">NEW OWNER</text><path d="M192 528 L864 528" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-04-consume-handoff-window-04-consume-handoff-window-arrow)"/><rect x="480.0" y="498" width="96" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="528.0" y="512" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">RECORD EVENT</text><path d="M192 576 L1088 576" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-04-consume-handoff-window-04-consume-handoff-window-arrow)"/><rect x="586.0" y="546" width="108" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="640.0" y="560" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">GRAPH DISPATCH</text><g data-node="true"><rect x="96" y="152" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="108" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Resume consumer</text><text x="108" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">先核對指定等待</text></g><g data-node="true"><rect x="320" y="152" width="192" height="64" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><text x="332" y="176" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Manifest Store</text><text x="332" y="196" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">保存消費狀態</text></g><g data-node="true"><rect x="544" y="152" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="556" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Ownership Store</text><text x="556" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">核對 expected generation</text></g><g data-node="true"><rect x="768" y="152" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="780" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">決策事件儲存</text><text x="780" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">保存恢復決策</text></g><g data-node="true"><rect x="992" y="152" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="1004" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Graph Runtime</text><text x="1004" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">接收後續派送</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">成功路徑在 consume 後繼續 supersede、保存事件與派送；各 Store 的箭頭未表示共同 transaction。</text><text x="96" y="660" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">風險窗口若發生故障，需另有可恢復接線；本輪未驗證跨程序接手，也未宣稱已部署 outbox。</text></svg>
