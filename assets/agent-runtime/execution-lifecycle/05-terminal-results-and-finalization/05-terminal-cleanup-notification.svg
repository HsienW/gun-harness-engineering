<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="05-terminal-cleanup-notification-title 05-terminal-cleanup-notification-desc" lang="zh-TW" id="d-05-terminal-cleanup-notification-root"><title id="05-terminal-cleanup-notification-title">結果提交、條件式清理與通知失敗分開處理</title><desc id="05-terminal-cleanup-notification-desc">概念成功提交路徑先保存權威結果，再按條件清理並通知；通知失敗時重送或讀取已有結果，不能因此重新執行業務。</desc><defs>
      <style>#d-05-terminal-cleanup-notification-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-05-terminal-cleanup-notification-root nav, #d-05-terminal-cleanup-notification-root p { font-size:14px; line-height:1.8; }
      #d-05-terminal-cleanup-notification-root a { color:#0066d6; }
      #d-05-terminal-cleanup-notification-root .diagram-container { width:100%; overflow-x:auto; }
      #d-05-terminal-cleanup-notification-root details { border-top:1px solid #b9cce3; margin-top:24px; padding-top:16px; }
      #d-05-terminal-cleanup-notification-root summary { cursor:pointer; font-size:16px; font-weight:600; }
      #d-05-terminal-cleanup-notification-root nav, #d-05-terminal-cleanup-notification-root details { display:none; }
      #d-05-terminal-cleanup-notification-root .diagram-container { overflow-x:visible; }</style><marker id="d-05-terminal-cleanup-notification-05-terminal-cleanup-notification-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-05-terminal-cleanup-notification-05-terminal-cleanup-notification-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker><marker id="d-05-terminal-cleanup-notification-05-terminal-cleanup-notification-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="272" height="24" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">TERMINAL / CLEANUP / NOTIFICATION</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">概念提交設計 · 不表示共同 transaction</text><rect x="96" y="116" width="64" height="4" rx="0" fill="#0078fc" stroke="none" stroke-width="1.2"/><path d="M192 216 L192 600" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><path d="M496 216 L496 600" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><path d="M800 216 L800 600" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><path d="M1104 216 L1104 600" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><path d="M192 248 L496 248" fill="none" stroke=