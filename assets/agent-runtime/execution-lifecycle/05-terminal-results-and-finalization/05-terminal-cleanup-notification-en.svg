<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="05-terminal-cleanup-notification-en-title 05-terminal-cleanup-notification-en-desc" lang="en" id="d-05-terminal-cleanup-notification-en-root"><title id="05-terminal-cleanup-notification-en-title">Result commit, conditional cleanup, and notification</title><desc id="05-terminal-cleanup-notification-en-desc">The conceptual commit path saves the authoritative result, then conditionally cleans up and notifies. Failed notification leads to redelivery or result lookup without repeating business work.</desc><defs>
      <style>#d-05-terminal-cleanup-notification-en-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-05-terminal-cleanup-notification-en-root nav, #d-05-terminal-cleanup-notification-en-root p { font-size:14px; line-height:1.8; }
      #d-05-terminal-cleanup-notification-en-root a { color:#0066d6; }
      #d-05-terminal-cleanup-notification-en-root .diagram-container { width:100%; overflow-x:auto; }
      #d-05-terminal-cleanup-notification-en-root details { border-top:1px solid #b9cce3; margin-top:24px; padding-top:16px; }
      #d-05-terminal-cleanup-notification-en-root summary { cursor:pointer; font-size:16px; font-weight:600; }
      #d-05-terminal-cleanup-notification-en-root nav, #d-05-terminal-cleanup-notification-en-root details { display:none; }
      #d-05-terminal-cleanup-notification-en-root .diagram-container { overflow-x:visible; }</style><marker id="d-05-terminal-cleanup-notification-en-05-terminal-cleanup-notification-en-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-05-terminal-cleanup-notification-en-05-terminal-cleanup-notification-en-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker><marker id="d-05-terminal-cleanup-notification-en-05-terminal-cleanup-notification-en-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="272" height="24" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">TERMINAL / CLEANUP / NOTIFICATION</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">Conceptual commit design · no shared transaction implied</text><rect x="96" y="116" width="64" height="4" rx="0" fill="#0078fc" stroke="none" stroke-width="1.2"/><path d="M192 216 L192 600" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><path d="M496 216 L496 600" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><path d="M800 216 L800 600" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><path d="M1104 216 L1104 600" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 