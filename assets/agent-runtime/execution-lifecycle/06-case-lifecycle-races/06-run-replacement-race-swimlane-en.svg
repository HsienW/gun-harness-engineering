      #d-06-run-replacement-race-swimlane-en-root .diagram-container { width:100%; overflow-x:auto; }
      #d-06-run-replacement-race-swimlane-en-root details { border-top:1px solid #b9cce3; margin-top:24px; padding-top:16px; }
      #d-06-run-replacement-race-swimlane-en-root summary { cursor:pointer; font-size:16px; font-weight:600; }
      #d-06-run-replacement-race-swimlane-en-root nav, #d-06-run-replacement-race-swimlane-en-root details { display:none; }
