<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="06-run-replacement-race-swimlane-en-title 06-run-replacement-race-swimlane-en-desc" lang="en" id="d-06-run-replacement-race-swimlane-en-root"><title id="06-run-replacement-race-swimlane-en-title">Checking stale cleanup and replies after Run replacement</title><desc id="06-run-replacement-race-swimlane-en-desc">In this teaching case, Run B conditionally replaces Run A; A's late finalizer and an old reply to a consumed wait undergo separate identity and state checks, while B's result follows its own authoritative conditions.</desc><defs>
      <style>#d-06-run-replacement-race-swimlane-en-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
