<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="02-stale-run-cleanup-title 02-stale-run-cleanup-desc" lang="zh-TW" id="d-02-stale-run-cleanup-root"><title id="02-stale-run-cleanup-title">B 已接手，A 的晚到清理核對自己的身分</title><desc id="02-stale-run-cleanup-desc">B 條件式替換 A 並採用新 generation 後，A 的本地 release 與 repository terminal 更新分別依自己的條件判定，不取得 B 的清理權。</desc><defs>
      <style>#d-02-stale-run-cleanup-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-02-stale-run-cleanup-root nav, #d-02-stale-run-cleanup-root p { font-size:14px; line-height:1.8; }
      #d-02-stale-run-cleanup-root a { color:#0066d6; }
      #d-02-stale-run-cleanup-root .diagram-container { width:100%; overflow-x:auto; }
      #d-02-stale-run-cleanup-root details { border-top:1px solid #b9cce3; margin-top:24px; padding-top:16px; }
      #d-02-stale-run-cleanup-root summary { cursor:pointer; font-size:16px; font-weight:600; }
      #d-02-stale-run-cleanup-root nav, #d-02-stale-run-cleanup-root details { display:none; }
      #d-02-stale-run-cleanup-root .diagram-container { overflow-x:visible; }</style><marker id="d-02-stale-run-cleanup-02-stale-run-cleanup-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-02-stale-run-cleanup-02-stale-run-cleanup-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker><marker id="d-02-stale-run-cleanup-02-stale-run-cleanup-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="212" height="24" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.2"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">OWNERSHIP / STALE CLEANUP</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">來源條件示例 · Run ID 不重用</text><rect x="96" y="116" width="64" height="4" rx="0" fill="#0078fc" stroke="none" stroke-width="1.2"/><path d="M192 216 L192 600" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><path d="M496 216 L496 600" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><path d="M800 216 L800 600" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><path d="M1104 216 L1104 600" fill="none" stroke="#d5e1ee" stroke-width="1" stroke-dasharray="4 4"/><path d="M1104 248 L800 248" fill="none" stroke="#0066d6" stroke-width="1.2" marker-end="url(#d-02-stale-run-cleanup-02-stale-run-cleanup-arrow-accent)"/><rect x="914.0" y="218" width="76" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="952.0" y="232" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">SUPERSEDE</text><path d="M800 304 L1104 304" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-02-stale-run-cleanup-02-stale-run-cleanup-arrow)"/><rect x="920.0" y="274" width="64" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="952.0" y="288" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">OWNER B</text><path d="M1104 360 L496 360" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-stale-run-cleanup-02-stale-run-cleanup-arrow)"/><rect x="768.0" y="330" width="64" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="800.0" y="344" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">ADOPT B</text><path d="M192 440 L496 440" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-stale-run-cleanup-02-stale-run-cleanup-arrow)"/><rect x="306.0" y="410" width="76" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="344.0" y="424" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">RELEASE A</text><path d="M496 488 L192 488" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-02-stale-run-cleanup-02-stale-run-cleanup-arrow)"/><rect x="308.0" y="458" width="72" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="344.0" y="472" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">NO MATCH</text><path d="M192 544 L800 544" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-stale-run-cleanup-02-stale-run-cleanup-arrow)"/><rect x="446.0" y="514" width="100" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="496.0" y="528" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">MARK TERMINAL</text><path d="M800 584 L192 584" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-02-stale-run-cleanup-02-stale-run-cleanup-arrow)"/><rect x="458.0" y="554" width="76" height="20" rx="2" fill="#fafdff" stroke="none" stroke-width="1.2"/><text x="496.0" y="568" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">ZERO ROWS</text><g data-node="true"><rect x="96" y="152" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="108" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">A 的 finalizer</text><text x="108" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Run A／generation 4</text></g><g data-node="true"><rect x="400" y="152" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="412" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">本地 QueryGuard</text><text x="412" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">核對 Run／generation</text></g><g data-node="true"><rect x="704" y="152" width="192" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><text x="716" y="176" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Ownership Store</text><text x="716" y="196" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">核對 Run／active</text></g><g data-node="true"><rect x="1008" y="152" width="192" height="64" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><text x="1020" y="176" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Run B consumer</text><text x="1020" y="196" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">以 A generation 4 替換</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">release 只刪本地 entry；markTerminal 依 Thread／Scope／Run／active 更新，沒有 generation 參數。</text><text x="96" y="660" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">圖中 A 已 superseded，因此兩次舊清理不命中 B；owner 替換未表示 A 的 I/O 已取消或下游已有 fencing。</text></svg>
