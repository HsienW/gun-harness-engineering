<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 530" role="img" aria-labelledby="title desc" lang="en" font-family="Arial, sans-serif">
  <title id="title">The conversation resumed. Which step still needs approval?</title>
  <desc id="desc">Check the candidate session ID, transcript, and CLI resume result. Verify approval for the pending write in the original task.</desc>
  <rect x="1" y="1" width="1038" height="528" rx="7" fill="#f5f8fc" stroke="#b9cce3"/>
  <text x="28" y="48" font-size="28" font-weight="600" fill="#102743">The conversation resumed. Which step still needs approval?</text>
  <path d="M28 68 H92" stroke="#0078fc" stroke-width="4"/>
  <rect x="32" y="96" width="276" height="100" rx="7" fill="#fff" stroke="#b9cce3"/>
  <text x="51" y="132" font-size="21" font-weight="600" fill="#0066d6">Hive role registry</text>
  <text x="51" y="166" font-size="18" font-weight="400" fill="#102743">Get candidate CLI session ID</text>
  <path d="M311 146 H373" fill="none" stroke="#0066d6" stroke-width="2"/>
  <path d="M373 146 L364 142 L364 150 Z" fill="#0066d6"/>
  <rect x="378" y="96" width="279" height="100" rx="7" fill="#fff" stroke="#b9cce3"/>
  <text x="397" y="132" font-size="21" font-weight="600" fill="#0066d6">Check the transcript</text>
  <text x="397" y="166" font-size="18" font-weight="400" fill="#102743">Can you read the right chat?</text>
  <path d="M660 146 H721" fill="none" stroke="#0066d6" stroke-width="2"/>
  <path d="M721 146 L712 142 L712 150 Z" fill="#0066d6"/>
  <rect x="726" y="96" width="282" height="100" rx="7" fill="#fff" stroke="#b9cce3"/>
  <text x="745" y="132" font-size="21" font-weight="600" fill="#0066d6">Check CLI resume</text>
  <text x="745" y="166" font-size="18" font-weight="400" fill="#102743">Read the original chat history</text>
  <path d="M170 197 V249" fill="none" stroke="#0066d6" stroke-width="2"/>
  <path d="M170 249 L174 240 L166 240 Z" fill="#0066d6"/>
  <path d="M516 197 V249" fill="none" stroke="#0066d6" stroke-width="2"/>
  <path d="M516 249 L520 240 L512 240 Z" fill="#0066d6"/>
  <rect x="32" y="255" width="625" height="85" rx="7" fill="#fff" stroke="#b9cce3"/>
  <text x="52" y="288" font-size="21" font-weight="600" fill="#0066d6">Resume still unconfirmed</text>
  <text x="52" y="319" font-size="18" font-weight="400" fill="#102743">Missing ID or readable transcript? Check who owns the conversation.</text>
  <path d="M867 197 V249" fill="none" stroke="#0066d6" stroke-width="2"/>
  <path d="M867 249 L871 240 L863 240 Z" fill="#0066d6"/>
  <rect x="726" y="255" width="282" height="85" rx="7" fill="#e2efff" stroke="#b9cce3"/>
  <text x="746" y="288" font-size="21" font-weight="600" fill="#0066d6">Conversation resumed</text>
  <text x="746" y="319" font-size="18" font-weight="400" fill="#102743">Find the task’s pending step</text>
  <path d="M867 342 V383" fill="none" stroke="#0066d6" stroke-width="2"/>
  <path d="M867 383 L871 374 L863 374 Z" fill="#0066d6"/>
  <rect x="32" y="389" width="976" height="109" rx="7" fill="#e2efff" stroke="#b9cce3"/>
  <text x="54" y="425" font-size="22" font-weight="600" fill="#0066d6">If a write was waiting for approval, check it before proceeding</text>
  <text x="54" y="468" font-size="20" font-weight="400" fill="#102743">Check the pending request, the approved action and scope, and whether the approval was used.</text>
</svg>
