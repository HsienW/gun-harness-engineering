<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" lang="zh-TW" role="img" aria-labelledby="02-gun-capability-composition-title 02-gun-capability-composition-desc" id="d-02-gun-capability-composition-root">
<title id="02-gun-capability-composition-title">Chat Gun 的能力組裝路徑</title><desc id="02-gun-capability-composition-desc">本地工具與選用 MCP 在 Agent 工具集合匯合，載入與執行的條件仍需分開核對。</desc>
<defs>
      <style>#d-02-gun-capability-composition-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-02-gun-capability-composition-root nav, #d-02-gun-capability-composition-root p, #d-02-gun-capability-composition-root li { font-size:14px;line-height:1.8 }
      #d-02-gun-capability-composition-root a { color:#0066d6 }
      #d-02-gun-capability-composition-root .diagram-container { width:100%;overflow-x:auto }
      #d-02-gun-capability-composition-root details { margin-top:24px;border-top:1px solid #b9cce3;padding-top:16px }
      #d-02-gun-capability-composition-root summary { cursor:pointer;font-weight:600 }
      #d-02-gun-capability-composition-root .notes { display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px }
      #d-02-gun-capability-composition-root ul { padding-left:20px }
      #d-02-gun-capability-composition-root nav, #d-02-gun-capability-composition-root details { display:none }
      #d-02-gun-capability-composition-root .diagram-container { overflow-x:visible }</style><marker id="d-02-gun-capability-composition-02-gun-capability-composition-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-02-gun-capability-composition-02-gun-capability-composition-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0078fc"/></marker></defs><rect width="1280" height="720" fill="#f5f8fc"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="200" height="24" fill="#f5f8fc"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">CAPABILITY COMPOSITION</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">概念圖 · 原始碼查讀</text><rect x="96" y="116" width="64" height="4" fill="#0078fc"/><path d="M248 276 L248 324" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-gun-capability-composition-02-gun-capability-composition-arrow)"/><path d="M248 436 L248 484" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-gun-capability-composition-02-gun-capability-composition-arrow)"/><path d="M624 276 L624 324" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-gun-capability-composition-02-gun-capability-composition-arrow)"/><path d="M1016 276 L1016 324" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-gun-capability-composition-02-gun-capability-composition-arrow)"/><path d="M624 436 L624 484" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-gun-capability-composition-02-gun-capability-composition-arrow)"/><path d="M1016 436 L1016 484" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-gun-capability-composition-02-gun-capability-composition-arrow)"/><path d="M400 540 L456 540" fill="none" stroke="#0078fc" stroke-width="1.2" marker-end="url(#d-02-gun-capability-composition-02-gun-capability-composition-arrow-accent)"/><g data-node="true"><rect x="96" y="164" width="304" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="112" y="176" width="46" height="18" rx="2" fill="#eef4fb"/><text x="120" y="189" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">LOCAL</text><text x="112" y="215" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">本地工具初始化</text><text x="112" y="238" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">LOCAL_PRODUCTION_TOOLS</text><text x="112" y="256" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Calculator、搜尋、擷取與天氣等</text></g><g data-node="true"><rect x="96" y="324" width="304" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="112" y="336" width="64" height="18" rx="2" fill="#eef4fb"/><text x="120" y="349" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">DESCRIBE</text><text x="112" y="375" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Descriptor 與 execution profile</text><text x="112" y="398" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">current_weather → SDK staging</text><text x="112" y="416" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">指定 legacy 才略過；錯誤可中止整批</text></g><g data-node="true"><rect x="96" y="484" width="304" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="112" y="496" width="94" height="18" rx="2" fill="#eef4fb"/><text x="120" y="509" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">LOCAL RUNTIME</text><text x="112" y="535" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Registry 與本地治理包裝</text><text x="112" y="558" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">核對前提並建立工具映射</text><text x="112" y="576" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">本地 wrapper 有自己的組裝位置</text></g><g data-node="true"><rect x="456" y="164" width="728" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="472" y="176" width="118" height="18" rx="2" fill="#eef4fb"/><text x="480" y="189" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">MCP CONFIGURATION</text><text x="472" y="215" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">選用 MCP：載入設定與 enforcement 分支</text><text x="472" y="238" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">includeMcp + MCP_LOAD_ON_START + server configuration</text><text x="472" y="256" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">未啟用時不載入；啟用後依 enforcement 選擇路徑</text></g><g data-node="true"><rect x="456" y="324" width="336" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="472" y="336" width="70" height="18" rx="2" fill="#eef4fb"/><text x="480" y="349" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">DISCOVERY</text><text x="472" y="375" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">stdio 發現</text><text x="472" y="398" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">connect → listTools → Schema subset</text><text x="472" y="416" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">透過 callTool 執行；略過指定 secret server</text></g><g data-node="true"><rect x="848" y="324" width="336" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="864" y="336" width="82" height="18" rx="2" fill="#eef4fb"/><text x="872" y="349" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">DECLARATION</text><text x="864" y="375" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">宣告工具</text><text x="864" y="398" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">由風險描述建立 descriptor／profile</text><text x="864" y="416" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">此時不啟動 stdio；執行需隔離 runner</text></g><g data-node="true"><rect x="456" y="484" width="728" height="112" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><rect x="472" y="496" width="118" height="18" rx="2" fill="#1c78e4"/><text x="480" y="509" font-size="9" fill="#ffffff" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">COMPOSED TOOL SET</text><text x="472" y="535" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Agent 使用的工具集合</text><text x="472" y="558" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">供模型綁定或程式呼叫；進入清單不等於執行已就緒</text><text x="472" y="576" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">選用 MCP 載入失敗可回空集合並保留本地工具</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">外層初始化失敗可中止整批；stdio 的 Promise.all 也可能因單一 server 拒絕而使整次 MCP 載入失敗。</text><text x="96" y="658" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">宣告工具的直接函式拒絕執行；pipeline 開關也不會移除所有本地治理包裝。Chat Gun 92a5673003e4。</text>
</svg>
