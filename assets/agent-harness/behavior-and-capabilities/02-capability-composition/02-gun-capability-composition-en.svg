<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" lang="en" role="img" aria-labelledby="02-gun-capability-composition-en-title 02-gun-capability-composition-en-desc" id="d-02-gun-capability-composition-en-root">
<title id="02-gun-capability-composition-en-title">Chat Gun capability composition</title><desc id="02-gun-capability-composition-en-desc">Local tools and optional MCP converge in the Agent tool set, while loading and execution conditions remain distinct.</desc>
<defs>
      <style>#d-02-gun-capability-composition-en-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-02-gun-capability-composition-en-root nav, #d-02-gun-capability-composition-en-root p, #d-02-gun-capability-composition-en-root li { font-size:14px;line-height:1.8 }
      #d-02-gun-capability-composition-en-root a { color:#0066d6 }
      #d-02-gun-capability-composition-en-root .diagram-container { width:100%;overflow-x:auto }
      #d-02-gun-capability-composition-en-root details { margin-top:24px;border-top:1px solid #b9cce3;padding-top:16px }
      #d-02-gun-capability-composition-en-root summary { cursor:pointer;font-weight:600 }
      #d-02-gun-capability-composition-en-root .notes { display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px }
      #d-02-gun-capability-composition-en-root ul { padding-left:20px }
      #d-02-gun-capability-composition-en-root nav, #d-02-gun-capability-composition-en-root details { display:none }
      #d-02-gun-capability-composition-en-root .diagram-container { overflow-x:visible }</style><marker id="d-02-gun-capability-composition-en-02-gun-capability-composition-en-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-02-gun-capability-composition-en-02-gun-capability-composition-en-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0078fc"/></marker></defs><rect width="1280" height="720" fill="#f5f8fc"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="200" height="24" fill="#f5f8fc"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">CAPABILITY COMPOSITION</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">CONCEPTUAL / SOURCE INSPECTION</text><rect x="96" y="116" width="64" height="4" fill="#0078fc"/><path d="M248 276 L248 324" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-gun-capability-composition-en-02-gun-capability-composition-en-arrow)"/><path d="M248 436 L248 484" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-gun-capability-composition-en-02-gun-capability-composition-en-arrow)"/><path d="M624 276 L624 324" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-gun-capability-composition-en-02-gun-capability-composition-en-arrow)"/><path d="M1016 276 L1016 324" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-gun-capability-composition-en-02-gun-capability-composition-en-arrow)"/><path d="M624 436 L624 484" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-gun-capability-composition-en-02-gun-capability-composition-en-arrow)"/><path d="M1016 436 L1016 484" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-gun-capability-composition-en-02-gun-capability-composition-en-arrow)"/><path d="M400 540 L456 540" fill="none" stroke="#0078fc" stroke-width="1.2" marker-end="url(#d-02-gun-capability-composition-en-02-gun-capability-composition-en-arrow-accent)"/><g data-node="true"><rect x="96" y="164" width="304" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="112" y="176" width="46" height="18" rx="2" fill="#eef4fb"/><text x="120" y="189" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">LOCAL</text><text x="112" y="215" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Initialize local tools</text><text x="112" y="238" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">LOCAL_PRODUCTION_TOOLS</text><text x="112" y="256" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Calculator, search, fetch, weather, etc.</text></g><g data-node="true"><rect x="96" y="324" width="304" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="112" y="336" width="64" height="18" rx="2" fill="#eef4fb"/><text x="120" y="349" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">DESCRIBE</text><text x="112" y="375" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Descriptor and execution profile</text><text x="112" y="398" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">current_weather → SDK staging</text><text x="112" y="416" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Only legacy skips staging; errors can stop loading</text></g><g data-node="true"><rect x="96" y="484" width="304" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="112" y="496" width="94" height="18" rx="2" fill="#eef4fb"/><text x="120" y="509" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">LOCAL RUNTIME</text><text x="112" y="535" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Registry and local governance</text><text x="112" y="558" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Check prerequisites and map implementations</text><text x="112" y="576" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Local wrappers have their own assembly points</text></g><g data-node="true"><rect x="456" y="164" width="728" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="472" y="176" width="118" height="18" rx="2" fill="#eef4fb"/><text x="480" y="189" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">MCP CONFIGURATION</text><text x="472" y="215" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Optional MCP: loading configuration and enforcement</text><text x="472" y="238" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">includeMcp + MCP_LOAD_ON_START + server configuration</text><text x="472" y="256" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Do not load when disabled; when enabled, select the enforcement path</text></g><g data-node="true"><rect x="456" y="324" width="336" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="472" y="336" width="70" height="18" rx="2" fill="#eef4fb"/><text x="480" y="349" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">DISCOVERY</text><text x="472" y="375" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">stdio discovery</text><text x="472" y="398" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">connect → listTools → Schema subset</text><text x="472" y="416" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Execute via callTool; skip designated secret servers</text></g><g data-node="true"><rect x="848" y="324" width="336" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="864" y="336" width="82" height="18" rx="2" fill="#eef4fb"/><text x="872" y="349" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">DECLARATION</text><text x="864" y="375" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Declared tools</text><text x="864" y="398" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Create descriptors / profiles from risk descriptions</text><text x="864" y="416" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">No stdio startup here; execution needs an isolated runner</text></g><g data-node="true"><rect x="456" y="484" width="728" height="112" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><rect x="472" y="496" width="118" height="18" rx="2" fill="#1c78e4"/><text x="480" y="509" font-size="9" fill="#ffffff" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">COMPOSED TOOL SET</text><text x="472" y="535" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Tool set supplied to the Agent</text><text x="472" y="558" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">For model binding or code calls; inclusion does not establish execution readiness</text><text x="472" y="576" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Optional MCP load failures can return an empty set while retaining local tools</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Outer initialization may stop the entire load; one server rejection in stdio Promise.all can fail the whole MCP load.</text><text x="96" y="658" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Declared tools reject direct execution; pipeline flags do not remove every local wrapper. Chat Gun 92a5673003e4.</text>
</svg>
