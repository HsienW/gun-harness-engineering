<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" lang="en" role="img" aria-labelledby="02-ccb-tool-pool-merge-en-title 02-ccb-tool-pool-merge-en-desc" id="d-02-ccb-tool-pool-merge-en-root">
<title id="02-ccb-tool-pool-merge-en-title">CCB tool pool: two merge layers</title><desc id="02-ccb-tool-pool-merge-en-desc">Inner name collisions retain built-in tools; outer collisions retain initialTools before further filtering and sorting.</desc>
<defs>
      <style>#d-02-ccb-tool-pool-merge-en-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-02-ccb-tool-pool-merge-en-root nav, #d-02-ccb-tool-pool-merge-en-root p, #d-02-ccb-tool-pool-merge-en-root li { font-size:14px;line-height:1.8 }
      #d-02-ccb-tool-pool-merge-en-root a { color:#0066d6 }
      #d-02-ccb-tool-pool-merge-en-root .diagram-container { width:100%;overflow-x:auto }
      #d-02-ccb-tool-pool-merge-en-root details { margin-top:24px;border-top:1px solid #b9cce3;padding-top:16px }
      #d-02-ccb-tool-pool-merge-en-root summary { cursor:pointer;font-weight:600 }
      #d-02-ccb-tool-pool-merge-en-root .notes { display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px }
      #d-02-ccb-tool-pool-merge-en-root ul { padding-left:20px }
      #d-02-ccb-tool-pool-merge-en-root nav, #d-02-ccb-tool-pool-merge-en-root details { display:none }
      #d-02-ccb-tool-pool-merge-en-root .diagram-container { overflow-x:visible }</style><marker id="d-02-ccb-tool-pool-merge-en-02-ccb-tool-pool-merge-en-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-02-ccb-tool-pool-merge-en-02-ccb-tool-pool-merge-en-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0078fc"/></marker></defs><rect width="1280" height="720" fill="#f5f8fc"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="200" height="24" fill="#f5f8fc"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">TOOL POOL / TWO MERGES</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">CONCEPTUAL / SOURCE INSPECTION</text><rect x="96" y="116" width="64" height="4" fill="#0078fc"/><path d="M352 220 L392 220 Q400 220 400 228 L400 276 Q400 284 408 284 L456 284" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-ccb-tool-pool-merge-en-02-ccb-tool-pool-merge-en-arrow)"/><path d="M352 384 L408 384 Q416 384 416 376 L416 340 Q416 332 424 332 L456 332" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-ccb-tool-pool-merge-en-02-ccb-tool-pool-merge-en-arrow)"/><path d="M792 308 L848 308" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-ccb-tool-pool-merge-en-02-ccb-tool-pool-merge-en-arrow)"/><path d="M1016 372 L1016 416 Q1016 424 1008 424 L632 424 Q624 424 624 432 L624 480" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-ccb-tool-pool-merge-en-02-ccb-tool-pool-merge-en-arrow)"/><rect x="770.0" y="398" width="100" height="18" rx="2" fill="#fafdff"/><text x="820" y="410" font-size="10" fill="#52657d" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">INNER RESULT</text><path d="M352 536 L456 536" fill="none" stroke="#0078fc" stroke-width="1.2" marker-end="url(#d-02-ccb-tool-pool-merge-en-02-ccb-tool-pool-merge-en-arrow-accent)"/><path d="M792 536 L848 536" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-ccb-tool-pool-merge-en-02-ccb-tool-pool-merge-en-arrow)"/><g data-node="true"><rect x="96" y="164" width="256" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="112" y="176" width="64" height="18" rx="2" fill="#eef4fb"/><text x="120" y="189" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">BUILT-IN</text><text x="112" y="215" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Built-in candidates</text><text x="112" y="238" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">getAllBaseTools() → getTools()</text><text x="112" y="256" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Filter by mode, deny, and conditions</text></g><g data-node="true"><rect x="96" y="328" width="256" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="112" y="340" width="40" height="18" rx="2" fill="#eef4fb"/><text x="120" y="353" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">MCP</text><text x="112" y="379" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">MCP candidates</text><text x="112" y="402" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Apply MCP deny filters</text><text x="112" y="420" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Sort groups for the inner merge</text></g><g data-node="true"><rect x="456" y="244" width="336" height="128" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="472" y="256" width="82" height="18" rx="2" fill="#eef4fb"/><text x="480" y="269" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">INNER MERGE</text><text x="472" y="295" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Inner: assembleToolPool()</text><text x="472" y="318" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Sort partitions, then deduplicate names</text><text x="472" y="336" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Built-in tools win name collisions</text></g><g data-node="true"><rect x="848" y="244" width="336" height="128" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="864" y="256" width="88" height="18" rx="2" fill="#eef4fb"/><text x="872" y="269" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">INNER RESULT</text><text x="864" y="295" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Inner pool result</text><text x="864" y="318" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">built-in X + MCP X → built-in X</text><text x="864" y="336" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Keep built-in / MCP partitions</text></g><g data-node="true"><rect x="96" y="480" width="256" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="112" y="492" width="88" height="18" rx="2" fill="#eef4fb"/><text x="120" y="505" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">CALLER INPUT</text><text x="112" y="531" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">initialTools</text><text x="112" y="554" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Initial tools supplied by the caller</text><text x="112" y="572" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Example: this set also contains X</text></g><g data-node="true"><rect x="456" y="480" width="336" height="112" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><rect x="472" y="492" width="82" height="18" rx="2" fill="#1c78e4"/><text x="480" y="505" font-size="9" fill="#ffffff" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">OUTER MERGE</text><text x="472" y="531" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Outer: merge and deduplicate</text><text x="472" y="554" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">mergeAndFilterTools()</text><text x="472" y="572" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">initialTools wins name collisions</text></g><g data-node="true"><rect x="848" y="480" width="336" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="864" y="492" width="76" height="18" rx="2" fill="#eef4fb"/><text x="872" y="505" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">FINAL POOL</text><text x="864" y="531" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Mode filtering and stable order</text><text x="864" y="554" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">initial X + built-in X → initial X</text><text x="864" y="572" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Coordinator conditions may narrow the set</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">X is an illustrative source marker; built-in precedence does not describe the outer merge.</text><text x="96" y="658" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Some getTools() modes return early; sorting supports Prompt cache, while actual visibility still requires request evidence.</text>
</svg>
