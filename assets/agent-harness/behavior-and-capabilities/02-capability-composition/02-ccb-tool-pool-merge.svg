<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" lang="zh-TW" role="img" aria-labelledby="02-ccb-tool-pool-merge-title 02-ccb-tool-pool-merge-desc" id="d-02-ccb-tool-pool-merge-root">
<title id="02-ccb-tool-pool-merge-title">CCB 工具池的兩層合併</title><desc id="02-ccb-tool-pool-merge-desc">內層同名保留內建工具，外層同名保留 initialTools，之後再篩選與排序。</desc>
<defs>
      <style>#d-02-ccb-tool-pool-merge-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-02-ccb-tool-pool-merge-root nav, #d-02-ccb-tool-pool-merge-root p, #d-02-ccb-tool-pool-merge-root li { font-size:14px;line-height:1.8 }
      #d-02-ccb-tool-pool-merge-root a { color:#0066d6 }
      #d-02-ccb-tool-pool-merge-root .diagram-container { width:100%;overflow-x:auto }
      #d-02-ccb-tool-pool-merge-root details { margin-top:24px;border-top:1px solid #b9cce3;padding-top:16px }
      #d-02-ccb-tool-pool-merge-root summary { cursor:pointer;font-weight:600 }
      #d-02-ccb-tool-pool-merge-root .notes { display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px }
      #d-02-ccb-tool-pool-merge-root ul { padding-left:20px }
      #d-02-ccb-tool-pool-merge-root nav, #d-02-ccb-tool-pool-merge-root details { display:none }
      #d-02-ccb-tool-pool-merge-root .diagram-container { overflow-x:visible }</style><marker id="d-02-ccb-tool-pool-merge-02-ccb-tool-pool-merge-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-02-ccb-tool-pool-merge-02-ccb-tool-pool-merge-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0078fc"/></marker></defs><rect width="1280" height="720" fill="#f5f8fc"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="200" height="24" fill="#f5f8fc"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">TOOL POOL / TWO MERGES</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">概念圖 · 原始碼查讀</text><rect x="96" y="116" width="64" height="4" fill="#0078fc"/><path d="M352 220 L392 220 Q400 220 400 228 L400 276 Q400 284 408 284 L456 284" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-ccb-tool-pool-merge-02-ccb-tool-pool-merge-arrow)"/><path d="M352 384 L408 384 Q416 384 416 376 L416 340 Q416 332 424 332 L456 332" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-ccb-tool-pool-merge-02-ccb-tool-pool-merge-arrow)"/><path d="M792 308 L848 308" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-ccb-tool-pool-merge-02-ccb-tool-pool-merge-arrow)"/><path d="M1016 372 L1016 416 Q1016 424 1008 424 L632 424 Q624 424 624 432 L624 480" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-ccb-tool-pool-merge-02-ccb-tool-pool-merge-arrow)"/><rect x="770.0" y="398" width="100" height="18" rx="2" fill="#fafdff"/><text x="820" y="410" font-size="10" fill="#52657d" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">INNER RESULT</text><path d="M352 536 L456 536" fill="none" stroke="#0078fc" stroke-width="1.2" marker-end="url(#d-02-ccb-tool-pool-merge-02-ccb-tool-pool-merge-arrow-accent)"/><path d="M792 536 L848 536" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-ccb-tool-pool-merge-02-ccb-tool-pool-merge-arrow)"/><g data-node="true"><rect x="96" y="164" width="256" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="112" y="176" width="64" height="18" rx="2" fill="#eef4fb"/><text x="120" y="189" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">BUILT-IN</text><text x="112" y="215" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">內建候選</text><text x="112" y="238" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">getAllBaseTools() → getTools()</text><text x="112" y="256" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">依模式、deny 等條件篩選</text></g><g data-node="true"><rect x="96" y="328" width="256" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="112" y="340" width="40" height="18" rx="2" fill="#eef4fb"/><text x="120" y="353" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">MCP</text><text x="112" y="379" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">MCP 候選</text><text x="112" y="402" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">套用 MCP deny 篩選</text><text x="112" y="420" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">各自排序後交內層合併</text></g><g data-node="true"><rect x="456" y="244" width="336" height="128" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="472" y="256" width="82" height="18" rx="2" fill="#eef4fb"/><text x="480" y="269" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">INNER MERGE</text><text x="472" y="295" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">內層：assembleToolPool()</text><text x="472" y="318" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">分區排序，再依名稱去重</text><text x="472" y="336" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">同名時保留內建工具</text></g><g data-node="true"><rect x="848" y="244" width="336" height="128" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="864" y="256" width="88" height="18" rx="2" fill="#eef4fb"/><text x="872" y="269" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">INNER RESULT</text><text x="864" y="295" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">內層組裝結果</text><text x="864" y="318" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">built-in X + MCP X → built-in X</text><text x="864" y="336" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">保留內建／MCP 分區</text></g><g data-node="true"><rect x="96" y="480" width="256" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="112" y="492" width="88" height="18" rx="2" fill="#eef4fb"/><text x="120" y="505" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">CALLER INPUT</text><text x="112" y="531" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">initialTools</text><text x="112" y="554" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">由 caller 傳入的初始集合</text><text x="112" y="572" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">示例：其中也有一個 X</text></g><g data-node="true"><rect x="456" y="480" width="336" height="112" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><rect x="472" y="492" width="82" height="18" rx="2" fill="#1c78e4"/><text x="480" y="505" font-size="9" fill="#ffffff" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">OUTER MERGE</text><text x="472" y="531" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">外層：再次合併與去重</text><text x="472" y="554" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">mergeAndFilterTools()</text><text x="472" y="572" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">同名時保留 initialTools</text></g><g data-node="true"><rect x="848" y="480" width="336" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="864" y="492" width="76" height="18" rx="2" fill="#eef4fb"/><text x="872" y="505" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">FINAL POOL</text><text x="864" y="531" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">模式篩選與穩定排序</text><text x="864" y="554" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">initial X + built-in X → initial X</text><text x="864" y="572" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Coordinator 等條件可再縮小集合</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">X 只是追蹤來源的示意名稱；「內建優先」不能概括外層合併規則。</text><text x="96" y="658" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">getTools() 某些模式提前回傳；排序支援 Prompt cache，實際模型可見內容仍需核對請求。</text>
</svg>
