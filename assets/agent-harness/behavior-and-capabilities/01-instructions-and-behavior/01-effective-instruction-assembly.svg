<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" lang="zh-TW" role="img" aria-labelledby="01-effective-instruction-assembly-title 01-effective-instruction-assembly-desc" id="d-01-effective-instruction-assembly-root">
<title id="01-effective-instruction-assembly-title">有效 System Prompt 的組成分支</title><desc id="01-effective-instruction-assembly-desc">依序檢查 override、Coordinator、proactive Agent 及一般分支；override 提前返回。</desc>
<defs>
      <style>#d-01-effective-instruction-assembly-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-01-effective-instruction-assembly-root nav, #d-01-effective-instruction-assembly-root p, #d-01-effective-instruction-assembly-root li { font-size:14px;line-height:1.8 }
      #d-01-effective-instruction-assembly-root a { color:#0066d6 }
      #d-01-effective-instruction-assembly-root .diagram-container { width:100%;overflow-x:auto }
      #d-01-effective-instruction-assembly-root details { margin-top:24px;border-top:1px solid #b9cce3;padding-top:16px }
      #d-01-effective-instruction-assembly-root summary { cursor:pointer;font-weight:600 }
      #d-01-effective-instruction-assembly-root .notes { display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px }
      #d-01-effective-instruction-assembly-root ul { padding-left:20px }
      #d-01-effective-instruction-assembly-root nav, #d-01-effective-instruction-assembly-root details { display:none }
      #d-01-effective-instruction-assembly-root .diagram-container { overflow-x:visible }</style><marker id="d-01-effective-instruction-assembly-01-effective-instruction-assembly-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-01-effective-instruction-assembly-01-effective-instruction-assembly-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0078fc"/></marker></defs><rect width="1280" height="720" fill="#f5f8fc"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="200" height="24" fill="#f5f8fc"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">SYSTEM PROMPT ASSEMBLY</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">概念圖 · 原始碼查讀</text><rect x="96" y="116" width="64" height="4" fill="#0078fc"/><path d="M496 204 L624 204" fill="none" stroke="#0078fc" stroke-width="1.2" marker-end="url(#d-01-effective-instruction-assembly-01-effective-instruction-assembly-arrow-accent)"/><rect x="536.0" y="176" width="48" height="18" rx="2" fill="#fafdff"/><text x="560" y="188" font-size="10" fill="#52657d" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">YES</text><path d="M296 244 L296 272" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-01-effective-instruction-assembly-01-effective-instruction-assembly-arrow)"/><rect x="312.0" y="250" width="40" height="18" rx="2" fill="#fafdff"/><text x="332" y="262" font-size="10" fill="#52657d" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">NO</text><path d="M496 312 L624 312" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-01-effective-instruction-assembly-01-effective-instruction-assembly-arrow)"/><rect x="536.0" y="284" width="48" height="18" rx="2" fill="#fafdff"/><text x="560" y="296" font-size="10" fill="#52657d" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">YES</text><path d="M296 352 L296 380" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-01-effective-instruction-assembly-01-effective-instruction-assembly-arrow)"/><rect x="312.0" y="358" width="40" height="18" rx="2" fill="#fafdff"/><text x="332" y="370" font-size="10" fill="#52657d" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">NO</text><path d="M496 420 L624 420" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-01-effective-instruction-assembly-01-effective-instruction-assembly-arrow)"/><rect x="536.0" y="392" width="48" height="18" rx="2" fill="#fafdff"/><text x="560" y="404" font-size="10" fill="#52657d" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">YES</text><path d="M296 460 L296 488" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-01-effective-instruction-assembly-01-effective-instruction-assembly-arrow)"/><rect x="312.0" y="466" width="40" height="18" rx="2" fill="#fafdff"/><text x="332" y="478" font-size="10" fill="#52657d" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">NO</text><path d="M496 528 L624 528" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-01-effective-instruction-assembly-01-effective-instruction-assembly-arrow)"/><g data-node="true"><rect x="96" y="164" width="400" height="80" rx="8" fill="#eef4fb" stroke="#b9cce3" stroke-width="1.2"/><rect x="112" y="176" width="64" height="18" rx="2" fill="#eef4fb"/><text x="120" y="189" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">OVERRIDE</text><text x="112" y="215" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">1. 有有效 override？</text><text x="112" y="238" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">命中後立即回傳</text></g><g data-node="true"><rect x="624" y="164" width="560" height="80" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><rect x="640" y="176" width="52" height="18" rx="2" fill="#1c78e4"/><text x="648" y="189" font-size="9" fill="#ffffff" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">RETURN</text><text x="640" y="215" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">只回傳 override</text><text x="640" y="238" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">不追加 append，也不選其他 Prompt</text></g><g data-node="true"><rect x="96" y="272" width="400" height="80" rx="8" fill="#eef4fb" stroke="#b9cce3" stroke-width="1.2"/><rect x="112" y="284" width="82" height="18" rx="2" fill="#eef4fb"/><text x="120" y="297" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">COORDINATOR</text><text x="112" y="323" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">2. Coordinator 條件成立？</text><text x="112" y="346" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">功能與模式啟用，且無 main-thread Agent</text></g><g data-node="true"><rect x="624" y="272" width="560" height="80" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="640" y="284" width="52" height="18" rx="2" fill="#eef4fb"/><text x="648" y="297" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">RETURN</text><text x="640" y="323" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Coordinator Prompt ＋ append（若有）</text><text x="640" y="346" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">使用這個分支的 Prompt</text></g><g data-node="true"><rect x="96" y="380" width="400" height="80" rx="8" fill="#eef4fb" stroke="#b9cce3" stroke-width="1.2"/><rect x="112" y="392" width="106" height="18" rx="2" fill="#eef4fb"/><text x="120" y="405" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">PROACTIVE AGENT</text><text x="112" y="431" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">3. proactive Agent 條件成立？</text><text x="112" y="454" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">具有 Agent Prompt，功能與執行狀態成立</text></g><g data-node="true"><rect x="624" y="380" width="560" height="80" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="640" y="392" width="52" height="18" rx="2" fill="#eef4fb"/><text x="648" y="405" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">RETURN</text><text x="640" y="431" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">default ＋ Agent 指令 ＋ append（若有）</text><text x="640" y="454" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">只有符合完整條件才採用此分支</text></g><g data-node="true"><rect x="96" y="488" width="400" height="80" rx="8" fill="#eef4fb" stroke="#b9cce3" stroke-width="1.2"/><rect x="112" y="500" width="58" height="18" rx="2" fill="#eef4fb"/><text x="120" y="513" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">GENERAL</text><text x="112" y="539" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">4. 一般分支</text><text x="112" y="562" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">前三項皆未命中</text></g><g data-node="true"><rect x="624" y="488" width="560" height="80" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="640" y="500" width="52" height="18" rx="2" fill="#eef4fb"/><text x="648" y="513" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">RETURN</text><text x="640" y="539" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Agent → custom → default</text><text x="640" y="562" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">取第一個適用 Prompt，再追加 append（若有）</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">override 只替換此函式的組裝結果；其他分支在 append 存在時才追加。</text><text x="96" y="658" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">canUseTool 與執行 Context 另行傳入；Prompt 不會覆蓋程式端授權。CCB 77a7934e15d6（第三方）。</text>
</svg>
