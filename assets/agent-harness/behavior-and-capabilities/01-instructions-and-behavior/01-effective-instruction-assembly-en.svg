<title id="01-effective-instruction-assembly-en-title">Effective System Prompt assembly</title><desc id="01-effective-instruction-assembly-en-desc">Check override, Coordinator, proactive Agent, and general branches in order; override returns early.</desc>
<defs>
      <style>#d-01-effective-instruction-assembly-en-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-01-effective-instruction-assembly-en-root nav, #d-01-effective-instruction-assembly-en-root p, #d-01-effective-instruction-assembly-en-root li { font-size:14px;line-height:1.8 }
      #d-01-effective-instruction-assembly-en-root a { color:#0066d6 }
      #d-01-effective-instruction-assembly-en-root .diagram-container { width:100%;overflow-x:auto }
      #d-01-effective-instruction-assembly-en-root details { margin-top:24px;border-top:1px solid #b9cce3;padding-top:16px }
      #d-01-effective-instruction-assembly-en-root summary { cursor:pointer;font-weight:600 }
      #d-01-effective-instruction-assembly-en-root .notes { display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px }
      #d-01-effective-instruction-assembly-en-root ul { padding-left:20px }
      #d-01-effective-instruction-assembly-en-root nav, #d-01-effective-instruction-assembly-en-root details { display:none }
