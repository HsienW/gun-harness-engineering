onsolas', 'Microsoft JhengHei', monospace" text-anchor="middle">NO</text><path d="M496 312 L624 312" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-01-effective-instruction-assembly-en-01-effective-instruction-assembly-en-arrow)"/><rect x="536.0" y="284" width="48" height="18" rx="2" fill="#fafdff"/><text x="560" y="296" font-size="10" fill="#52657d" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">YES</text><path d="M296 352 L296 380" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-01-effective-instruction-assembly-en-01-effective-instruction-assembly-en-arrow)"/><rect x="312.0" y="358" width="40" height="18" rx="2" fill="#fafdff"/><text x="332" y="370" font-size="10" fill="#52657d" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">NO</text><path d="M496 420 L624 420" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-01-effective-instruction-assembly-en-01-effective-instruction-assembly-en-arrow)"/><rect x="536.0" y="392" width="48" height="18" rx="2" fill="#fafdff"/><text x="560" y="404" font-size="10" fill="#52657d" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">YES</text><path d="M296 460 L296 488" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-01-effective-instruction-assembly-en-01-effective-instruction-assembly-en-arrow)"/><rect x="312.0" y="466" width="40" height="18" rx="2" fill="#fafdff"/><text x="332" y="478" font-size="10" fill="#52657d" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">NO</text><path d="M496 528 L624 528" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-01-effective-instruction-assembly-en-01-effective-instruction-assembly-en-arrow)"/><g data-node="true"><rect x="96" y="164" width="400" height="80" rx="8" fill="#eef4fb" stroke="#b9cce3" stroke-width="1.2"/><rect x="112" y="176" width="64" height="18" rx="2" fill="#eef4fb"/><text x="120" y="189" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">OVERRIDE</text><text x="112" y="215" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">1. Valid override?</text><text x="112" y="238" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Return immediately on a match</text></g><g data-node="true"><rect x="624" y="164" width="560" height="80" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><rect x="640" y="176" width="52" height="18" rx="2" fill="#1c78e4"/><text x="648" y="189" font-size="9" fill="#ffffff" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">RETURN</text><text x="640" y="215" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Return only the override</text><text x="640" y="238" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">No append and no further Prompt selection</text></g><g data-node="true"><rect x="96" y="272" width="400" height="80" rx="8" fill="#eef4fb" stroke="#b9cce3" stroke-width="1.2"/><rect x="112" y="284" width="82" height="18" rx="2" fill="#eef4fb"/><text x="120" y="297" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">COORDINATOR</text><text x="112" y="323" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">2. Coordinator conditions met?</text><text x="112" y="346" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Feature and mode on; no main-thread Agent</text></g><g data-node="true"><rect x="624" y="272" width="560" height="80" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="640" y="284" width="52" height="18" rx="2" fill="#eef4fb"/><text x="648" y="297" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">RETURN</text><text x="640" y="323" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Coordinator Prompt + optional append</text><text x="640" y="346" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Use this branch&#x27;s Prompt</text></g><g data-node="true"><rect x="96" y="380" width="400" height="80" rx="8" fill="#eef4fb" stroke="#b9cce3" stroke-width="1.2"/><rect x="112" y="392" width="106" height="18" rx="2" fill="#eef4fb"/><text x="120" y="405" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">PROACTIVE AGENT</text><text x="112" y="431" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">3. Proactive Agent conditions met?</text><text x="112" y="454" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Agent Prompt exists; feature and state match</text></g><g data-node="true"><rect x="624" y="380" width="560" height="80" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="640" y="392" width="52" height="18" rx="2" fill="#eef4fb"/><text x="648" y="405" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">RETURN</text><text x="640" y="431" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Default + Agent instructions + optional append</text><text x="640" y="454" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Select only when all conditions hold</text></g><g data-node="true"><rect x="96" y="488" width="400" height="80" rx="8" fill="#eef4fb" stroke="#b9cce3" stroke-width="1.2"/><rect x="112" y="500" width="58" height="18" rx="2" fill="#eef4fb"/><text x="120" y="513" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">GENERAL</text><text x="112" y="539" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">4. General branch</text><text x="112" y="562" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">None of the earlier branches matched</text></g><g data-node="true"><rect x="624" y="488" width="560" height="80" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="640" y="500" width="52" height="18" rx="2" fill="#eef4fb"/><text x="648" y="513" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">RETURN</text><text x="640" y="539" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Agent → custom → default</text><text x="640" y="562" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">First applicable Prompt, then optional append</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Override replaces this function&#x27;s assembly result; other branches append only when content is present.</text><text x="96" y="658" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">canUseTool and execution Context are separate; Prompt assembly does not override code authorization. CCB 77a7934e15d6 (third party).</text>
