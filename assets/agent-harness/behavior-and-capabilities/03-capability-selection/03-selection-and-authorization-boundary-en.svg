<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" lang="en" role="img" aria-labelledby="03-selection-and-authorization-boundary-en-title 03-selection-and-authorization-boundary-en-desc" id="d-03-selection-and-authorization-boundary-en-root">
<title id="03-selection-and-authorization-boundary-en-title">From capability sets to concrete calls</title><desc id="03-selection-and-authorization-boundary-en-desc">Registration, availability, and visibility are distinct observations; model and code calls need concrete execution decisions.</desc>
<defs>
      <style>#d-03-selection-and-authorization-boundary-en-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-03-selection-and-authorization-boundary-en-root nav, #d-03-selection-and-authorization-boundary-en-root p, #d-03-selection-and-authorization-boundary-en-root li { font-size:14px;line-height:1.8 }
      #d-03-selection-and-authorization-boundary-en-root a { color:#0066d6 }
      #d-03-selection-and-authorization-boundary-en-root .diagram-container { width:100%;overflow-x:auto }
      #d-03-selection-and-authorization-boundary-en-root details { margin-top:24px;border-top:1px solid #b9cce3;padding-top:16px }
      #d-03-selection-and-authorization-boundary-en-root summary { cursor:pointer;font-weight:600 }
      #d-03-selection-and-authorization-boundary-en-root .notes { display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px }
      #d-03-selection-and-authorization-boundary-en-root ul { padding-left:20px }
      #d-03-selection-and-authorization-boundary-en-root nav, #d-03-selection-and-authorization-boundary-en-root details { display:none }
      #d-03-selection-and-authorization-boundary-en-root .diagram-container { overflow-x:visible }</style><marker id="d-03-selection-and-authorization-boundary-en-03-selection-and-authorization-boundary-en-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-03-selection-and-authorization-boundary-en-03-selection-and-authorization-boundary-en-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0078fc"/></marker></defs><rect width="1280" height="720" fill="#f5f8fc"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="224" height="24" fill="#f5f8fc"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">SELECTION / AUTHORIZATION</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">CONCEPTUAL / SOURCE INSPECTION</text><rect x="96" y="116" width="64" height="4" fill="#0078fc"/><path d="M400 220 L456 220" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-03-selection-and-authorization-boundary-en-03-selection-and-authorization-boundary-en-arrow)"/><path d="M792 220 L848 220" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-03-selection-and-authorization-boundary-en-03-selection-and-authorization-boundary-en-arrow)"/><path d="M624 276 L624 316 Q624 324 616 324 L264 324 Q256 324 256 332 L256 380" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-03-selection-and-authorization-boundary-en-03-selection-and-authorization-boundary-en-arrow)"/><rect x="382.0" y="298" width="92" height="18" rx="2" fill="#fafdff"/><text x="428" y="310" font-size="10" fill="#52657d" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">CODE ROUTE</text><path d="M1016 276 L1016 380" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-03-selection-and-authorization-boundary-en-03-selection-and-authorization-boundary-en-arrow)"/><rect x="1044.0" y="320" width="96" height="18" rx="2" fill="#fafdff"/><text x="1092" y="332" font-size="10" fill="#52657d" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">MODEL PATH</text><path d="M416 444 L428 444 Q436 444 436 452 L436 488 Q436 496 444 496 L456 496" fill="none" stroke="#0078fc" stroke-width="1.2" marker-end="url(#d-03-selection-and-authorization-boundary-en-03-selection-and-authorization-boundary-en-arrow-accent)"/><path d="M864 444 L852 444 Q844 444 844 452 L844 488 Q844 496 836 496 L824 496" fill="none" stroke="#0078fc" stroke-width="1.2" marker-end="url(#d-03-selection-and-authorization-boundary-en-03-selection-and-authorization-boundary-en-arrow-accent)"/><g data-node="true"><rect x="96" y="164" width="304" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="112" y="176" width="64" height="18" rx="2" fill="#eef4fb"/><text x="120" y="189" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">REGISTER</text><text x="112" y="215" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">1. Registered</text><text x="112" y="238" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Capability definitions in the Registry</text><text x="112" y="256" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Evidence: source, name, version</text></g><g data-node="true"><rect x="456" y="164" width="336" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="472" y="176" width="70" height="18" rx="2" fill="#eef4fb"/><text x="480" y="189" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">AVAILABLE</text><text x="472" y="215" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">2. Available at entry</text><text x="472" y="238" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Compose by Agent, mode, and load conditions</text><text x="472" y="256" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Evidence: filters and resulting list</text></g><g data-node="true"><rect x="848" y="164" width="336" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="864" y="176" width="52" height="18" rx="2" fill="#eef4fb"/><text x="872" y="189" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">EXPOSE</text><text x="864" y="215" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">3. Visible to the model</text><text x="864" y="238" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Descriptions in this actual request</text><text x="864" y="256" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Evidence: request tool Schemas</text></g><g data-node="true"><rect x="96" y="380" width="320" height="128" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="112" y="392" width="88" height="18" rx="2" fill="#eef4fb"/><text x="120" y="405" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">CODE ROUTING</text><text x="112" y="431" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">4-B. Code selects the call</text><text x="112" y="454" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Select through extraction, rules, or routing</text><text x="112" y="472" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">No prior model exposure is required</text></g><g data-node="true"><rect x="864" y="380" width="320" height="128" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="880" y="392" width="100" height="18" rx="2" fill="#eef4fb"/><text x="888" y="405" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">MODEL PROPOSAL</text><text x="880" y="431" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">4-A. Model proposes a call</text><text x="880" y="454" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Name, arguments, and call identity</text><text x="880" y="472" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">A direct answer may contain no tool call</text></g><g data-node="true"><rect x="456" y="432" width="368" height="144" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><rect x="472" y="444" width="94" height="18" rx="2" fill="#1c78e4"/><text x="480" y="457" font-size="9" fill="#ffffff" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">CONCRETE CALL</text><text x="472" y="483" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">5. Check this call&#x27;s execution decision</text><text x="472" y="506" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Consumer, trusted identity, resources, policy</text><text x="472" y="524" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Allowed / denied / confirmation / unavailable</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Schema validation checks input shape; resource access still requires the concrete call&#x27;s authorization consumer.</text><text x="96" y="658" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">These are observation points, not a shared five-stage pipeline; previously exposed descriptions do not vanish when hidden later.</text>
</svg>
