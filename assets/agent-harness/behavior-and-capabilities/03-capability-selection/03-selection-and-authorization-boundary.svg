<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" lang="zh-TW" role="img" aria-labelledby="03-selection-and-authorization-boundary-title 03-selection-and-authorization-boundary-desc" id="d-03-selection-and-authorization-boundary-root">
<title id="03-selection-and-authorization-boundary-title">從能力集合到具體呼叫</title><desc id="03-selection-and-authorization-boundary-desc">註冊、入口可用與模型可見是不同觀察點，模型提案與程式路由都需核對具體執行決策。</desc>
<defs>
      <style>#d-03-selection-and-authorization-boundary-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-03-selection-and-authorization-boundary-root nav, #d-03-selection-and-authorization-boundary-root p, #d-03-selection-and-authorization-boundary-root li { font-size:14px;line-height:1.8 }
      #d-03-selection-and-authorization-boundary-root a { color:#0066d6 }
      #d-03-selection-and-authorization-boundary-root .diagram-container { width:100%;overflow-x:auto }
      #d-03-selection-and-authorization-boundary-root details { margin-top:24px;border-top:1px solid #b9cce3;padding-top:16px }
      #d-03-selection-and-authorization-boundary-root summary { cursor:pointer;font-weight:600 }
      #d-03-selection-and-authorization-boundary-root .notes { display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px }
      #d-03-selection-and-authorization-boundary-root ul { padding-left:20px }
      #d-03-selection-and-authorization-boundary-root nav, #d-03-selection-and-authorization-boundary-root details { display:none }
      #d-03-selection-and-authorization-boundary-root .diagram-container { overflow-x:visible }</style><marker id="d-03-selection-and-authorization-boundary-03-selection-and-authorization-boundary-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-03-selection-and-authorization-boundary-03-selection-and-authorization-boundary-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0078fc"/></marker></defs><rect width="1280" height="720" fill="#f5f8fc"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="224" height="24" fill="#f5f8fc"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">SELECTION / AUTHORIZATION</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">概念圖 · 原始碼查讀</text><rect x="96" y="116" width="64" height="4" fill="#0078fc"/><path d="M400 220 L456 220" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-03-selection-and-authorization-boundary-03-selection-and-authorization-boundary-arrow)"/><path d="M792 220 L848 220" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-03-selection-and-authorization-boundary-03-selection-and-authorization-boundary-arrow)"/><path d="M624 276 L624 316 Q624 324 616 324 L264 324 Q256 324 256 332 L256 380" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-03-selection-and-authorization-boundary-03-selection-and-authorization-boundary-arrow)"/><rect x="382.0" y="298" width="92" height="18" rx="2" fill="#fafdff"/><text x="428" y="310" font-size="10" fill="#52657d" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">CODE ROUTE</text><path d="M1016 276 L1016 380" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-03-selection-and-authorization-boundary-03-selection-and-authorization-boundary-arrow)"/><rect x="1044.0" y="320" width="96" height="18" rx="2" fill="#fafdff"/><text x="1092" y="332" font-size="10" fill="#52657d" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">MODEL PATH</text><path d="M416 444 L428 444 Q436 444 436 452 L436 488 Q436 496 444 496 L456 496" fill="none" stroke="#0078fc" stroke-width="1.2" marker-end="url(#d-03-selection-and-authorization-boundary-03-selection-and-authorization-boundary-arrow-accent)"/><path d="M864 444 L852 444 Q844 444 844 452 L844 488 Q844 496 836 496 L824 496" fill="none" stroke="#0078fc" stroke-width="1.2" marker-end="url(#d-03-selection-and-authorization-boundary-03-selection-and-authorization-boundary-arrow-accent)"/><g data-node="true"><rect x="96" y="164" width="304" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="112" y="176" width="64" height="18" rx="2" fill="#eef4fb"/><text x="120" y="189" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">REGISTER</text><text x="112" y="215" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">1. 已註冊</text><text x="112" y="238" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Registry 中的能力定義</text><text x="112" y="256" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">證據：來源、名稱與版本</text></g><g data-node="true"><rect x="456" y="164" width="336" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="472" y="176" width="70" height="18" rx="2" fill="#eef4fb"/><text x="480" y="189" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">AVAILABLE</text><text x="472" y="215" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">2. 入口可用</text><text x="472" y="238" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">依 Agent、模式與載入條件組裝</text><text x="472" y="256" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">證據：篩選條件與清單</text></g><g data-node="true"><rect x="848" y="164" width="336" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="864" y="176" width="52" height="18" rx="2" fill="#eef4fb"/><text x="872" y="189" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">EXPOSE</text><text x="864" y="215" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">3. 模型可見</text><text x="864" y="238" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">本次請求真正帶入的描述</text><text x="864" y="256" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">證據：請求中的工具 Schema</text></g><g data-node="true"><rect x="96" y="380" width="320" height="128" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="112" y="392" width="88" height="18" rx="2" fill="#eef4fb"/><text x="120" y="405" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">CODE ROUTING</text><text x="112" y="431" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">4-B. 程式決定呼叫</text><text x="112" y="454" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">由輸入抽取、規則或路由選擇</text><text x="112" y="472" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">不必先向模型曝光能力</text></g><g data-node="true"><rect x="864" y="380" width="320" height="128" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="880" y="392" width="100" height="18" rx="2" fill="#eef4fb"/><text x="888" y="405" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">MODEL PROPOSAL</text><text x="880" y="431" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">4-A. 模型提出呼叫</text><text x="880" y="454" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">名稱、參數與呼叫識別</text><text x="880" y="472" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">也可能直接回答而沒有 Tool Call</text></g><g data-node="true"><rect x="456" y="432" width="368" height="144" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><rect x="472" y="444" width="94" height="18" rx="2" fill="#1c78e4"/><text x="480" y="457" font-size="9" fill="#ffffff" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">CONCRETE CALL</text><text x="472" y="483" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">5. 核對這次呼叫的執行決策</text><text x="472" y="506" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Consumer、可信身分、資源、政策與批准</text><text x="472" y="524" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">允許／拒絕／待確認／不可用</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Schema 驗證輸入形狀；資源可否存取，仍須核對具體呼叫的授權 consumer。</text><text x="96" y="658" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">這是觀察位置，不宣稱兩專案共用五階段管線；先前曝光內容也不會因後續隱藏而消失。</text>
</svg>
