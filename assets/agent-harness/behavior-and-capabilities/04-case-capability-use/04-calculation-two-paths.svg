      #d-04-calculation-two-paths-root ul { padding-left:20px }
      #d-04-calculation-two-paths-root nav, #d-04-calculation-two-paths-root details { display:none }
      #d-04-calculation-two-paths-root .diagram-container { overflow-x:visible }</style><marker id="d-04-calculation-two-paths-04-calculation-two-paths-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-04-calculation-two-paths-04-calculation-two-paths-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0078fc"/></marker></defs><rect width="1280" height="720" fill="#f5f8fc"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="240" height="24" fill="#f5f8fc"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">MODEL PROPOSAL / CODE ROUTE</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">概念圖 · 原始碼查讀</text><rect x="96" y="116" width="64" height="4" fill="#0078fc"/><path d="M344 292 L344 332" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-04-calculation-two-paths-04-calculation-two-paths-arrow)"/><rect x="366.0" y="304" width="88" height="18" rx="2" fill="#fafdff"/><text x="410" y="316" font-size="10" fill="#52657d" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">WITH CALLS</text><path d="M936 292 L936 332" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-04-calculation-two-paths-04-calculation-two-paths-arrow)"/><rect x="958.0" y="304" width="84" height="18" rx="2" fill="#fafdff"/><text x="1000" y="316" font-size="10" fill="#52657d" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">EXTRACTED</text><path d="M344 444 L344 484" fill="none" stroke="#0078fc" stroke-width="1.2" marker-end="url(#d-04-calculation-two-paths-04-calculation-two-paths-arrow-accent)"/><rect x="370.0" y="456" width="72" height="18" rx="2" fill="#fafdff"/><text x="406" y="468" font-size="10" fill="#52657d" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">ALLOWED</text><path d="M936 444 L936 484" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-04-calculation-two-paths-04-calculation-two-paths-arrow)"/><text x="96" y="156" font-size="12" fill="#52657d" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">INPUT: (1250 + 350) * 1.05</text><text x="688" y="156" font-size="12" fill="#52657d" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">EXPECTED: 1680 / NOT EXECUTED</text><g data-node="true"><rect x="96" y="180" width="496" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="112" y="192" width="46" height="18" rx="2" fill="#eef4fb"/><text x="120" y="205" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">MODEL</text><text x="112" y="231" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">MCP Agent：模型決定是否提案</text><text x="112" y="254" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">bindTools(tools).invoke(modelInput)</text><text x="112" y="272" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">沒有 tool_calls → 直接回覆並結束</text></g><g data-node="true"><rect x="688" y="180" width="496" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="704" y="192" width="40" height="18" rx="2" fill="#eef4fb"/><text x="712" y="205" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">CODE</text><text x="704" y="231" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Math Agent：程式抽取算式</text><text x="704" y="254" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">extractExpressionFromUserMessage()</text><text x="704" y="272" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">抽取不到算式 → 另走 Math Prompt 模型分支</text></g><g data-node="true"><rect x="96" y="332" width="496" height="112" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><rect x="112" y="344" width="76" height="18" rx="2" fill="#1c78e4"/><text x="120" y="357" font-size="9" fill="#ffffff" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">GOVERNANCE</text><text x="112" y="383" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">authorization_gate</text><text x="112" y="406" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">核對本次工具、參數與可信 Context</text><text x="112" y="424" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">拒絕／不可用 → 結果；待確認 → 保存並中斷</text></g><g data-node="true"><rect x="688" y="332" width="496" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="704" y="344" width="142" height="18" rx="2" fill="#eef4fb"/><text x="712" y="357" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">INITIALIZATION CHOICE</text><text x="704" y="383" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">使用初始化時選定的 calculator</text><text x="704" y="406" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">loadMathCalculatorTool()</text><text x="704" y="424" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Pipeline 關 → 原始工具；開 → Runtime 工具</text></g><g data-node="true"><rect x="96" y="484" width="496" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="112" y="496" width="148" height="18" rx="2" fill="#eef4fb"/><text x="120" y="509" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">DISPATCH / MODEL REPLY</text><text x="112" y="535" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">派送後以 ToolMessage 回到模型</text><text x="112" y="558" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">physical_dispatch → executeAuthorizedTyped()</text><text x="112" y="576" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">核對結果內容，再由模型產生最終回覆</text></g><g data-node="true"><rect x="688" y="484" width="496" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="704" y="496" width="142" height="18" rx="2" fill="#eef4fb"/><text x="712" y="509" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">DIRECT INVOKE / REPLY</text><text x="704" y="535" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">工具結果直接套入程式回覆模板</text><text x="704" y="558" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">此直接分支不先建立模型 Tool Call</text><text x="704" y="576" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Error: 字串也可能進模板，仍需核對成功</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">教學情境與靜態追蹤，未送出請求或取得執行紀錄；1680 只是預期值。Chat Gun 92a5673003e4。</text><text x="96" y="658" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">MCP 待確認須完成流程才繼續；Math 需核對其工具與 Context，不能套用 MCP Graph 的同一授權時序。</text>
</svg>
