<title id="04-calculation-two-paths-title">同一算式，兩種能力使用路徑</title><desc id="04-calculation-two-paths-desc">同一算式分別經 MCP 模型提案與 Math 程式抽取；預期值 1680 並非實測結果。</desc>
<defs>
      <style>#d-04-calculation-two-paths-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
