<rect x="88" y="249" width="592" height="95" rx="9" fill="#e7f2ff" stroke="#80baff" />
<text x="106" y="280" class="heading">Rules, messages, and tool descriptions</text>
<text x="106" y="309" class="body">bindTools(tools).invoke(modelInput)</text>
</g>
<path d="M 384 344 V 366" fill="none" stroke="#52657d" stroke-width="1.7" marker-end="url(#arrow)" />
<g data-node="Model response">
