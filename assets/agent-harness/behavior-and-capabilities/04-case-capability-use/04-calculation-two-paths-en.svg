<text x="106" y="549" class="heading">authorization_gate</text>
<text x="106" y="578" class="body">Find the governance executor.</text>
<text x="106" y="604" class="body">Check this name, arguments,</text>
<text x="106" y="630" class="body">and trusted execution Context.</text>
</g>
<path d="M 420 585 H 450" fill="none" stroke="#52657d" stroke-width="1.7" marker-end="url(#arrow)" />
