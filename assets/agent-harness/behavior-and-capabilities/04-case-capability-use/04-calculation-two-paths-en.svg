<text x="476" y="578" class="body">Denied / unavailable:</text>
<text x="476" y="604" class="body">produce a tool result.</text>
<text x="476" y="630" class="body">Confirmation needed:</text>
<text x="476" y="656" class="body">save state; interrupt.</text>
</g>
<path d="M 254 655 V 701" fill="none" stroke="#52657d" stroke-width="1.7" marker-end="url(#arrow)" />
