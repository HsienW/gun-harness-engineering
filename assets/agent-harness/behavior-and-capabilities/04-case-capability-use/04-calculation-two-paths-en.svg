text><path d="M344 444 L344 484" fill="none" stroke="#0078fc" stroke-width="1.2" marker-end="url(#d-04-calculation-two-paths-en-04-calculation-two-paths-en-arrow-accent)"/><rect x="370.0" y="456" width="72" height="18" rx="2" fill="#fafdff"/><text x="406" y="468" font-size="10" fill="#52657d" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">ALLOWED</text><path d="M936 444 L936 484" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-04-calculation-two-paths-en-04-calculation-two-paths-en-arrow)"/><text x="96" y="156" font-size="12" fill="#52657d" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">INPUT: (1250 + 350) * 1.05</text><text x="688" y="156" font-size="12" fill="#52657d" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">EXPECTED: 1680 / NOT EXECUTED</text><g data-node="true"><rect x="96" y="180" width="496" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="112" y="192" width="46" height="18" rx="2" fill="#eef4fb"/><text x="120" y="205" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">MODEL</text><text x="112" y="231" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">MCP Agent: the model may propose a call</text><text x="112" y="254" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">bindTools(tools).invoke(modelInput)</text><text x="112" y="272" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">No tool_calls → direct reply and end</text></g><g data-node="true"><rect x="688" y="180" width="496" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="704" y="192" width="40" height="18" rx="2" fill="#eef4fb"/><text x="712" y="205" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">CODE</text><text x="704" y="231" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Math Agent: code extracts an expression</text><text x="704" y="254" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">extractExpressionFromUserMessage()</text><text x="704" y="272" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">No expression → take the Math Prompt model branch</text></g><g data-node="true"><rect x="96" y="332" width="496" height="112" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><rect x="112" y="344" width="76" height="18" rx="2" fill="#1c78e4"/><text x="120" y="357" font-size="9" fill="#ffffff" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">GOVERNANCE</text><text x="112" y="383" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">authorization_gate</text><text x="112" y="406" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Check this tool, arguments, and trusted Context</text><text x="112" y="424" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Denied / unavailable → result; confirmation → interrupt</text></g><g data-node="true"><rect x="688" y="332" width="496" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="704" y="344" width="142" height="18" rx="2" fill="#eef4fb"/><text x="712" y="357" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">INITIALIZATION CHOICE</text><text x="704" y="383" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Use the calculator selected at initialization</text><text x="704" y="406" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">loadMathCalculatorTool()</text><text x="704" y="424" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Pipeline off → original tool; on → Runtime tool</text></g><g data-node="true"><rect x="96" y="484" width="496" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="112" y="496" width="148" height="18" rx="2" fill="#eef4fb"/><text x="120" y="509" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">DISPATCH / MODEL REPLY</text><text x="112" y="535" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Dispatch, then return ToolMessage to the model</text><text x="112" y="558" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">physical_dispatch → executeAuthorizedTyped()</text><text x="112" y="576" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Check result content; the model produces the final reply</text></g><g data-node="true"><rect x="688" y="484" width="496" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="704" y="496" width="142" height="18" rx="2" fill="#eef4fb"/><text x="712" y="509" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">DIRECT INVOKE / REPLY</text><text x="704" y="535" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Put the tool result into a code reply template</text><text x="704" y="558" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">This direct branch creates no prior model Tool Call</text><text x="704" y="576" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">An Error: string can enter the template; check success</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Teaching scenario and static trace: no request or execution record; 1680 is expected only. Chat Gun 92a5673003e4.</text><text x="96" y="658" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">MCP confirmation must finish before continuation; Math uses its own tool and Context path, not the same MCP Graph authorization sequence.</text>
