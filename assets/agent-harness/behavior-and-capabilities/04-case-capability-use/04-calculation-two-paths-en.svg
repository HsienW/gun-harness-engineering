<text x="476" y="405" class="heading">Direct reply</text>
<text x="476" y="434" class="body">No tool use evidence</text>
<text x="476" y="460" class="body">for this request.</text>
</g>
<path d="M 254 484 V 510" fill="none" stroke="#52657d" stroke-width="1.7" marker-end="url(#arrow)" />
<text x="267" y="505" class="label">With calls</text>
