<text x="64" y="64" class="kicker">BEHAVIOR &amp; CAPABILITIES / 04</text>
<text x="64" y="113" class="title">One expression, two capability paths</text>
<text x="64" y="151" class="small">Input: (1250 + 350) * 1.05. Explain the expression and result. Expected value: 1680.</text>
<rect x="64" y="183" width="640" height="907" rx="9" fill="#f1f6fc" stroke="#b9cce3" />
<rect x="728" y="183" width="648" height="907" rx="9" fill="#f1f6fc" stroke="#b9cce3" />
<text x="88" y="222" class="heading">MCP Agent / model proposes a tool</text>
<text x="752" y="222" class="heading">Math Agent / code extracts an expression</text>
