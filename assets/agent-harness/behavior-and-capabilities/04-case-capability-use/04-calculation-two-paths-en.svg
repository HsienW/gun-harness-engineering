<title id="title">One expression, two capability paths</title><desc id="desc">A teaching scenario compares the MCP Agent model proposal and authorization Graph with Math Agent expression extraction and direct invocation. With the Math pipeline disabled, the original calculator is used; when enabled, Runtime tools are used. The expected value 1680 is not a measured result.</desc>
