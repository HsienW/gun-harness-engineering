<g data-node="Runtime tool">
<rect x="1060" y="669" width="292" height="115" rx="9" fill="#fff" stroke="#b9cce3" />
<text x="1078" y="700" class="heading">Runtime tool</text>
<text x="1078" y="725" class="body">Obtain the composed tool.</text>
<text x="1078" y="748" class="body">Check governance and Context</text>
<text x="1078" y="771" class="body">for this path.</text></g>
<path d="M 898 784 V 816 H 1052 V 849" fill="none" stroke="#52657d" stroke-width="1.7" marker-end="url(#arrow)" />
<path d="M 1206 784 V 816 H 1052" fill="none" stroke="#52657d" stroke-width="1.7" marker-end="url(#arrow)" />
<g data-node="Tool result → code reply template">
<rect x="752" y="857" width="600" height="184" rx="9" fill="#e7f2ff" stroke="#80baff" />
<text x="770" y="888" class="heading">Tool result → code reply template</text>
<text x="770" y="917" class="body">No model Tool Call is created first.</text>
<text x="770" y="943" class="body">This direct branch does not ask the model to rewrite the result.</text>
<text x="770" y="969" class="body">An Error: string can still enter the template;</text>
<text x="770" y="995" class="body">calculation success needs a separate check.</text>
</g>
<rect x="64" y="1121" width="1312" height="105" rx="9" fill="#eef4fb" stroke="#b9cce3" />
<text x="84" y="1150" class="small">Shared prerequisites: tool initialization and entry conditions must hold. The MCP model path also needs Provider tool binding support.</text>
<text x="84" y="1177" class="small">On the left, pending confirmation must pass its confirmation flow. Resume, remaining calls, and multiple rounds are not expanded here.</text>
<text x="84" y="1204" class="small">Teaching scenario and static source trace only: no request was sent or execution record obtained. 1680 is the expected value.</text>
