<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="memory-title memory-desc" id="input-context-04-memory">
  <title id="memory-title">Memory 召回與 Context 容量取捨</title>
  <desc id="memory-desc">Chat Gun 只有在 canonical execution context 與 Memory provider 等條件具備時才發出 recall。未發出 recall 時沒有 Memory 區塊；已發出但 timeout 或錯誤時略過 Memory 並在 manifest 留下原因碼；召回與授權成功則產生 P3 候選區塊，仍須經 Context 容量選取。預設壓縮主要截短或移除 P5 與 P4，並不生成歷史摘要。</desc>
  <defs>
    <style>
      #input-context-04-memory { font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #input-context-04-memory .ink { fill: #102743; }
      #input-context-04-memory .muted { fill: #52657d; }
      #input-context-04-memory .blue { fill: #0066d6; }
      #input-context-04-memory .small { font-size: 12px; }
      #input-context-04-memory .body { font-size: 14px; }
      #input-context-04-memory .label { font-size: 15px; font-weight: 600; }
      #input-context-04-memory .mono { font-family: 'Geist Mono', Consolas, monospace; }
    </style>
    <marker id="memory-arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7 Z" fill="#52657d"/></marker>
  </defs>
  <rect width="1280" height="720" fill="#f5f8fc"/>
  <rect x="56" y="72" width="1168" height="576" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/>
  <rect x="88" y="60" width="292" height="24" fill="#f5f8fc"/>
  <text x="96" y="77" class="blue mono small" letter-spacing=".10em">INPUT &amp; CONTEXT / 04</text>
  <text x="96" y="133" class="ink" font-size="26" font-weight="600">Memory 先召回，Context 再取捨</text>
  <text x="96" y="164" class="muted body">「沒有 Memory」有不同原因；召回成功的紀錄，也還只是容量選取的候選區塊。</text>

  <rect x="96" y="201" width="348" height="127" rx="8" fill="#ffffff" stroke="#80baff" stroke-width="1.4"/>
  <text x="117" y="231" class="blue label">召回前提</text>
  <text x="117" y="261" class="ink body">canonical execution context</text>
  <text x="117" y="286" class="ink body">Principal、Scope 與 Memory provider</text>
  <text x="117" y="310" class="muted small">provider 可停用；預設 Store 是 in-memory</text>
  <path d="M453 265 H483" fill="none" stroke="#52657d" stroke-width="1.5" marker-end="url(#memory-arrow)"/>
  <rect x="492" y="201" width="343" height="127" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/>
  <text x="513" y="231" class="ink label">Memory recall</text>
  <text x="513" y="260" class="ink body">依身分與範圍檢索，治理服務授權</text>
  <text x="513" y="287" class="muted small">成功後帶出來源與 revision 等 metadata</text>
  <text x="513" y="310" class="muted small">是否發出 recall，要從設定與呼叫路徑核對</text>

  <path d="M844 265 H873" fill="none" stroke="#52657d" stroke-width="1.5" marker-end="url(#memory-arrow)"/>
  <rect x="882" y="201" width="302" height="127" rx="8" fill="#e7f2ff" stroke="#80baff"/>
  <text x="903" y="231" class="blue label">成功召回</text>
  <text x="903" y="260" class="ink body">P3 Memory 候選區塊</text>
  <text x="903" y="286" class="muted small">進入組裝器後仍受有效上限約束</text>
  <text x="903" y="310" class="muted small">不是保證被保留的模型輸入</text>

  <rect x="96" y="351" width="524" height="99" rx="8" fill="#f6f8fb" stroke="#b9cce3"/>
  <text x="117" y="380" class="ink label">條件不具備：未發出 recall</text>
  <text x="117" y="408" class="muted body">沒有 provider 或缺少必要執行脈絡 → 沒有 Memory 區塊</text>
  <text x="117" y="432" class="muted small">僅看 manifest 沒有 Memory，無法判定是否屬於這條路徑。</text>

  <rect x="635" y="351" width="430" height="99" rx="8" fill="#fff1f2" stroke="#d7a0aa"/>
  <text x="656" y="380" fill="#8d5260" class="label">已發出 recall：timeout 或錯誤</text>
  <text x="656" y="408" class="ink body">略過 Memory，manifest 記下失敗原因</text>
  <text x="656" y="432" class="muted mono small">memory_timeout / memory_unavailable</text>

  <path d="M1130 337 V462" fill="none" stroke="#52657d" stroke-width="1.5" marker-end="url(#memory-arrow)"/>
  <rect x="96" y="471" width="1088" height="111" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/>
  <text x="117" y="501" class="ink label">容量取捨（預設策略）</text>
  <rect x="117" y="515" width="326" height="43" rx="5" fill="#eef4fb" stroke="#b9cce3"/>
  <text x="133" y="542" class="ink small">P5 ≤2,000 字元；P4 ≤500 字元</text>
  <path d="M451 536 H481" fill="none" stroke="#52657d" stroke-width="1.5" marker-end="url(#memory-arrow)"/>
  <rect x="490" y="515" width="298" height="43" rx="5" fill="#eef4fb" stroke="#b9cce3"/>
  <text x="505" y="542" class="ink small">仍超限：依 P5 → P2 移除區塊</text>
  <path d="M796 536 H825" fill="none" stroke="#52657d" stroke-width="1.5" marker-end="url(#memory-arrow)"/>
  <rect x="834" y="515" width="329" height="43" rx="5" fill="#e7f2ff" stroke="#80baff"/>
  <text x="849" y="542" class="blue small">保留區塊組成模型可見 Context</text>

  <text x="96" y="617" class="ink small">Chat Gun 預設壓縮是截短與移除，沒有自動產生歷史摘要；P0 或 P0＋P1 超限會停止正常組裝。</text>
  <text x="96" y="682" class="muted small">依 Chat Gun Memory 與 Context 程式路徑繪製；不同部署需核對 provider、feature flag 與模型上限。</text>
</svg>
