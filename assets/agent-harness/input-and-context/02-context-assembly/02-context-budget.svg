<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="context-budget-title context-budget-desc" id="input-context-02-budget">
  <title id="context-budget-title">Context 容量不足時的取捨</title>
  <desc id="context-budget-desc">候選來源依 P0 至 P5 排列。組裝器依有效上限先截短 P5 與 P4，再依序移除低優先區塊；P0 或 P0 加 P1 仍超限時停止正常組裝。模型可見文字、manifest 與 truncatedBlocks 是不同輸出。</desc>
  <defs>
    <style>
      #input-context-02-budget { font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #input-context-02-budget .ink { fill: #102743; }
      #input-context-02-budget .muted { fill: #52657d; }
      #input-context-02-budget .blue { fill: #0066d6; }
      #input-context-02-budget .small { font-size: 12px; }
      #input-context-02-budget .body { font-size: 14px; }
      #input-context-02-budget .label { font-size: 15px; font-weight: 600; }
      #input-context-02-budget .mono { font-family: 'Geist Mono', Consolas, monospace; }
    </style>
    <marker id="context-budget-arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7 Z" fill="#52657d"/></marker>
  </defs>
  <rect width="1280" height="720" fill="#f5f8fc"/>
  <rect x="56" y="72" width="1168" height="576" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/>
  <rect x="88" y="60" width="292" height="24" fill="#f5f8fc"/>
  <text x="96" y="77" class="blue mono small" letter-spacing=".10em">INPUT &amp; CONTEXT / 02</text>
  <text x="96" y="133" class="ink" font-size="26" font-weight="600">容量不足時，保留什麼？</text>
  <text x="96" y="164" class="muted body">候選來源先分層；有效上限決定截短、移除，或停止本次模型呼叫。</text>

  <rect x="96" y="198" width="314" height="366" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/>
  <text x="118" y="228" class="ink label">候選 Context 區塊</text>
  <text x="118" y="248" class="muted small">本次呼叫不一定具備全部來源</text>
  <g class="body">
    <rect x="118" y="266" width="270" height="40" rx="5" fill="#e7f2ff" stroke="#80baff"/>
    <text x="132" y="291" class="blue mono small">P0</text><text x="180" y="291" class="ink">System Policy</text>
    <rect x="118" y="311" width="270" height="40" rx="5" fill="#e7f2ff" stroke="#80baff"/>
    <text x="132" y="336" class="blue mono small">P1</text><text x="180" y="336" class="ink">Current Task</text>
    <rect x="118" y="356" width="270" height="40" rx="5" fill="#f1f6fc" stroke="#b9cce3"/>
    <text x="132" y="381" class="muted mono small">P2</text><text x="180" y="381" class="ink">Active State</text>
    <rect x="118" y="401" width="270" height="40" rx="5" fill="#f1f6fc" stroke="#b9cce3"/>
    <text x="132" y="426" class="muted mono small">P3</text><text x="180" y="426" class="ink">Memory</text>
    <rect x="118" y="446" width="270" height="40" rx="5" fill="#f6f8fb" stroke="#c6d4e4"/>
    <text x="132" y="471" class="muted mono small">P4</text><text x="180" y="471" class="ink">Recent Messages</text>
    <rect x="118" y="491" width="270" height="40" rx="5" fill="#f6f8fb" stroke="#c6d4e4"/>
    <text x="132" y="516" class="muted mono small">P5</text><text x="180" y="516" class="ink">Tool Output</text>
  </g>

  <path d="M418 380 H451" fill="none" stroke="#52657d" stroke-width="1.5" marker-end="url(#context-budget-arrow)"/>
  <rect x="460" y="198" width="350" height="366" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/>
  <text x="482" y="228" class="ink label">有效上限與處理順序</text>
  <rect x="482" y="248" width="306" height="59" rx="5" fill="#e7f2ff" stroke="#80baff"/>
  <text x="496" y="271" class="blue mono small">EFFECTIVE LIMIT</text>
  <text x="496" y="293" class="ink small">min(產品預算, 模型視窗 − 輸出預留)</text>
  <g class="body">
    <circle cx="497" cy="340" r="13" fill="#0066d6"/><text x="497" y="345" text-anchor="middle" fill="#ffffff" class="small">1</text>
    <text x="522" y="345" class="ink">先截短 P5 工具結果、P4 對話</text>
    <circle cx="497" cy="390" r="13" fill="#0066d6"/><text x="497" y="395" text-anchor="middle" fill="#ffffff" class="small">2</text>
    <text x="522" y="395" class="ink">必要時依 P5 → P2 移除</text>
    <circle cx="497" cy="440" r="13" fill="#8d5260"/><text x="497" y="445" text-anchor="middle" fill="#ffffff" class="small">3</text>
    <text x="522" y="445" class="ink">P0 或 P0＋P1 超限則報錯</text>
  </g>
  <line x1="482" y1="473" x2="788" y2="473" stroke="#d5e1ee"/>
  <text x="482" y="500" class="muted small">預設策略是截斷與移除，並非生成摘要。</text>
  <text x="482" y="526" class="muted small">Feature Flag 與實際模型上限仍取決於執行環境。</text>

  <path d="M818 380 H841" fill="none" stroke="#52657d" stroke-width="1.5" marker-end="url(#context-budget-arrow)"/>
  <rect x="850" y="198" width="334" height="366" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/>
  <text x="872" y="228" class="ink label">組裝結果分成三份</text>
  <rect x="872" y="253" width="290" height="72" rx="5" fill="#0066d6"/>
  <text x="890" y="278" fill="#ffffff" class="label">模型可見文字</text>
  <text x="890" y="302" fill="#e2efff" class="small">僅由保留的區塊格式化而成</text>
  <rect x="872" y="338" width="290" height="78" rx="5" fill="#eef4fb" stroke="#9db5cf"/>
  <text x="890" y="365" class="ink label">ContextManifest</text>
  <text x="890" y="388" class="muted small">保留來源、估算 Token、上限、原因碼</text>
  <rect x="872" y="429" width="290" height="77" rx="5" fill="#f6f8fb" stroke="#b9cce3"/>
  <text x="890" y="456" class="ink label">truncatedBlocks</text>
  <text x="890" y="479" class="muted small">組裝結果中的被移除區塊</text>
  <text x="872" y="538" class="muted small">Manifest 不保存被移除的完整原文。</text>

  <text x="96" y="611" class="ink small">容量優先序處理「放不放得下」；指令權威與工具授權要由其他規則判斷。</text>
  <text x="96" y="682" class="muted small">依 Chat Gun Context Assembler 程式路徑繪製；此圖說明分支，不代表某次正式執行的實際區塊。</text>
</svg>
