<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" lang="en" role="img" aria-labelledby="06-interaction-evidence-swimlanes-en-title 06-interaction-evidence-swimlanes-en-desc" id="d-06-interaction-evidence-swimlanes-en-root">
<title id="06-interaction-evidence-swimlanes-en-title">Evidence lanes: what each test establishes</title><desc id="06-interaction-evidence-swimlanes-en-desc">Independent tests support their own assertions, not one completed end-to-end execution.</desc>
<defs>
      <style>#d-06-interaction-evidence-swimlanes-en-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-06-interaction-evidence-swimlanes-en-root nav, #d-06-interaction-evidence-swimlanes-en-root p, #d-06-interaction-evidence-swimlanes-en-root li { font-size:14px;line-height:1.8 }
      #d-06-interaction-evidence-swimlanes-en-root a { color:#0066d6 }
      #d-06-interaction-evidence-swimlanes-en-root .diagram-container { width:100%;overflow-x:auto }
      #d-06-interaction-evidence-swimlanes-en-root details { margin-top:24px;border-top:1px solid #b9cce3;padding-top:16px }
      #d-06-interaction-evidence-swimlanes-en-root summary { cursor:pointer;font-weight:600 }
      #d-06-interaction-evidence-swimlanes-en-root .notes { display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px }
      #d-06-interaction-evidence-swimlanes-en-root ul { padding-left:20px }
      #d-06-interaction-evidence-swimlanes-en-root nav, #d-06-interaction-evidence-swimlanes-en-root details { display:none }
      #d-06-interaction-evidence-swimlanes-en-root .diagram-container { overflow-x:visible }</style><marker id="d-06-interaction-evidence-swimlanes-en-06-interaction-evidence-swimlanes-en-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-06-interaction-evidence-swimlanes-en-06-interaction-evidence-swimlanes-en-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0078fc"/></marker></defs><rect width="1280" height="720" fill="#f5f8fc"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="184" height="24" fill="#f5f8fc"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">INDEPENDENT EVIDENCE</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">CONCEPTUAL / SOURCE INSPECTION</text><rect x="96" y="116" width="64" height="4" fill="#0078fc"/><rect x="96" y="204" width="1088" height="56" rx="4" fill="#ffffff"/><path d="M96 264 H1184" fill="none" stroke="#d5e1ee" stroke-width="1"/><rect x="96" y="268" width="1088" height="56" rx="4" fill="#eef4fb"/><path d="M96 328 H1184" fill="none" stroke="#d5e1ee" stroke-width="1"/><rect x="96" y="332" width="1088" height="56" rx="4" fill="#ffffff"/><path d="M96 392 H1184" fill="none" stroke="#d5e1ee" stroke-width="1"/><rect x="96" y="396" width="1088" height="56" rx="4" fill="#ffffff"/><path d="M96 456 H1184" fill="none" stroke="#d5e1ee" stroke-width="1"/><rect x="96" y="460" width="1088" height="56" rx="4" fill="#ffffff"/><path d="M96 520 H1184" fill="none" stroke="#d5e1ee" stroke-width="1"/><rect x="96" y="524" width="1088" height="56" rx="4" fill="#ffffff"/><path d="M96 584 H1184" fill="none" stroke="#d5e1ee" stroke-width="1"/><text x="112" y="176" font-size="11" fill="#52657d" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">INDEPENDENT SOURCE</text><text x="400" y="176" font-size="11" fill="#52657d" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">SETUP / ASSERTION</text><text x="816" y="176" font-size="11" fill="#52657d" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">EVIDENCE STILL NEEDED</text><text x="112" y="225" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Wrapper resume test</text><text x="112" y="246" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">interaction-runtime.test.ts</text><text x="400" y="228" font-size="12" fill="#102743" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Mock authorizer / Graph; Task-preserving arguments</text><text x="816" y="228" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Real schema, consume, DB, checkpoint</text><text x="112" y="289" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">UI and schema contract</text><text x="112" y="310" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">App test + schema registry</text><text x="400" y="292" font-size="12" fill="#102743" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">UI sends candidateIndex; strict schema rejects it</text><text x="816" y="292" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Shared contract and real authorizer integration</text><text x="112" y="353" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Guard late release</text><text x="112" y="374" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">query-guard.test.ts</text><text x="400" y="356" font-size="12" fill="#102743" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Old release retains the new guard entry</text><text x="816" y="356" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">DB concurrency; stopped old external work</text><text x="112" y="417" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Activity consumer</text><text x="112" y="438" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">App + reducer tests</text><text x="400" y="420" font-size="12" fill="#102743" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Ignore lower generation; replace with new activity</text><text x="816" y="420" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Text, legacy events, terminal callbacks</text><text x="112" y="481" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Dispatch stop / cancel</text><text x="112" y="502" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">Wrapper + authorizer tests</text><text x="400" y="484" font-size="12" fill="#102743" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Stop on confirmation, queue gaps, or manual decisions</text><text x="816" y="484" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Native queue, Ledger, reconciliation, compensation</text><text x="112" y="545" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Feedback preparation</text><text x="112" y="566" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">feedback-loop.test.ts</text><text x="400" y="548" font-size="12" fill="#102743" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Different fixed failure data checks fields / versions</text><text x="816" y="548" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">UI replay runner / metric and experiment artifacts</text><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Rows use different generations, doubles, and data; the reading order is not a single execution timeline.</text><text x="96" y="658" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">stale_activity_visible is an article design example; no formal experiment integration or before / after scores exist here.</text>
</svg>
