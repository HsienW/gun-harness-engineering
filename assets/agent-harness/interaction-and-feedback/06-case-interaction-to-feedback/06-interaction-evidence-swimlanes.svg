<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" lang="zh-TW" role="img" aria-labelledby="06-interaction-evidence-swimlanes-title 06-interaction-evidence-swimlanes-desc" id="d-06-interaction-evidence-swimlanes-root">
<title id="06-interaction-evidence-swimlanes-title">獨立證據泳道：各測試證明到哪裡</title><desc id="06-interaction-evidence-swimlanes-desc">不同測試只支持各自斷言，不能拼成同一次已完成的 E2E。</desc>
<defs>
      <style>#d-06-interaction-evidence-swimlanes-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-06-interaction-evidence-swimlanes-root nav, #d-06-interaction-evidence-swimlanes-root p, #d-06-interaction-evidence-swimlanes-root li { font-size:14px;line-height:1.8 }
      #d-06-interaction-evidence-swimlanes-root a { color:#0066d6 }
      #d-06-interaction-evidence-swimlanes-root .diagram-container { width:100%;overflow-x:auto }
      #d-06-interaction-evidence-swimlanes-root details { margin-top:24px;border-top:1px solid #b9cce3;padding-top:16px }
      #d-06-interaction-evidence-swimlanes-root summary { cursor:pointer;font-weight:600 }
      #d-06-interaction-evidence-swimlanes-root .notes { display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px }
      #d-06-interaction-evidence-swimlanes-root ul { padding-left:20px }
      #d-06-interaction-evidence-swimlanes-root nav, #d-06-interaction-evidence-swimlanes-root details { display:none }
      #d-06-interaction-evidence-swimlanes-root .diagram-container { overflow-x:visible }</style><marker id="d-06-interaction-evidence-swimlanes-06-interaction-evidence-swimlanes-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-06-interaction-evidence-swimlanes-06-interaction-evidence-swimlanes-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0078fc"/></marker></defs><rect width="1280" height="720" fill="#f5f8fc"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="184" height="24" fill="#f5f8fc"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">INDEPENDENT EVIDENCE</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">概念圖 · 原始碼查讀</text><rect x="96" y="116" width="64" height="4" fill="#0078fc"/><rect x="96" y="204" width="1088" height="56" rx="4" fill="#ffffff"/><path d="M96 264 H1184" fill="none" stroke="#d5e1ee" stroke-width="1"/><rect x="96" y="268" width="1088" height="56" rx="4" fill="#eef4fb"/><path d="M96 328 H1184" fill="none" stroke="#d5e1ee" stroke-width="1"/><rect x="96" y="332" width="1088" height="56" rx="4" fill="#ffffff"/><path d="M96 392 H1184" fill="none" stroke="#d5e1ee" stroke-width="1"/><rect x="96" y="396" width="1088" height="56" rx="4" fill="#ffffff"/><path d="M96 456 H1184" fill="none" stroke="#d5e1ee" stroke-width="1"/><rect x="96" y="460" width="1088" height="56" rx="4" fill="#ffffff"/><path d="M96 520 H1184" fill="none" stroke="#d5e1ee" stroke-width="1"/><rect x="96" y="524" width="1088" height="56" rx="4" fill="#ffffff"/><path d="M96 584 H1184" fill="none" stroke="#d5e1ee" stroke-width="1"/><text x="112" y="176" font-size="11" fill="#52657d" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">獨立來源</text><text x="400" y="176" font-size="11" fill="#52657d" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">安排與斷言</text><text x="816" y="176" font-size="11" fill="#52657d" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">尚待補齊的證據</text><text x="112" y="225" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Wrapper 恢復測試</text><text x="112" y="246" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">interaction-runtime.test.ts</text><text x="400" y="228" font-size="12" fill="#102743" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Mock authorizer／Graph；保留 Task 的參數</text><text x="816" y="228" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">真實 Schema、consume、DB 與 checkpoint</text><text x="112" y="289" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">UI 與 Schema 契約</text><text x="112" y="310" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">App test + schema registry</text><text x="400" y="292" font-size="12" fill="#102743" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">UI 送 candidateIndex；strict Schema 拒絕</text><text x="816" y="292" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">共同契約與真實 authorizer 的整合</text><text x="112" y="353" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Guard 晚到清理</text><text x="112" y="374" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">query-guard.test.ts</text><text x="400" y="356" font-size="12" fill="#102743" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">舊 release 不移除新 guard entry</text><text x="816" y="356" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">多程序 DB 競態、舊外部工作已停止</text><text x="112" y="417" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">活動消費端</text><text x="112" y="438" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">App + reducer tests</text><text x="400" y="420" font-size="12" fill="#102743" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">低 generation 忽略；新活動替換</text><text x="816" y="420" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">一般文字、legacy 與 terminal 回呼</text><text x="112" y="481" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">停止與取消分支</text><text x="112" y="502" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">Wrapper + authorizer tests</text><text x="400" y="484" font-size="12" fill="#102743" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">待確認、缺 queue 或人工決策時不接替</text><text x="816" y="484" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Native queue、Ledger、回查與補償</text><text x="112" y="545" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">回饋資料整理</text><text x="112" y="566" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">feedback-loop.test.ts</text><text x="400" y="548" font-size="12" fill="#102743" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">另一組固定失敗資料測欄位與版本</text><text x="816" y="548" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">UI 事件重播 runner／metric 與實驗產物</text><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">各列的 generation、替身與資料不同；上下順序是閱讀順序，並非同一筆執行時間軸。</text><text x="96" y="658" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">stale_activity_visible 是文章設計例子；尚未接入正式實驗，也沒有 before／after 分數。</text>
</svg>
