<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" lang="en" role="img" aria-labelledby="01-input-disposition-en-title 01-input-disposition-en-desc" id="d-01-input-disposition-en-root">
<title id="01-input-disposition-en-title">Handling new input during a Run</title><desc id="01-input-disposition-en-desc">Configuration and classification precede actual resume, reuse, or dispatch rejection.</desc>
<defs>
      <style>#d-01-input-disposition-en-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-01-input-disposition-en-root nav, #d-01-input-disposition-en-root p, #d-01-input-disposition-en-root li { font-size:14px;line-height:1.8 }
      #d-01-input-disposition-en-root a { color:#0066d6 }
      #d-01-input-disposition-en-root .diagram-container { width:100%;overflow-x:auto }
      #d-01-input-disposition-en-root details { margin-top:24px;border-top:1px solid #b9cce3;padding-top:16px }
      #d-01-input-disposition-en-root summary { cursor:pointer;font-weight:600 }
      #d-01-input-disposition-en-root .notes { display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px }
      #d-01-input-disposition-en-root ul { padding-left:20px }
      #d-01-input-disposition-en-root nav, #d-01-input-disposition-en-root details { display:none }
      #d-01-input-disposition-en-root .diagram-container { overflow-x:visible }</style><marker id="d-01-input-disposition-en-01-input-disposition-en-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-01-input-disposition-en-01-input-disposition-en-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0078fc"/></marker></defs><rect width="1280" height="720" fill="#f5f8fc"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="160" height="24" fill="#f5f8fc"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">INPUT DISPOSITION</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">CONCEPTUAL / SOURCE INSPECTION</text><rect x="96" y="116" width="64" height="4" fill="#0078fc"/><path d="M400 220 L456 220" fill="none" stroke="#0078fc" stroke-width="1.2" marker-end="url(#d-01-input-disposition-en-01-input-disposition-en-arrow-accent)"/><path d="M624 276 L624 304 Q624 312 616 312 L300 312 Q292 312 292 320 L292 352" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-01-input-disposition-en-01-input-disposition-en-arrow)"/><path d="M488 408 L552 408" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-01-input-disposition-en-01-input-disposition-en-arrow)"/><rect x="492.0" y="380" width="56" height="18" rx="2" fill="#fafdff"/><text x="520" y="392" font-size="10" fill="#52657d" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">OTHER</text><path d="M392 352 L392 332 Q392 324 400 324 L1040 324 Q1048 324 1048 332 L1048 352" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-01-input-disposition-en-01-input-disposition-en-arrow)"/><rect x="966.0" y="298" width="68" height="18" rx="2" fill="#fafdff"/><text x="1000" y="310" font-size="10" fill="#52657d" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">DIRECT</text><path d="M848 408 L912 408" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-01-input-disposition-en-01-input-disposition-en-arrow)"/><path d="M984 464 L984 472 Q984 480 976 480 L362 480 Q354 480 354 488 L354 512" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-01-input-disposition-en-01-input-disposition-en-arrow)"/><path d="M1112 464 L1112 488 Q1112 496 1104 496 L926 496 Q918 496 918 504 L918 512" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-01-input-disposition-en-01-input-disposition-en-arrow)"/><g data-node="true"><rect x="96" y="164" width="304" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="112" y="176" width="46" height="18" rx="2" fill="#eef4fb"/><text x="120" y="189" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">INPUT</text><text x="112" y="215" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Input and trusted ownership</text><text x="112" y="238" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Read Thread / Scope / Task / Run</text><text x="112" y="256" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Client hints cannot override durable owner</text></g><g data-node="true"><rect x="456" y="164" width="336" height="112" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><rect x="472" y="176" width="94" height="18" rx="2" fill="#1c78e4"/><text x="480" y="189" font-size="9" fill="#ffffff" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">CONFIGURATION</text><text x="472" y="215" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Policy activation check</text><text x="472" y="238" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Unconfigured → no-op; original Graph</text><text x="472" y="256" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Enabled production path requires a DB</text></g><g data-node="true"><rect x="96" y="352" width="392" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="112" y="364" width="64" height="18" rx="2" fill="#eef4fb"/><text x="120" y="377" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">CLASSIFY</text><text x="112" y="403" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Ordered deterministic checks</text><text x="112" y="426" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Cancel → duplicate key + bytes → waiting Task</text><text x="112" y="444" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Send remaining input to semantic classification</text></g><g data-node="true"><rect x="552" y="352" width="296" height="112" rx="8" fill="#eef4fb" stroke="#b9cce3" stroke-width="1.2"/><rect x="568" y="364" width="64" height="18" rx="2" fill="#eef4fb"/><text x="576" y="377" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">SEMANTIC</text><text x="568" y="403" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Tentative semantic proposal</text><text x="568" y="426" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">intent_revision / new_independent_task</text><text x="568" y="444" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Classifier failure does not start a task</text></g><g data-node="true"><rect x="912" y="352" width="272" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="928" y="364" width="64" height="18" rx="2" fill="#eef4fb"/><text x="936" y="377" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">DISPATCH</text><text x="928" y="403" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Disposition and consumer</text><text x="928" y="426" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Reuse / resume / stop before dispatch</text><text x="928" y="444" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Strategy names do not prove wiring</text></g><g data-node="true"><rect x="96" y="512" width="516" height="76" rx="8" fill="#eef4fb" stroke="#b9cce3" stroke-width="1.2"/><rect x="112" y="524" width="184" height="18" rx="2" fill="#eef4fb"/><text x="120" y="537" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">AWAIT CONFIRMATION / ENQUEUE</text><text x="112" y="563" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Stop: confirmation or native queue required</text></g><g data-node="true"><rect x="652" y="512" width="532" height="76" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="668" y="524" width="148" height="18" rx="2" fill="#eef4fb"/><text x="676" y="537" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">CACHED RESULT / RESUME</text><text x="668" y="563" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Reuse and resume retain their own checks</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">A duplicate marker may contain no answer; a semantic proposal does not authorize irreversible handling.</text><text x="96" y="658" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">CCB uses its own in-process command queue; it does not establish persistence or multi-instance guarantees for Chat Gun.</text>
</svg>
