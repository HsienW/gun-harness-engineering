n-03-clarification-resume-swimlane-en-arrow)"/><rect x="462.0" y="386" width="68" height="18" rx="2" fill="#fafdff"/><text x="496" y="398" font-size="10" fill="#52657d" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">RESUME</text><path d="M904 432 L944 432" fill="none" stroke="#0078fc" stroke-width="1.2" marker-end="url(#d-03-clarification-resume-swimlane-en-03-clarification-resume-swimlane-en-arrow-accent)"/><rect x="900.0" y="404" width="48" height="18" rx="2" fill="#fafdff"/><text x="924" y="416" font-size="10" fill="#52657d" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">PASS</text><path d="M1064 500 L1064 548 Q1064 556 1056 556 L616 556" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-03-clarification-resume-swimlane-en-03-clarification-resume-swimlane-en-arrow)"/><text x="96" y="176" font-size="11" fill="#52657d" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">USER / APP</text><text x="376" y="176" font-size="11" fill="#52657d" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">GRAPH</text><text x="656" y="176" font-size="11" fill="#52657d" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">MANIFEST / AUTHORIZER</text><text x="944" y="176" font-size="11" fill="#52657d" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">OWNERSHIP / RUNTIME</text><g data-node="true"><rect x="376" y="212" width="240" height="100" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="392" y="224" width="40" height="18" rx="2" fill="#eef4fb"/><text x="400" y="237" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">WAIT</text><text x="392" y="263" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Create clarification state</text><text x="392" y="286" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Retain query and Task bindings</text></g><g data-node="true"><rect x="656" y="212" width="248" height="100" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="672" y="224" width="58" height="18" rx="2" fill="#eef4fb"/><text x="680" y="237" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">PERSIST</text><text x="672" y="263" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Persist the manifest first</text><text x="672" y="286" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Match IDs; reject binding conflicts</text></g><g data-node="true"><rect x="96" y="364" width="240" height="100" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="112" y="376" width="46" height="18" rx="2" fill="#eef4fb"/><text x="120" y="389" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">REPLY</text><text x="112" y="415" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Reply to the bound wait</text><text x="112" y="438" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">command.resume + interrupt ID</text></g><g data-node="true"><rect x="656" y="364" width="248" height="136" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><rect x="672" y="376" width="70" height="18" rx="2" fill="#1c78e4"/><text x="680" y="389" font-size="9" fill="#ffffff" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">AUTHORIZE</text><text x="672" y="415" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Validate and consume once</text><text x="672" y="438" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Bindings / waiting / expiry</text><text x="672" y="456" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Compatibility / schema / consume</text></g><g data-node="true"><rect x="944" y="364" width="240" height="136" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="960" y="376" width="58" height="18" rx="2" fill="#eef4fb"/><text x="968" y="389" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">HANDOFF</text><text x="960" y="415" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Same Task, new Run</text><text x="960" y="438" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">CAS / expected generation</text><text x="960" y="456" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">clarification_resumed</text></g><g data-node="true"><rect x="376" y="512" width="240" height="84" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="392" y="524" width="94" height="18" rx="2" fill="#eef4fb"/><text x="400" y="537" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">RESUMECLARIFY</text><text x="392" y="563" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Graph rechecks the reply</text><text x="392" y="586" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Timeout / nonempty / 500 chars</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Failed checks stop resumption; this conditional path does not resolve the actual UI payload mismatch.</text><text x="96" y="658" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">The pinned version uses MemorySaver; cross-deployment resume, active ownership, and checkpoints need environment evidence.</text>
</svg>
