      #d-03-clarification-resume-swimlane-en-root .diagram-container { width:100%;overflow-x:auto }
      #d-03-clarification-resume-swimlane-en-root details { margin-top:24px;border-top:1px solid #b9cce3;padding-top:16px }
      #d-03-clarification-resume-swimlane-en-root summary { cursor:pointer;font-weight:600 }
      #d-03-clarification-resume-swimlane-en-root .notes { display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px }
      #d-03-clarification-resume-swimlane-en-root ul { padding-left:20px }
      #d-03-clarification-resume-swimlane-en-root nav, #d-03-clarification-resume-swimlane-en-root details { display:none }
