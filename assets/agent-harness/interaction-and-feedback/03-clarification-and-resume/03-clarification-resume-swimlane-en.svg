<title id="03-clarification-resume-swimlane-en-title">Clarification resume with a new Run</title><desc id="03-clarification-resume-swimlane-en-desc">Persist the manifest, receive the bound reply, and attempt same-Task resumption after validation.</desc>
<defs>
      <style>#d-03-clarification-resume-swimlane-en-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-03-clarification-resume-swimlane-en-root nav, #d-03-clarification-resume-swimlane-en-root p, #d-03-clarification-resume-swimlane-en-root li { font-size:14px;line-height:1.8 }
