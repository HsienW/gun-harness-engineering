<title id="03-clarification-resume-swimlane-title">釐清等待與同 Task 新 Run 的恢復</title><desc id="03-clarification-resume-swimlane-desc">先保存 manifest，再接收指定等待的回答，通過檢查後嘗試恢復同 Task。</desc>
