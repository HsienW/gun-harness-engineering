<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" lang="en" role="img" aria-labelledby="03-resume-payload-contract-en-title 03-resume-payload-contract-en-desc" id="d-03-resume-payload-contract-en-root">
<title id="03-resume-payload-contract-en-title">Payload contract: validation and parsing</title><desc id="03-resume-payload-contract-en-desc">Candidate payloads retain candidateIndex, which the default strict schema rejects.</desc>
<defs>
      <style>#d-03-resume-payload-contract-en-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-03-resume-payload-contract-en-root nav, #d-03-resume-payload-contract-en-root p, #d-03-resume-payload-contract-en-root li { font-size:14px;line-height:1.8 }
      #d-03-resume-payload-contract-en-root a { color:#0066d6 }
      #d-03-resume-payload-contract-en-root .diagram-container { width:100%;overflow-x:auto }
      #d-03-resume-payload-contract-en-root details { margin-top:24px;border-top:1px solid #b9cce3;padding-top:16px }
      #d-03-resume-payload-contract-en-root summary { cursor:pointer;font-weight:600 }
      #d-03-resume-payload-contract-en-root .notes { display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px }
      #d-03-resume-payload-contract-en-root ul { padding-left:20px }
      #d-03-resume-payload-contract-en-root nav, #d-03-resume-payload-contract-en-root details { display:none }
      #d-03-resume-payload-contract-en-root .diagram-container { overflow-x:visible }</style><marker id="d-03-resume-payload-contract-en-03-resume-payload-contract-en-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-03-resume-payload-contract-en-03-resume-payload-contract-en-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0078fc"/></marker></defs><rect width="1280" height="720" fill="#f5f8fc"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="136" height="24" fill="#f5f8fc"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">RESUME PAYLOAD</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">CONCEPTUAL / SOURCE INSPECTION</text><rect x="96" y="116" width="64" height="4" fill="#0078fc"/><path d="M432 244 L488 244" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-03-resume-payload-contract-en-03-resume-payload-contract-en-arrow)"/><path d="M776 244 L832 244" fill="none" stroke="#0078fc" stroke-width="1.2" marker-end="url(#d-03-resume-payload-contract-en-03-resume-payload-contract-en-arrow-accent)"/><path d="M1008 308 L1008 356 Q1008 364 1000 364 L844 364 Q836 364 836 372 L836 416" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-03-resume-payload-contract-en-03-resume-payload-contract-en-arrow)"/><rect x="886.0" y="338" width="68" height="18" rx="2" fill="#fafdff"/><text x="920" y="350" font-size="10" fill="#52657d" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">REJECT</text><g data-node="true"><rect x="96" y="180" width="336" height="128" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="112" y="192" width="76" height="18" rx="2" fill="#eef4fb"/><text x="120" y="205" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">UI PAYLOAD</text><text x="112" y="231" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Candidate button payload</text><text x="112" y="254" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">userReply: &quot;Springfield, Illinois, ...&quot;</text><text x="112" y="272" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">candidateIndex: 1</text></g><g data-node="true"><rect x="488" y="180" width="288" height="128" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="504" y="192" width="70" height="18" rx="2" fill="#eef4fb"/><text x="512" y="205" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">NORMALIZE</text><text x="504" y="231" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Normalization retains the value</text><text x="504" y="254" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">command.resume → value: unknown</text><text x="504" y="272" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Does not remove candidateIndex</text></g><g data-node="true"><rect x="832" y="180" width="352" height="128" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><rect x="848" y="192" width="118" height="18" rx="2" fill="#1c78e4"/><text x="856" y="205" font-size="9" fill="#ffffff" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">RESPONSE CONTRACT</text><text x="848" y="231" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Default authorizer schema gate</text><text x="848" y="254" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">weather_clarification_resume@1.0</text><text x="848" y="272" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Strict objects reject extra fields</text></g><g data-node="true"><rect x="96" y="416" width="336" height="148" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="112" y="428" width="52" height="18" rx="2" fill="#eef4fb"/><text x="120" y="441" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">SCHEMA</text><text x="112" y="467" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Accepted contract shapes</text><text x="112" y="490" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Nonempty string (max 100000 chars)</text><text x="112" y="508" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">{userReply: string} [strict]</text><text x="112" y="526" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">{cancel: true} [strict]</text></g><g data-node="true"><rect x="488" y="416" width="696" height="84" rx="8" fill="#eef4fb" stroke="#b9cce3" stroke-width="1.2"/><rect x="504" y="428" width="196" height="18" rx="2" fill="#eef4fb"/><text x="512" y="441" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">CLARIFICATION_RESPONSE_INVALID</text><text x="504" y="467" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">This payload is rejected upstream</text></g><text x="504" y="532" font-size="12" fill="#102743" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Downstream support for candidateIndex does not bypass the upstream contract.</text><text x="504" y="554" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">buildResumingClarificationState()</text><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Applies to the enabled default authorizer / schema path; this is a static contract mismatch.</text><text x="96" y="658" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">App submission tests and mock-authorizer tests do not jointly prove successful end-to-end resumption.</text>
</svg>
