<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" lang="zh-TW" role="img" aria-labelledby="02-run-generation-and-stale-output-title 02-run-generation-and-stale-output-desc" id="d-02-run-generation-and-stale-output-root">
<title id="02-run-generation-and-stale-output-title">新舊 Run 的歸屬與可見狀態</title><desc id="02-run-generation-and-stale-output-desc">歸屬 CAS 切換後，舊 Run 清理與前端輸出仍需要各自的身分檢查。</desc>
<defs>
      <style>#d-02-run-generation-and-stale-output-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-02-run-generation-and-stale-output-root nav, #d-02-run-generation-and-stale-output-root p, #d-02-run-generation-and-stale-output-root li { font-size:14px;line-height:1.8 }
      #d-02-run-generation-and-stale-output-root a { color:#0066d6 }
      #d-02-run-generation-and-stale-output-root .diagram-container { width:100%;overflow-x:auto }
      #d-02-run-generation-and-stale-output-root details { margin-top:24px;border-top:1px solid #b9cce3;padding-top:16px }
      #d-02-run-generation-and-stale-output-root summary { cursor:pointer;font-weight:600 }
      #d-02-run-generation-and-stale-output-root .notes { display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px }
      #d-02-run-generation-and-stale-output-root ul { padding-left:20px }
      #d-02-run-generation-and-stale-output-root nav, #d-02-run-generation-and-stale-output-root details { display:none }
      #d-02-run-generation-and-stale-output-root .diagram-container { overflow-x:visible }</style><marker id="d-02-run-generation-and-stale-output-02-run-generation-and-stale-output-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-02-run-generation-and-stale-output-02-run-generation-and-stale-output-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0078fc"/></marker></defs><rect width="1280" height="720" fill="#f5f8fc"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="128" height="24" fill="#f5f8fc"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">RUN OWNERSHIP</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">概念圖 · 原始碼查讀</text><rect x="96" y="116" width="64" height="4" fill="#0078fc"/><path d="M416 280 L456 280" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-run-generation-and-stale-output-02-run-generation-and-stale-output-arrow)"/><path d="M776 280 L816 280" fill="none" stroke="#0078fc" stroke-width="1.2" marker-end="url(#d-02-run-generation-and-stale-output-02-run-generation-and-stale-output-arrow-accent)"/><path d="M616 336 L616 420" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-run-generation-and-stale-output-02-run-generation-and-stale-output-arrow)"/><path d="M1000 336 L1000 420" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-run-generation-and-stale-output-02-run-generation-and-stale-output-arrow)"/><path d="M256 532 L256 560 Q256 568 264 568 L992 568 Q1000 568 1000 560 L1000 532" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-02-run-generation-and-stale-output-02-run-generation-and-stale-output-arrow)"/><rect x="580.0" y="542" width="96" height="18" rx="2" fill="#fafdff"/><text x="628" y="554" font-size="10" fill="#52657d" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">LATE EVENT</text><text x="96" y="180" font-size="12" fill="#52657d" font-weight="500" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">執行與晚到輸出</text><text x="456" y="180" font-size="12" fill="#52657d" font-weight="500" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">OWNERSHIP / GUARD</text><text x="816" y="180" font-size="12" fill="#52657d" font-weight="500" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">APP / ACTIVITY</text><g data-node="true"><rect x="96" y="224" width="320" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="112" y="236" width="58" height="18" rx="2" fill="#eef4fb"/><text x="120" y="249" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">REQUEST</text><text x="112" y="275" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">新輸入要求由 B 接替</text><text x="112" y="298" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Run A / generation N</text><text x="112" y="316" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">可信入口準備新 Run B</text></g><g data-node="true"><rect x="456" y="224" width="320" height="112" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><rect x="472" y="236" width="70" height="18" rx="2" fill="#1c78e4"/><text x="480" y="249" font-size="9" fill="#ffffff" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">AUTHORITY</text><text x="472" y="275" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">交易內 CAS 切換 owner</text><text x="472" y="298" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">expected generation = N</text><text x="472" y="316" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Run B / generation N+1</text></g><g data-node="true"><rect x="816" y="224" width="368" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="832" y="236" width="94" height="18" rx="2" fill="#eef4fb"/><text x="840" y="249" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">VISIBLE OWNER</text><text x="832" y="275" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">App 更新可信 hint</text><text x="832" y="298" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">只接受不低於目前 generation 的 hint</text><text x="832" y="316" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Versioned envelope 比對 context.runId</text></g><g data-node="true"><rect x="96" y="420" width="320" height="112" rx="8" fill="#eef4fb" stroke="#b9cce3" stroke-width="1.2"/><rect x="112" y="432" width="82" height="18" rx="2" fill="#eef4fb"/><text x="120" y="445" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">LATE OUTPUT</text><text x="112" y="471" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">舊 Run A 可能繼續輸出</text><text x="112" y="494" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Wrapper 不逐 chunk 重查 owner</text><text x="112" y="512" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">BFF 不逐段補 generation</text></g><g data-node="true"><rect x="456" y="420" width="320" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="472" y="432" width="70" height="18" rx="2" fill="#eef4fb"/><text x="480" y="445" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">FINALIZER</text><text x="472" y="471" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">舊 release 不清新 entry</text><text x="472" y="494" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">release 同時比對 Run ID 與 generation</text><text x="472" y="512" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">正確匹配才能從 guard Map 移除</text></g><g data-node="true"><rect x="816" y="420" width="368" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="832" y="432" width="64" height="18" rx="2" fill="#eef4fb"/><text x="840" y="445" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">CONSUMER</text><text x="832" y="471" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">活動 reducer 的 generation 檢查</text><text x="832" y="494" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">較低忽略，較高替換；缺值無法數值比較</text><text x="832" y="512" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">此處保護範圍是活動消費端</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">替換 ownership 不代表舊程序或 I/O 已停；completed 也不等於業務成功。</text><text x="96" y="658" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Legacy、缺 generation、thread.messages 與舊 terminal 回呼，仍需各自驗證。</text>
</svg>
