<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" lang="en" role="img" aria-labelledby="02-run-generation-and-stale-output-en-title 02-run-generation-and-stale-output-en-desc" id="d-02-run-generation-and-stale-output-en-root">
<title id="02-run-generation-and-stale-output-en-title">Old and new Runs: ownership and visibility</title><desc id="02-run-generation-and-stale-output-en-desc">After ownership CAS, stale cleanup and frontend output still need separate identity checks.</desc>
<defs>
      <style>#d-02-run-generation-and-stale-output-en-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-02-run-generation-and-stale-output-en-root nav, #d-02-run-generation-and-stale-output-en-root p, #d-02-run-generation-and-stale-output-en-root li { font-size:14px;line-height:1.8 }
      #d-02-run-generation-and-stale-output-en-root a { color:#0066d6 }
      #d-02-run-generation-and-stale-output-en-root .diagram-container { width:100%;overflow-x:auto }
      #d-02-run-generation-and-stale-output-en-root details { margin-top:24px;border-top:1px solid #b9cce3;padding-top:16px }
      #d-02-run-generation-and-stale-output-en-root summary { cursor:pointer;font-weight:600 }
      #d-02-run-generation-and-stale-output-en-root .notes { display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px }
      #d-02-run-generation-and-stale-output-en-root ul { padding-left:20px }
      #d-02-run-generation-and-stale-output-en-root nav, #d-02-run-generation-and-stale-output-en-root details { display:none }
      #d-02-run-generation-and-stale-output-en-root .diagram-container { overflow-x:visible }</style><marker id="d-02-run-generation-and-stale-output-en-02-run-generation-and-stale-output-en-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-02-run-generation-and-stale-output-en-02-run-generation-and-stale-output-en-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0078fc"/></marker></defs><rect width="1280" height="720" fill="#f5f8fc"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="128" height="24" fill="#f5f8fc"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">RUN OWNERSHIP</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">CONCEPTUAL / SOURCE INSPECTION</text><rect x="96" y="116" width="64" height="4" fill="#0078fc"/><path d="M416 280 L456 280" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-run-generation-and-stale-output-en-02-run-generation-and-stale-output-en-arrow)"/><path d="M776 280 L816 280" fill="none" stroke="#0078fc" stroke-width="1.2" marker-end="url(#d-02-run-generation-and-stale-output-en-02-run-generation-and-stale-output-en-arrow-accent)"/><path d="M616 336 L616 420" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-run-generation-and-stale-output-en-02-run-generation-and-stale-output-en-arrow)"/><path d="M1000 336 L1000 420" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-run-generation-and-stale-output-en-02-run-generation-and-stale-output-en-arrow)"/><path d="M256 532 L256 560 Q256 568 264 568 L992 568 Q1000 568 1000 560 L1000 532" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-02-run-generation-and-stale-output-en-02-run-generation-and-stale-output-en-arrow)"/><rect x="580.0" y="542" width="96" height="18" rx="2" fill="#fafdff"/><text x="628" y="554" font-size="10" fill="#52657d" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">LATE EVENT</text><text x="96" y="180" font-size="12" fill="#52657d" font-weight="500" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Execution and late output</text><text x="456" y="180" font-size="12" fill="#52657d" font-weight="500" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">OWNERSHIP / GUARD</text><text x="816" y="180" font-size="12" fill="#52657d" font-weight="500" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">APP / ACTIVITY</text><g data-node="true"><rect x="96" y="224" width="320" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="112" y="236" width="58" height="18" rx="2" fill="#eef4fb"/><text x="120" y="249" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">REQUEST</text><text x="112" y="275" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">New input requests Run B</text><text x="112" y="298" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Run A / generation N</text><text x="112" y="316" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Trusted entry prepares Run B</text></g><g data-node="true"><rect x="456" y="224" width="320" height="112" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><rect x="472" y="236" width="70" height="18" rx="2" fill="#1c78e4"/><text x="480" y="249" font-size="9" fill="#ffffff" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">AUTHORITY</text><text x="472" y="275" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">CAS changes the active owner</text><text x="472" y="298" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">expected generation = N</text><text x="472" y="316" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Run B / generation N+1</text></g><g data-node="true"><rect x="816" y="224" width="368" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="832" y="236" width="94" height="18" rx="2" fill="#eef4fb"/><text x="840" y="249" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">VISIBLE OWNER</text><text x="832" y="275" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">App updates its current hint</text><text x="832" y="298" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Accept hints at least as new as current</text><text x="832" y="316" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Versioned envelope checks context.runId</text></g><g data-node="true"><rect x="96" y="420" width="320" height="112" rx="8" fill="#eef4fb" stroke="#b9cce3" stroke-width="1.2"/><rect x="112" y="432" width="82" height="18" rx="2" fill="#eef4fb"/><text x="120" y="445" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">LATE OUTPUT</text><text x="112" y="471" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Old Run A may still output</text><text x="112" y="494" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">No per-chunk owner check in wrapper</text><text x="112" y="512" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">BFF does not tag every chunk</text></g><g data-node="true"><rect x="456" y="420" width="320" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="472" y="432" width="70" height="18" rx="2" fill="#eef4fb"/><text x="480" y="445" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">FINALIZER</text><text x="472" y="471" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Old release retains the new entry</text><text x="472" y="494" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Release checks Run ID and generation</text><text x="472" y="512" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Remove only a matching guard entry</text></g><g data-node="true"><rect x="816" y="420" width="368" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="832" y="432" width="64" height="18" rx="2" fill="#eef4fb"/><text x="840" y="445" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">CONSUMER</text><text x="832" y="471" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Activity reducer generation check</text><text x="832" y="494" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Lower: ignore; higher: replace; missing: no check</text><text x="832" y="512" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">This check covers the activity consumer</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Ownership replacement does not stop old processes or I/O; completed does not imply business success.</text><text x="96" y="658" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Legacy events, missing generations, thread.messages, and old terminal callbacks need separate validation.</text>
</svg>
