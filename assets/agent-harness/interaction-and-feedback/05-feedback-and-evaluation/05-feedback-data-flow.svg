<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" lang="zh-TW" role="img" aria-labelledby="05-feedback-data-flow-title 05-feedback-data-flow-desc" id="d-05-feedback-data-flow-root">
<title id="05-feedback-data-flow-title">回饋資料流與獨立實驗接點</title><desc id="05-feedback-data-flow-desc">Bad trace 經資料處理形成案例，CLI 比較既有 snapshots，而實驗是獨立 consumer。</desc>
<defs>
      <style>#d-05-feedback-data-flow-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-05-feedback-data-flow-root nav, #d-05-feedback-data-flow-root p, #d-05-feedback-data-flow-root li { font-size:14px;line-height:1.8 }
      #d-05-feedback-data-flow-root a { color:#0066d6 }
      #d-05-feedback-data-flow-root .diagram-container { width:100%;overflow-x:auto }
      #d-05-feedback-data-flow-root details { margin-top:24px;border-top:1px solid #b9cce3;padding-top:16px }
      #d-05-feedback-data-flow-root summary { cursor:pointer;font-weight:600 }
      #d-05-feedback-data-flow-root .notes { display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px }
      #d-05-feedback-data-flow-root ul { padding-left:20px }
      #d-05-feedback-data-flow-root nav, #d-05-feedback-data-flow-root details { display:none }
      #d-05-feedback-data-flow-root .diagram-container { overflow-x:visible }</style><marker id="d-05-feedback-data-flow-05-feedback-data-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-05-feedback-data-flow-05-feedback-data-flow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0078fc"/></marker></defs><rect width="1280" height="720" fill="#f5f8fc"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="168" height="24" fill="#f5f8fc"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">FEEDBACK DATA FLOW</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">概念圖 · 原始碼查讀</text><rect x="96" y="116" width="64" height="4" fill="#0078fc"/><path d="M400 244 L456 244" fill="none" stroke="#0078fc" stroke-width="1.2" marker-end="url(#d-05-feedback-data-flow-05-feedback-data-flow-arrow-accent)"/><path d="M792 244 L848 244" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-05-feedback-data-flow-05-feedback-data-flow-arrow)"/><path d="M400 488 L456 488" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-05-feedback-data-flow-05-feedback-data-flow-arrow)"/><path d="M1184 244 L1192 244 Q1200 244 1200 252 L1200 372 Q1200 380 1192 380 L1024 380 Q1016 380 1016 388 L1016 424" fill="none" stroke="#52657d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#d-05-feedback-data-flow-05-feedback-data-flow-arrow)"/><rect x="1024.0" y="356" width="120" height="18" rx="2" fill="#fafdff"/><text x="1084" y="368" font-size="10" fill="#52657d" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">WIRE SEPARATELY</text><path d="M1016 308 L1016 352 Q1016 360 1008 360 L632 360 Q624 360 624 368 L624 424" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-05-feedback-data-flow-05-feedback-data-flow-arrow)"/><g data-node="true"><rect x="96" y="180" width="304" height="128" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="112" y="192" width="52" height="18" rx="2" fill="#eef4fb"/><text x="120" y="205" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">SOURCE</text><text x="112" y="231" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Bad trace 與資料政策</text><text x="112" y="254" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Input、預期結果、failure、build</text><text x="112" y="272" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">允許欄位、case ID 與 dataset 版本</text></g><g data-node="true"><rect x="456" y="180" width="336" height="128" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><rect x="472" y="192" width="70" height="18" rx="2" fill="#1c78e4"/><text x="480" y="205" font-size="9" fill="#ffffff" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">TRANSFORM</text><text x="472" y="231" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">建立最小化回歸案例</text><text x="472" y="254" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">選允許欄位；限制值形狀與長度</text><text x="472" y="272" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">trace ID → sourceTraceDigest</text></g><g data-node="true"><rect x="848" y="180" width="336" height="128" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="864" y="192" width="58" height="18" rx="2" fill="#eef4fb"/><text x="872" y="205" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">DATASET</text><text x="864" y="231" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">加入指定 dataset</text><text x="864" y="254" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">名稱／版本一致；拒絕重複 case ID</text><text x="864" y="272" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">不自動改版或發布</text></g><g data-node="true"><rect x="96" y="424" width="304" height="128" rx="8" fill="#eef4fb" stroke="#b9cce3" stroke-width="1.2"/><rect x="112" y="436" width="100" height="18" rx="2" fill="#eef4fb"/><text x="120" y="449" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">EXTERNAL INPUT</text><text x="112" y="475" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">另外提供實驗 snapshots</text><text x="112" y="498" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">before / after</text><text x="112" y="516" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">需要實際執行路徑取得結果</text></g><g data-node="true"><rect x="456" y="424" width="336" height="128" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="472" y="436" width="40" height="18" rx="2" fill="#eef4fb"/><text x="480" y="449" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">CLI</text><text x="472" y="475" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Workflow CLI 整理與比較</text><text x="472" y="498" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">feedback-loop.cli.ts</text><text x="472" y="516" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">dataset + comparison JSON</text></g><g data-node="true"><rect x="848" y="424" width="336" height="128" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="864" y="436" width="76" height="18" rx="2" fill="#eef4fb"/><text x="872" y="449" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">EXPERIMENT</text><text x="864" y="475" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">獨立實驗 consumer</text><text x="864" y="498" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">runExperiment()</text><text x="864" y="516" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Runner → metrics → 本地／hosted 結果</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">CLI 沒有自動啟動兩次模型實驗、修改 Prompt、訓練或部署；虛線接點需另行接線。</text><text x="96" y="658" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">欄位篩選不等於完整去識別；expectedOutput 需審閱，版本字串也不保證內容一致。</text>
</svg>
