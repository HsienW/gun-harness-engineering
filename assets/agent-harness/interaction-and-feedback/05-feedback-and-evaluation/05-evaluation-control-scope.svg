<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" lang="zh-TW" role="img" aria-labelledby="05-evaluation-control-scope-title 05-evaluation-control-scope-desc" id="d-05-evaluation-control-scope-root">
<title id="05-evaluation-control-scope-title">評估執行的控制範圍</title><desc id="05-evaluation-control-scope-desc">Runner timeout、成本、metrics 與 hosted 發布各有不同控制邊界。</desc>
<defs>
      <style>#d-05-evaluation-control-scope-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-05-evaluation-control-scope-root nav, #d-05-evaluation-control-scope-root p, #d-05-evaluation-control-scope-root li { font-size:14px;line-height:1.8 }
      #d-05-evaluation-control-scope-root a { color:#0066d6 }
      #d-05-evaluation-control-scope-root .diagram-container { width:100%;overflow-x:auto }
      #d-05-evaluation-control-scope-root details { margin-top:24px;border-top:1px solid #b9cce3;padding-top:16px }
      #d-05-evaluation-control-scope-root summary { cursor:pointer;font-weight:600 }
      #d-05-evaluation-control-scope-root .notes { display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px }
      #d-05-evaluation-control-scope-root ul { padding-left:20px }
      #d-05-evaluation-control-scope-root nav, #d-05-evaluation-control-scope-root details { display:none }
      #d-05-evaluation-control-scope-root .diagram-container { overflow-x:visible }</style><marker id="d-05-evaluation-control-scope-05-evaluation-control-scope-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-05-evaluation-control-scope-05-evaluation-control-scope-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0078fc"/></marker></defs><rect width="1280" height="720" fill="#f5f8fc"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="152" height="24" fill="#f5f8fc"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">EVALUATION SCOPE</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">概念圖 · 原始碼查讀</text><rect x="96" y="116" width="64" height="4" fill="#0078fc"/><path d="M336 284 L376 284" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-05-evaluation-control-scope-05-evaluation-control-scope-arrow)"/><path d="M624 284 L664 284" fill="none" stroke="#0078fc" stroke-width="1.2" marker-end="url(#d-05-evaluation-control-scope-05-evaluation-control-scope-arrow-accent)"/><path d="M912 284 L952 284" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-05-evaluation-control-scope-05-evaluation-control-scope-arrow)"/><path d="M1068 356 L1068 448" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-05-evaluation-control-scope-05-evaluation-control-scope-arrow)"/><g data-node="true"><rect x="96" y="212" width="240" height="144" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="112" y="224" width="52" height="18" rx="2" fill="#eef4fb"/><text x="120" y="237" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">CONFIG</text><text x="112" y="263" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">驗證設定與資料集</text><text x="112" y="286" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">版本、數量與已累積成本</text><text x="112" y="304" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">限制達成可略過後續 item</text></g><g data-node="true"><rect x="376" y="212" width="248" height="144" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><rect x="392" y="224" width="58" height="18" rx="2" fill="#1c78e4"/><text x="400" y="237" font-size="9" fill="#ffffff" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">TIMEOUT</text><text x="392" y="263" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Agent runner</text><text x="392" y="286" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Promise.race() + AbortSignal</text><text x="392" y="304" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Timeout 結束本層等待</text></g><g data-node="true"><rect x="664" y="212" width="248" height="144" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="680" y="224" width="58" height="18" rx="2" fill="#eef4fb"/><text x="688" y="237" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">METRICS</text><text x="680" y="263" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">完成後另外評分</text><text x="680" y="286" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">ToolCallCorrectness</text><text x="680" y="304" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">ResponseQuality / judge</text></g><g data-node="true"><rect x="952" y="212" width="232" height="144" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="968" y="224" width="64" height="18" rx="2" fill="#eef4fb"/><text x="976" y="237" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">ARTIFACT</text><text x="968" y="263" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">本地 JSON 產物</text><text x="968" y="286" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">結果、metric、trace、設定</text><text x="968" y="304" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">另記 hosted publication 狀態</text></g><g data-node="true"><rect x="96" y="448" width="304" height="112" rx="8" fill="#eef4fb" stroke="#b9cce3" stroke-width="1.2"/><rect x="112" y="460" width="94" height="18" rx="2" fill="#eef4fb"/><text x="120" y="473" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">REPORTED COST</text><text x="112" y="499" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">成本回報有缺口</text><text x="112" y="522" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">預設 runner 不提供 tokenCostUsd</text><text x="112" y="540" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">不能宣稱完整帳單硬上限</text></g><g data-node="true"><rect x="456" y="448" width="336" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="472" y="460" width="94" height="18" rx="2" fill="#eef4fb"/><text x="480" y="473" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">CONTROL LIMIT</text><text x="472" y="499" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Timeout 不涵蓋所有 judge 呼叫</text><text x="472" y="522" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">底層 I/O 是否停止需另證據</text><text x="472" y="540" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">分數不替代控制條件的程式檢查</text></g><g data-node="true"><rect x="848" y="448" width="336" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="864" y="460" width="82" height="18" rx="2" fill="#eef4fb"/><text x="872" y="473" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">PUBLICATION</text><text x="864" y="499" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Hosted 發布是另一個結果</text><text x="864" y="522" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">遠端失敗可保留本地產物</text><text x="864" y="540" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Local ID 不等於 hosted ID</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">每項都要保留 completed／failed／timeout／skipped；不能只比較有分數的樣本。</text><text x="96" y="658" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">比較需保留 dataset 內容與 Agent／judge／metric 設定；本輪沒有執行評分或遠端實驗。</text>
</svg>
