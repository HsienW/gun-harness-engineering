<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" lang="zh-TW" role="img" aria-labelledby="04-cancellation-paths-title 04-cancellation-paths-desc" id="d-04-cancellation-paths-root">
<title id="04-cancellation-paths-title">取消分流：停止、補償與修正</title><desc id="04-cancellation-paths-desc">停止串流與業務取消分開，取消決策依 Ledger 已知效果分流。</desc>
<defs>
      <style>#d-04-cancellation-paths-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-04-cancellation-paths-root nav, #d-04-cancellation-paths-root p, #d-04-cancellation-paths-root li { font-size:14px;line-height:1.8 }
      #d-04-cancellation-paths-root a { color:#0066d6 }
      #d-04-cancellation-paths-root .diagram-container { width:100%;overflow-x:auto }
      #d-04-cancellation-paths-root details { margin-top:24px;border-top:1px solid #b9cce3;padding-top:16px }
      #d-04-cancellation-paths-root summary { cursor:pointer;font-weight:600 }
      #d-04-cancellation-paths-root .notes { display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px }
      #d-04-cancellation-paths-root ul { padding-left:20px }
      #d-04-cancellation-paths-root nav, #d-04-cancellation-paths-root details { display:none }
      #d-04-cancellation-paths-root .diagram-container { overflow-x:visible }</style><marker id="d-04-cancellation-paths-04-cancellation-paths-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-04-cancellation-paths-04-cancellation-paths-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0078fc"/></marker></defs><rect width="1280" height="720" fill="#f5f8fc"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="168" height="24" fill="#f5f8fc"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">CANCELLATION PATHS</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">概念圖 · 原始碼查讀</text><rect x="96" y="116" width="64" height="4" fill="#0078fc"/><path d="M96 304 H1184" fill="none" stroke="#d5e1ee" stroke-width="1"/><path d="M96 372 H1184" fill="none" stroke="#d5e1ee" stroke-width="1"/><path d="M96 440 H1184" fill="none" stroke="#d5e1ee" stroke-width="1"/><path d="M96 508 H1184" fill="none" stroke="#d5e1ee" stroke-width="1"/><path d="M528 220 L592 220" fill="none" stroke="#0078fc" stroke-width="1.2" marker-end="url(#d-04-cancellation-paths-04-cancellation-paths-arrow-accent)"/><path d="M388 324 L428 324" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-04-cancellation-paths-04-cancellation-paths-arrow)"/><path d="M388 392 L428 392" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-04-cancellation-paths-04-cancellation-paths-arrow)"/><path d="M388 460 L428 460" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-04-cancellation-paths-04-cancellation-paths-arrow)"/><path d="M388 528 L428 528" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-04-cancellation-paths-04-cancellation-paths-arrow)"/><g data-node="true"><rect x="96" y="164" width="432" height="108" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="112" y="176" width="70" height="18" rx="2" fill="#eef4fb"/><text x="120" y="189" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">TRANSPORT</text><text x="112" y="215" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">App 停止目前串流</text><text x="112" y="238" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">UI cancelled → thread.stop()</text><text x="112" y="256" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">斷線不證明外部尚未提交</text></g><g data-node="true"><rect x="592" y="164" width="592" height="108" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><rect x="608" y="176" width="106" height="18" rx="2" fill="#1c78e4"/><text x="616" y="189" font-size="9" fill="#ffffff" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">BUSINESS CANCEL</text><text x="608" y="215" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">另外提出業務取消</text><text x="608" y="238" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">{kind: &quot;cancel&quot;, targetRunId?}</text><text x="608" y="256" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">decideCancellation 的依賴必須實際注入</text></g><text x="112" y="328" font-size="11" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">read_only</text><text x="456" y="324" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">中斷或接替</text><text x="456" y="346" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">interrupt_or_supersede</text><text x="112" y="396" font-size="11" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">reversible_committed</text><text x="456" y="392" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">補償成功才接替；失敗交人工</text><text x="456" y="414" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">compensated_then_supersede</text><text x="112" y="464" font-size="11" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">irreversible_committed</text><text x="456" y="460" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">授權修正或交人工；此處不啟動修正任務</text><text x="456" y="482" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">corrective_authorized / manual</text><text x="112" y="532" font-size="11" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">unknown</text><text x="456" y="528" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">先回查；已知則重分流，仍未知交人工</text><text x="456" y="550" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">reconcile → known phase / manual</text><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">production 預設未注入 decideCancellation；supersede 也沒有呼叫 native Run cancel API。</text><text x="96" y="658" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">read_only 僅代表 Ledger 觀察；替換 owner 不是停止舊 I/O，也不會自動撤銷外部效果。</text>
</svg>
