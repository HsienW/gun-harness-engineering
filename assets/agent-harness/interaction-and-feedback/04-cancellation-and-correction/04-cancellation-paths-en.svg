<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" lang="en" role="img" aria-labelledby="04-cancellation-paths-en-title 04-cancellation-paths-en-desc" id="d-04-cancellation-paths-en-root">
<title id="04-cancellation-paths-en-title">Cancellation: stop, compensate, or correct</title><desc id="04-cancellation-paths-en-desc">Transport stop and business cancellation are separate; decisions depend on Ledger effect state.</desc>
<defs>
      <style>#d-04-cancellation-paths-en-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-04-cancellation-paths-en-root nav, #d-04-cancellation-paths-en-root p, #d-04-cancellation-paths-en-root li { font-size:14px;line-height:1.8 }
      #d-04-cancellation-paths-en-root a { color:#0066d6 }
      #d-04-cancellation-paths-en-root .diagram-container { width:100%;overflow-x:auto }
      #d-04-cancellation-paths-en-root details { margin-top:24px;border-top:1px solid #b9cce3;padding-top:16px }
      #d-04-cancellation-paths-en-root summary { cursor:pointer;font-weight:600 }
      #d-04-cancellation-paths-en-root .notes { display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px }
      #d-04-cancellation-paths-en-root ul { padding-left:20px }
      #d-04-cancellation-paths-en-root nav, #d-04-cancellation-paths-en-root details { display:none }
      #d-04-cancellation-paths-en-root .diagram-container { overflow-x:visible }</style><marker id="d-04-cancellation-paths-en-04-cancellation-paths-en-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-04-cancellation-paths-en-04-cancellation-paths-en-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0078fc"/></marker></defs><rect width="1280" height="720" fill="#f5f8fc"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="168" height="24" fill="#f5f8fc"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">CANCELLATION PATHS</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">CONCEPTUAL / SOURCE INSPECTION</text><rect x="96" y="116" width="64" height="4" fill="#0078fc"/><path d="M96 304 H1184" fill="none" stroke="#d5e1ee" stroke-width="1"/><path d="M96 372 H1184" fill="none" stroke="#d5e1ee" stroke-width="1"/><path d="M96 440 H1184" fill="none" stroke="#d5e1ee" stroke-width="1"/><path d="M96 508 H1184" fill="none" stroke="#d5e1ee" stroke-width="1"/><path d="M528 220 L592 220" fill="none" stroke="#0078fc" stroke-width="1.2" marker-end="url(#d-04-cancellation-paths-en-04-cancellation-paths-en-arrow-accent)"/><path d="M388 324 L428 324" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-04-cancellation-paths-en-04-cancellation-paths-en-arrow)"/><path d="M388 392 L428 392" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-04-cancellation-paths-en-04-cancellation-paths-en-arrow)"/><path d="M388 460 L428 460" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-04-cancellation-paths-en-04-cancellation-paths-en-arrow)"/><path d="M388 528 L428 528" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-04-cancellation-paths-en-04-cancellation-paths-en-arrow)"/><g data-node="true"><rect x="96" y="164" width="432" height="108" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="112" y="176" width="70" height="18" rx="2" fill="#eef4fb"/><text x="120" y="189" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">TRANSPORT</text><text x="112" y="215" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">App stops the current stream</text><text x="112" y="238" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">UI cancelled → thread.stop()</text><text x="112" y="256" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Disconnect does not prove no external commit</text></g><g data-node="true"><rect x="592" y="164" width="592" height="108" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><rect x="608" y="176" width="106" height="18" rx="2" fill="#1c78e4"/><text x="616" y="189" font-size="9" fill="#ffffff" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">BUSINESS CANCEL</text><text x="608" y="215" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Submit a separate business cancellation</text><text x="608" y="238" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">{kind: &quot;cancel&quot;, targetRunId?}</text><text x="608" y="256" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">decideCancellation requires injected dependencies</text></g><text x="112" y="328" font-size="11" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">read_only</text><text x="456" y="324" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Interrupt or supersede</text><text x="456" y="346" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">interrupt_or_supersede</text><text x="112" y="396" font-size="11" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">reversible_committed</text><text x="456" y="392" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Compensate before replacement; failure → manual</text><text x="456" y="414" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">compensated_then_supersede</text><text x="112" y="464" font-size="11" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">irreversible_committed</text><text x="456" y="460" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Authorize correction or manual; no corrective task starts here</text><text x="456" y="482" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">corrective_authorized / manual</text><text x="112" y="532" font-size="11" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">unknown</text><text x="456" y="528" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Reconcile, then reclassify; still unknown → manual</text><text x="456" y="550" font-size="10" fill="#52657d" font-weight="400" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">reconcile → known phase / manual</text><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Production defaults omit decideCancellation; supersede does not call a native Run cancel API.</text><text x="96" y="658" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">read_only reflects Ledger observations; replacing ownership neither stops old I/O nor automatically reverses external effects.</text>
</svg>
