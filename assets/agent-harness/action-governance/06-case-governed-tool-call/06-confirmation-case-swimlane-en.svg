<text x="92" y="1345" class="body">A later upsertPending() rejects; the error propagates.</text>
<text x="92" y="1373" class="body">Total calls remain 1, from the earlier approved call.</text>
<text x="92" y="1401" class="body">The failed call adds no execution.</text>
