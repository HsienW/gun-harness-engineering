<g>
<rect x="810" y="1280" width="720" height="185" rx="10" fill="#f0f3f7" stroke="#b9cce3"/>
<text x="832" y="1313" class="heading">Evidence this test does not supply</text>
<text x="832" y="1345" class="body">Real file writes, PostgreSQL races, production isolation.</text>
<text x="832" y="1373" class="body">Cross-deployment recovery, external idempotency, undo.</text>
