 Mono', 'Consolas', 'Microsoft JhengHei', monospace">TEST INPUT</text><text x="112" y="263" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Queue write_file directly</text><text x="112" y="286" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">No model Tool Call is obtained first</text></g><g data-node="true"><rect x="376" y="212" width="240" height="100" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="392" y="224" width="70" height="18" rx="2" fill="#eef4fb"/><text x="400" y="237" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">INTERRUPT</text><text x="392" y="263" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Save pending and wait</text><text x="392" y="286" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">upsertPending() + manifest</text></g><g data-node="true"><rect x="656" y="212" width="248" height="100" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="672" y="224" width="58" height="18" rx="2" fill="#eef4fb"/><text x="680" y="237" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">WAITING</text><text x="672" y="263" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Manifest remains waiting</text><text x="672" y="286" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Wait for the bound approval response</text></g><g data-node="true"><rect x="944" y="212" width="240" height="100" rx="8" fill="#eef4fb" stroke="#b9cce3" stroke-width="1.2"/><rect x="960" y="224" width="70" height="18" rx="2" fill="#eef4fb"/><text x="968" y="237" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">ASSERTION</text><text x="960" y="263" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">invoked = 0</text><text x="960" y="286" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">No tool calls while waiting</text></g><g data-node="true"><rect x="96" y="364" width="240" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="112" y="376" width="52" height="18" rx="2" fill="#eef4fb"/><text x="120" y="389" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">RESUME</text><text x="112" y="415" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Approve in the same Thread</text><text x="112" y="438" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Command(resume): approve + IDs</text><text x="112" y="456" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">thread_id = &quot;thread-1&quot;</text></g><g data-node="true"><rect x="656" y="364" width="248" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="672" y="376" width="82" height="18" rx="2" fill="#eef4fb"/><text x="680" y="389" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">TEST DOUBLE</text><text x="672" y="415" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Mock consume()</text><text x="672" y="438" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Always returns approved</text><text x="672" y="456" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Manifest: waiting → resumed</text></g><g data-node="true"><rect x="376" y="500" width="240" height="96" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="392" y="512" width="64" height="18" rx="2" fill="#eef4fb"/><text x="400" y="525" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">DISPATCH</text><text x="392" y="551" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Dispatch after approval</text><text x="392" y="574" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">executeAuthorizedTyped()</text></g><g data-node="true"><rect x="944" y="500" width="240" height="96" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><rect x="960" y="512" width="70" height="18" rx="2" fill="#1c78e4"/><text x="968" y="525" font-size="9" fill="#ffffff" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">ASSERTION</text><text x="960" y="551" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">invoked = 1</text><text x="960" y="574" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">wrote:${path}</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">A later pending-save failure adds no execution: total calls stay at 1 from the prior approval; the mock returns text, not a file write.</text><text x="96" y="658" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Tests were read, not run; no PostgreSQL race, deployment recovery, or isolation proof, and the Graph adds no model reply.</text>
