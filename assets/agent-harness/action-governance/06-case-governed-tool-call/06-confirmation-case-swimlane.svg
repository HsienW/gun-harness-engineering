ne" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-06-confirmation-case-swimlane-06-confirmation-case-swimlane-arrow)"/><rect x="460.0" y="394" width="72" height="18" rx="2" fill="#fafdff"/><text x="496" y="406" font-size="10" fill="#52657d" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">CONSUME</text><path d="M780 476 L780 480 Q780 488 772 488 L504 488 Q496 488 496 496 L496 500" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-06-confirmation-case-swimlane-06-confirmation-case-swimlane-arrow)"/><path d="M616 548 L944 548" fill="none" stroke="#0078fc" stroke-width="1.2" marker-end="url(#d-06-confirmation-case-swimlane-06-confirmation-case-swimlane-arrow-accent)"/><rect x="748.0" y="522" width="64" height="18" rx="2" fill="#fafdff"/><text x="780" y="534" font-size="10" fill="#52657d" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">INVOKE</text><text x="96" y="176" font-size="11" fill="#52657d" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">測試 Caller</text><text x="376" y="176" font-size="11" fill="#52657d" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">GRAPH</text><text x="656" y="176" font-size="11" fill="#52657d" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">MOCK STORE / MANIFEST</text><text x="944" y="176" font-size="11" fill="#52657d" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">MOCK TOOL</text><g data-node="true"><rect x="96" y="212" width="240" height="100" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="112" y="224" width="76" height="18" rx="2" fill="#eef4fb"/><text x="120" y="237" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">TEST INPUT</text><text x="112" y="263" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">直接放入 write_file 佇列</text><text x="112" y="286" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">測試不先取得模型 Tool Call</text></g><g data-node="true"><rect x="376" y="212" width="240" height="100" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="392" y="224" width="70" height="18" rx="2" fill="#eef4fb"/><text x="400" y="237" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">INTERRUPT</text><text x="392" y="263" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">保存 pending 並等待</text><text x="392" y="286" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">upsertPending() + manifest</text></g><g data-node="true"><rect x="656" y="212" width="248" height="100" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="672" y="224" width="58" height="18" rx="2" fill="#eef4fb"/><text x="680" y="237" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">WAITING</text><text x="672" y="263" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Manifest 保持 waiting</text><text x="672" y="286" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">待指定的批准資料恢復</text></g><g data-node="true"><rect x="944" y="212" width="240" height="100" rx="8" fill="#eef4fb" stroke="#b9cce3" stroke-width="1.2"/><rect x="960" y="224" width="70" height="18" rx="2" fill="#eef4fb"/><text x="968" y="237" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">ASSERTION</text><text x="960" y="263" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">invoked = 0</text><text x="960" y="286" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">等待期間沒有工具呼叫</text></g><g data-node="true"><rect x="96" y="364" width="240" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="112" y="376" width="52" height="18" rx="2" fill="#eef4fb"/><text x="120" y="389" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">RESUME</text><text x="112" y="415" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">同 Thread 恢復批准</text><text x="112" y="438" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Command(resume): approve + IDs</text><text x="112" y="456" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">thread_id = &quot;thread-1&quot;</text></g><g data-node="true"><rect x="656" y="364" width="248" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="672" y="376" width="82" height="18" rx="2" fill="#eef4fb"/><text x="680" y="389" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">TEST DOUBLE</text><text x="672" y="415" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Mock consume()</text><text x="672" y="438" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">固定回 approved</text><text x="672" y="456" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Manifest：waiting → resumed</text></g><g data-node="true"><rect x="376" y="500" width="240" height="96" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="392" y="512" width="64" height="18" rx="2" fill="#eef4fb"/><text x="400" y="525" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">DISPATCH</text><text x="392" y="551" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">以批准交回派送</text><text x="392" y="574" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">executeAuthorizedTyped()</text></g><g data-node="true"><rect x="944" y="500" width="240" height="96" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><rect x="960" y="512" width="70" height="18" rx="2" fill="#1c78e4"/><text x="968" y="525" font-size="9" fill="#ffffff" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">ASSERTION</text><text x="960" y="551" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">invoked = 1</text><text x="960" y="574" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">wrote:${path}</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">另一分支保存失敗時不增加執行：總計仍為前一個批准案例的 1 次；mock 只回文字，未寫檔。</text><text x="96" y="658" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">已讀測試未重跑；不證明 PostgreSQL 競態、跨部署恢復或隔離，Graph 也沒有接續模型回覆。</text>
