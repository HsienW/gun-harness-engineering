<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" lang="zh-TW" role="img" aria-labelledby="01-contract-sources-title 01-contract-sources-desc" id="d-01-contract-sources-root">
<title id="01-contract-sources-title">行動契約：每個欄位有自己的來源</title><desc id="01-contract-sources-desc">操作提案、可信身分、政策資源與 Runtime 描述分別提供契約內容。</desc>
<defs>
      <style>#d-01-contract-sources-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-01-contract-sources-root nav, #d-01-contract-sources-root p, #d-01-contract-sources-root li { font-size:14px;line-height:1.8 }
      #d-01-contract-sources-root a { color:#0066d6 }
      #d-01-contract-sources-root .diagram-container { width:100%;overflow-x:auto }
      #d-01-contract-sources-root details { margin-top:24px;border-top:1px solid #b9cce3;padding-top:16px }
      #d-01-contract-sources-root summary { cursor:pointer;font-weight:600 }
      #d-01-contract-sources-root .notes { display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px }
      #d-01-contract-sources-root ul { padding-left:20px }
      #d-01-contract-sources-root nav, #d-01-contract-sources-root details { display:none }
      #d-01-contract-sources-root .diagram-container { overflow-x:visible }</style><marker id="d-01-contract-sources-01-contract-sources-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-01-contract-sources-01-contract-sources-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0078fc"/></marker></defs><rect width="1280" height="720" fill="#f5f8fc"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="208" height="24" fill="#f5f8fc"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">ACTION CONTRACT SOURCES</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">概念圖 · 原始碼查讀</text><rect x="96" y="116" width="64" height="4" fill="#0078fc"/><path d="M216 308 L216 360 Q216 368 224 368 L408 368 Q416 368 416 376 L416 432" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-01-contract-sources-01-contract-sources-arrow)"/><path d="M500 308 L500 336 Q500 344 508 344 L552 344 Q560 344 560 352 L560 432" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-01-contract-sources-01-contract-sources-arrow)"/><path d="M788 308 L788 336 Q788 344 780 344 L712 344 Q704 344 704 352 L704 432" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-01-contract-sources-01-contract-sources-arrow)"/><path d="M1068 308 L1068 360 Q1068 368 1060 368 L856 368 Q848 368 848 376 L848 432" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-01-contract-sources-01-contract-sources-arrow)"/><g data-node="true"><rect x="96" y="180" width="240" height="128" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="112" y="192" width="70" height="18" rx="2" fill="#eef4fb"/><text x="120" y="205" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">OPERATION</text><text x="112" y="231" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">模型提案／程式路由</text><text x="112" y="254" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Tool name + input</text><text x="112" y="272" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Tool call ID</text></g><g data-node="true"><rect x="376" y="180" width="248" height="128" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="392" y="192" width="64" height="18" rx="2" fill="#eef4fb"/><text x="400" y="205" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">IDENTITY</text><text x="392" y="231" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">可信執行入口</text><text x="392" y="254" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Principal / Tenant / Scope</text><text x="392" y="272" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Canonical execution Context</text></g><g data-node="true"><rect x="664" y="180" width="248" height="128" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="680" y="192" width="70" height="18" rx="2" fill="#eef4fb"/><text x="688" y="205" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">AUTHORITY</text><text x="680" y="231" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">政策與資源解析</text><text x="680" y="254" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Actions + risk policy</text><text x="680" y="272" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">resourceRefResolver → ResourceRef</text></g><g data-node="true"><rect x="952" y="180" width="232" height="128" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="968" y="192" width="70" height="18" rx="2" fill="#eef4fb"/><text x="976" y="205" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">EXECUTION</text><text x="968" y="231" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Runtime descriptor</text><text x="968" y="254" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Version / profile / Schemas</text><text x="968" y="272" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">唯讀、並行、timeout、retry</text></g><g data-node="true"><rect x="280" y="432" width="728" height="136" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><rect x="296" y="444" width="160" height="18" rx="2" fill="#1c78e4"/><text x="304" y="457" font-size="9" fill="#ffffff" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">CONCRETE ACTION CONTRACT</text><text x="296" y="483" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">在具體呼叫時組裝並核對行動契約</text><text x="296" y="506" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Registry 對回實作；Schema 檢查形狀；政策與 resolver 形成授權輸入</text><text x="296" y="524" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Call ID 關聯提案與結果；可信 Context 建立操作人與範圍</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">有效字串不代表有權讀寫檔案或 URL；輸入驗證、風險分類與操作授權分開核對。</text><text x="96" y="658" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">外部文字不能改寫 Principal／Tenant／Scope；模型宣稱安全，也不能取代可信風險政策。</text>
</svg>
