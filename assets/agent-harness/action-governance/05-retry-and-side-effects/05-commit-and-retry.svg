<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" lang="zh-TW" role="img" aria-labelledby="05-commit-and-retry-title 05-commit-and-retry-desc" id="d-05-commit-and-retry-root">
<title id="05-commit-and-retry-title">提交狀態決定重試路徑</title><desc id="05-commit-and-retry-desc">未提交的失敗需通過重試 gate；派送後效果不明則先回查。</desc>
<defs>
      <style>#d-05-commit-and-retry-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-05-commit-and-retry-root nav, #d-05-commit-and-retry-root p, #d-05-commit-and-retry-root li { font-size:14px;line-height:1.8 }
      #d-05-commit-and-retry-root a { color:#0066d6 }
      #d-05-commit-and-retry-root .diagram-container { width:100%;overflow-x:auto }
      #d-05-commit-and-retry-root details { margin-top:24px;border-top:1px solid #b9cce3;padding-top:16px }
      #d-05-commit-and-retry-root summary { cursor:pointer;font-weight:600 }
      #d-05-commit-and-retry-root .notes { display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px }
      #d-05-commit-and-retry-root ul { padding-left:20px }
      #d-05-commit-and-retry-root nav, #d-05-commit-and-retry-root details { display:none }
      #d-05-commit-and-retry-root .diagram-container { overflow-x:visible }</style><marker id="d-05-commit-and-retry-05-commit-and-retry-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-05-commit-and-retry-05-commit-and-retry-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0078fc"/></marker></defs><rect width="1280" height="720" fill="#f5f8fc"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="184" height="24" fill="#f5f8fc"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">COMMIT STATE / RETRY</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">概念圖 · 原始碼查讀</text><rect x="96" y="116" width="64" height="4" fill="#0078fc"/><path d="M292 292 L292 356" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-05-commit-and-retry-05-commit-and-retry-arrow)"/><path d="M936 292 L936 356" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-05-commit-and-retry-05-commit-and-retry-arrow)"/><path d="M292 484 L292 524" fill="none" stroke="#0078fc" stroke-width="1.2" marker-end="url(#d-05-commit-and-retry-05-commit-and-retry-arrow-accent)"/><path d="M812 484 L812 492 Q812 500 804 500 L656 500 Q648 500 648 508 L648 524" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-05-commit-and-retry-05-commit-and-retry-arrow)"/><path d="M936 484 L936 504 Q936 512 928 512 L876 512 Q868 512 868 520 L868 524" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-05-commit-and-retry-05-commit-and-retry-arrow)"/><path d="M1060 484 L1060 492 Q1060 500 1068 500 L1084 500 Q1092 500 1092 508 L1092 524" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-05-commit-and-retry-05-commit-and-retry-arrow)"/><g data-node="true"><rect x="96" y="180" width="392" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="112" y="192" width="70" height="18" rx="2" fill="#eef4fb"/><text x="120" y="205" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">NO COMMIT</text><text x="112" y="231" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">failed_not_committed</text><text x="112" y="254" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">執行契約回報未提交的失敗</text><text x="112" y="272" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">不是只看 timeout 或錯誤文字</text></g><g data-node="true"><rect x="688" y="180" width="496" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="704" y="192" width="112" height="18" rx="2" fill="#eef4fb"/><text x="712" y="205" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">UNCERTAIN EFFECT</text><text x="704" y="231" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">ambiguous_after_dispatch</text><text x="704" y="254" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">已派送，但外部提交狀態不確定</text><text x="704" y="272" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">不可直接當作未提交再派送</text></g><g data-node="true"><rect x="96" y="356" width="392" height="128" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><rect x="112" y="368" width="76" height="18" rx="2" fill="#1c78e4"/><text x="120" y="381" font-size="9" fill="#ffffff" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">RETRY GATE</text><text x="112" y="407" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">A. 核對重試條件</text><text x="112" y="430" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">錯誤可重試 ＋ policy 允許 ＋ budget 可繼續</text><text x="112" y="448" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">另查取消與 attempt 上限；不符就停止</text></g><g data-node="true"><rect x="688" y="356" width="496" height="128" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="704" y="368" width="100" height="18" rx="2" fill="#eef4fb"/><text x="712" y="381" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">RECONCILIATION</text><text x="704" y="407" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">先 reconcile 外部狀態</text><text x="704" y="430" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">該操作必須有可用的回查能力</text><text x="704" y="448" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">回查結果決定結果處理、重試資格或 defer</text></g><g data-node="true"><rect x="96" y="524" width="392" height="72" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="112" y="536" width="130" height="18" rx="2" fill="#eef4fb"/><text x="120" y="549" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">PASS ALL CONDITIONS</text><text x="112" y="575" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Backoff → 下一次 attempt，再分類結果</text></g><g data-node="true"><rect x="552" y="524" width="184" height="72" rx="8" fill="#eef4fb" stroke="#b9cce3" stroke-width="1.2"/><rect x="568" y="536" width="70" height="18" rx="2" fill="#eef4fb"/><text x="576" y="549" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">COMMITTED</text><text x="568" y="575" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">處理提交結果</text></g><g data-node="true"><rect x="776" y="524" width="184" height="72" rx="8" fill="#eef4fb" stroke="#b9cce3" stroke-width="1.2"/><rect x="792" y="536" width="94" height="18" rx="2" fill="#eef4fb"/><text x="800" y="549" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">NOT COMMITTED</text><text x="792" y="575" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">回到重試 gate A</text></g><g data-node="true"><rect x="1000" y="524" width="184" height="72" rx="8" fill="#eef4fb" stroke="#b9cce3" stroke-width="1.2"/><rect x="1016" y="536" width="58" height="18" rx="2" fill="#eef4fb"/><text x="1024" y="549" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">UNKNOWN</text><text x="1016" y="575" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">保留未知／人工</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">預設 MCP reconciler 回 unknown：MCP_RECONCILIATION_QUERY_UNAVAILABLE；未提交也要再符合重試條件。</text><text x="96" y="658" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">已授權的非唯讀 pipeline 呼叫 maxAttempts=1；本地 Ledger 不保證外部 exactly-once。</text>
</svg>
