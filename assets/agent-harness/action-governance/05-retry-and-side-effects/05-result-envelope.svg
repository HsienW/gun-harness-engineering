<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" lang="zh-TW" role="img" aria-labelledby="05-result-envelope-title 05-result-envelope-desc" id="d-05-result-envelope-root">
<title id="05-result-envelope-title">外層成功仍須核對內層 outcome</title><desc id="05-result-envelope-desc">外層可以成功交付封套，而內層仍保留派送後效果不明的結果。</desc>
<defs>
      <style>#d-05-result-envelope-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-05-result-envelope-root nav, #d-05-result-envelope-root p, #d-05-result-envelope-root li { font-size:14px;line-height:1.8 }
      #d-05-result-envelope-root a { color:#0066d6 }
      #d-05-result-envelope-root .diagram-container { width:100%;overflow-x:auto }
      #d-05-result-envelope-root details { margin-top:24px;border-top:1px solid #b9cce3;padding-top:16px }
      #d-05-result-envelope-root summary { cursor:pointer;font-weight:600 }
      #d-05-result-envelope-root .notes { display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px }
      #d-05-result-envelope-root ul { padding-left:20px }
      #d-05-result-envelope-root nav, #d-05-result-envelope-root details { display:none }
      #d-05-result-envelope-root .diagram-container { overflow-x:visible }</style><marker id="d-05-result-envelope-05-result-envelope-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-05-result-envelope-05-result-envelope-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0078fc"/></marker></defs><rect width="1280" height="720" fill="#f5f8fc"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="144" height="24" fill="#f5f8fc"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">RESULT ENVELOPE</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">概念圖 · 原始碼查讀</text><rect x="96" y="116" width="64" height="4" fill="#0078fc"/><path d="M400 536 L456 536" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-05-result-envelope-05-result-envelope-arrow)"/><path d="M792 536 L848 536" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-05-result-envelope-05-result-envelope-arrow)"/><g data-node="true"><rect x="96" y="164" width="1088" height="280" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="112" y="176" width="118" height="18" rx="2" fill="#eef4fb"/><text x="120" y="189" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">ENVELOPE DELIVERY</text><text x="112" y="215" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">外層 GovernedToolOutcome：succeeded</text><text x="112" y="238" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">成功交付 StructuredToolResultEnvelope，不代表工具或業務已完成</text></g><g data-node="true"><rect x="144" y="280" width="992" height="112" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><rect x="160" y="292" width="94" height="18" rx="2" fill="#1c78e4"/><text x="168" y="305" font-size="9" fill="#ffffff" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">INNER OUTCOME</text><text x="160" y="331" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">envelope.outcome: ambiguous_after_dispatch</text><text x="160" y="354" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">例如派送後 Task／Step 持久化失敗，內層保留不確定狀態</text><text x="160" y="372" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">不可改寫成「確定未提交」或「操作成功」</text></g><text x="160" y="420" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">toLegacyToolResult() → 依內層結果轉成文字</text><g data-node="true"><rect x="96" y="480" width="304" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="112" y="492" width="64" height="18" rx="2" fill="#eef4fb"/><text x="120" y="505" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">DELIVERY</text><text x="112" y="531" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">1. 封套是否交付？</text><text x="112" y="554" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">核對外層結果</text><text x="112" y="572" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">此處只回答封套交付</text></g><g data-node="true"><rect x="456" y="480" width="336" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="472" y="492" width="82" height="18" rx="2" fill="#eef4fb"/><text x="480" y="505" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">TOOL RESULT</text><text x="472" y="531" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">2. 工具 outcome 是什麼？</text><text x="472" y="554" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">讀取 outcome 與結果參照</text><text x="472" y="572" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">成功／未提交／效果不明</text></g><g data-node="true"><rect x="848" y="480" width="336" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="864" y="492" width="106" height="18" rx="2" fill="#eef4fb"/><text x="872" y="505" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">BUSINESS EFFECT</text><text x="864" y="531" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">3. 完成陳述有何證據？</text><text x="864" y="554" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">核對工具結果與外部資源狀態</text><text x="864" y="572" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">成功文字不能取代效果證據</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">這是雙層結果的示意，不表示每次 succeeded 都含不明狀態，也不是本輪執行的故障演練。</text><text x="96" y="658" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Promise resolve、外層成功、工具成功與業務完成要分別查證，並據內層結果決定回查或重試。</text>
</svg>
