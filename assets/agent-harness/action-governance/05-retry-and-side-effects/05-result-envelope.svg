<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1290" width="1600" height="1290" lang="zh-TW" role="img" aria-labelledby="title desc">
<title id="title">結果封套：外層成功仍須檢查內層 outcome</title><desc id="desc">以下示意 pipeline 如何成功交付封套，同時保留派送後效果不明的內層結果。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52657d"/></marker></defs><style>text{font-family:'Segoe UI','Microsoft JhengHei',Arial,sans-serif;fill:#102743}.title{font-size:32px;font-weight:700}.heading{font-size:20px;font-weight:600}.body{font-size:19px}.small{font-size:17px;fill:#52657d}.kicker{font-size:15px;fill:#0078d4;letter-spacing:2px}.label{font-size:16px;fill:#0078d4;font-weight:600;paint-order:stroke;stroke:#f5f8fc;stroke-width:5;stroke-linejoin:round}</style>
<rect width="1600" height="1290" fill="#f5f8fc"/>
<text x="70" y="55" class="kicker">ACTION GOVERNANCE / 05</text>
<text x="70" y="105" class="title">結果封套：外層成功仍須檢查內層 outcome</text>
<text x="70" y="146" class="small">以下示意 pipeline 如何成功交付封套，同時保留派送後效果不明的內層結果。</text>
<g>
<rect x="70" y="210" width="1460" height="575" rx="10" fill="#e7f2ff" stroke="#80baff"/>
<text x="100" y="253" class="heading">外層 GovernedToolOutcome：succeeded</text>
<text x="100" y="300" class="body">代表本層成功回傳 StructuredToolResultEnvelope。</text>
<text x="100" y="338" class="body">不能只憑這個標籤，就向使用者宣稱工具已完成。</text>
<g>
<rect x="140" y="395" width="1320" height="230" rx="10" fill="#fff7e5" stroke="#d8b866"/>
<text x="162" y="428" class="heading">StructuredToolResultEnvelope</text>
<text x="162" y="460" class="body">envelope.outcome：範例為 ambiguous_after_dispatch。</text>
<text x="162" y="488" class="body">例如：派送後 Task／Step 持久化失敗，內層保留效果不明。</text>
<text x="162" y="516" class="body">此時不能把未知狀態改寫成「沒有提交」，也不能改寫成「操作成功」。</text>
<text x="162" y="544" class="body">後續仍需依 outcome、結果參照與外部狀態判讀。</text>
</g>
<text x="100" y="690" class="body">toLegacyToolResult() 依封套內層結果轉成文字。</text>
<text x="100" y="735" class="body">Promise resolve、外層 succeeded、工具成功與業務完成，是需要分別核對的事。</text>
</g>
<path d="M 800 785 V 835 H 300 V 890" fill="none" stroke="#52657d" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 800 785 V 835 H 800 V 890" fill="none" stroke="#52657d" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 800 785 V 835 H 1300 V 890" fill="none" stroke="#52657d" stroke-width="2" marker-end="url(#arrow)"/>
<g>
<rect x="70" y="890" width="460" height="180" rx="10" fill="#e7f2ff" stroke="#80baff"/>
<text x="92" y="923" class="heading">1  封套是否成功交付</text>
<text x="92" y="955" class="body">核對外層結果。</text>
<text x="92" y="983" class="body">這只回答交付封套的這一層。</text>
<text x="92" y="1011" class="body">不能跳過內層判讀。</text>
</g>
<g>
<rect x="570" y="890" width="460" height="180" rx="10" fill="#fff7e5" stroke="#d8b866"/>
<text x="592" y="923" class="heading">2  工具 outcome 是什麼</text>
<text x="592" y="955" class="body">讀取 envelope.outcome。</text>
<text x="592" y="983" class="body">區分成功、未提交、效果不明。</text>
<text x="592" y="1011" class="body">不明狀態轉回副作用處理。</text>
</g>
<g>
<rect x="1070" y="890" width="460" height="180" rx="10" fill="#eaf6ee" stroke="#92bda0"/>
<text x="1092" y="923" class="heading">3  完成陳述有何證據</text>
<text x="1092" y="955" class="body">核對工具結果與實際資源狀態。</text>
<text x="1092" y="983" class="body">業務完成須對應可查證效果。</text>
<text x="1092" y="1011" class="body">成功文字不能替代中間證據。</text>
</g>
<g>
<rect x="70" y="1130" width="1460" height="100" rx="10" fill="#f0f3f7" stroke="#b9cce3"/>
<text x="92" y="1163" class="heading">這張圖的範圍</text>
<text x="92" y="1195" class="body">示意固定版本 pipeline 的雙層結果；不表示每次 succeeded 都包含不明狀態，也不代表本輪做過故障演練。</text>
</g>
<text x="70" y="1260" class="small">閱讀位置：第 8 節。保留內層 outcome，才能決定回查、重試與使用者回覆。</text>
</svg>
