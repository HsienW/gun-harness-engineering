<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" lang="en" role="img" aria-labelledby="05-commit-and-retry-en-title 05-commit-and-retry-en-desc" id="d-05-commit-and-retry-en-root">
<title id="05-commit-and-retry-en-title">Commit state determines the retry path</title><desc id="05-commit-and-retry-en-desc">Non-commit failures must pass the retry gate; uncertainty after dispatch requires reconciliation first.</desc>
<defs>
      <style>#d-05-commit-and-retry-en-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-05-commit-and-retry-en-root nav, #d-05-commit-and-retry-en-root p, #d-05-commit-and-retry-en-root li { font-size:14px;line-height:1.8 }
      #d-05-commit-and-retry-en-root a { color:#0066d6 }
      #d-05-commit-and-retry-en-root .diagram-container { width:100%;overflow-x:auto }
      #d-05-commit-and-retry-en-root details { margin-top:24px;border-top:1px solid #b9cce3;padding-top:16px }
      #d-05-commit-and-retry-en-root summary { cursor:pointer;font-weight:600 }
      #d-05-commit-and-retry-en-root .notes { display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px }
      #d-05-commit-and-retry-en-root ul { padding-left:20px }
      #d-05-commit-and-retry-en-root nav, #d-05-commit-and-retry-en-root details { display:none }
      #d-05-commit-and-retry-en-root .diagram-container { overflow-x:visible }</style><marker id="d-05-commit-and-retry-en-05-commit-and-retry-en-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-05-commit-and-retry-en-05-commit-and-retry-en-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0078fc"/></marker></defs><rect width="1280" height="720" fill="#f5f8fc"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="184" height="24" fill="#f5f8fc"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">COMMIT STATE / RETRY</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">CONCEPTUAL / SOURCE INSPECTION</text><rect x="96" y="116" width="64" height="4" fill="#0078fc"/><path d="M292 292 L292 356" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-05-commit-and-retry-en-05-commit-and-retry-en-arrow)"/><path d="M936 292 L936 356" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-05-commit-and-retry-en-05-commit-and-retry-en-arrow)"/><path d="M292 484 L292 524" fill="none" stroke="#0078fc" stroke-width="1.2" marker-end="url(#d-05-commit-and-retry-en-05-commit-and-retry-en-arrow-accent)"/><path d="M812 484 L812 492 Q812 500 804 500 L656 500 Q648 500 648 508 L648 524" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-05-commit-and-retry-en-05-commit-and-retry-en-arrow)"/><path d="M936 484 L936 504 Q936 512 928 512 L876 512 Q868 512 868 520 L868 524" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-05-commit-and-retry-en-05-commit-and-retry-en-arrow)"/><path d="M1060 484 L1060 492 Q1060 500 1068 500 L1084 500 Q1092 500 1092 508 L1092 524" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-05-commit-and-retry-en-05-commit-and-retry-en-arrow)"/><g data-node="true"><rect x="96" y="180" width="392" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="112" y="192" width="70" height="18" rx="2" fill="#eef4fb"/><text x="120" y="205" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">NO COMMIT</text><text x="112" y="231" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">failed_not_committed</text><text x="112" y="254" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Execution contract reports no commit</text><text x="112" y="272" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">A timeout or error string alone is insufficient</text></g><g data-node="true"><rect x="688" y="180" width="496" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="704" y="192" width="112" height="18" rx="2" fill="#eef4fb"/><text x="712" y="205" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">UNCERTAIN EFFECT</text><text x="704" y="231" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">ambiguous_after_dispatch</text><text x="704" y="254" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Dispatched, but external commit is uncertain</text><text x="704" y="272" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Do not treat it as no commit and redispatch</text></g><g data-node="true"><rect x="96" y="356" width="392" height="128" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><rect x="112" y="368" width="76" height="18" rx="2" fill="#1c78e4"/><text x="120" y="381" font-size="9" fill="#ffffff" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">RETRY GATE</text><text x="112" y="407" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">A. Check retry conditions</text><text x="112" y="430" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Retryable error + allowed policy + remaining budget</text><text x="112" y="448" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Check cancellation and attempt limits; otherwise stop</text></g><g data-node="true"><rect x="688" y="356" width="496" height="128" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="704" y="368" width="100" height="18" rx="2" fill="#eef4fb"/><text x="712" y="381" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">RECONCILIATION</text><text x="704" y="407" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Reconcile external state first</text><text x="704" y="430" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">This operation needs an available status query</text><text x="704" y="448" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">The result determines handling, retry eligibility, or defer</text></g><g data-node="true"><rect x="96" y="524" width="392" height="72" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="112" y="536" width="130" height="18" rx="2" fill="#eef4fb"/><text x="120" y="549" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">PASS ALL CONDITIONS</text><text x="112" y="575" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Backoff → next attempt; reclassify</text></g><g data-node="true"><rect x="552" y="524" width="184" height="72" rx="8" fill="#eef4fb" stroke="#b9cce3" stroke-width="1.2"/><rect x="568" y="536" width="70" height="18" rx="2" fill="#eef4fb"/><text x="576" y="549" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">COMMITTED</text><text x="568" y="575" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Handle the result</text></g><g data-node="true"><rect x="776" y="524" width="184" height="72" rx="8" fill="#eef4fb" stroke="#b9cce3" stroke-width="1.2"/><rect x="792" y="536" width="94" height="18" rx="2" fill="#eef4fb"/><text x="800" y="549" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">NOT COMMITTED</text><text x="792" y="575" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Return to retry gate A</text></g><g data-node="true"><rect x="1000" y="524" width="184" height="72" rx="8" fill="#eef4fb" stroke="#b9cce3" stroke-width="1.2"/><rect x="1016" y="536" width="58" height="18" rx="2" fill="#eef4fb"/><text x="1024" y="549" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">UNKNOWN</text><text x="1016" y="575" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Defer / manual</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Default MCP reconciliation returns unknown: MCP_RECONCILIATION_QUERY_UNAVAILABLE; no commit still requires retry eligibility.</text><text x="96" y="658" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">For authorizationAlreadyEvaluated non-read-only pipeline calls, maxAttempts=1; a local Ledger does not prove external exactly-once.</text>
</svg>
