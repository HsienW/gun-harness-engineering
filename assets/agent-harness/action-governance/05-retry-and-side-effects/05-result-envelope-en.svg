<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" lang="en" role="img" aria-labelledby="05-result-envelope-en-title 05-result-envelope-en-desc" id="d-05-result-envelope-en-root">
<title id="05-result-envelope-en-title">Outer success still needs an inner outcome check</title><desc id="05-result-envelope-en-desc">The outer layer may deliver an envelope successfully while the inner outcome remains uncertain after dispatch.</desc>
<defs>
      <style>#d-05-result-envelope-en-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-05-result-envelope-en-root nav, #d-05-result-envelope-en-root p, #d-05-result-envelope-en-root li { font-size:14px;line-height:1.8 }
      #d-05-result-envelope-en-root a { color:#0066d6 }
      #d-05-result-envelope-en-root .diagram-container { width:100%;overflow-x:auto }
      #d-05-result-envelope-en-root details { margin-top:24px;border-top:1px solid #b9cce3;padding-top:16px }
      #d-05-result-envelope-en-root summary { cursor:pointer;font-weight:600 }
      #d-05-result-envelope-en-root .notes { display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px }
      #d-05-result-envelope-en-root ul { padding-left:20px }
      #d-05-result-envelope-en-root nav, #d-05-result-envelope-en-root details { display:none }
      #d-05-result-envelope-en-root .diagram-container { overflow-x:visible }</style><marker id="d-05-result-envelope-en-05-result-envelope-en-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-05-result-envelope-en-05-result-envelope-en-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0078fc"/></marker></defs><rect width="1280" height="720" fill="#f5f8fc"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="144" height="24" fill="#f5f8fc"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">RESULT ENVELOPE</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">CONCEPTUAL / SOURCE INSPECTION</text><rect x="96" y="116" width="64" height="4" fill="#0078fc"/><path d="M400 536 L456 536" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-05-result-envelope-en-05-result-envelope-en-arrow)"/><path d="M792 536 L848 536" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-05-result-envelope-en-05-result-envelope-en-arrow)"/><g data-node="true"><rect x="96" y="164" width="1088" height="280" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="112" y="176" width="118" height="18" rx="2" fill="#eef4fb"/><text x="120" y="189" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">ENVELOPE DELIVERY</text><text x="112" y="215" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Outer GovernedToolOutcome: succeeded</text><text x="112" y="238" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Successfully delivering StructuredToolResultEnvelope does not establish tool or business completion</text></g><g data-node="true"><rect x="144" y="280" width="992" height="112" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><rect x="160" y="292" width="94" height="18" rx="2" fill="#1c78e4"/><text x="168" y="305" font-size="9" fill="#ffffff" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">INNER OUTCOME</text><text x="160" y="331" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">envelope.outcome: ambiguous_after_dispatch</text><text x="160" y="354" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">For example, Task / Step persistence fails after dispatch, retaining uncertainty inside</text><text x="160" y="372" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Do not rewrite this as confirmed non-commit or successful completion</text></g><text x="160" y="420" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">toLegacyToolResult() → convert the inner result to text</text><g data-node="true"><rect x="96" y="480" width="304" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="112" y="492" width="64" height="18" rx="2" fill="#eef4fb"/><text x="120" y="505" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">DELIVERY</text><text x="112" y="531" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">1. Was the envelope delivered?</text><text x="112" y="554" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Inspect the outer result</text><text x="112" y="572" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">This answers envelope delivery only</text></g><g data-node="true"><rect x="456" y="480" width="336" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="472" y="492" width="82" height="18" rx="2" fill="#eef4fb"/><text x="480" y="505" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">TOOL RESULT</text><text x="472" y="531" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">2. What is the tool outcome?</text><text x="472" y="554" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Read outcome and result references</text><text x="472" y="572" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Success / no commit / uncertainty</text></g><g data-node="true"><rect x="848" y="480" width="336" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="864" y="492" width="106" height="18" rx="2" fill="#eef4fb"/><text x="872" y="505" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">BUSINESS EFFECT</text><text x="864" y="531" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">3. What supports completion?</text><text x="864" y="554" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Check tool results and external resource state</text><text x="864" y="572" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Success text cannot replace effect evidence</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">This illustrates nested outcomes; not every succeeded result is uncertain, and no failure drill was performed here.</text><text x="96" y="658" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Check Promise resolution, envelope delivery, tool success, and business completion separately; use the inner outcome for reconciliation or retry.</text>
</svg>
