<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1290" width="1600" height="1290" lang="en" role="img" aria-labelledby="title desc">
<title id="title">Result envelopes: outer success still needs an inner outcome check</title><desc id="desc">The pipeline can deliver an envelope successfully while retaining an uncertain post-dispatch outcome inside.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52657d"/></marker></defs><style>text{font-family:'Segoe UI','Microsoft JhengHei',Arial,sans-serif;fill:#102743}.title{font-size:32px;font-weight:700}.heading{font-size:20px;font-weight:600}.body{font-size:19px}.small{font-size:17px;fill:#52657d}.kicker{font-size:15px;fill:#0078d4;letter-spacing:2px}.label{font-size:16px;fill:#0078d4;font-weight:600;paint-order:stroke;stroke:#f5f8fc;stroke-width:5;stroke-linejoin:round}</style>
<rect width="1600" height="1290" fill="#f5f8fc"/>
<text x="70" y="55" class="kicker">ACTION GOVERNANCE / 05</text>
<text x="70" y="105" class="title">Result envelopes: outer success still needs an inner outcome check</text>
<text x="70" y="146" class="small">The pipeline can deliver an envelope successfully while retaining an uncertain post-dispatch outcome inside.</text>
<g>
<rect x="70" y="210" width="1460" height="575" rx="10" fill="#e7f2ff" stroke="#80baff"/>
<text x="100" y="253" class="heading">Outer GovernedToolOutcome: succeeded</text>
<text x="100" y="300" class="body">This layer successfully returns a StructuredToolResultEnvelope.</text>
<text x="100" y="338" class="body">This label alone does not establish tool completion for the user.</text>
<g>
<rect x="140" y="395" width="1320" height="230" rx="10" fill="#fff7e5" stroke="#d8b866"/>
<text x="162" y="428" class="heading">StructuredToolResultEnvelope</text>
<text x="162" y="460" class="body">envelope.outcome: ambiguous_after_dispatch in this example.</text>
<text x="162" y="488" class="body">For example, Task/Step persistence fails after dispatch, retaining uncertainty inside.</text>
<text x="162" y="516" class="body">Do not rewrite uncertainty as confirmed non-commit or successful completion.</text>
<text x="162" y="544" class="body">Continue interpreting the outcome, result references, and external state.</text>
</g>
<text x="100" y="690" class="body">toLegacyToolResult() converts the inner envelope result to text.</text>
<text x="100" y="735" class="body">Promise resolution, outer success, tool success, and business completion require separate checks.</text>
</g>
<path d="M 800 785 V 835 H 300 V 890" fill="none" stroke="#52657d" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 800 785 V 835 H 800 V 890" fill="none" stroke="#52657d" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 800 785 V 835 H 1300 V 890" fill="none" stroke="#52657d" stroke-width="2" marker-end="url(#arrow)"/>
<g>
<rect x="70" y="890" width="460" height="180" rx="10" fill="#e7f2ff" stroke="#80baff"/>
<text x="92" y="923" class="heading">1  Was the envelope delivered?</text>
<text x="92" y="955" class="body">Inspect the outer result.</text>
<text x="92" y="983" class="body">This answers only envelope delivery.</text>
<text x="92" y="1011" class="body">Do not skip the inner outcome.</text>
</g>
<g>
<rect x="570" y="890" width="460" height="180" rx="10" fill="#fff7e5" stroke="#d8b866"/>
<text x="592" y="923" class="heading">2  What is the tool outcome?</text>
<text x="592" y="955" class="body">Read envelope.outcome.</text>
<text x="592" y="983" class="body">Separate success, non-commit,</text>
<text x="592" y="1011" class="body">and uncertainty; handle effects.</text>
</g>
<g>
<rect x="1070" y="890" width="460" height="180" rx="10" fill="#eaf6ee" stroke="#92bda0"/>
<text x="1092" y="923" class="heading">3  What supports completion?</text>
<text x="1092" y="955" class="body">Check tool results / resource state.</text>
<text x="1092" y="983" class="body">Verify claimed business effects.</text>
<text x="1092" y="1011" class="body">Success text cannot replace evidence.</text>
</g>
<g>
<rect x="70" y="1130" width="1460" height="100" rx="10" fill="#f0f3f7" stroke="#b9cce3"/>
<text x="92" y="1163" class="heading">Scope of this diagram</text>
<text x="92" y="1195" class="body">This illustrates nested pipeline results, not uncertainty in every success or a failure drill performed here.</text>
</g>
<text x="70" y="1260" class="small">Reading: Section 8. Retain the inner outcome when deciding reconciliation, retries, and the user reply.</text>
</svg>
