<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" lang="en" role="img" aria-labelledby="00-action-governance-overview-en-title 00-action-governance-overview-en-desc" id="d-00-action-governance-overview-en-root">
<title id="00-action-governance-overview-en-title">Action governance: from a concrete call to evidence</title><desc id="00-action-governance-overview-en-desc">Contracts, authorization, confirmation, execution conditions, and outcome evidence form a conceptual reading map.</desc>
<defs>
      <style>#d-00-action-governance-overview-en-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-00-action-governance-overview-en-root nav, #d-00-action-governance-overview-en-root p, #d-00-action-governance-overview-en-root li { font-size:14px;line-height:1.8 }
      #d-00-action-governance-overview-en-root a { color:#0066d6 }
      #d-00-action-governance-overview-en-root .diagram-container { width:100%;overflow-x:auto }
      #d-00-action-governance-overview-en-root details { margin-top:24px;border-top:1px solid #b9cce3;padding-top:16px }
      #d-00-action-governance-overview-en-root summary { cursor:pointer;font-weight:600 }
      #d-00-action-governance-overview-en-root .notes { display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px }
      #d-00-action-governance-overview-en-root ul { padding-left:20px }
      #d-00-action-governance-overview-en-root nav, #d-00-action-governance-overview-en-root details { display:none }
      #d-00-action-governance-overview-en-root .diagram-container { overflow-x:visible }</style><marker id="d-00-action-governance-overview-en-00-action-governance-overview-en-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-00-action-governance-overview-en-00-action-governance-overview-en-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0078fc"/></marker></defs><rect width="1280" height="720" fill="#f5f8fc"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="248" height="24" fill="#f5f8fc"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">ACTION GOVERNANCE / OVERVIEW</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">CONCEPTUAL / SOURCE INSPECTION</text><rect x="96" y="116" width="64" height="4" fill="#0078fc"/><path d="M400 220 L456 220" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-00-action-governance-overview-en-00-action-governance-overview-en-arrow)"/><path d="M792 220 L848 220" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-00-action-governance-overview-en-00-action-governance-overview-en-arrow)"/><rect x="800.0" y="192" width="40" height="18" rx="2" fill="#fafdff"/><text x="820" y="204" font-size="10" fill="#52657d" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">ASK</text><path d="M456 252 L440 252 Q432 252 432 260 L432 336 Q432 344 424 344 L256 344 Q248 344 248 352 L248 428" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-00-action-governance-overview-en-00-action-governance-overview-en-arrow)"/><rect x="278.0" y="318" width="108" height="18" rx="2" fill="#fafdff"/><text x="332" y="330" font-size="10" fill="#52657d" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">DENY / BLOCK</text><path d="M624 276 L624 428" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-00-action-governance-overview-en-00-action-governance-overview-en-arrow)"/><rect x="656.0" y="336" width="64" height="18" rx="2" fill="#fafdff"/><text x="688" y="348" font-size="10" fill="#52657d" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">ALLOW</text><path d="M1016 276 L1016 348 Q1016 356 1008 356 L712 356 Q704 356 704 364 L704 428" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-00-action-governance-overview-en-00-action-governance-overview-en-arrow)"/><rect x="826.0" y="330" width="124" height="18" rx="2" fill="#fafdff"/><text x="888" y="342" font-size="10" fill="#52657d" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">VALID APPROVAL</text><path d="M792 492 L848 492" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-00-action-governance-overview-en-00-action-governance-overview-en-arrow)"/><g data-node="true"><rect x="96" y="164" width="304" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="112" y="176" width="94" height="18" rx="2" fill="#eef4fb"/><text x="120" y="189" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">01 / CONTRACT</text><text x="112" y="215" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Concrete call and action contract</text><text x="112" y="238" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Tool name / arguments / trusted Context</text><text x="112" y="256" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Map risk, resource, and execution conditions</text></g><g data-node="true"><rect x="456" y="164" width="336" height="112" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><rect x="472" y="176" width="124" height="18" rx="2" fill="#1c78e4"/><text x="480" y="189" font-size="9" fill="#ffffff" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">02 / AUTHORIZATION</text><text x="472" y="215" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Evaluate authorization</text><text x="472" y="238" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Trusted identity / resource / policy</text><text x="472" y="256" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Allow, deny, or require confirmation</text></g><g data-node="true"><rect x="848" y="164" width="336" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="864" y="176" width="118" height="18" rx="2" fill="#eef4fb"/><text x="872" y="189" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">03 / CONFIRMATION</text><text x="864" y="215" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Persist and validate confirmation</text><text x="864" y="238" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Save pending descriptor and manifest</text><text x="864" y="256" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Consume only a valid bound approval</text></g><g data-node="true"><rect x="96" y="428" width="304" height="128" rx="8" fill="#eef4fb" stroke="#b9cce3" stroke-width="1.2"/><rect x="112" y="440" width="40" height="18" rx="2" fill="#eef4fb"/><text x="120" y="453" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">STOP</text><text x="112" y="479" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Do not dispatch</text><text x="112" y="502" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Retain denial or unavailability reasons</text><text x="112" y="520" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Approval cannot override a denial</text></g><g data-node="true"><rect x="456" y="428" width="336" height="128" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="472" y="440" width="94" height="18" rx="2" fill="#eef4fb"/><text x="480" y="453" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">04 / DISPATCH</text><text x="472" y="479" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Enforce limits and execute</text><text x="472" y="502" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Profiles / dependencies / configured path</text><text x="472" y="520" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Track execution and cancellation conditions</text></g><g data-node="true"><rect x="848" y="428" width="336" height="128" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="864" y="440" width="148" height="18" rx="2" fill="#eef4fb"/><text x="872" y="453" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">05-06 / EFFECTS / CASE</text><text x="864" y="479" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Classify outcome and retain evidence</text><text x="864" y="502" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Uncertain effect → reconcile or manual</text><text x="864" y="520" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Results / resource state support completion</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Retry only when commit state, policy, cancellation, and budget permit; uncertain effects are not confirmed non-commits.</text><text x="96" y="658" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Reading map, not a shared execution sequence. Correlate authorization, approval, dispatch, attempts, and effect evidence for the same call.</text>
</svg>
