<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" lang="en" role="img" aria-labelledby="03-confirmation-resume-en-title 03-confirmation-resume-en-desc" id="d-03-confirmation-resume-en-root">
<title id="03-confirmation-resume-en-title">Confirmation: bound approval and execution handoff</title><desc id="03-confirmation-resume-en-desc">Persist the wait and manifest, validate the bound approval, then hand off using the evaluated authorization.</desc>
<defs>
      <style>#d-03-confirmation-resume-en-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-03-confirmation-resume-en-root nav, #d-03-confirmation-resume-en-root p, #d-03-confirmation-resume-en-root li { font-size:14px;line-height:1.8 }
      #d-03-confirmation-resume-en-root a { color:#0066d6 }
      #d-03-confirmation-resume-en-root .diagram-container { width:100%;overflow-x:auto }
      #d-03-confirmation-resume-en-root details { margin-top:24px;border-top:1px solid #b9cce3;padding-top:16px }
      #d-03-confirmation-resume-en-root summary { cursor:pointer;font-weight:600 }
      #d-03-confirmation-resume-en-root .notes { display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px }
      #d-03-confirmation-resume-en-root ul { padding-left:20px }
      #d-03-confirmation-resume-en-root nav, #d-03-confirmation-resume-en-root details { display:none }
      #d-03-confirmation-resume-en-root .diagram-container { overflow-x:visible }</style><marker id="d-03-confirmation-resume-en-03-confirmation-resume-en-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-03-confirmation-resume-en-03-confirmation-resume-en-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0078fc"/></marker></defs><rect width="1280" height="720" fill="#f5f8fc"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="176" height="24" fill="#f5f8fc"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">CONFIRMATION RESUME</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">CONCEPTUAL / SOURCE INSPECTION</text><rect x="96" y="116" width="64" height="4" fill="#0078fc"/><path d="M616 248 L944 248" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-03-confirmation-resume-en-03-confirmation-resume-en-arrow)"/><path d="M1064 300 L1064 312 Q1064 320 1056 320 L504 320 Q496 320 496 328 L496 340" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-03-confirmation-resume-en-03-confirmation-resume-en-arrow)"/><path d="M616 396 L656 396" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-03-confirmation-resume-en-03-confirmation-resume-en-arrow)"/><path d="M780 452 L780 464 Q780 472 772 472 L224 472 Q216 472 216 480 L216 496" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-03-confirmation-resume-en-03-confirmation-resume-en-arrow)"/><rect x="452.0" y="478" width="88" height="18" rx="2" fill="#fafdff"/><text x="496" y="490" font-size="10" fill="#52657d" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">INTERRUPT</text><path d="M336 544 L656 544" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-03-confirmation-resume-en-03-confirmation-resume-en-arrow)"/><rect x="464.0" y="518" width="64" height="18" rx="2" fill="#fafdff"/><text x="496" y="530" font-size="10" fill="#52657d" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">RESUME</text><path d="M904 548 L944 548" fill="none" stroke="#0078fc" stroke-width="1.2" marker-end="url(#d-03-confirmation-resume-en-03-confirmation-resume-en-arrow-accent)"/><rect x="908.0" y="520" width="32" height="18" rx="2" fill="#fafdff"/><text x="924" y="532" font-size="10" fill="#52657d" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">OK</text><text x="96" y="172" font-size="11" fill="#52657d" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">USER / CALLER</text><text x="376" y="172" font-size="11" fill="#52657d" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">GRAPH</text><text x="656" y="172" font-size="11" fill="#52657d" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">STORE / MANIFEST</text><text x="944" y="172" font-size="11" fill="#52657d" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">GOVERNANCE EXECUTOR</text><g data-node="true"><rect x="376" y="200" width="240" height="100" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="392" y="212" width="70" height="18" rx="2" fill="#eef4fb"/><text x="400" y="225" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">AUTHORIZE</text><text x="392" y="251" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Request authorization</text><text x="392" y="274" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">authorizeTyped()</text></g><g data-node="true"><rect x="944" y="200" width="240" height="100" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="960" y="212" width="64" height="18" rx="2" fill="#eef4fb"/><text x="968" y="225" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">DECISION</text><text x="960" y="251" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Return confirmation required</text><text x="960" y="274" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Create a confirmation descriptor</text></g><g data-node="true"><rect x="376" y="340" width="240" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="392" y="352" width="58" height="18" rx="2" fill="#eef4fb"/><text x="400" y="365" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">PERSIST</text><text x="392" y="391" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Save pending and manifest</text><text x="392" y="414" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Save failure does not dispatch</text></g><g data-node="true"><rect x="656" y="340" width="248" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="672" y="352" width="58" height="18" rx="2" fill="#eef4fb"/><text x="680" y="365" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">WAITING</text><text x="672" y="391" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Store the call binding</text><text x="672" y="414" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Identity, execution, resource, version</text></g><g data-node="true"><rect x="96" y="496" width="240" height="100" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="112" y="508" width="94" height="18" rx="2" fill="#eef4fb"/><text x="120" y="521" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">USER RESPONSE</text><text x="112" y="547" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Resume: approve / deny and IDs</text><text x="112" y="570" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Bind to the wait and trusted Context</text></g><g data-node="true"><rect x="656" y="496" width="248" height="100" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><rect x="672" y="508" width="58" height="18" rx="2" fill="#1c78e4"/><text x="680" y="521" font-size="9" fill="#ffffff" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">CONSUME</text><text x="672" y="547" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Consume bound approval</text><text x="672" y="570" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Mismatch / denial / expiry → stop</text></g><g data-node="true"><rect x="944" y="496" width="240" height="100" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="960" y="508" width="112" height="18" rx="2" fill="#eef4fb"/><text x="968" y="521" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">APPROVED HANDOFF</text><text x="960" y="547" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Reuse evaluated authority</text><text x="960" y="570" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">executeAuthorizedTyped()</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Approval reuses evaluated authorization, not an unconditional engine rerun; execution restrictions still depend on actual consumers.</text><text x="96" y="658" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">There is no complete argument hash or full latest-policy requery here; recovery across processes and deployments needs evidence.</text>
</svg>
