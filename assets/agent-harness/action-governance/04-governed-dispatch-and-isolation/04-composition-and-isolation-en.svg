<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" lang="en" role="img" aria-labelledby="04-composition-and-isolation-en-title 04-composition-and-isolation-en-desc" id="d-04-composition-and-isolation-en-root">
<title id="04-composition-and-isolation-en-title">Composition, dispatch, and isolation conditions</title><desc id="04-composition-and-isolation-en-desc">Registry composes wrappers and optional pipelines; profile enforcement depends on settings and runner capabilities.</desc>
<defs>
      <style>#d-04-composition-and-isolation-en-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-04-composition-and-isolation-en-root nav, #d-04-composition-and-isolation-en-root p, #d-04-composition-and-isolation-en-root li { font-size:14px;line-height:1.8 }
      #d-04-composition-and-isolation-en-root a { color:#0066d6 }
      #d-04-composition-and-isolation-en-root .diagram-container { width:100%;overflow-x:auto }
      #d-04-composition-and-isolation-en-root details { margin-top:24px;border-top:1px solid #b9cce3;padding-top:16px }
      #d-04-composition-and-isolation-en-root summary { cursor:pointer;font-weight:600 }
      #d-04-composition-and-isolation-en-root .notes { display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px }
      #d-04-composition-and-isolation-en-root ul { padding-left:20px }
      #d-04-composition-and-isolation-en-root nav, #d-04-composition-and-isolation-en-root details { display:none }
      #d-04-composition-and-isolation-en-root .diagram-container { overflow-x:visible }</style><marker id="d-04-composition-and-isolation-en-04-composition-and-isolation-en-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-04-composition-and-isolation-en-04-composition-and-isolation-en-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0078fc"/></marker></defs><rect width="1280" height="720" fill="#f5f8fc"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="208" height="24" fill="#f5f8fc"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">COMPOSITION / ISOLATION</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">CONCEPTUAL / SOURCE INSPECTION</text><rect x="96" y="116" width="64" height="4" fill="#0078fc"/><path d="M248 276 L248 324" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-04-composition-and-isolation-en-04-composition-and-isolation-en-arrow)"/><path d="M624 276 L624 324" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-04-composition-and-isolation-en-04-composition-and-isolation-en-arrow)"/><path d="M1016 276 L1016 324" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-04-composition-and-isolation-en-04-composition-and-isolation-en-arrow)"/><path d="M960 452 L960 468 Q960 476 952 476 L632 476 Q624 476 624 484 L624 500" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-04-composition-and-isolation-en-04-composition-and-isolation-en-arrow)"/><path d="M1096 452 L1096 500" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-04-composition-and-isolation-en-04-composition-and-isolation-en-arrow)"/><g data-node="true"><rect x="96" y="164" width="1088" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="112" y="176" width="58" height="18" rx="2" fill="#eef4fb"/><text x="120" y="189" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">COMPOSE</text><text x="112" y="215" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Registry: loadAgentToolRuntime()</text><text x="112" y="238" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Compose authorization, confirmation Store, Runtime descriptors, execution profiles, and enforcer</text><text x="112" y="256" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">These are composition and capability relationships, not one mandatory sequence for every Agent</text></g><g data-node="true"><rect x="96" y="324" width="304" height="128" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="112" y="336" width="58" height="18" rx="2" fill="#eef4fb"/><text x="120" y="349" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">WRAPPER</text><text x="112" y="375" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Governance wrapper</text><text x="112" y="398" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Enablement, input, authorization, audit</text><text x="112" y="416" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Timeout, cancellation, result handling</text></g><g data-node="true"><rect x="456" y="324" width="336" height="128" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="472" y="336" width="88" height="18" rx="2" fill="#eef4fb"/><text x="480" y="349" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">SOURCE FLAGS</text><text x="472" y="375" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Optional dispatch pipeline</text><text x="472" y="398" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Descriptors, Context, scheduling, locks, runners</text><text x="472" y="416" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">MATH / DEEP_RESEARCHER / MCP flags</text></g><g data-node="true"><rect x="848" y="324" width="336" height="128" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><rect x="864" y="336" width="130" height="18" rx="2" fill="#1c78e4"/><text x="872" y="349" font-size="9" fill="#ffffff" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">PROFILE ENFORCEMENT</text><text x="864" y="375" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">ExecutionProfileEnforcer</text><text x="864" y="398" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Separate enforcement flag and injection</text><text x="864" y="416" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">When enabled, check profile, version, runner</text></g><g data-node="true"><rect x="96" y="500" width="304" height="96" rx="8" fill="#eef4fb" stroke="#b9cce3" stroke-width="1.2"/><rect x="112" y="512" width="112" height="18" rx="2" fill="#eef4fb"/><text x="120" y="525" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">ENTRY DIFFERENCE</text><text x="112" y="551" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Math also has a direct-import branch</text><text x="112" y="574" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Pipeline off: original calculator</text></g><g data-node="true"><rect x="456" y="500" width="336" height="96" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="472" y="512" width="76" height="18" rx="2" fill="#eef4fb"/><text x="480" y="525" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">IN-PROCESS</text><text x="472" y="551" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">trusted_in_process</text><text x="472" y="574" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Capability match may allow; no OS isolation claim</text></g><g data-node="true"><rect x="848" y="500" width="336" height="96" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="864" y="512" width="106" height="18" rx="2" fill="#eef4fb"/><text x="872" y="525" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">ISOLATED RUNNER</text><text x="864" y="551" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">isolated_process</text><text x="864" y="574" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Needs a matching runner; absent / insufficient → deny</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">The pinned version has no production SandboxRunnerPort; a subprocess or test double does not prove deployment isolation.</text><text x="96" y="658" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Disabled enforcement still resolves required secrets; disabling the pipeline does not remove every local governance wrapper.</text>
</svg>
