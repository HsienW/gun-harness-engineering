<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" lang="zh-TW" role="img" aria-labelledby="02-authorization-decision-title 02-authorization-decision-desc" id="d-02-authorization-decision-root">
<title id="02-authorization-decision-title">授權：先檢查基本邊界，再匹配 grant</title><desc id="02-authorization-decision-desc">授權先查租戶與 Scope 等邊界，再查政策權限、owner、grant 及風險。</desc>
<defs>
      <style>#d-02-authorization-decision-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-02-authorization-decision-root nav, #d-02-authorization-decision-root p, #d-02-authorization-decision-root li { font-size:14px;line-height:1.8 }
      #d-02-authorization-decision-root a { color:#0066d6 }
      #d-02-authorization-decision-root .diagram-container { width:100%;overflow-x:auto }
      #d-02-authorization-decision-root details { margin-top:24px;border-top:1px solid #b9cce3;padding-top:16px }
      #d-02-authorization-decision-root summary { cursor:pointer;font-weight:600 }
      #d-02-authorization-decision-root .notes { display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px }
      #d-02-authorization-decision-root ul { padding-left:20px }
      #d-02-authorization-decision-root nav, #d-02-authorization-decision-root details { display:none }
      #d-02-authorization-decision-root .diagram-container { overflow-x:visible }</style><marker id="d-02-authorization-decision-02-authorization-decision-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker><marker id="d-02-authorization-decision-02-authorization-decision-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0078fc"/></marker></defs><rect width="1280" height="720" fill="#f5f8fc"/><rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="88" y="60" width="200" height="24" fill="#f5f8fc"/><text x="96" y="77" font-size="12" fill="#102743" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">AUTHORIZATION DECISION</text><text x="1184" y="108" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">概念圖 · 原始碼查讀</text><rect x="96" y="116" width="64" height="4" fill="#0078fc"/><path d="M296 276 L296 324" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-authorization-decision-02-authorization-decision-arrow)"/><path d="M496 356 L552 356 Q560 356 560 348 L560 228 Q560 220 568 220 L624 220" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-authorization-decision-02-authorization-decision-arrow)"/><rect x="576.0" y="292" width="48" height="18" rx="2" fill="#fafdff"/><text x="600" y="304" font-size="10" fill="#52657d" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">FAIL</text><path d="M496 396 L624 396" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-authorization-decision-02-authorization-decision-arrow)"/><rect x="536.0" y="368" width="48" height="18" rx="2" fill="#fafdff"/><text x="560" y="380" font-size="10" fill="#52657d" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">PASS</text><path d="M904 324 L904 276" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-authorization-decision-02-authorization-decision-arrow)"/><rect x="1002.0" y="292" width="108" height="18" rx="2" fill="#fafdff"/><text x="1056" y="304" font-size="10" fill="#52657d" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace" text-anchor="middle">NO AUTHORITY</text><path d="M904 436 L904 452 Q904 460 896 460 L648 460 Q640 460 640 468 L640 484" fill="none" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-02-authorization-decision-02-authorization-decision-arrow)"/><g data-node="true"><rect x="96" y="164" width="400" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="112" y="176" width="94" height="18" rx="2" fill="#eef4fb"/><text x="120" y="189" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">TRUSTED INPUT</text><text x="112" y="215" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">AuthorizationRequest</text><text x="112" y="238" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">可信 Principal／Tenant／Scope</text><text x="112" y="256" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">action + ResourceRef + policy</text></g><g data-node="true"><rect x="96" y="324" width="400" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="112" y="336" width="112" height="18" rx="2" fill="#eef4fb"/><text x="120" y="349" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">BASIC BOUNDARIES</text><text x="112" y="375" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">1. Grant 不能跨越的基本邊界</text><text x="112" y="398" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">帳號／Tenant、active Scope、可讀寫範圍</text><text x="112" y="416" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">政策存在且宣告這個 action</text></g><g data-node="true"><rect x="624" y="164" width="560" height="112" rx="8" fill="#eef4fb" stroke="#b9cce3" stroke-width="1.2"/><rect x="640" y="176" width="82" height="18" rx="2" fill="#eef4fb"/><text x="648" y="189" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">NO DISPATCH</text><text x="640" y="215" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">Deny：保留邊界與原因</text><text x="640" y="238" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">CROSS_TENANT_DENIED / other reason codes</text><text x="640" y="256" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">已存 grant 或使用者批准都不能跨越基本拒絕</text></g><g data-node="true"><rect x="624" y="324" width="560" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/><rect x="640" y="336" width="118" height="18" rx="2" fill="#eef4fb"/><text x="648" y="349" font-size="9" fill="#0066d6" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">AUTHORITY / GRANT</text><text x="640" y="375" font-size="14" fill="#102743" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">2. Policy authority、owner 與 grant</text><text x="640" y="398" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">核對角色／Principal scope；必要時匹配有效 grant</text><text x="640" y="416" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">核對 owner、資源、Scope、Tenant、action 與期限</text></g><g data-node="true"><rect x="96" y="484" width="1088" height="112" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/><rect x="112" y="496" width="64" height="18" rx="2" fill="#1c78e4"/><text x="120" y="509" font-size="9" fill="#ffffff" font-weight="500" font-family="'Geist Mono', 'Consolas', 'Microsoft JhengHei', monospace">DECISION</text><text x="112" y="535" font-size="14" fill="#ffffff" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">3. Context、工具風險與決策交接</text><text x="112" y="558" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">替代結果：deny ／ require_confirmation ／ allow ／ AUTHORIZATION_UNAVAILABLE</text><text x="112" y="576" font-size="12" fill="#e2efff" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">允許後仍需執行限制；依賴或必要交接失敗，不悄悄降級派送</text></g><path d="M96 612 H1184" stroke="#d5e1ee" stroke-width="1"/><text x="96" y="638" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">預設 resolveScopeAccess() 並未查逐檔／逐筆 ACL；ResourceRef 粒度取決於 resolver。</text><text x="96" y="658" font-size="12" fill="#52657d" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">未配置 authorization 的 executor 可直接回 authorized；必須查實際 Registry 組裝與 consumer。</text>
</svg>
