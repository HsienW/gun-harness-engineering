<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="file-edit-one-turn-en-title file-edit-one-turn-en-desc" id="d-05-file-edit-one-turn-en-root">
  <title id="file-edit-one-turn-en-title">Complete Execution Path for a File Edit Task</title>
  <desc id="file-edit-one-turn-en-desc">After the user requests a file edit, the Harness normalizes the input and assembles the task. The Runtime executes the model's proposed FileRead and returns the Tool Result to the model, which then proposes FileEdit. The Harness decides whether the edit is authorized. The Runtime executes it or returns the denial, and the task ends with a Terminal Result and a user-visible reply.</desc>
  <defs>
    <style>
      #d-05-file-edit-one-turn-en-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-05-file-edit-one-turn-en-root .stage-title { fill: #102743; font-size: 16px; font-weight: 600; }
      #d-05-file-edit-one-turn-en-root .slot { fill: #0066d6; font-family: 'Geist Mono', monospace; font-size: 9px; font-weight: 500; letter-spacing: .08em; }
      #d-05-file-edit-one-turn-en-root .body { fill: #102743; font-size: 12px; }
      #d-05-file-edit-one-turn-en-root .muted { fill: #52657d; font-size: 12px; }
      #d-05-file-edit-one-turn-en-root .technical { fill: #52657d; font-family: 'Geist Mono', monospace; font-size: 10px; }
    </style>
    <marker id="d-05-file-edit-one-turn-en-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker>
    <marker id="d-05-file-edit-one-turn-en-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0078fc"/></marker>
  </defs>
  <rect width="1280" height="720" fill="#f5f8fc"/>
  <rect x="56" y="72" width="1168" height="576" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/>
  <rect x="88" y="60" width="220" height="24" fill="#f5f8fc"/>
  <text x="96" y="77" fill="#102743" font-family="'Geist Mono', monospace" font-size="12" font-weight="500" letter-spacing=".10em">ONE TURN / FILE EDIT</text>
  <text x="1184" y="108" text-anchor="end" class="muted">Legacy Claude Code example · time flows left to right</text>
  <rect x="96" y="116" width="64" height="4" fill="#0078fc"/>

  <g fill="none" stroke-width="1.2">
    <path d="M288 368 H320" stroke="#52657d" marker-end="url(#d-05-file-edit-one-turn-en-arrow)"/>
    <path d="M512 368 H544" stroke="#52657d" marker-end="url(#d-05-file-edit-one-turn-en-arrow)"/>
