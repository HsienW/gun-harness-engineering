    <text x="112" y="222">Accept Input</text>
    <text x="336" y="222">Assemble Task</text>
    <text x="560" y="222">Read File</text>
    <text x="784" y="222">Edit File</text>
    <text x="1008" y="222">Report Result</text>
  </g>

  <g class="slot">
    <text x="112" y="260">HARNESS</text><text x="336" y="260">HARNESS</text><text x="560" y="260">HARNESS</text><text x="784" y="260">HARNESS</text><text x="1008" y="260">HARNESS</text>
    <text x="112" y="336">RUNTIME</text><text x="336" y="336">RUNTIME</text><text x="560" y="336">RUNTIME</text><text x="784" y="336">RUNTIME</text><text x="1008" y="336">RUNTIME</text>
    <text x="112" y="452">HANDOFF</text><text x="336" y="452">HANDOFF</text><text x="560" y="452">HANDOFF</text><text x="784" y="452">HANDOFF</text><text x="1008" y="452">HANDOFF</text>
  </g>

  <g class="body">
    <text x="112" y="284">Normalize request</text><text x="112" y="302">IDE Context</text>
    <text x="336" y="284">Select Context, rules</text><text x="336" y="302">FileRead / FileEdit</text>
    <text x="560" y="284">Expose FileRead</text><text x="560" y="302">for this task</text>
    <text x="784" y="284">Check FileEdit scope</text><text x="784" y="302">Seek approval if needed</text>
    <text x="1008" y="284">Present message</text><text x="1008" y="302">Take the next input</text>

    <text x="112" y="362">Run not started</text>
    <text x="336" y="362">Start model turn</text><text x="336" y="382">Pass execution terms</text>
    <text x="560" y="362">Model proposes FileRead</text><text x="560" y="382">Run and return result</text><text x="560" y="402">Model samples again</text>
    <text x="784" y="362">Model proposes FileEdit</text><text x="784" y="382">Run or return denial</text><text x="784" y="402">Send result to model</text>
    <text x="1008" y="362">Emit Runtime Events</text><text x="1008" y="382">and Terminal Result</text>
  </g>

  <g class="technical">
    <text x="112" y="482">Normalized Input</text>
    <text x="336" y="482">Execution Request</text>
    <text x="560" y="482" fill="#0066d6">FileRead Tool Result</text>
    <text x="784" y="482">Decision / Tool Result</text>
    <text x="1008" y="482">User-visible Reply</text>
  </g>
  <g class="muted">
    <text x="112" y="510">Includes edit target</text>
    <text x="336" y="510">Context, tools, limits</text>
    <text x="560" y="510">File data or read error</text>
    <text x="784" y="510">Allow, deny, or approve</text>
    <text x="1008" y="510">State success or failure</text>
  </g>

  <rect x="96" y="552" width="528" height="56" rx="6" fill="#ffffff" stroke="#b9cce3" stroke-width="1"/>
  <rect x="640" y="552" width="544" height="56" rx="6" fill="#ffffff" stroke="#b9cce3" stroke-width="1"/>
  <text x="112" y="574" fill="#102743" font-size="12" font-weight="600">Failures return along the same path</text>
  <text x="112" y="594" class="muted">Tool error / Permission denial → Model handles → User-visible result</text>
  <text x="656" y="574" fill="#102743" font-size="12" font-weight="600">New input during execution</text>
  <text x="656" y="594" class="muted">Harness decides input ownership and Run generation</text>
  <text x="96" y="632" class="muted">This diagram shows the main Claude Code example; check actual wiring to see which Chat Gun stages use the execution path.</text>
</svg>
