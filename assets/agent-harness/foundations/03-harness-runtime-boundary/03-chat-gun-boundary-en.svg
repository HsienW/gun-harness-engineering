        <text x="1184" y="108" text-anchor="end" fill="#52657d" font-size="12" font-family="'Geist', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif">Responsibilities · not deployment topology</text>
        <rect x="96" y="116" width="64" height="4" fill="#0078fc"/>

