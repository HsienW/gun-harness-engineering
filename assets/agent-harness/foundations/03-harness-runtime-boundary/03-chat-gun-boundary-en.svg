        <line x1="96" y1="608" x2="1184" y2="608" stroke="#d5e1ee"/>
        <text x="96" y="632" fill="#52657d" font-size="12" font-family="'Geist', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif">Production Agent Server persistence in PostgreSQL / Redis still lacks live evidence. This diagram assigns responsibility; it does not claim deployment validation is complete.</text>
