<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="chat-gun-boundary-en-title chat-gun-boundary-en-desc" id="d-03-chat-gun-boundary-en-root">
        <title id="chat-gun-boundary-en-title">Chat Gun Product, Harness, Runtime, and External Commit Responsibilities</title>
        <desc id="chat-gun-boundary-en-desc">The product entry point and BFF establish trusted identity. The Interaction Harness governs input and actions, LangGraph owns the Run and checkpoint, Tool Dispatch executes allowed tools, and external systems plus the ledger provide commit evidence. Tool authorization returns through the Harness; events and terminal results return to the product.</desc>
        <defs>
      <style>#d-03-chat-gun-boundary-en-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; }
      #d-03-chat-gun-boundary-en-root .diagram-container { width: 100%; overflow-x: auto; }
      #d-03-chat-gun-boundary-en-root .diagram-container { overflow-x: visible; }</style>
          <marker id="d-03-chat-gun-boundary-en-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker>
          <marker id="d-03-chat-gun-boundary-en-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0078fc"/></marker>
          <marker id="d-03-chat-gun-boundary-en-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker>
        </defs>
