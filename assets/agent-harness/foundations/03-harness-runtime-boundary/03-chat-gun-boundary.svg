        <text x="564" y="372" fill="#102743" font-size="12" font-family="'Geist', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif">Run／Thread／Interrupt</text>
        <text x="564" y="400" fill="#52657d" font-size="12" font-family="'Geist', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif">Graph State／Checkpoint</text>
        <text x="564" y="428" fill="#52657d" font-size="12" font-family="'Geist', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif">Event／Terminal</text>

        <rect x="772" y="224" width="192" height="228" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/>
