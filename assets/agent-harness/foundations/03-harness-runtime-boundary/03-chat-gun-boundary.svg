        <text x="336" y="292" fill="#ffffff" font-size="14" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif">Interaction Harness</text>
        <line x1="336" y1="312" x2="488" y2="312" stroke="#9bcaff"/>
        <text x="336" y="372" fill="#ffffff" font-size="12" font-family="'Geist', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif">輸入／Run Ownership</text>
        <text x="336" y="400" fill="#e2efff" font-size="12" font-family="'Geist', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif">授權、批准與互動政策</text>

