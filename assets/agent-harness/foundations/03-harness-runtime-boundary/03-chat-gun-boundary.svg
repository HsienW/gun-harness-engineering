        <text x="792" y="292" fill="#102743" font-size="14" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif">Tool Dispatch</text>
        <line x1="792" y1="312" x2="944" y2="312" stroke="#d5e1ee"/>
