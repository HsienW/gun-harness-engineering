        <rect x="88" y="60" width="208" height="24" fill="#f5f8fc"/>
        <text x="96" y="77" fill="#102743" font-size="12" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing=".10em">CHAT GUN BOUNDARY</text>
        <text x="1184" y="108" text-anchor="end" fill="#52657d" font-size="12" font-family="'Geist', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif">責任視角 · 非部署拓樸</text>
        <rect x="96" y="116" width="64" height="4" fill="#0078fc"/>

        <!-- The main path, policy callback, and result return occupy separate rails. -->
        <g fill="none" stroke-width="1.2">
          <path d="M280 336 H316" stroke="#52657d" marker-end="url(#d-03-chat-gun-boundary-arrow)"/>
          <path d="M508 336 H544" stroke="#0078fc" marker-end="url(#d-03-chat-gun-boundary-arrow-accent)"/>
