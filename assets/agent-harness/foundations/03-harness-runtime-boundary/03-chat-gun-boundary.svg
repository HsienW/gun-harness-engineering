        <text x="792" y="428" fill="#52657d" font-size="12" font-family="'Geist', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif">Tool Result</text>

        <rect x="1000" y="224" width="192" height="228" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/>
        <rect x="1020" y="244" width="72" height="16" rx="2" fill="#eef4fb" stroke="#b9cce3" stroke-width=".8"/>
