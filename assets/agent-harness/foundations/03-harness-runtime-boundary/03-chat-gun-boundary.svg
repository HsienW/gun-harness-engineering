<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="chat-gun-boundary-title chat-gun-boundary-desc" id="d-03-chat-gun-boundary-root">
  <title id="chat-gun-boundary-title">Chat Gun 的產品、Harness、Runtime 與外部 Commit 責任</title>
  <desc id="chat-gun-boundary-desc">產品入口與 BFF 建立可信身分，Interaction Harness 治理輸入與行動，LangGraph 持有 Run 與 Checkpoint，Tool Dispatch 執行已允許的工具，外部系統與 Ledger 提供 Commit 證據。工具授權往返 Harness，事件與終止結果回到產品。</desc>
        <defs>
      <style>#d-03-chat-gun-boundary-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; }
      #d-03-chat-gun-boundary-root .diagram-container { width: 100%; overflow-x: auto; }
      #d-03-chat-gun-boundary-root .diagram-container { overflow-x: visible; }</style>
          <marker id="d-03-chat-gun-boundary-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker>
          <marker id="d-03-chat-gun-boundary-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0078fc"/></marker>
          <marker id="d-03-chat-gun-boundary-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker>
        </defs>
        <rect width="1280" height="720" fill="#f5f8fc"/>
