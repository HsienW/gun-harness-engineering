<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="handoff-contracts-en-title handoff-contracts-en-desc" id="d-03-handoff-contracts-en-root">
        <title id="handoff-contracts-en-title">Five Bidirectional Handoff Contracts Between the Harness and Runtime</title>
        <desc id="handoff-contracts-en-desc">The Harness delivers governed conditions through an Execution Request. The Runtime uses Decision Ports to request policy decisions and reports execution facts through Runtime Events, a Terminal Result, and Persistence and Effect Evidence. These are five distinct channels, not five sequential steps.</desc>
        <defs>
      <style>#d-03-handoff-contracts-en-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; }
      #d-03-handoff-contracts-en-root .diagram-container { width: 100%; overflow-x: auto; }
      #d-03-handoff-contracts-en-root .diagram-container { overflow-x: visible; }</style>
          <marker id="d-03-handoff-contracts-en-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker>
          <marker id="d-03-handoff-contracts-en-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0078fc"/></marker>
        </defs>
        <rect width="1280" height="720" fill="#f5f8fc"/>
        <rect x="56" y="72" width="1168" height="576" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/>
        <rect x="88" y="60" width="208" height="24" fill="#f5f8fc"/>
        <text x="96" y="77" fill="#102743" font-size="12" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing=".10em">RUNTIME HANDOFF</text>
        <text x="1184" y="108" text-anchor="end" fill="#52657d" font-size="12" font-family="'Geist', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif">Contract directions · not execution steps</text>
        <rect x="96" y="116" width="64" height="4" fill="#0078fc"/>

        <!-- Contract arrows attach to distinct side ports on the two owners. -->
        <g fill="none" stroke-width="1.2">
          <path d="M368 192 H456" stroke="#0078fc" marker-end="url(#d-03-handoff-contracts-en-arrow-accent)"/>
          <path d="M824 192 H912" stroke="#0078fc" marker-end="url(#d-03-handoff-contracts-en-arrow-accent)"/>
          <path d="M912 268 H824" stroke="#52657d" marker-end="url(#d-03-handoff-contracts-en-arrow)"/>
          <path d="M456 268 H368" stroke="#52657d" marker-end="url(#d-03-handoff-contracts-en-arrow)"/>
          <path d="M368 292 H456" stroke="#52657d" stroke-dasharray="5 4" marker-end="url(#d-03-handoff-contracts-en-arrow)"/>
          <path d="M824 292 H912" stroke="#52657d" stroke-dasharray="5 4" marker-end="url(#d-03-handoff-contracts-en-arrow)"/>
          <path d="M912 360 H824" stroke="#52657d" stroke-dasharray="5 4" marker-end="url(#d-03-handoff-contracts-en-arrow)"/>
          <path d="M456 360 H368" stroke="#52657d" stroke-dasharray="5 4" marker-end="url(#d-03-handoff-contracts-en-arrow)"/>
          <path d="M912 444 H824" stroke="#52657d" stroke-dasharray="5 4" marker-end="url(#d-03-handoff-contracts-en-arrow)"/>
          <path d="M456 444 H368" stroke="#52657d" stroke-dasharray="5 4" marker-end="url(#d-03-handoff-contracts-en-arrow)"/>
          <path d="M912 528 H824" stroke="#52657d" stroke-dasharray="5 4" marker-end="url(#d-03-handoff-contracts-en-arrow)"/>
          <path d="M456 528 H368" stroke="#52657d" stroke-dasharray="5 4" marker-end="url(#d-03-handoff-contracts-en-arrow)"/>
        </g>

        <!-- Owner panels. -->
        <rect x="96" y="152" width="272" height="420" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/>
        <rect x="116" y="172" width="72" height="16" rx="2" fill="#1c78e4" stroke="#a8d2ff" stroke-width=".8"/>
        <text x="152" y="184" text-anchor="middle" fill="#ffffff" font-size="8" font-family="'Geist Mono', monospace" letter-spacing=".08em">HARNESS</text>
        <text x="116" y="228" fill="#ffffff" font-size="16" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif">Sets execution conditions</text>
        <text x="116" y="250" fill="#e2efff" font-size="12" font-family="'Geist', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif">Validates input, context,</text>
        <text x="116" y="270" fill="#e2efff" font-size="12" font-family="'Geist', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif">capabilities, and policy</text>
        <line x1="116" y1="284" x2="348" y2="284" stroke="#9bcaff"/>
        <text x="116" y="332" fill="#ffffff" font-size="12" font-family="'Geist', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif">Provides the Execution Request</text>
        <text x="116" y="376" fill="#ffffff" font-size="12" font-family="'Geist', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif">Returns authorization / human decisions</text>
        <text x="116" y="420" fill="#ffffff" font-size="12" font-family="'Geist', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif">Consumes events and terminal results</text>
        <text x="116" y="464" fill="#ffffff" font-size="12" font-family="'Geist', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif">Translates results for the product</text>

        <rect x="912" y="152" width="272" height="420" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/>
        <rect x="932" y="172" width="72" height="16" rx="2" fill="#eef4fb" stroke="#b9cce3" stroke-width=".8"/>
        <text x="968" y="184" text-anchor="middle" fill="#52657d" font-size="8" font-family="'Geist Mono', monospace" letter-spacing=".08em">RUNTIME</text>
        <text x="932" y="228" fill="#102743" font-size="16" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif">Drives the Run lifecycle</text>
        <text x="932" y="256" fill="#52657d" font-size="12" font-family="'Geist', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif">Models, tools, state, and recovery</text>
        <line x1="932" y1="284" x2="1164" y2="284" stroke="#d5e1ee"/>
        <text x="932" y="332" fill="#102743" font-size="12" font-family="'Geist', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif">Consumes validated conditions</text>
        <text x="932" y="376" fill="#102743" font-size="12" font-family="'Geist', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif">Requests policy decisions</text>
        <text x="932" y="420" fill="#102743" font-size="12" font-family="'Geist', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif">Emits execution facts / terminal result</text>
        <text x="932" y="464" fill="#102743" font-size="12" font-family="'Geist', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif">Persists state and recovery evidence</text>

        <!-- Five typed contracts, not a vertical process. -->
        <g font-family="'Geist', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif">
          <rect x="456" y="160" width="368" height="64" rx="8" fill="#eef4fb" stroke="#0078fc" stroke-width="1.2"/>
          <text x="476" y="186" fill="#0066d6" font-size="12" font-weight="600">01</text>
          <text x="508" y="186" fill="#102743" font-size="14" font-weight="600">Execution Request</text>
          <text x="508" y="207" fill="#52657d" font-size="12">Governed input, capabilities, and constraints →</text>

          <rect x="456" y="244" width="368" height="64" rx="8" fill="#ffffff" stroke="#9db5cf" stroke-width="1.2"/>
          <text x="476" y="270" fill="#0066d6" font-size="12" font-weight="600">02</text>
          <text x="508" y="270" fill="#102743" font-size="14" font-weight="600">Decision Ports</text>
          <text x="508" y="291" fill="#52657d" font-size="12">← Decision request / decision response →</text>

          <rect x="456" y="328" width="368" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/>
          <text x="476" y="354" fill="#0066d6" font-size="12" font-weight="600">03</text>
          <text x="508" y="354" fill="#102743" font-size="14" font-weight="600">Runtime Events</text>
          <text x="508" y="375" fill="#52657d" font-size="12">← Replayable progress and execution facts</text>

          <rect x="456" y="412" width="368" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/>
          <text x="476" y="438" fill="#0066d6" font-size="12" font-weight="600">04</text>
          <text x="508" y="438" fill="#102743" font-size="14" font-weight="600">Terminal Result</text>
          <text x="508" y="459" fill="#52657d" font-size="12">← Termination decision for this Run</text>

          <rect x="456" y="496" width="368" height="64" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/>
          <text x="476" y="522" fill="#0066d6" font-size="12" font-weight="600">05</text>
          <text x="508" y="522" fill="#102743" font-size="14" font-weight="600">Persistence / Effect Evidence</text>
          <text x="508" y="543" fill="#52657d" font-size="12">← Distinguish checkpoint from commit evidence</text>
        </g>

        <line x1="96" y1="608" x2="1184" y2="608" stroke="#d5e1ee"/>
        <text x="96" y="632" fill="#52657d" font-size="12" font-family="'Geist', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif">Downstream systems and the side-effect ledger prove external commit truth. A Runtime checkpoint cannot replace that evidence.</text>
      </svg>
