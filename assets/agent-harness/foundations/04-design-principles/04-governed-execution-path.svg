<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="governed-execution-path-title governed-execution-path-desc" id="d-04-governed-execution-path-root">
  <title id="governed-execution-path-title">從受治理的輸入到可追溯的執行</title>
  <desc id="governed-execution-path-desc">Harness 依本次明確指令篩選記憶與外部內容，只交付任務需要的上下文及能力。模型提出行動後，正式執行路徑中的授權關卡決定是否允許 Runtime 執行，並保留決策與結果證據。</desc>
  <defs>
    <style>
      #d-04-governed-execution-path-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-04-governed-execution-path-root .label { fill: #102743; font-size: 14px; font-weight: 600; }
      #d-04-governed-execution-path-root .detail { fill: #52657d; font-size: 12px; }
      #d-04-governed-execution-path-root .tag { font-family: 'Geist Mono', monospace; font-size: 9px; letter-spacing: .08em; }
    </style>
    <marker id="d-04-governed-execution-path-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker>
    <marker id="d-04-governed-execution-path-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0078fc"/></marker>
  </defs>
  <rect width="1280" height="720" fill="#f5f8fc"/>
  <rect x="56" y="72" width="1168" height="576" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/>
  <rect x="88" y="60" width="224" height="24" fill="#f5f8fc"/>
  <text x="96" y="77" fill="#102743" font-size="12" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing=".10em">GOVERNED EXECUTION</text>
  <text x="1184" y="108" text-anchor="end" class="detail">原則 1–4 · 從輸入到執行</text>
  <rect x="96" y="116" width="64" height="4" fill="#0078fc"/>

  <g fill="none" stroke-width="1.2">
    <path d="M352 220 H408" stroke="#0078fc" marker-end="url(#d-04-governed-execution-path-arrow-accent)"/>
    <path d="M352 336 H408" stroke="#52657d" stroke-dasharray="5 4" marker-end="url(#d-04-governed-execution-path-arrow)"/>
    <path d="M704 272 H808" stroke="#0078fc" marker-end="url(#d-04-governed-execution-path-arrow-accent)"/>
    <path d="M832 372 V400 H744 V488 H704" stroke="#52657d" marker-end="url(#d-04-governed-execution-path-arrow)"/>
    <path d="M408 500 H352" stroke="#0078fc" marker-end="url(#d-04-governed-execution-path-arrow-accent)"/>
    <path d="M224 544 V576 H976 V544" stroke="#52657d" stroke-dasharray="5 4" marker-end="url(#d-04-governed-execution-path-arrow)"/>
  </g>
  <rect x="356" y="476" width="48" height="16" rx="2" fill="#fafdff"/>
  <text x="380" y="488" text-anchor="middle" class="tag" fill="#0066d6">ALLOW</text>

  <rect x="96" y="176" width="256" height="88" rx="8" fill="#ffffff" stroke="#0078fc" stroke-width="1.2"/>
  <rect x="112" y="192" width="104" height="18" rx="2" fill="#eef4fb"/>
  <text x="164" y="205" text-anchor="middle" class="tag" fill="#0066d6">CURRENT TURN</text>
  <text x="112" y="234" class="label">本次明確指令</text>
  <text x="112" y="252" class="detail">決定當前任務與允許範圍</text>

  <rect x="96" y="292" width="256" height="88" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/>
  <rect x="112" y="308" width="100" height="18" rx="2" fill="#eef4fb"/>
  <text x="162" y="321" text-anchor="middle" class="tag" fill="#52657d">DATA SOURCE</text>
  <text x="112" y="350" class="label">記憶、工具與外部內容</text>
  <text x="112" y="368" class="detail">可提供資料，不授予指令權威</text>

  <rect x="408" y="176" width="296" height="204" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/>
  <rect x="428" y="196" width="72" height="18" rx="2" fill="#1c78e4" stroke="#a8d2ff" stroke-width=".8"/>
  <text x="464" y="209" text-anchor="middle" class="tag" fill="#ffffff">HARNESS</text>
  <text x="428" y="248" fill="#ffffff" font-size="17" font-weight="600">治理模型可見條件</text>
  <line x1="428" y1="268" x2="684" y2="268" stroke="#9bcaff"/>
  <text x="428" y="298" fill="#ffffff" font-size="12">依本次任務選取 Context</text>
  <text x="428" y="326" fill="#ffffff" font-size="12">只公開所需能力與限制</text>
  <text x="428" y="354" fill="#e2efff" font-size="12">交付 Execution Request</text>

  <rect x="808" y="176" width="336" height="196" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/>
  <rect x="828" y="196" width="56" height="18" rx="2" fill="#eef4fb"/>
  <text x="856" y="209" text-anchor="middle" class="tag" fill="#52657d">MODEL</text>
  <text x="828" y="248" class="label">在受限條件下推進任務</text>
  <text x="828" y="278" class="detail">讀取已篩選的上下文</text>
  <text x="828" y="304" class="detail">可提出具體 Tool Call</text>
  <line x1="828" y1="324" x2="1124" y2="324" stroke="#d5e1ee"/>
  <text x="828" y="350" fill="#0066d6" font-size="12" font-weight="600">提案不等於執行許可</text>

  <rect x="408" y="432" width="296" height="112" rx="8" fill="#eef4fb" stroke="#0078fc" stroke-width="1.5"/>
  <rect x="428" y="448" width="128" height="18" rx="2" fill="#ffffff"/>
  <text x="492" y="461" text-anchor="middle" class="tag" fill="#0066d6">ACTION POLICY</text>
  <text x="428" y="492" class="label">正式路徑中的授權關卡</text>
  <text x="428" y="516" class="detail">依身分、資源與政策版本判斷</text>
  <text x="428" y="534" class="detail">允許／拒絕／要求人工確認</text>

  <rect x="96" y="432" width="256" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/>
  <rect x="112" y="448" width="64" height="18" rx="2" fill="#eef4fb"/>
  <text x="144" y="461" text-anchor="middle" class="tag" fill="#52657d">RUNTIME</text>
  <text x="112" y="492" class="label">執行已獲准的行動</text>
  <text x="112" y="516" class="detail">排程 Tool Call 並回報結果</text>

  <rect x="808" y="432" width="336" height="112" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/>
  <rect x="828" y="448" width="72" height="18" rx="2" fill="#eef4fb"/>
  <text x="864" y="461" text-anchor="middle" class="tag" fill="#52657d">EVIDENCE</text>
  <text x="828" y="492" class="label">保留決策與執行證據</text>
  <text x="828" y="516" class="detail">Decision、Event、Terminal Result</text>

  <line x1="96" y1="608" x2="1184" y2="608" stroke="#d5e1ee"/>
  <text x="96" y="632" class="detail">行為規則必須在這條正式路徑生效；文件中的規則本身無法阻止未授權的 Tool Call。</text>
</svg>
