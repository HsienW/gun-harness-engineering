<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="in-flight-interactions-en-title in-flight-interactions-en-desc" id="d-04-in-flight-interactions-en-root">
  <title id="in-flight-interactions-en-title">State Transitions for Mid-Run Input, Approval, and Cancellation</title>
  <desc id="in-flight-interactions-en-desc">A Run may wait for clarification or human approval. When new instructions arrive, the Harness uses Run ownership and generation to queue, replace, or clarify the input. After approval, the original Run resumes under its prior conditions. Cancellation and denial lead to terminal states, and the user receives the corresponding result.</desc>
  <defs>
    <style>
      #d-04-in-flight-interactions-en-root { color: #102743; font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #d-04-in-flight-interactions-en-root .label { fill: #102743; font-size: 14px; font-weight: 600; }
      #d-04-in-flight-interactions-en-root .detail { fill: #52657d; font-size: 12px; }
      #d-04-in-flight-interactions-en-root .tag { font-family: 'Geist Mono', monospace; font-size: 9px; letter-spacing: .08em; }
    </style>
    <marker id="d-04-in-flight-interactions-en-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker>
    <marker id="d-04-in-flight-interactions-en-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0078fc"/></marker>
  </defs>
  <rect width="1280" height="720" fill="#f5f8fc"/>
  <rect x="56" y="72" width="1168" height="608" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/>
  <rect x="88" y="60" width="256" height="24" fill="#f5f8fc"/>
  <text x="96" y="77" fill="#102743" font-size="12" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing=".10em">IN-FLIGHT INTERACTION</text>
  <text x="1184" y="108" text-anchor="end" class="detail">Principle 5 · Run state and user feedback</text>
  <rect x="96" y="116" width="64" height="4" fill="#0078fc"/>

  <rect x="96" y="136" width="1088" height="376" rx="8" fill="none" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/>
  <rect x="112" y="128" width="140" height="20" fill="#fafdff"/>
  <text x="120" y="143" class="tag" fill="#52657d">ACTIVE RUN</text>

  <g fill="none" stroke-width="1.2">
    <path d="M548 252 V296 H272 V336" stroke="#52657d" marker-end="url(#d-04-in-flight-interactions-en-arrow)"/>
    <path d="M732 252 V296 H1008 V336" stroke="#52657d" marker-end="url(#d-04-in-flight-interactions-en-arrow)"/>
    <path d="M144 380 H112 V204 H500" stroke="#52657d" stroke-dasharray="5 4" marker-end="url(#d-04-in-flight-interactions-en-arrow)"/>
    <path d="M1136 380 H1168 V204 H780" stroke="#0078fc" stroke-dasharray="5 4" marker-end="url(#d-04-in-flight-interactions-en-arrow-accent)"/>
    <path d="M640 252 V568" stroke="#52657d" marker-end="url(#d-04-in-flight-interactions-en-arrow)"/>
    <path d="M272 512 V568" stroke="#52657d" marker-end="url(#d-04-in-flight-interactions-en-arrow)"/>
    <path d="M1008 432 V568" stroke="#52657d" marker-end="url(#d-04-in-flight-interactions-en-arrow)"/>
  </g>

  <rect x="184" y="272" width="136" height="18" rx="2" fill="#fafdff"/>
  <text x="252" y="285" text-anchor="middle" class="detail">Needs clarification</text>
  <rect x="920" y="272" width="176" height="18" rx="2" fill="#fafdff"/>
  <text x="1008" y="285" text-anchor="middle" class="detail">Request human approval</text>
  <rect x="568" y="392" width="144" height="20" rx="2" fill="#fafdff"/>
  <text x="640" y="407" text-anchor="middle" class="detail">Execution complete</text>
  <rect x="200" y="528" width="144" height="18" rx="2" fill="#fafdff"/>
  <text x="272" y="541" text-anchor="middle" class="detail">Cancellation request</text>
  <rect x="936" y="488" width="144" height="18" rx="2" fill="#fafdff"/>
  <text x="1008" y="501" text-anchor="middle" class="detail">Denied or timed out</text>

  <rect x="500" y="172" width="280" height="80" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/>
  <rect x="520" y="188" width="56" height="18" rx="2" fill="#1c78e4" stroke="#a8d2ff" stroke-width=".8"/>
  <text x="548" y="201" text-anchor="middle" class="tag" fill="#ffffff">RUNNING</text>
  <text x="520" y="232" fill="#ffffff" font-size="16" font-weight="600">Runtime advances this Run</text>

  <rect x="144" y="336" width="264" height="96" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/>
  <rect x="160" y="352" width="132" height="18" rx="2" fill="#eef4fb"/>
  <text x="226" y="365" text-anchor="middle" class="tag" fill="#52657d">WAITING FOR INPUT</text>
  <text x="160" y="394" class="label">Awaiting user clarification</text>
  <text x="160" y="416" class="detail">Reply must match original Run</text>

  <rect x="872" y="336" width="264" height="96" rx="8" fill="#eef4fb" stroke="#0078fc" stroke-width="1.2"/>
  <rect x="888" y="352" width="144" height="18" rx="2" fill="#ffffff"/>
  <text x="960" y="365" text-anchor="middle" class="tag" fill="#0066d6">WAITING FOR APPROVAL</text>
  <text x="888" y="394" class="label">Awaiting human approval</text>
  <text x="888" y="416" class="detail">Approval tied to Run and resource</text>

  <rect x="144" y="568" width="264" height="72" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/>
  <text x="160" y="596" class="label">Cancelled</text>
  <text x="160" y="620" class="detail">Report cancellation and effects</text>

  <rect x="500" y="568" width="280" height="72" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/>
  <text x="520" y="596" class="label">Completed</text>
  <text x="520" y="620" class="detail">Report Terminal Result</text>

  <rect x="872" y="568" width="264" height="72" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/>
  <text x="888" y="596" class="label">Rejected</text>
  <text x="888" y="620" class="detail">Report denial or timeout reason</text>

  <text x="96" y="652" class="detail">New instructions during a Run: the Harness uses Run generation to queue, replace, or seek clarification.</text>
  <text x="96" y="668" class="detail">Cancellation may occur while Running or waiting; late events must not return a terminal Run to Running.</text>
</svg>
