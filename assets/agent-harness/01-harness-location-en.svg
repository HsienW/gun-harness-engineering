<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="harness-location-en-title harness-location-en-desc" id="d-01-harness-location-en-root">
        <title id="harness-location-en-title">Where the Agent Harness Sits in an Agent Product</title>
        <desc id="harness-location-en-desc">The product layer provides entry points and user experience, the Harness sets task conditions and governs actions, and the Runtime executes the Run. Events and decision requests return through the Harness to the product layer.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d-01-harness-location-en-root { --paper: #f5f8fc;
      --ink: #102743;
      --muted: #52657d;
      --accent: #0078fc; }
      #d-01-harness-location-en-root { color: var(--ink); font-family: 'Geist', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; }
      #d-01-harness-location-en-root .diagram-container { width: 100%; overflow-x: auto; }
      #d-01-harness-location-en-root .diagram-container { overflow-x: visible; }</style>
          <marker id="d-01-harness-location-en-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52657d"/></marker>
          <marker id="d-01-harness-location-en-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0078fc"/></marker>
          <marker id="d-01-harness-location-en-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066d6"/></marker>
        </defs>

        <rect width="1280" height="720" fill="#f5f8fc"/>
        <rect x="56" y="72" width="1168" height="552" rx="8" fill="#fafdff" stroke="#b9cce3" stroke-width="1.2" stroke-dasharray="6 6"/>
        <rect x="88" y="60" width="152" height="24" fill="#f5f8fc"/>
        <text x="96" y="77" fill="#102743" font-size="12" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing="0.10em">AGENT PRODUCT</text>
        <text x="1184" y="108" fill="#52657d" font-size="12" font-family="'Geist', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">Responsibilities · not deployment topology</text>
        <rect x="96" y="116" width="64" height="4" fill="#0078fc"/>

        <!-- The outward task path and the return path use separate ports. -->
        <line x1="392" y1="328" x2="492" y2="328" stroke="#52657d" stroke-width="1.2" marker-end="url(#d-01-harness-location-en-arrow)"/>
        <line x1="788" y1="328" x2="888" y2="328" stroke="#0078fc" stroke-width="1.2" marker-end="url(#d-01-harness-location-en-arrow-accent)"/>
        <line x1="492" y1="472" x2="392" y2="472" stroke="#52657d" stroke-width="1" stroke-dasharray="5 4" marker-end="url(#d-01-harness-location-en-arrow)"/>
        <line x1="888" y1="472" x2="788" y2="472" stroke="#52657d" stroke-width="1" stroke-dasharray="5 4" marker-end="url(#d-01-harness-location-en-arrow)"/>

        <rect x="400" y="302" width="84" height="16" rx="2" fill="#fafdff"/>
        <text x="442" y="315" text-anchor="middle" fill="#102743" font-size="11" font-family="'Geist', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif">Task intent</text>
        <rect x="796" y="286" width="84" height="34" rx="2" fill="#fafdff"/>
        <text x="838" y="299" text-anchor="middle" fill="#0066d6" font-size="11" font-family="'Geist', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif">Conditions</text>
        <text x="838" y="313" text-anchor="middle" fill="#0066d6" font-size="11" font-family="'Geist', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif">decisions</text>
        <rect x="400" y="430" width="84" height="34" rx="2" fill="#fafdff"/>
        <text x="442" y="443" text-anchor="middle" fill="#52657d" font-size="11" font-family="'Geist', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif">Progress</text>
        <text x="442" y="457" text-anchor="middle" fill="#52657d" font-size="11" font-family="'Geist', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif">results</text>
        <rect x="796" y="430" width="84" height="34" rx="2" fill="#fafdff"/>
        <text x="838" y="443" text-anchor="middle" fill="#52657d" font-size="11" font-family="'Geist', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif">Events</text>
        <text x="838" y="457" text-anchor="middle" fill="#52657d" font-size="11" font-family="'Geist', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif">requests</text>

        <!-- Product-facing responsibilities -->
        <rect x="96" y="192" width="296" height="320" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/>
        <rect x="116" y="212" width="72" height="16" rx="2" fill="#eef4fb" stroke="#b9cce3" stroke-width="0.8"/>
        <text x="152" y="224" text-anchor="middle" fill="#52657d" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">PRODUCT</text>
        <text x="116" y="264" fill="#102743" font-size="14" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif">Product layer</text>
        <text x="116" y="288" fill="#52657d" font-size="12" font-family="'Geist', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif">Product intent and user experience</text>
        <line x1="116" y1="308" x2="372" y2="308" stroke="#d5e1ee" stroke-width="1"/>
        <rect x="116" y="340" width="4" height="4" fill="#9db5cf"/>
        <text x="132" y="348" fill="#102743" font-size="12" font-family="'Geist', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif">Terminals and accounts</text>
        <rect x="116" y="384" width="4" height="4" fill="#9db5cf"/>
        <text x="132" y="392" fill="#102743" font-size="12" font-family="'Geist', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif">Business workflows</text>
        <rect x="116" y="428" width="4" height="4" fill="#9db5cf"/>
        <text x="132" y="436" fill="#102743" font-size="12" font-family="'Geist', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif">User experience</text>

        <!-- The focal control layer, using the supplied logo's blue. -->
        <rect x="492" y="192" width="296" height="320" rx="8" fill="#0066d6" stroke="#0066d6" stroke-width="1.2"/>
        <rect x="512" y="212" width="72" height="16" rx="2" fill="#1c78e4" stroke="#a8d2ff" stroke-width="0.8"/>
        <text x="548" y="224" text-anchor="middle" fill="#ffffff" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">HARNESS</text>
        <text x="512" y="264" fill="#ffffff" font-size="14" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif">Agent Harness</text>
        <text x="512" y="288" fill="#ffffff" font-size="12" font-family="'Geist', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif">Task setup and model governance</text>
        <line x1="512" y1="308" x2="768" y2="308" stroke="#9bcaff" stroke-width="1"/>
        <rect x="512" y="336" width="4" height="4" fill="#a8d2ff"/>
        <text x="528" y="344" fill="#ffffff" font-size="12" font-family="'Geist', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif">Input and Context</text>
        <rect x="512" y="372" width="4" height="4" fill="#a8d2ff"/>
        <text x="528" y="380" fill="#ffffff" font-size="12" font-family="'Geist', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif">Rules and capabilities</text>
        <rect x="512" y="408" width="4" height="4" fill="#a8d2ff"/>
        <text x="528" y="416" fill="#ffffff" font-size="12" font-family="'Geist', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif">Permissions and human approval</text>
        <rect x="512" y="444" width="4" height="4" fill="#a8d2ff"/>
        <text x="528" y="452" fill="#ffffff" font-size="12" font-family="'Geist', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif">Interaction and feedback</text>

        <!-- Runtime responsibilities -->
        <rect x="888" y="192" width="296" height="320" rx="8" fill="#ffffff" stroke="#b9cce3" stroke-width="1.2"/>
        <rect x="908" y="212" width="72" height="16" rx="2" fill="#eef4fb" stroke="#b9cce3" stroke-width="0.8"/>
        <text x="944" y="224" text-anchor="middle" fill="#52657d" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">RUNTIME</text>
        <text x="908" y="264" fill="#102743" font-size="14" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif">Agent Runtime</text>
        <text x="908" y="288" fill="#52657d" font-size="12" font-family="'Geist', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif">Drives execution; owns Run state</text>
        <line x1="908" y1="308" x2="1164" y2="308" stroke="#d5e1ee" stroke-width="1"/>
        <rect x="908" y="340" width="4" height="4" fill="#9db5cf"/>
        <text x="924" y="348" fill="#102743" font-size="12" font-family="'Geist', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif">Run lifecycle</text>
        <rect x="908" y="384" width="4" height="4" fill="#9db5cf"/>
        <text x="924" y="392" fill="#102743" font-size="12" font-family="'Geist', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif">Model and tool loop</text>
        <rect x="908" y="428" width="4" height="4" fill="#9db5cf"/>
        <text x="924" y="436" fill="#102743" font-size="12" font-family="'Geist', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif">State, retries, and recovery</text>

        <line x1="96" y1="552" x2="1184" y2="552" stroke="#d5e1ee" stroke-width="1"/>
        <text x="96" y="584" fill="#52657d" font-size="12" font-family="'Geist', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif">All three layers may live in one program; the distinction is decision authority and state ownership.</text>
      </svg>
