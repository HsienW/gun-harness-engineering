<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 320" role="img" aria-labelledby="title desc" lang="en" font-family="Geist, Noto Sans TC, Microsoft JhengHei, sans-serif">
<title id="title">Which revision did the verifier test?</title><desc id="desc">Both workers replied about the same task. The coordinator still needs the revision used for testing.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#0066d6"/></marker></defs>
<rect x="1" y="1" width="1038" height="318" rx="7" fill="#f5f8fc" stroke="#b9cce3"/><text x="28" y="48" font-size="28" fill="#102743" font-weight="600">Which revision did the verifier test?</text><path d="M28 68 H92" stroke="#0078fc" stroke-width="4"/>
<rect x="35" y="90" width="320" height="85" rx="7" fill="#fff" stroke="#b9cce3"/>
<text x="51" y="123" font-size="20" fill="#0066d6" font-weight="600">Implementer’s reply</text>
<text x="51" y="153" font-size="17" fill="#102743" font-weight="400">Delivered revision B</text>
<rect x="35" y="206" width="320" height="85" rx="7" fill="#fff" stroke="#b9cce3"/>
<text x="51" y="239" font-size="20" fill="#0066d6" font-weight="600">Verifier’s reply</text>
<text x="51" y="269" font-size="17" fill="#102743" font-weight="400">Tests passed. Which revision?</text>
<path d="M357 132 L494 177" fill="none" stroke="#0066d6" stroke-width="2" marker-end="url(#arr)"/>
<path d="M357 248 L494 191" fill="none" stroke="#0066d6" stroke-width="2" marker-end="url(#arr)"/>
<rect x="504" y="143" width="500" height="85" rx="7" fill="#fff" stroke="#b9cce3"/>
<text x="520" y="176" font-size="20" fill="#0066d6" font-weight="600">Coordinator checks the deliverable</text>
<text x="520" y="206" font-size="17" fill="#102743" font-weight="400">Ask for the revision. Rerun on B if needed.</text>
</svg>
