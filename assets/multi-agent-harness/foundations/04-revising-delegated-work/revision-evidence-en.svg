<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 408" role="img" aria-labelledby="title desc" lang="en" font-family="Geist, Noto Sans TC, Microsoft JhengHei, sans-serif">
  <title id="title">Which revision does the late test report cover?</title>
  <desc id="desc">The report covers Taiwan addresses on B. If B ships, check other regions. If C ships, use B for comparison and verify the revised scope on C.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0066d6"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1038" height="406" rx="7" fill="#f5f8fc" stroke="#b9cce3"/>
  <text x="28" y="48" font-size="28" font-weight="600" fill="#102743">Which revision does the late test report cover?</text>
  <path d="M28 68 H92" stroke="#0078fc" stroke-width="4"/>
  <rect x="38" y="95" width="445" height="68" rx="7" fill="#fff" stroke="#b9cce3"/>
  <text x="58" y="121" font-size="17" font-weight="400" fill="#52657d">Reply received after the scope change</text>
  <text x="58" y="149" font-size="20" font-weight="600" fill="#102743">“Taiwan address cases passed on B.”</text>
  <path d="M485 129 H546" fill="none" stroke="#0066d6" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="552" y="95" width="452" height="68" rx="7" fill="#e2efff" stroke="#b9cce3"/>
  <text x="583" y="137" font-size="22" font-weight="600" fill="#102743">Which revision will be delivered?</text>
  <path d="M778 163 V196 H263" fill="none" stroke="#0066d6" stroke-width="2"/>
  <path d="M263 195 V220" fill="none" stroke="#0066d6" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M778 195 V220" fill="none" stroke="#0066d6" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="38" y="225" width="450" height="152" rx="7" fill="#fff" stroke="#b9cce3"/>
  <rect x="552" y="225" width="452" height="152" rx="7" fill="#fff" stroke="#b9cce3"/>
  <text x="60" y="261" font-size="23" font-weight="600" fill="#0066d6">Deliver B</text>
  <text x="60" y="304" font-size="20" font-weight="400" fill="#102743">Keep the Taiwan results for B.</text>
  <text x="60" y="343" font-size="19" font-weight="400" fill="#102743">Compare other regions on B and the original.</text>
  <text x="574" y="261" font-size="23" font-weight="600" fill="#0066d6">Deliver C</text>
  <text x="574" y="304" font-size="20" font-weight="400" fill="#102743">Keep B’s results for comparison.</text>
  <text x="574" y="340" font-size="19" font-weight="400" fill="#102743">Retest Taiwan addresses on C.</text>
  <text x="574" y="365" font-size="19" font-weight="400" fill="#102743">Check other regions against the original.</text>
</svg>
