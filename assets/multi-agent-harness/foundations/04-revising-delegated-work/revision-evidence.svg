<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 408" role="img" aria-labelledby="title desc" lang="zh-TW" font-family="Geist, Noto Sans TC, Microsoft JhengHei, sans-serif">
  <title id="title">晚到的測試回信，可以用在哪個版本？</title>
  <desc id="desc">同一封回信只證明版本 B 的台灣地址案例通過。沿用 B 時補查其他地區；改交 C 時，B 的結果留作對照，在 C 重跑台灣案例並核對其他地區。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0066d6"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1038" height="406" rx="7" fill="#f5f8fc" stroke="#b9cce3"/>
  <text x="28" y="48" font-size="28" font-weight="600" fill="#102743">晚到的測試回信，可以用在哪個版本？</text>
  <path d="M28 68 H92" stroke="#0078fc" stroke-width="4"/>
  <rect x="38" y="95" width="445" height="68" rx="7" fill="#fff" stroke="#b9cce3"/>
  <text x="58" y="121" font-size="17" font-weight="400" fill="#52657d">更正後才收到的回信</text>
  <text x="58" y="149" font-size="20" font-weight="600" fill="#102743">「B 的台灣地址案例通過」</text>
  <path d="M485 129 H546" fill="none" stroke="#0066d6" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="552" y="95" width="452" height="68" rx="7" fill="#e2efff" stroke="#b9cce3"/>
  <text x="583" y="137" font-size="22" font-weight="600" fill="#102743">更正後，實作者交付哪個版本？</text>
  <path d="M778 163 V196 H263" fill="none" stroke="#0066d6" stroke-width="2"/>
  <path d="M263 195 V220" fill="none" stroke="#0066d6" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M778 195 V220" fill="none" stroke="#0066d6" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="38" y="225" width="450" height="152" rx="7" fill="#fff" stroke="#b9cce3"/>
  <rect x="552" y="225" width="452" height="152" rx="7" fill="#fff" stroke="#b9cce3"/>
  <text x="60" y="261" font-size="23" font-weight="600" fill="#0066d6">沿用版本 B</text>
  <text x="60" y="304" font-size="20" font-weight="400" fill="#102743">採納已通過的台灣地址案例。</text>
  <text x="60" y="343" font-size="19" font-weight="400" fill="#102743">待補：比對其他地區在原版與 B 的結果。</text>
  <text x="574" y="261" font-size="23" font-weight="600" fill="#0066d6">改交版本 C</text>
  <text x="574" y="304" font-size="20" font-weight="400" fill="#102743">B 的結果留作對照。</text>
  <text x="574" y="340" font-size="19" font-weight="400" fill="#102743">待補：在 C 重跑台灣案例，</text>
  <text x="631" y="365" font-size="19" font-weight="400" fill="#102743">並比對其他地區與原版的結果。</text>
</svg>
